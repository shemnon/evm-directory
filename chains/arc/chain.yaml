  - name: SystemAccounting gas-value write
    note: "each block, a call from 0xffff…fffe stores that block's gas values into the SystemAccounting precompile. No transaction appears in the body."
    src: crates/precompiles/src/system_accounting.rs:ARC_SYSTEM_CALLER

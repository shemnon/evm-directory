    severity: high
    src: core/systemcontracts/upgrade.go:1111-1127
    note: >-
      BSC REWRITES system-contract bytecode at fork boundaries via statedb.SetCode.
      Twenty per-fork bytecode directories exist (bruno, euler, gibbs, moran,
      planck, plato, luban, kepler, feynman, haber_fix, bohr, pascal, lorentz,
      maxwell, fermi, pasteur, ...). Unique in this dataset: on every other chain,
      code at an address changes only by transaction. Here the client swaps it, so
      the same address can have completely different behaviour across a fork with no
      on-chain transaction to observe.

system_transactions:
  note: >-
    Parlia inserts system transactions from the block coinbase to system contracts
    (consensus/parlia/parlia.go:1357,1945). isToSystemContract gates them.

opcodes:
  added: []
  removed: []
  modified:
  - op: "0x44"
    name: DIFFICULTY
    severity: high
    note: >-
      Never became PREVRANDAO. The byte is bound to `opDifficulty` in every
      instruction set BSC can select, because the Shanghai set is derived from the
      London set rather than from the merge set — so it pushes
      `Context.Difficulty`, which Parlia sets to 1 or 2. See eips.4399.
    src: "core/vm/jump_table.go:117-118, core/vm/instructions.go:477-481"
    src_live: "eth_call 0x445f5260205ff3 @ 121088698 -> 0x..02"

tx_lifecycle:
  ordered_then_invalid:
    verdict: unreachable
    src: "miner/worker.go:commitTransactions, core/state_transition.go:preCheck"
    note: >-
      The proposer executes each transaction as it appends it: an invalid one is popped out
      of the candidate set and never reaches the block, so the ordered-but-invalid state is
      not reachable and the nonce is untouched. If one reached a proposed block anyway,
      `preCheck` fails at import and the whole block is invalid. Mainnet semantics, verified
      against this row's own pinned client rather than assumed from the family.
  nonce_on_failure:
    verdict: preserved
    src: "miner/worker.go:commitTransactions, core/state_transition.go:preCheck"
    note: >-
      Preserved. Nothing is committed for a transaction the builder rejected, so the account
      nonce is untouched and the sender resubmits at the same nonce.

fee_model:
  metering: gas
  fee_market: EIP-1559 (London active at block 31302048)
  extra_components: []
  note: blob market present (Cancun/Prague/Osaka blob schedules configured); BPO forks skipped

header_fields:
  added: []
  removed: []
  modified:
  - name: mixHash
    severity: high
    note: >-
      REPURPOSED TO CARRY THE SUB-SECOND PART OF THE TIMESTAMP, AND CONSENSUS
      CHECKS IT. From Lorentz, `Prepare` calls
      `header.SetMilliseconds(blockTime % 1000)`, which stores that value in
      `MixDigest`; before Lorentz a non-zero mix digest is rejected outright
      (`errInvalidMixDigest`), and after it `verifyHeader` rejects any header
      where `MilliTimestamp()/1000 != Time`. So the field is not merely unused —
      it is a validated timestamp fraction in [0, 999].

      The RPC surfaces it as a `milliTimestamp` key, which is the honest reading.
      What is not honest is `mixHash` itself: a tool that reads it expecting
      post-merge randomness gets a small integer that increments with block
      production. Verified live: mixHash 0x258 = 600, timestamp 1789051672,
      milliTimestamp 1789051672600.

      Third meaning for a repurposed header field in this dataset, after OP
      Stack's `blobGasUsed` (DA footprint) and Avalanche's (pinned to zero).
    src: "consensus/parlia/parlia.go:1176-1180, consensus/parlia/parlia.go:626-635, core/types/block.go:161-173"
    src_live: "eth_getBlockByNumber @ 121088698 -> mixHash 0x..0258 (600), timestamp 1789051672, milliTimestamp 1789051672600 — MilliTimestamp()/1000 == Time, as verifyHeader requires"

gotchas:
  - >-
    `block.prevrandao` RETURNS 1 OR 2. BSC never took the merge rung: 0x44 is
    still DIFFICULTY in every instruction set it can select, and Parlia's
    difficulty is one bit. Contracts using it for entropy are drawing from a
    two-element set, with no revert and no signal. See eips.4399.
  - >-
    `mixHash` IS A TIMESTAMP, NOT RANDOMNESS. From Lorentz it carries the
    millisecond fraction of the block time and consensus validates that it does.
    Read `milliTimestamp` if that is what you want; do not read `mixHash` as an
    entropy source.
  - >-
    BSC shipped Prague SEVEN WEEKS BEFORE Ethereum mainnet (2025-03-20 vs 2025-05-07)
    and Osaka nearly five months AFTER (2026-04-28 vs 2025-12-03). "Behind mainnet"
    is not a stable property of a chain — it flips fork to fork.
  - >-
    BSC took Prague's EVM half (BLS12-381, EIP-7702, EIP-2935) and dropped its
    beacon half (4788, 6110, 7002, 7251) via an explicit IsInBSC() early return.
    A fork-name-only survey would record "Prague" and be wrong about four EIPs.
  - >-
    Custom precompiles at 0x64-0x69 leave only 0x12-0x63 of headroom before mainnet
    grows into them. This is the placement risk flagged from the Ethereum baseline,
    realised.
  - >-
    System contract bytecode is REPLACED BY THE CLIENT at fork boundaries
    (statedb.SetCode). Code at a fixed address can change with no transaction in any
    block. Indexers reconstructing contract history from transactions will miss it.
  - >-
    0x64 and 0x65 become always-erroring at Pasteur (activation_time 1787625000 = 2026-08-25) —
    the same tombstoning pattern as Avalanche's native-asset precompiles.
  - >-
    Only chain here with EIP-7702 besides mainnet, and the only one with zero
    transaction-type divergence.

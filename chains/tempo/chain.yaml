      different reason. A token created by the TIP20Factory gets an address in this
      range and its ERC-20 surface is executed as native Rust, not as bytecode.
      `pathUSD` at 0x20C0..0000 is the canonical one and the default fee token.
    src: crates/precompiles/src/lib.rs:extend_tempo_precompiles, crates/primitives/src/address.rs:TIP20_TOKEN_PREFIX

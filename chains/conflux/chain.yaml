    status: unrecorded
    note: >-
      CIP-175 makes cross-space calls resolve an eSpace 7702 delegation. Whether
      the resulting phantom transaction reports the delegating account or the
      delegate as `to` was not established.

non_eip_specs:
  - id: CIP-90
    name: "Introduce a fully EVM-compatible space"
    adoption: adopted
    fork: Hydra
    src: "crates/execution/executor/src/spec.rs:cip90"
    note: "the CIP that created eSpace. Everything in this row is downstream of it."
  - id: CIP-133
    name: "Enhanced block hash query"
    adoption: adopted
    fork: V2.4
    severity: high
    src: "crates/execution/executor/src/context.rs:blockhash_from_state, crates/execution/executor/src/internal_contract/impls/context.rs:epoch_hash_slot"
    src_live: "eth_call @ 155333000 -> BLOCKHASH(n) returns the true hash for every n from 155333000 down to 155267466 (65534 back) and zero from 155267465 down"
    note: >-
      BLOCKHASH SERVES 65,536 BLOCKS, NOT 256 — a 256x window, about 18 hours.
      Epoch hashes are written into a 65536-slot ring buffer in system storage
      (`height & 0xffff`) and read back with the guard
      `env.epoch_height - 65536 < number <= env.epoch_height`. Verified live
      across the whole range including both boundaries. A contract that treats
      `blockhash(n) == 0` as "older than 256 blocks" — a standard idiom — never
      takes that branch on eSpace until 18 hours have passed.

      AND THE UPPER BOUND IS INCLUSIVE, WHICH MAINNET'S IS NOT. `number ==
      env.epoch_height` is accepted. `before_epoch_execution` writes the pivot
      block's own hash into its slot BEFORE the epoch's transactions run — which
      deferred execution makes possible — so inside a mined transaction
      `blockhash(block.number)` returns THE HASH OF THE BLOCK THE TRANSACTION IS
      IN. Mainnet defines that to be zero.

      IN `eth_call` THE SAME EXPRESSION RETURNS SOMETHING ELSE AGAIN. A call
      pinned at block B runs with `block.number = B+1` on the state after epoch B,
      where slot `(B+1) & 0xffff` still holds the hash from 65536 epochs earlier.
      Live: `BLOCKHASH(155333001)` returned 0xd6dbfdfb..2243, which is the hash of
      block 155267465 = 155333001 - 65536. So one expression has three answers:
      zero on mainnet, the current block's hash in a Conflux transaction, and an
      18-hour-old hash under `eth_call`. Simulation does not predict execution.
  - id: CIP-98
    name: "Fix the BLOCKHASH bug in eSpace"
    adoption: adopted
    fork: V2.1
    src: "crates/execution/executor/src/context.rs:blockhash_from_env"
    note: >-
      Historical, but it names the hazard: before CIP-98, eSpace's BLOCKHASH
      compared the requested number against `env.number` — the DAG BLOCK NUMBER —
      while eSpace's `block.number` is the EPOCH HEIGHT. The two differ by a
      factor of ~2.4, so `blockhash(block.number - 1)` returned zero.
  - id: CIP-137
    name: "Base fee sharing in CIP-1559"
    adoption: adopted
    fork: V2.4
    severity: high
    src: "crates/execution/executor/src/state/state_object/reward.rs:burnt_gas_price, crates/parameters/src/lib.rs:CIP137_BASEFEE_PROP_INIT"
    src_live: "eth_getTransactionReceipt(0x8afdf9bd..0205) @ 155332908 -> gasFee 0x2f0bbf433b0000, burntGasFee 0x115537232a33c0 = 36.84% of it, i.e. 7.368 gwei burnt of a 20 gwei base fee"
    note: >-
      Only part of the base fee is burnt; the rest goes to the miner. The split is
      an on-chain DAO parameter (`BaseFeeProp`) initialised to 1 CFX (a half-burn)
      and since moved: live receipts show a 36.84% burn. The transaction validity
      threshold is the BURNT part, not the advertised base fee — see eips.1559.
      The receipt exposes both numbers in a non-standard `burntGasFee` key, so
      this is one of the few governance parameters in the dataset that a client
      can read straight out of a receipt.
  - id: CIP-130
    name: "Aligning gas limit with transaction size"
    adoption: adopted
    fork: V2.4
    src: "crates/cfxcore/core/src/verification.rs:check_gas_limit_with_calldata"
    note: >-
      A transaction is INVALID unless its declared gas limit is at least 100 x
      calldata length. Not a pricing rule — a validity rule, checked before
      execution, applying to eSpace transactions as well as Core ones. A
      10,000-byte calldata transaction must declare 1,000,000 gas even if it
      would use 200,000. Mainnet has no analogue and no wallet sets gas this way.
      `align_evm` would disable it.
  - id: CIP-645
    name: "Align Conflux gas pricing with EVM"
    adoption: adopted
    fork: V3.0
    src: "crates/execution/vm-types/src/spec.rs:CIP645Spec"
    note: >-
      A single atomic bundle of fourteen flags that dragged Conflux from
      Istanbul-era gas to Berlin/London/Cancun-era gas in 2025: EIP-1108, 1884,
      2028, 2200+3529, 2565, 2929+3651, 3860, and fixes for 684, 1559, 5656, 1153,
      BLOCKHASH gas, the opcode table and EXTCODEHASH. The struct's own doc
      comment warns that mixing the flags gives undefined behaviour. Note what is
      NOT in it: `evm_gas_ratio`, which still doubles SSTORE-set, code deposit,
      new-account transfer and 7702 authorization costs.
  - id: CIP-172
    name: "Canonical transaction RLP encoding"
    adoption: adopted
    fork: V3.1
    src: "crates/cfxcore/core/src/verification.rs:check_canonical_rlp"
    note: >-
      From epoch 155,140,000 a block containing a non-canonically-RLP-encoded
      transaction is invalid. Locally-submitted non-canonical transactions were
      already rejected; V3.1 makes it a consensus rule.
  - id: CIP-176
    name: "Merge storage keys of repeated addresses in an access list"
    adoption: adopted
    fork: V3.1
    src: "crates/execution/executor/src/state/state_object/warm.rs:set_tx_access_list"
    note: "see eips.2930"
  - id: CIP-107
    name: "DAO-adjustable burn of storage collateral"
    adoption: adopted
    fork: V2.3
    src: "crates/execution/executor/src/spec.rs:cip107"
    note: "CORE SPACE ONLY — eSpace has no storage collateral. Listed so the negative is on the record."
  - id: CIP-1559
    name: "Fee market change for Conflux"
    adoption: adopted
    fork: V2.4
    src: "crates/primitives/src/block_header/base_price.rs:compute_next_price"

tx_types:
  note: >-
    The eSpace type-byte set is 0x00 / 0x01 / 0x02 / 0x04. There is no 0x03 — the
    decoder has no constant for it — and Conflux adds NO type byte of its own.
    That is the trap this row exists to flag: an envelope-diffing survey reports
    eSpace as type-byte-equivalent to Prague mainnet, and everything that actually
    diverges is in ordering, block synthesis, gas and the second space. Note also
    that the SAME BLOCK BODY carries Core-Space transactions, which use a
    different encoding entirely — see `non_evm_transactions`.
  src: "crates/primitives/src/transaction/mod.rs:EIP7702_TYPE"
  src_live: "eth_getBlockByNumber over 120 consecutive blocks ending @ 155333000 -> 34 transactions, 24 of type 0x0 and 10 of type 0x2"
  "0x03":
    name: BlobTx
    status: removed
    src: "crates/primitives/src/transaction/mod.rs:EIP1559_TYPE"
    note: "no EIP4844_TYPE constant exists; the type byte does not decode. CIP-144 imported only the 0x0a precompile."
  "0x04":
    name: SetCodeTx
    status: modified
    fork: "V3.0 (CIP-7702)"
    src: "crates/execution/executor/src/executive/mod.rs:authorization_gas"
    note: "accepted, but the intrinsic authorization gas is 17000 base + 50000 per empty account rather than 12500 + 25000 — see eips.7702"

tx_authorization:
  key_binding: derived
  signers_per_tx: 1
  note: >-
    ORDINARY AT THE PROTOCOL LEVEL AND EXTRAORDINARY AT THE RPC LEVEL. An eSpace
    transaction is authorized exactly as on mainnet: a secp256k1 signature over
    the EIP-155 or EIP-2718 payload, recovered to an address that IS the hash of
    the key. `key_binding: derived`. CIP-152 (V3.0) adds EIP-3607.

    WHAT IS NOT ORDINARY: eSpace contains transactions THAT WERE NEVER SIGNED BY
    ANYONE and cannot be, and they are indistinguishable from user transactions
    unless you look. Phantom transactions synthesised from Core-Space cross-space
    calls are `fake_sign_phantom`ed with `r = s = the sender's own address` and
    `v = 0`, then re-serialised by the RPC with `r = s = chain_id` when those
    values are zero. Their authority is a Core-Space transaction that the eSpace
    RPC will never show you, signed by a Core-Space key over a Core-Space payload
    with a Core-Space nonce. See `system_transactions` and `non_evm_transactions`.

    A SECOND NONCE-UNIQUENESS BREAK: every "funding" phantom transaction is
    emitted `from` the ZERO ADDRESS with `nonce: 0`, because "zero address always
    has nonce 0". eSpace therefore contains an unbounded number of distinct
    transactions from one sender at one nonce. They are distinguished only by
    their hash, which is why the fake signature exists at all.
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      src: "crates/execution/executor/src/builtin/mod.rs:ecrecover_evm, crates/execution/executor/src/executive/fresh_executive.rs:check_from_eoa_with_code"
      note: >-
        The 0x01 implementation is `EcRecover(Space::Ethereum)`, a separate
        instantiation from the Core-Space one — Core Space forces the recovered
        address into Conflux's typed-address format and eSpace does not. So the
        two spaces have DIFFERENT ecrecover behaviour at the same address, and
        eSpace's is the mainnet one. Confirmed live at 3000 gas via the standard
        map. EIP-7702 delegation exists from V3.0 and, as on mainnet, changes
        nothing on this axis.
    secp256r1:
      status: inherited
      authorizes: never
      precompile: "0x0100"
      src: "crates/execution/executor/src/machine/mod.rs:P256VERIFY_ADDRESS"
      note: "P256VERIFY since V3.1 (2026-08-25). A tool for contracts; a P-256 key cannot authorize an eSpace transaction."
    bls12_381:
      status: inherited
      authorizes: never
      precompile: "0x0f"
      src: "crates/execution/executor/src/machine/mod.rs:build_bls12_builtin_map"
      note: >-
        EIP-2537 pairing at 0x0f since V3.0. Conflux's PoS finality chain does use
        BLS aggregation, but that is Core-Space/PoS consensus and no BLS key can
        move a wei in eSpace.
    conflux_core_secp256k1:
      status: added
      authorizes: never
      precompile: none
      src: "crates/primitives/src/transaction/native_transaction.rs:NativeTransaction, crates/execution/execute-helper/src/phantom_tx/recover.rs:recover_phantom"
      note: >-
        THE ROW'S REAL AUTHORIZATION FINDING, AND IT NEEDS ITS OWN ENTRY BECAUSE
        NEITHER `protocol` NOR `account_code` DESCRIBES IT. A Core-Space
        transaction is signed with secp256k1 over a NINE-FIELD payload — the
        Ethereum six plus `storage_limit`, `epoch_height` and `chain_id` (1029) —
        and cannot authorize an eSpace transaction. But executing it CAN cause
        eSpace state changes and CAN cause eSpace transactions to appear, with a
        `from` that is `keccak256(core_address)[12..]`, a mapped address whose
        private key nobody holds. `authorizes: never` is therefore literally true
        and materially misleading: the scheme cannot sign an eSpace transaction
        and can nonetheless move eSpace value. `precompile: none` — eSpace has no
        way to verify a Core-Space signature or even to observe that one existed.

non_evm_transactions:
  entries:
  - id: core_space_legacy
    name: Conflux Core Space transaction (CIP-155 legacy)
    status: added
    src: crates/primitives/src/transaction/native_transaction.rs:NativeTransaction
    src_live: cfx_getBlockByEpochNumber @ 155332816 -> the same epoch whose eSpace view lists one
      type-0x02 transaction reports a pivot block with transactionsRoot 0xc5d24601..a470 (keccak
      of empty)
    note: 'An untyped RLP list of nine fields: nonce, gas_price, gas, action, value, STORAGE_LIMIT,
      EPOCH_HEIGHT, chain_id, data — plus v/r/s. No EIP-2718 type byte, so it cannot appear in `tx_types`.
      `epoch_height` is a validity WINDOW: the transaction may only be packed within TRANSACTION_DEFAULT_EPOCH_BOUND
      = 100,000 epochs (about 28 hours) either side of the height it names. `storage_limit` is the
      maximum storage collateral the sender will lock. Neither field exists in eSpace. These transactions
      sit in the SAME BLOCK BODY as eSpace transactions and are counted in the pivot block''s `transactionsRoot`
      — the value the eSpace RPC republishes as its own `transactionsRoot`.'
  - id: core_space_typed
    name: Conflux Core Space typed transaction (CIP-2930 / CIP-1559)
    status: added
    src: crates/primitives/src/transaction/mod.rs:TYPED_NATIVE_TX_PREFIX
    note: Typed Core transactions are prefixed with the ASCII BYTES `cfx` (0x63 0x66 0x78) followed
      by 0x01 or 0x02. 0x63 is inside EIP-2718's 0x00-0x7f type-byte range, so a generic 2718 decoder
      pointed at a Conflux block body reads a Core transaction as an unknown TYPE-0x63 transaction
      rather than as a foreign encoding. Four-byte envelope, one byte of which collides with a reserved
      namespace.
  - id: cross_space_call
    name: CrossSpaceCall (Core -> eSpace value and calls)
    status: added
    src: crates/parameters/src/internal_contract_addresses.rs:CROSS_SPACE_CONTRACT_ADDRESS, crates/execution/executor/src/internal_contract/impls/cross_space.rs:withdraw_from_evmcore
    src_live: eth_getCode(0x0888000000000000000000000000000000000006) @ 155333000 -> 0x; eth_call
      to it -> 0x
    note: The bridge is an INTERNAL CONTRACT at 0x0888..0006 that exists ONLY IN CORE SPACE. `InternalContractMap::contract`
      returns None for any address whose space is not Native, so from eSpace the address is an ordinary
      empty account — confirmed live, no code and an empty-output call. It is neither a precompile
      nor a system contract HERE; it is absent, and that is the answer to the question this row was
      asked. All eight internal-contract addresses (0x0888..0000-0007 and ..000a) were probed and
      all are empty in eSpace. Value moves Core -> eSpace by a Core transaction calling `transferEVM`/`callEVM`
      on this contract, and back by `withdrawFromMapped`, which sweeps the balance of `keccak256(core_address)[12..]`.
      An eSpace account cannot initiate either direction; there is no eSpace-callable surface at
      all. Only 1/10 of the remaining gas is forwarded into eSpace (`CROSS_SPACE_GAS_RATIO = 10`)
      — a 9/10 retention where the EVM's own CALL keeps 1/64.
precompiles:
  base_map:
    status: inherited
    present: "0x01-0x11"
    p256verify: true
    src: crates/execution/executor/src/machine/mod.rs:new_builtin_map
    note: >-
      `new_builtin_map` builds 0x01-0x11 plus 0x0100, and is called once per space;
      only 0x01 differs between eSpace and Core Space (see the 0x01 row). KZG at 0x0a
      and P256VERIFY at 0x0100 were imported by CIP-144 / CIP-167 on a chain with no
      blob market — `added` relative to Conflux's own history, not to mainnet.
  note: >-
    THE ADDRESS SET IS MAINNET-OSAKA-EQUIVALENT AND SAYS NOTHING. 0x01-0x11 plus
    0x0100, built by `new_builtin_map`, which is called twice — once per space —
    with only 0x01 differing between them. All eighteen were probed live at the
    pinned block: 0x01-0x0a and 0x0b-0x11 answer, 0x12 and 0x0101 return empty
    output like empty accounts, none has bytecode. Conflux adds NO precompile of
    its own to eSpace. Everything Conflux adds lives in Core Space as an internal
    contract that eSpace cannot see.
  src: "crates/execution/executor/src/machine/mod.rs:new_builtin_map"
  "0x0000000000000000000000000000000000000001":
    name: ECRECOVER
    status: modified
    divergence: gas
    src: "crates/execution/executor/src/builtin/mod.rs:ecrecover_evm"
    note: >-
      Same price (3000) and same result as mainnet, but it is a DIFFERENT
      IMPLEMENTATION from the one at the same address in Core Space: eSpace uses
      `EcRecover(Space::Ethereum)` and Core Space uses `EcRecover(Space::Native)`,
      which coerces the recovered address into Conflux's typed-address format.
      Recorded because "0x01 on Conflux" is ambiguous in a way it is on no other
      chain in this dataset. Marked `divergence: gas` because eSpace's result is
      mainnet's.
  "0x000000000000000000000000000000000000000a":
    name: POINT_EVALUATION
    status: added
    fork: "V2.4 (CIP-144)"
    src: "crates/execution/executor/src/machine/mod.rs:kzg_point_eval"
    src_live: "eth_call(0x0a, 1 byte) @ 155333000 -> 'execution reverted: Built-in failed: Blob invalid input length'"
    note: >-
      `added` relative to the chain's own history, not to mainnet: eSpace has the
      KZG precompile at the mainnet address and the mainnet price (50000) while
      having NO BLOB TRANSACTIONS, no BLOBHASH and no blob gas market. CIP-144
      imported the precompile alone. A contract can verify a KZG proof about a
      blob that the chain can never carry.
  "0x0000000000000000000000000000000000000100":
    name: P256VERIFY
    status: added
    fork: "V3.1 (CIP-167)"
    src: "crates/execution/executor/src/machine/mod.rs:P256VERIFY_ADDRESS"
    src_live: "eth_call(0x0100, 160 zero bytes) @ 155333000 -> 0x (empty output = EIP-7951 invalid-signature semantics)"

system_contracts:
  note: >-
    NONE IN eSPACE. Not one address in eSpace carries client-installed bytecode.
    Every Conflux system component — AdminControl 0x0888..0000, SponsorWhitelistControl
    ..0001, Staking ..0002, Context ..0004, PoSRegister ..0005, CrossSpaceCall
    ..0006, ParamsControl ..0007, SystemStorage ..000a — is an INTERNAL CONTRACT
    (native Rust, no bytecode) and is gated to `Space::Native`. All eight return
    empty code to `eth_getCode` and empty output to `eth_call`. The EIP-2935
    history address is likewise empty (see eips.2935). This is the opposite of
    the Flare-style error the brief warns about: there is nothing to
    misclassify, because from eSpace there is nothing there.
  src: "crates/execution/executor/src/internal_contract/components/contract_map.rs:InternalContractMap"
  src_live: "eth_getCode @ 155333000 on 0x0888..0000, ..0001, ..0002, ..0004, ..0005, ..0006, ..0007, ..000a -> 0x on all eight"

system_transactions:
  phantom_transactions:
    name: "Phantom transactions (synthesised from Core-Space cross-space calls)"
    status: added
    fork: "Hydra (CIP-90)"
    severity: high
    src: "crates/execution/execute-helper/src/phantom_tx/recover.rs:recover_phantom, crates/execution/execute-helper/src/phantom_tx/mod.rs:into_eip155, crates/primitives/src/transaction/eth_transaction.rs:fake_sign_phantom"
    src_live: "eth_getBlockByNumber(0x94230d9, true) @ epoch 155332825 -> 2 transactions, block gasUsed 0x0; tx 0 from 0x00..00 to 0x86e7e8a9..8b73, gas 0x0, gasPrice 0x0, input = 64 bytes = (core tx hash, cross-space nonce); tx 1 from that mapped address onwards. Receipt of tx 0: gasUsed 0x0, gasFee 0x0, effectiveGasPrice 0x0, status 0x1, NO `type` key."
    note: >-
      CONFLUX'S PROTOCOL-DRIVEN STATE CHANGES ARE NOT A TRANSACTION TYPE AND NOT
      UNSIGNED-BY-CONVENTION. They are LEGACY (0x00) transactions manufactured by
      the RPC layer by REPLAYING THE LOGS of a successful Core-Space transaction.
      For each `CallEvent`/`CreateEvent` emitted by the CrossSpaceCall internal
      contract, `recover_phantom` emits a PAIR: first a transfer FROM THE ZERO
      ADDRESS to the mapped sender carrying `abi.encode(coreTxHash, crossSpaceNonce)`
      as calldata, then the actual call. A `WithdrawEvent` emits a single transfer
      from the mapped address TO the zero address. All carry `gas: 0` and
      `gasPrice: 0` and consume no gas, so a block can contain transactions and
      still report `gasUsed: 0x0` — observed live.

      HOW A TOOL GETS THIS WRONG. There is no type byte to filter on. `from` is a
      normal-looking 20-byte address (or the zero address). The transaction has a
      hash, a receipt, a log set, an index, and appears in `eth_getTransactionByHash`.
      An indexer counts them as user activity, books value transfers with a zero
      gas price as organic, and — because the receipt for a legacy transaction
      omits the `type` key entirely here — may fail a schema check that mainnet
      passes.

      WHAT IS INVISIBLE. A Core-Space transaction that FAILS produces NO phantom
      transactions at all ("failing transactions will not produce any phantom txs
      or traces"), so a reverted cross-space call leaves no trace in eSpace even
      though it was ordered, executed and charged. A phantom transaction's status
      CAN be 0 (the `ReturnEvent` carries the success flag), so the eSpace view
      shows failures of the inner call but never failures of the outer one.


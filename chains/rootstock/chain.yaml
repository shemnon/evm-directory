     src_live: "eth_getBlockByNumber @ 9225919 -> rskPteEdges: null"}
  removed:
  - name: mixHash
    severity: high
    note: >-
      NOT A CONSENSUS FIELD, BUT THE RPC PRINTS ONE. `BlockHeader.getEncoded` has no
      mixHash item; `eth_getBlockByNumber` nevertheless returns
      `mixHash: 0x00…00`. A tool that re-derives a block hash from the JSON, or that
      reads mixHash for randomness, gets a fabricated zero that no header ever
      committed to.
    src: "rskj-core/src/main/java/org/ethereum/core/BlockHeader.java:372-377"
    src_live: "eth_getBlockByNumber @ 9225919 -> mixHash 0x00…00"
  - {name: nonce, note: "likewise absent from the header RLP and fabricated as 0x0000000000000000 in the JSON",
     src: "rskj-core/src/main/java/org/ethereum/core/BlockHeader.java:372-377"}
  - {name: baseFeePerGas, note: "no EIP-1559 — see eips.1559", src: "rskj-core/src/main/java/org/ethereum/core/BlockHeader.java:372-377"}
  - {name: withdrawalsRoot, note: "no beacon chain", src: "rskj-core/src/main/java/org/ethereum/core/BlockHeader.java:372-377"}
  - {name: blobGasUsed, note: "no EIP-4844", src: "rskj-core/src/main/java/org/ethereum/core/BlockHeader.java:372-377"}

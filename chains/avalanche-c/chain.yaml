fee_model:
  metering: gas
  fee_market: ACP-176 dynamic fee (target gas excess), NOT mainnet's 1559 update rule
  extra_components: []
  note: >-
    London is active (LondonBlock = 0 from Apricot Phase 3) so 1559-shaped fields
    exist, but the base-fee update algorithm is Avalanche's own. FROM HELICON, A
    TRANSACTION PAYS FOR AT LEAST HALF ITS GAS LIMIT (ACP-194's ceil(limit/2) floor),
    so gas-limit padding is no longer refunded. The minimum price is ACP-283's dynamic
    one, a validator-voted minPriceExponent carried in the header.
  src: "vms/saevm/gastime/acp176.go:AfterBlock, graft/coreth/params/hooks_libevm.go:MinimumGasConsumption"
  src_live: "eth_getTransactionReceipt @ 101206056 -> gas limit 250000, gasUsed 125000; @ 101206055 -> limit 300000, gasUsed 150000 (both exactly ceil(limit/2))"

header_fields:
  added:
    - {name: extDataHash, note: "commitment to the atomic (UTXO) transaction data — the header half of non_evm_transactions", src: "graft/coreth/plugin/evm/customtypes/header_ext.go:HeaderExtra"}
    - {name: extDataGasUsed, note: "gas attributed to atomic transactions, metered separately from gasUsed — until Helicon; SAE writes 0 and counts atomic gas in gasUsed", src: "graft/coreth/plugin/evm/customtypes/header_ext.go:HeaderExtra"}
    - {name: blockGasCost, note: "ACP-176 block cost", src: "graft/coreth/plugin/evm/customtypes/header_ext.go:HeaderExtra"}
    - {name: timestampMilliseconds, note: "Granite; sub-second block times, so the second-resolution timestamp is no longer the full story", src: "graft/coreth/plugin/evm/customtypes/header_ext.go:HeaderExtra"}
    - {name: targetExponent, note: "Helicon: validator-voted ACP-176 gas target, ramped block to block", src: "graft/coreth/plugin/evm/customtypes/header_ext.go:TargetExponent", src_live: "eth_getBlockByNumber @ 95921105 -> targetExponent 0x2c5c860; absent @ 95921104"}
    - {name: minPriceExponent, note: "Helicon: ACP-283 dynamic minimum gas price", src: "graft/coreth/plugin/evm/customtypes/header_ext.go:MinPriceExponent"}
    - {name: minDelayExcess, note: "ACP-226 minimum block delay, Granite", src: "graft/coreth/plugin/evm/customtypes/header_ext.go:HeaderExtra"}
  removed: []
  modified:
    - {name: blobGasUsed,   note: "must be 0", src: "vms/saevm/cchain/hooks.go:BlobGasUsed"}
    - {name: excessBlobGas, note: "must be 0", src: "vms/saevm/cchain/hooks.go:ExcessBlobGas"}
    - {name: parentBeaconRoot, note: "must be the empty hash — no beacon chain", src: "vms/saevm/cchain/hooks.go:ParentBeaconRoot"}
    - {name: stateRoot, note: "FROM HELICON: the post-execution root of the last SETTLED block, not of this block", src: "vms/saevm/sae/block_builder.go:PostExecutionStateRoot"}
  note: >-
    Two things at once. Cancun's header shape is adopted for compatibility, then
    every Cancun-specific field is constrained to a constant — structurally
    conformant, semantically empty. AND the VM RLP-appends fields of its own
    (HeaderExtra, seven since Helicon), so they are inside the block hash: an Ethereum header decoder
    does not round-trip an Avalanche header. This row recorded `added: []` until the
    `flare` row — a different client, the same coreth — observed all five live and
    contradicted it. Corrected against this row's own pinned clone.

gotchas:
  - >-
    NO EIP-7702. The C-Chain is Cancun-equivalent, not Prague — tx type 0x04 does
    not exist and no BLS12-381 precompiles are available. Wallets and AA stacks that
    assume Prague on any major EVM chain break here.
  - >-
    P256VERIFY at 0x0100 exists WITHOUT BLS12-381 at 0x0b-0x11, because it arrived
    via Avalanche's own Granite fork rather than Osaka. Inferring a chain's fork
    level from which precompiles are present fails in both directions on this chain.
  - >-
    Three precompile addresses (0x0100..00/01/02) are tombstoned: they always revert.
    They are neither absent nor functional — calling them fails differently than
    calling an empty account, which returns success.
  - >-
    Atomic import/export transactions are not RLP and have no EIP-2718 type byte.
    Any indexer that enumerates "all transactions in a block" via the EVM envelope
    silently misses all cross-chain value movement.
  - >-
    Cancun header fields are present but pinned to constants. blobGasUsed == 0 is
    enforced, not conventional — contrast OP Stack, which repurposed the same field
    to mean something else entirely.

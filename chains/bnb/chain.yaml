consensus:
  engine: Parlia (Proof of Staked Authority)
  block_time: 450ms
  block_time_history: "3000ms default -> 1500ms Lorentz -> 750ms Maxwell -> 450ms Fermi"
  block_time_src: consensus/parlia/parlia.go:61-64

baseline_fork: osaka

recorded_at: 1755302400   # 2026-08-16
stale_after: 1787625000   # 2026-08-25 Pasteur — 0x64/0x65 tombstone, precompile set changes

forks:
  src: params/config.go:BSCChainConfig
  note: >-
    BSC bundles each Ethereum fork with a same-timestamp BSC fork. Two timing facts
    matter more than the names.
  timeline:
  - {name: "shanghai + kepler",  activation_time: 1705996800, mainnet_equivalent: shanghai}
  - {name: "cancun + haber",     activation_time: 1718863500, mainnet_equivalent: cancun}
  - {name: "prague + pascal",    activation_time: 1742436600, mainnet_equivalent: prague,
     note: "2025-03-20 — SEVEN WEEKS BEFORE mainnet's Prague (1746612311, 2025-05-07)"}
  - {name: lorentz,  activation_time: 1745903100, mainnet_equivalent: null}
  - {name: maxwell,  activation_time: 1751250600, mainnet_equivalent: null}
  - {name: fermi,    activation_time: 1768357800, mainnet_equivalent: null}
  - {name: "osaka + mendel", activation_time: 1777343400, mainnet_equivalent: osaka,
     note: "2026-04-28 — nearly five months AFTER mainnet's Osaka (2025-12-03)"}
  - {name: pasteur, activation_time: 1787625000, status: pending,
     note: "not yet live; observed pre-activation on 2026-08-16. Will tombstone 0x64 and 0x65."}
  - {name: bpo1, activation_time: null, status: skipped, note: "explicitly 'will be skipped in BSC'"}
  - {name: bpo2, activation_time: null, status: skipped, note: "explicitly 'will be skipped in BSC'"}

eips:
  4399:
    status: removed
    severity: high
    note: >-
      PREVRANDAO IS NOT REACHABLE, AND 0x44 RETURNS 1 OR 2. Three edits interact,
      and no one of them is the whole answer:

      (1) `NewEVMBlockContext` sets `Random = &header.MixDigest` only when
      `header.Difficulty.Sign() == 0`. Parlia writes 1 (out of turn) or 2 (in
      turn), so `Random` stays nil. `Rules()` then computes
      `isMerge = isMerge && c.IsLondon(num)` under a comment that says outright
      `// always false in BSC`.

      (2) That would normally disable Shanghai and everything after it, because
      upstream gates `IsShanghai`/`IsCancun`/`IsPrague`/`IsOsaka` on `isMerge`.
      BSC re-enables them with `(isMerge || c.IsInBSC())`, where `IsInBSC()` is
      just `c.Parlia != nil` — so the modern instruction sets ARE selected and
      PUSH0, MCOPY and transient storage all work.

      (3) But `newShanghaiInstructionSet` is built from
      `newLondonInstructionSet()`, not from `newMergeInstructionSet()` as upstream
      builds it — so the merge rung is bypassed in the DERIVATION CHAIN and
      `opRandom` never enters any table BSC can select. `mergeInstructionSet`
      exists in the binary and is unreachable.

      The result is that `block.prevrandao` in Solidity reads the Parlia
      difficulty — a one-bit value — with no revert and no signal. Any contract
      using it as an entropy source on BSC is drawing from {1, 2}.

      Core reaches the same observable by a THIRD route: it keeps upstream's
      merge-based derivation and then explicitly rebinds 0x44 back to
      `opDifficulty` for Satoshi. Same answer, three different mechanisms — see
      chains/core/.
    src: "core/evm.go:75-77, params/config.go:2136, params/config.go:2159-2172, core/vm/jump_table.go:117-118, core/vm/jump_table.go:125-136"
    src_live: "eth_call 0x445f5260205ff3 @ 121088698 -> 0x..02 (the difficulty); the same call on Ethereum mainnet returns 32 bytes of randomness"
  4844:
    status: inherited
    note: "blob market present; Cancun/Prague/Osaka blob schedules configured"
    src: params/config.go:BSCChainConfig.BlobScheduleConfig
  2537: {status: inherited, note: "BLS12-381 0x0b-0x11 fully present (Prague/Pascal)",
         src: "core/vm/contracts.go:PrecompiledContractsOsaka"}
  7702: {status: inherited, note: "tx type 0x04 present — the only non-mainnet chain here with EIP-7702",
         src: "core/types/transaction.go:SetCodeTxType"}
  7823: {status: inherited, note: "bigModExp{eip7823: true} matches mainnet Osaka exactly",
         src: "core/vm/contracts.go:PrecompiledContractsOsaka"}
  7883: {status: inherited, note: "bigModExp{eip7883: true} matches mainnet Osaka exactly",
         src: "core/vm/contracts.go:PrecompiledContractsOsaka"}
  7951: {status: inherited, note: "p256Verify{eip7951: true} — mainnet gas, unlike OP Stack",
         src: "core/vm/contracts.go:PrecompiledContractsOsaka"}
  2935:
    status: inherited
    note: >-
      The ONLY Ethereum system contract BSC keeps. Notably its bytecode is installed
      by the client at the Prague transition via statedb.SetCode
      (core/systemcontracts/upgrade.go:1117-1120), and the code comment calls it
      "a special system contract in bsc, which can't be upgraded".
    src: "core/systemcontracts/upgrade.go:TryUpdateBuildInSystemContract"
  4788:
    status: removed
    note: >-
      No beacon roots. ActiveSystemContracts takes an early-return IsInBSC() branch
      that omits BEACON_ROOTS_ADDRESS entirely — BSC has no beacon chain.
    src: params/config.go:1917-1923
  6110: {status: removed, note: "no DEPOSIT_CONTRACT_ADDRESS in the IsInBSC branch",
         src: "params/config.go:ActiveSystemContracts"}
  7002: {status: removed, note: "no WITHDRAWAL_REQUEST_PREDEPLOY in the IsInBSC branch",
         src: "params/config.go:ActiveSystemContracts"}
  7251: {status: removed, note: "no CONSOLIDATION_REQUEST_PREDEPLOY in the IsInBSC branch",
         src: "params/config.go:ActiveSystemContracts"}
  note: >-
    BSC's Prague adoption is a clean split: it takes the EVM-facing half (BLS12-381,
    EIP-7702, EIP-2935) and drops the entire beacon/staking half (4788, 6110, 7002,
    7251), which is meaningless without a beacon chain. This is the clearest example
    in the dataset of why fork names must not be trusted over EIP sets.

non_eip_specs:
  - {id: BEP-comprehensive, name: BSC BEP series, adoption: adopted,
     note: "fork names (Kepler, Haber, Pascal, Lorentz, Maxwell, Fermi, Mendel, Pasteur) bundle BEPs"}

tx_types:
  envelope:
    status: inherited
    present: "0x00-0x04"
    src: derived from the eips map (2930 / 1559 / 4844 / 7702); see those entries
    note: >-
      The EIP-2718 envelope this chain accepts in mainnet shape. Derived from the eips map
      (2930/1559/4844/7702); per-type divergences and their evidence are on the rows below.
  note: >-
    0x00-0x04, IDENTICAL to mainnet including EIP-7702 SetCodeTx. No BSC-specific
    envelope types. The only chain in this dataset with zero tx-type divergence.
  src: core/types/transaction.go:48-52

tx_authorization:
  key_binding: derived
  signers_per_tx: 1
  note: >-
    UNCHANGED FROM MAINNET for anything a user can send. types.Sender is stock geth,
    secp256k1 is the only scheme that authorizes a transaction, and the address is still
    the hash of the recovered public key.

    Two BSC features look like alternatives and are not. Parlia's fast-finality VOTES
    are BLS12-381 signatures over block attestations aggregated into the header — that
    is CONSENSUS signing and cannot move a wei out of an account. blsSignatureVerify at
    0x66 is a verifier for CONTRACTS, in exactly the sense P256VERIFY is. Neither is a
    way to authorize a BSC transaction.

    Parlia's SYSTEM TRANSACTIONS deserve precision, because BSC is on the opposite side
    of the line from OP Stack. They are NOT unsigned: applyTransaction builds an
    ordinary legacy transaction and the block proposer signs it with its normal
    secp256k1 validator key (signTxFn), so the sender is recovered by the same path as
    any user transaction. What is special-cased is the RECOVERED ADDRESS, not the
    signature — IsSystemTransaction accepts one only if the recovered sender equals
    header.Coinbase, the effective gas price is zero, and the destination is a system
    contract. Compare OP Stack's 0x7e deposits, which carry no signature at all.
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      src: "core/types/transaction_signing.go:Sender, consensus/parlia/parlia.go:IsSystemTransaction"
    secp256r1:
      status: inherited
      authorizes: never
      precompile: "0x0100"
      note: >-
        P256VERIFY with mainnet semantics and gas. A tool for contracts; a P-256 key
        cannot authorize a BSC transaction at any fork level.
      src: "core/vm/contracts.go:p256Verify"
    bls12_381:
      status: added
      authorizes: never
      precompile: "0x66"
      note: >-
        RECORDED SO IT IS NOT MISREAD. BSC handles BLS in two unrelated places and
        neither authorizes a transaction. blsSignatureVerify at 0x66 (Luban) is a
        contract-callable verifier, the BLS analogue of P256VERIFY. Parlia's
        VoteAttestation carries BLS votes and vote addresses through the consensus
        layer, where they finalize blocks — they are not transaction signatures and
        cannot be used as such. There is no BSC transaction envelope that accepts a
        BLS signature. (The standard EIP-2537 range 0x0b-0x11 is present too, from
        Prague/Pascal; 0x66 is named as the pairing because it is the one that verifies
        a BLS SIGNATURE rather than exposing curve operations.)
      src: "core/vm/contracts.go:blsSignatureVerify, core/types/vote.go:VoteAttestation"

precompiles:
  # verified: core/vm/contracts.go:PrecompiledContractsOsaka (LIVE set as of 2026-08-16)
  base_map:
    status: inherited
    present: "0x01-0x11"
    p256verify: true
    src: core/vm/contracts.go:PrecompiledContractsOsaka
    note: >-
      The full mainnet Osaka base range, unmodified — BLS12-381 (Prague/Pascal),
      MODEXP with EIP-7823/7883 bounds, P256VERIFY with mainnet gas. The most
      mainnet-faithful base map in this dataset.
  "0x64":
    name: tmHeaderValidate
    status: added
    tombstoned_at: 1787625000
    note: >-
      Tendermint header validation for the BNB Beacon Chain bridge. LIVE today.
      Will become tmHeaderValidateDeprecated at Pasteur (2026-08-25), after which it
      returns errors.New("deprecated") — tombstoned, not removed.
    src: core/vm/contracts.go:343, core/vm/contracts_lightclient.go:139-147
  "0x65":
    name: iavlMerkleProofValidate
    status: added
    tombstoned_at: 1787625000
    note: >-
      IAVL merkle proof validation. Currently the Plato variant; has been revised
      four times (base, Moran, Planck, Plato). Also tombstoned at Pasteur.
    src: core/vm/contracts.go:344
  "0x66":
    name: blsSignatureVerify
    status: added
    fork: luban
    src: core/vm/contracts.go:345
  "0x67":
    name: cometBFTLightBlockValidate
    status: added
    fork: luban
    note: "currently the Hertz variant; Pasteur introduces another"
    src: core/vm/contracts.go:346
  "0x68":
    name: verifyDoubleSignEvidence
    status: added
    note: "consensus slashing evidence verification exposed to the EVM"
    src: core/vm/contracts.go:347
  "0x69":
    name: secp256k1SignatureRecover
    status: added
    note: "distinct from ECRECOVER at 0x01"
    src: core/vm/contracts.go:348
  "0x0100": {name: P256VERIFY, status: inherited, note: "mainnet semantics and gas",
             src: "core/vm/contracts.go:PrecompiledContractsOsaka, params/protocol_params.go:P256VerifyGas"}
  note: >-
    ADDRESS PLACEMENT RISK. BSC's custom precompiles occupy 0x64-0x69 (decimal
    100-105), which sits BETWEEN mainnet's occupied 0x01-0x11 and 0x0100. Mainnet
    allocates upward from 0x11, leaving only 0x12-0x63 of headroom before collision.
    Every other chain in this dataset placed customs at 0x0100.., 0x0200.. or higher.
    BSC is the one on a collision course, and two of these addresses are being
    tombstoned rather than freed — permanently consumed.


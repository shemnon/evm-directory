    src: "crates/execution/vm-types/src/spec.rs:eip2028"
    note: "calldata non-zero gas fell from 68 to 16 only at V3.0"
  1884:
    status: inherited
    fork: "V3.0 (CIP-645)"
    src: "crates/execution/vm-types/src/spec.rs:eip1884"
  684:
    status: inherited
    fork: "V3.0 (CIP-645)"
    src: "crates/execution/vm-types/src/spec.rs:fix_eip684"
    note: "CREATE-into-collision reverts; before CIP-645 it did not"
  155:
    status: modified
    severity: high
    src: "crates/rpc/rpc-eth-types/src/transaction.rs:from_signed, crates/primitives/src/transaction/eth_transaction.rs:fake_sign_phantom"
    src_live: "eth_getBlockByNumber(0x94230d9, true) @ 155332825 -> tx 0: from 0x00..00, v 0x82f, r 0x406, s 0x406, while its own `raw` field RLP-encodes r = s = 0x80 (zero)"
    note: >-
      THE JSON SIGNATURE FIELDS ARE FABRICATED FOR SOME TRANSACTIONS. Phantom
      transactions (see `system_transactions`) are fake-signed with `r = s =
      sender address` and `v = 0`; when the sender is the zero address that gives
      r = s = 0, so `Transaction::from_signed` substitutes the CHAIN ID —
      "some txs r and s to 0 which is not valid in some ethereum tools, so we set
      them to chain_id". The `raw` field in the same JSON object still contains
      the real RLP with zeros. A client that re-derives the transaction hash from
      the JSON r/s/v gets a different hash from the one the same response
      reports; `ecrecover` on the JSON signature returns garbage rather than
      `from`.

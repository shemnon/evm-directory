schema_version: 2

chain:
  name: Avalanche C-Chain
  slug: avalanche-c
  chain_id: 43114
  role: fork
  live: true

lineage:
  upstream: ethereum
  ancestry: [ethereum]
  fork_of: go-ethereum (via libevm)
  note: >-
    The C-Chain VM is avalanchego's own since the coreth repo was archived. From
    Helicon (2026-09-22) it is the SAE VM (vms/saevm, ACP-194), and v1.15.3 registers
    saevm.Factory directly. No Coreth execution path is left in the tree: graft/coreth
    keeps only params, header types, the precompiles and nativeasset. Like coreth
    before it, the VM is NOT a whole-repo geth fork. It consumes ava-labs/libevm — a geth fork published as a library with explicit extension
    hooks — and layers Avalanche behaviour through RulesExtra hooks
    (graft/coreth/params/hooks_libevm.go, vms/saevm/cchain/libevm). Structurally the cleanest fork relationship in this
    dataset: divergence is concentrated in hook implementations rather than
    scattered through a patched tree.
  sync_point: >-
    avalanchego v1.15.3 on libevm v1.13.15-0.20261028200218-d398bc4dbe41. EVM behaviour
    tracks geth through CANCUN only — see forks. Execution has been asynchronous (SAE)
    since Helicon.

client:
  name: avalanchego (C-Chain VM)
  repo: https://github.com/ava-labs/avalanchego
  version: v1.15.3
  commit: 983815fd993acf846a27749b598f0fea4d876a75
  language: go
  note: >-
    RE-PINNED FROM ava-labs/coreth, WHICH WAS ARCHIVED ON 2025-11-25. Coreth moved into
    avalanchego as graft/coreth, and the row read a frozen repo for a year. Since Helicon
    (2026-09-22) the C-Chain VM is avalanchego's transitionvm: Coreth up to Helicon, then
    the SAE VM (vms/saevm, ACP-194). The last coreth-repo pin was v0.16.0 @ 64c271b4.

live_probe:
  endpoint: https://api.avax.network/ext/bc/C/rpc
  chain_id: 43114
  observed_at_block: 101206057
  observed_at: 2026-11-23
  chain_id_src_live: "eth_chainId @ 101206057 -> 0xa86a (43114)"
  note: >-
    Added at the avalanchego re-pin. web3_clientVersion @ 101206057 answers
    avalanchego/1.15.3 commit=983815fd, the pinned commit exactly.

consensus:
  engine: Snowman++ (Avalanche consensus)
  finality: sub-second, single-slot

baseline_fork: cancun

forks:
  src: upgrade/upgrade.go:Mainnet, vms/saevm/cchain/cparams/config.go:FromUpgrades
  mapping_src: vms/saevm/cchain/genesis.go:100-101
  note: >-
    Only two Avalanche upgrades map onto Ethereum forks, and the mapping is an
    explicit assignment, not a coincidence:
    `c.ShanghaiTime = durango` and `c.CancunTime = etna`.
    There is NO PragueTime or OsakaTime assignment anywhere in the tree.
  timeline:
  - {name: "Apricot Phase 1-6", mainnet_equivalent: null}
  - {name: apricot_phase3, mainnet_equivalent: london, note: "sets LondonBlock = 0"}
  - {name: banff,   mainnet_equivalent: null, note: deprecated the native-asset precompiles}
  - {name: cortina, mainnet_equivalent: null}
  - {name: durango, mainnet_equivalent: shanghai, enforced: "ShanghaiTime = durango"}
  - {name: etna,    mainnet_equivalent: cancun,   enforced: "CancunTime = etna"}
  - {name: fortuna, mainnet_equivalent: null}
  - {name: granite, activation_time: 1763568000, mainnet_equivalent: null, note: "added P256VERIFY at 0x0100 — out of Ethereum's fork order"}
  - name: helicon
    activation_time: 1790089200
    mainnet_equivalent: null
    severity: high
    note: >-
      CONTINUOUS (ASYNCHRONOUS) EXECUTION, ACP-194, plus ACP-283's dynamic minimum gas
      price. Blocks are accepted first and executed afterwards. Consequences on this chain:
      (1) a header's stateRoot is the post-execution root of the LAST SETTLED block, not of
      the block itself (Tau = 5 s); (2) "latest" is the last-executed block, and "safe" and
      "finalized" are the last-settled one; (3) every transaction is charged at least
      ceil(gasLimit/2); (4) inclusion is checked against a worst-case balance and nonce
      state, so included transactions are valid when executed; (5) atomic import/export
      transactions become end-of-block operations whose gas is counted in gasUsed, so
      extDataGasUsed is 0; (6) a builder rule asks each transaction to carry at least
      blockGasLimit/TargetBlockBytes gas per byte, so a full block still fits one 2 MiB
      p2p message. No Ethereum fork is added: there is still no PragueTime.
    src: "upgrade/upgrade.go:Mainnet, node/node.go:saevm, vms/saevm/sae/block_builder.go:PostExecutionStateRoot, vms/saevm/params/params.go:TauSeconds, graft/coreth/params/hooks_libevm.go:MinimumGasConsumption, vms/saevm/worstcase/state.go:State, vms/saevm/cchain/hooks.go:ExtDataGasUsed, vms/saevm/txgossip/txgossip.go:minGasForSize, vms/saevm/cchain/cparams/config.go:HeliconTimestamp"
    src_live: "eth_getBlockByNumber @ 95921104 -> timestamp 1790089190, no targetExponent; @ 95921105 -> timestamp 1790089200, targetExponent 0x2c5c860"
    src_doc: "https://github.com/avalanche-foundation/ACPs/tree/main/ACPs/194-streaming-asynchronous-execution"
  - {name: igloo, status: pending, mainnet_equivalent: null, note: "declared placeholder, UnscheduledActivationTime at v1.15.3", src: "upgrade/upgrade.go:IglooTime"}

eips:
  1559:
    status: modified
    note: >-
      Avalanche uses its own dynamic-fee mechanism (ACP-176 target gas excess, now
      with ACP-283's dynamic minimum price from Helicon) rather than mainnet's 1559
      base-fee update rule. London is marked active but fee dynamics differ.
    src: "vms/saevm/gastime/acp176.go:AfterBlock, vms/saevm/cchain/dynamic/doc.go"
  4844:
    status: removed
    note: >-
      Cancun is active via Etna, but blobs are explicitly disabled. Block validation
      rejects any header with blobGasUsed != 0 or excessBlobGas != 0: since Helicon
      the SAE builder writes both as zero and a block is verified by rebuilding it.
      The header fields exist and are pinned to zero.
    src: "vms/saevm/cchain/hooks.go:BlobGasUsed, vms/saevm/cchain/hooks.go:ExcessBlobGas"
  4788:
    status: modified
    note: >-
      parentBeaconRoot must be the EMPTY HASH — there is no beacon chain. The field
      is structurally present (Cancun compliance) and semantically inert, so the
      beacon-roots system contract has nothing to read.
    src: "vms/saevm/cchain/hooks.go:ParentBeaconRoot"
  2537:
    status: removed
    note: "BLS12-381 precompiles 0x0b-0x11 never adopted — C-Chain has no Prague"
    src: "vms/saevm/cchain/genesis.go:CancunTime"
  2935: {status: removed, note: "Prague not adopted", src: "vms/saevm/cchain/genesis.go:CancunTime"}
  6110: {status: removed, note: "Prague not adopted; no beacon chain", src: "vms/saevm/cchain/genesis.go:CancunTime"}
  7002: {status: removed, note: "Prague not adopted; no beacon chain", src: "vms/saevm/cchain/genesis.go:CancunTime"}
  7251: {status: removed, note: "Prague not adopted; no beacon chain", src: "vms/saevm/cchain/genesis.go:CancunTime"}
  7702:
    status: removed
    note: >-
      NO EOA code delegation. Prague was never adopted, so tx type 0x04 does not
      exist. This is the single most consequential absence for wallets and
      account-abstraction tooling targeting the C-Chain.
    src: "vms/saevm/cchain/genesis.go:CancunTime"
  7823: {status: removed, note: Osaka not adopted, src: "vms/saevm/cchain/genesis.go:CancunTime"}
  7883: {status: removed, note: Osaka not adopted, src: "vms/saevm/cchain/genesis.go:CancunTime"}
  7951:
    status: modified
    note: >-
      P256VERIFY at 0x0100, added at GRANITE — an Avalanche-specific upgrade, not
      Osaka. Adopted OUT OF ORDER: the C-Chain has 0x0100 but does NOT have the
      BLS12-381 precompiles at 0x0b-0x11 that mainnet shipped two forks earlier.
      Fork-level inference from precompile presence fails here in both directions.
    src: "graft/coreth/params/hooks_libevm.go:PrecompiledContractsGranite"

non_eip_specs:
  - {id: ACP-176, name: dynamic fee / target gas excess, adoption: adopted,
     src: "vms/saevm/gastime/acp176.go:AfterBlock"}
  - {id: Avalanche Warp Messaging, name: cross-subnet messaging, adoption: adopted, fork: durango,
     src: "graft/coreth/precompile/contracts/warp/contract.go:ContractAddress"}
  - {id: ACP-194, name: streaming asynchronous execution, adoption: adopted, fork: helicon,
     src: "node/node.go:saevm"}
  - {id: ACP-283, name: dynamic minimum gas price, adoption: adopted, fork: helicon,
     src: "vms/saevm/cchain/cparams/config.go:HeliconTimestamp"}

tx_types:
  envelope:
    status: inherited
    present: "0x00-0x02"
    src: derived from the eips map (2930 / 1559 / 4844 / 7702); see those entries
    note: >-
      The EIP-2718 envelope this chain accepts in mainnet shape; no blob transactions
      (EIP-4844), no EIP-7702 set-code transactions. Derived from the eips map
      (2930/1559/4844/7702); per-type divergences and their evidence are on the rows below.
  note: >-
    EVM envelope types come from libevm: 0x00-0x03. 0x04 (EIP-7702 SetCode) is
    ABSENT because Prague was never adopted. Blob txs (0x03) exist as a type but
    cannot be included — blob gas is pinned to zero at the header level.
  "0x03":
    name: BlobTx
    status: removed
    note: "type exists in libevm but blocks with nonzero blob gas are rejected"
    src: "vms/saevm/cchain/hooks.go:BlobGasUsed"
  "0x04":
    name: SetCodeTx
    status: removed
    note: "EIP-7702 not adopted — Prague absent"
    src: "vms/saevm/cchain/genesis.go:CancunTime"

non_evm_transactions:
  # SCHEMA NOTE: these have no EIP-2718 type byte and are not RLP. New category.
  note: >-
    Atomic transactions move value between the C-Chain and Avalanche's X/P chains.
    They are UTXO-based, serialised with Avalanche's own codec (not RLP), and
    registered in a separate codec namespace (vms/saevm/cchain/tx/codec.go) —
    they live entirely OUTSIDE the EIP-2718 envelope while still being included in
    C-Chain blocks. No type byte can be assigned to them, which is why they cannot
    appear in tx_types.
  entries:
  - name: UnsignedImportTx
    status: added
    src: "vms/saevm/cchain/tx/import.go:Import"
    fields: [NetworkID, BlockchainID, SourceChain, ImportedInputs, Outs]
  - name: UnsignedExportTx
    status: added
    src: "vms/saevm/cchain/tx/export.go:Export"
    fields: [NetworkID, BlockchainID, DestinationChain, Ins, ExportedOutputs]

tx_authorization:
  key_binding: derived
  signers_per_tx: "1 for EVM transactions; N for atomic transactions"
  note: >-
    TWO AUTHORIZATION MODELS ON ONE CHAIN, and only one of them is Ethereum's. EVM
    transactions are stock: TransactionToMessage calls libevm's types.Sender, secp256k1,
    one signer, address = hash of the recovered key.

    The ATOMIC transactions already recorded in non_evm_transactions are authorized
    completely differently. They are not RLP, carry no type byte, and are not signed
    with an Ethereum digest. The signed payload is the Avalanche-codec serialization of
    the UNSIGNED transaction, hashed by avalanchego's hashing.ComputeHash256 rather than
    keccak256 over an EIP-155/EIP-2718 envelope, and the signature block is not a single
    (v,r,s) but a LIST OF CREDENTIALS — Tx.Creds — one per input, each holding a list of
    signatures. The count of signers is therefore a property of the transaction, not of
    the chain: an export with five EVMInputs owned by five different accounts is one
    transaction with five independent signers, and an import spending an m-of-n
    threshold UTXO needs m signatures for that one input alone. This is the same curve
    as an EVM transaction and a fundamentally different authorization envelope.

    signers_per_tx is written as prose because a single integer would be false for one
    of the two paths.

    Warp's BLS12-381 is the trap in this row and is recorded as `authorizes: never`.
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      note: >-
        EVM path. Sender recovery and the 0x01-0x11 implementations come from
        ava-labs/libevm (d398bc4dbe41), a module dependency outside this clone. The
        in-tree evidence is the SAE executor's call into libevm's state processing,
        and the C-Chain hooks add no other signer.
      src: "vms/saevm/saexec/execution.go:NewEVMBlockContext"
      src_doc: "https://github.com/ava-labs/libevm/blob/d398bc4dbe41/core/state_transition.go"
    secp256k1_utxo_credential:
      status: added
      authorizes: protocol
      precompile: "0x01"
      note: >-
        The atomic import/export path. Same curve, different everything else.

        EXPORT: one credential per EVMInput, each required to hold EXACTLY ONE signature
        (errIncorrectNumSignatures otherwise), recovered against utx.Bytes() and checked
        against that input's declared Address via pubKey.EthAddress(). Multiple distinct
        accounts can be debited by one transaction, each authorizing only its own input.

        IMPORT: one credential per imported UTXO, verified by Fx.VerifyTransfer against
        the UTXO's own secp256k1fx output owners — an m-of-n threshold multisig defined
        on the SOURCE chain (X or P). For those inputs the key binding is effectively
        `declared`, not `derived`: the addresses and threshold that may spend are
        written into the UTXO, not derived from any C-Chain account.

        PRECOMPILE PAIRING, STATED CAREFULLY. This is NOT an `authorizes: protocol` +
        `precompile: none` finding. The scheme is secp256k1 ECDSA, and 0x01 verifies
        secp256k1 ECDSA, so a contract that reconstructs the digest can check these
        signatures. The catch is the digest: it is SHA-256 of the Avalanche-codec bytes
        of the unsigned transaction. RecoverPublicKey hashes with
        hashing.ComputeHash256 before recovering, which the avalanchego re-pin now
        lets this row verify. It is not keccak256 of an RLP envelope, so a contract must
        rebuild the codec bytes and SHA-256 them (0x02) before calling 0x01. Recorded as
        0x01 with that caveat rather than as `none`.
      src: "vms/saevm/cchain/tx/export.go:verifyCredentials, vms/saevm/cchain/tx/import.go:verifyCredentials, utils/crypto/secp256k1/secp256k1.go:RecoverPublicKey"
    secp256r1:
      status: inherited
      authorizes: never
      precompile: "0x0100"
      note: >-
        P256VERIFY, adopted at Granite out of Ethereum's fork order (see eips.7951). A
        tool for contracts; a P-256 key cannot authorize either kind of C-Chain
        transaction.
      src: "graft/coreth/params/hooks_libevm.go:P256VerifyAddress"
    bls12_381:
      status: added
      authorizes: never
      precompile: "0x0200000000000000000000000000000000000005"
      note: >-
        AVALANCHE WARP MESSAGING IS CONSENSUS SIGNING, NOT TRANSACTION AUTHORIZATION.
        A Warp message carries an aggregated BLS signature from a source-subnet
        validator set, and it authorizes a MESSAGE to be treated as verified — it never
        authorizes a C-Chain transaction, pays no fee, and has no nonce or account.

        The pairing is also indirect and worth stating: the aggregate signature is
        verified by Config.VerifyPredicate, a BLOCK PREDICATE evaluated outside EVM
        execution. The precompile at 0x0200..05 only READS the predicate result. So a
        contract cannot hand this address an arbitrary BLS signature and get a verdict
        the way it can with 0x01 — the address is listed as the pairing because it is
        where Warp BLS verification is reachable at all, not because it is a
        general-purpose BLS verifier.
      src: "graft/coreth/precompile/contracts/warp/config.go:VerifyPredicate, graft/coreth/precompile/contracts/warp/contract.go:ContractAddress"

precompiles:
  # verified: graft/coreth/params/hooks_libevm.go:81-86 (PrecompiledContractsGranite = current)
  base_map:
    status: inherited
    present: "0x01-0x0a"
    p256verify: true
    src: >-
      graft/coreth/params/hooks_libevm.go:PrecompiledContractsGranite (base 0x01-0x0a resolved
      through the ava-labs/libevm dependency, not vendored in this tree)
    note: >-
      Cancun-level base: 0x01-0x0a present, MODEXP without the EIP-7823/7883 Osaka
      bounds (see 0x05), no EIP-2537 BLS at 0x0b-0x11 (no Prague). P256VERIFY at
      0x0100 arrives out of Ethereum fork order, at Granite — see the 0x0100 row.
  "0x05":
    name: MODEXP
    status: modified
    note: "Cancun-level (eip2565 only) — no EIP-7823 bounds, no EIP-7883 repricing, because Osaka was never adopted"
    src: "vms/saevm/cchain/genesis.go:CancunTime"
  "0x0b": {name: BLS12_G1ADD, status: removed, note: "EIP-2537 absent — no Prague", src: "vms/saevm/cchain/genesis.go:CancunTime"}
  "0x0c": {name: BLS12_G1MSM, status: removed, note: "EIP-2537 absent — no Prague", src: "vms/saevm/cchain/genesis.go:CancunTime"}
  "0x0d": {name: BLS12_G2ADD, status: removed, note: "EIP-2537 absent — no Prague", src: "vms/saevm/cchain/genesis.go:CancunTime"}
  "0x0e": {name: BLS12_G2MSM, status: removed, note: "EIP-2537 absent — no Prague", src: "vms/saevm/cchain/genesis.go:CancunTime"}
  "0x0f": {name: BLS12_PAIRING, status: removed, note: "EIP-2537 absent — no Prague", src: "vms/saevm/cchain/genesis.go:CancunTime"}
  "0x10": {name: BLS12_MAP_FP_TO_G1, status: removed, note: "EIP-2537 absent — no Prague", src: "vms/saevm/cchain/genesis.go:CancunTime"}
  "0x11": {name: BLS12_MAP_FP2_TO_G2, status: removed, note: "EIP-2537 absent — no Prague", src: "vms/saevm/cchain/genesis.go:CancunTime"}
  "0x0100000000000000000000000000000000000000":
    name: GenesisContract
    status: tombstoned
    note: "always reverts (nativeasset.DeprecatedContract → vm.ErrExecutionReverted)"
    src: graft/coreth/nativeasset/contract.go:25,167-171
  "0x0100000000000000000000000000000000000001":
    name: NativeAssetBalance
    status: tombstoned
    note: >-
      Live in Apricot Phase 2 and again in Phase 6; tombstoned at Banff. Now always
      reverts. Address is permanently burned — cannot be reused.
    src: graft/coreth/nativeasset/contract.go:26
  "0x0100000000000000000000000000000000000002":
    name: NativeAssetCall
    status: tombstoned
    note: "same lifecycle as NativeAssetBalance; always reverts since Banff"
    src: graft/coreth/nativeasset/contract.go:27
  "0x0200000000000000000000000000000000000005":
    name: Warp Messenger
    status: added
    fork: durango
    note: >-
      Stateful precompile for Avalanche Warp Messaging. Uses block predicates
      (GetPredicateResults) — a mechanism with no mainnet analogue: results are
      computed outside normal EVM execution and read by the precompile.
    src: "graft/coreth/precompile/contracts/warp/contract.go:ContractAddress"
  "0x0100":
    name: P256VERIFY
    status: modified
    fork: granite
    note: "adopted at Granite, out of Ethereum fork order — see eips.7951"
    src: "graft/coreth/params/hooks_libevm.go:PrecompiledContractsGranite"
  note: >-
    Two distinct custom ranges: 0x0100..00-02 (legacy native-asset, all tombstoned)
    and 0x0200..05 (warp). Both are far from mainnet's 0x01-0x11, following the
    convention. The three tombstoned addresses are the clearest example in this
    dataset of precompile addresses being permanently consumed: they cannot be
    reused and cannot be removed, only made to revert.

system_contracts:
  note: >-
    None of Ethereum's system contracts are present. Beacon roots (0x000F3df6..) is
    meaningless without a beacon chain; EIP-2935 history, EIP-7002/7251 queues and
    the deposit contract all require Prague, which was never adopted.

opcodes:
  prevrandao:
    source: difficulty
    value: the constant 1
    chooser: >-
      nobody — since Helicon the SAE builder writes `Difficulty: big.NewInt(1)` and a
      block is verified by rebuilding it (before Helicon, coreth's dummy engine did the same)
    known_at: always
    note: >-
      COPIED FROM THE DIFFICULTY FIELD BY A libevm HOOK, NOT READ FROM ANY HEADER MIX.
      `OverrideNewEVMArgs` runs inside `vm.NewEVM`: from Shanghai onward it sets
      `BlockContext.Random = Difficulty.Bytes()` and then zeroes `Difficulty`. The
      comment says why — "This allows using the same jump table as upstream": coreth
      wants stock geth's post-merge jump table, where 0x44 is `opRandom`, so it feeds
      the difficulty in through the `Random` slot rather than patch the instruction.
      The SAE VM kept the trick verbatim in its own libevm hook, and its builder fixes
      the difficulty at 1, so `block.prevrandao` and `block.difficulty` are both 1
      forever, across the Helicon switch.
    src: >-
      vms/saevm/cchain/libevm/vm/hooks.go:OverrideNewEVMArgs, vms/saevm/cchain/hooks.go:Difficulty
  added: []
  removed: []
  modified: []
  note: >-
    No opcode divergence. Avalanche's changes are concentrated in precompiles, fee
    dynamics and the atomic-tx layer.

tx_lifecycle:
  ordered_then_invalid:
    verdict: unreachable
    src: "vms/saevm/sae/block_builder.go:pendingTxs, vms/saevm/worstcase/state.go:State"
    note: >-
      SAME VERDICT, NEW MECHANISM SINCE HELICON. The SAE builder no longer executes a
      transaction to include it: it applies each candidate to a worst-case balance and
      nonce state designed so that everything included is valid when the execution
      stream reaches it. The ordered-but-invalid state stays unreachable. Before
      Helicon (Coreth): the proposer executes each transaction as it appends it: an invalid one is popped out
      of the candidate set and never reaches the block, so the ordered-but-invalid state is
      not reachable and the nonce is untouched. If one reached a proposed block anyway,
      `preCheck` fails at import and the whole block is invalid. Mainnet semantics, verified
      against this row's own pinned client rather than assumed from the family.
  nonce_on_failure:
    verdict: preserved
    src: "vms/saevm/sae/block_builder.go:pendingTxs, vms/saevm/worstcase/state.go:State"
    note: >-
      Preserved. Nothing is committed for a transaction the builder rejected, so the account
      nonce is untouched and the sender resubmits at the same nonce.

p2p:
  max_tx_bytes:
    verdict: 131072
    tier: policy
    src_doc: "https://github.com/ava-labs/libevm/blob/d398bc4dbe41/core/txpool/legacypool/legacypool.go"
    note: >-
      The flat cap is libevm's geth value (4 * 32 KiB), at the libevm version avalanchego
      v1.15.3 pins. It is no longer the binding rule. Since Helicon the gossip layer also
      requires gasLimit >= ceil(size * blockGasLimit / TargetBlockBytes): at 80M gas and
      1.75 MiB that is about 43.6 gas per byte, so a transaction heavy on calldata but light
      on gas is refused far below 128 KiB. This keeps a full block inside one p2p message.
      TargetBlockBytes is marked "NOT a consensus-breaking change", so this is builder and
      mempool policy, not block validity.
  max_message_bytes:
    verdict: 2031616
    tier: transport
    src: "graft/evm/message/codec.go:maxMessageSize"
    note: >-
      A FIFTH OF MAINNET'S. `2*units.MiB - 64*units.KiB` = 2,031,616 bytes, and the comment
      states the derivation: the 64 KiB is subtracted "to leave room for encoding overhead
      from AvalancheGo", so the VM's codec sits deliberately under the host's network cap.
      Mainnet's 10 MiB `eth` message limit has no counterpart here because there is no
      `eth` protocol to carry it.
  transports:
    verdict: "AvalancheGo p2p"
    src: "graft/evm/message/codec.go:maxMessageSize"
    note: >-
      NOT DEVP2P. The clone has no `eth/protocols` directory at all: the EVM runs as a VM
      plugin inside AvalancheGo, which speaks its own TLS/protobuf transport, and the VM
      reaches peers through AppRequest/AppGossip rather than an RLPx subprotocol.
      Transaction gossip is also a different MODEL, not just a different wire — it is
      bloom-filter pull gossip (SAE's `vms/saevm/txgossip`, coreth's `eth_gossiper.go` before it), where a peer advertises what it holds and others
      pull the gap, in place of mainnet's push-and-announce.
    stack:
      - {layer: execution, protocol: AvalancheGo p2p, purpose: AppGossip tx + block exchange}

block_metrics:
  block_gas_limit:
    verdict: ~
    observed: 80000000
    observed_at_block: 101206057
    observed_at: 2026-11-23
    mutability: adjustable
    src_live: "eth_getBlockByNumber @ 101196057 and @ 101206057 -> gasLimit 0x4c4b400 (80,000,000) at both"
    note: >-
      ACP-176 sets the per-block limit at 20 times the gas target, and the target is
      itself a validator-voted exponent (targetExponent in the header), so the limit can
      move without a fork. The txgossip README gives 80M as the Helicon-launch figure.

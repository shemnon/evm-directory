schema_version: 2

chain:
  name: Conflux eSpace
  slug: conflux
  chain_id: 1030
  role: independent
  equivalence: behavioural
  live: true
  chain_id_src: "run/hydra.toml:evm_chain_id"
  note: >-
    eSpace is not a chain. It is one of TWO SPACES inside a single Conflux ledger:
    Core Space (chain id 1029, `cfx:` base32 addresses, Conflux's own account and
    transaction model) and eSpace (chain id 1030, `0x` addresses, Ethereum
    semantics). One node, one block DAG, one consensus, one PoW, one epoch
    sequence, ONE BLOCK BODY — and two disjoint account trees with separate
    nonces. Everything below is a BEHAVIOURAL comparison against mainnet:
    conflux-rust is an original Rust client whose EVM interpreter descends
    distantly from OpenEthereum/Parity (the file headers still say so) but which
    reimplements the state transition, the fee market and the ledger.

    THE SINGLE MOST IMPORTANT STRUCTURAL FACT: an eSpace "block" does not exist.
    `eth_getBlockByNumber` synthesises a PHANTOM BLOCK per EPOCH by scanning every
    Core-Space block in that epoch's ordered block set, keeping the eSpace
    transactions, dropping the skipped ones and injecting synthetic transactions
    for cross-space calls. The header it returns is the epoch's PIVOT block's
    header with some fields substituted and some invented. Almost every divergence
    in this row follows from that one sentence.

lineage:
  upstream: null
  ancestry: []
  fork_of: null
  inspired_by: "OpenEthereum / Parity (VM interpreter and gas-spec skeleton only)"
  note: >-
    `crates/execution/vm-types/src/spec.rs` and the interpreter still carry Parity
    Technologies copyright headers, and `Spec` is recognisably OpenEthereum's cost
    struct. Everything above the interpreter — consensus (Tree-Graph/GHAST + a PoS
    finality chain), the two-space state, the epoch executor, the fee market, the
    RPC layer — is Conflux's own. There is no Ethereum client this row can be
    diffed against, so every entry is a behavioural claim.

client:
  name: conflux-rust
  repo: https://github.com/Conflux-Chain/conflux-rust
  version: v3.1.0
  commit: 6e2e837c8271695b139e491f50e586ebd8ed10c8
  language: rust
  note: >-
    The pinned tag is EXACTLY what mainnet runs: `web3_clientVersion` answers
    `conflux-rust/v3.1.0-6e2e837-20260810/x86_64-linux-gnu/rustc1.94.1`, and
    `6e2e837` is the short form of this commit. Core Space and eSpace are the same
    binary; `cfx_clientVersion` on https://main.confluxrpc.com returns the same
    string. No companion repo: the whole state transition, consensus, tx pool and
    RPC live in this tree.

live_probe:
  endpoint: https://evm.confluxrpc.com
  chain_id: 1030
  observed_at_block: 155333000
  note: >-
    Block 155333000 = epoch 155,333,000, timestamp 1787845217 (2026-08-27
    ~15:40 UTC), baseFeePerGas 20 gwei, hash 0x89f90b56..0f94. A few claims are
    pinned to nearby blocks (155332816, 155332825, 155332908) and say so. The
    CORE-space RPC https://main.confluxrpc.com (chain id 1029) is used for the
    handful of claims that require seeing the same ledger from the other space;
    those are marked `cfx_*` in the citation and are pinned to the same epoch.

consensus:
  engine: "Tree-Graph DAG + GHAST (PoW, adaptive weight) with a PoS finality chain (CIP-43)"
  finality: "PoS-finalised, ~200-240 epochs behind the tip; PoW blocks before that are reorgable"
  block_time: "~0.5 s per DAG block, ~1 s per epoch (eSpace block.number advances ~1/s)"
  src: "crates/parameters/src/lib.rs:DEFERRED_STATE_EPOCH_COUNT, crates/cfxcore/core/src/consensus/consensus_graph/rpc_api/phantom_block_provider.rs:get_phantom_block_by_number"
  src_live: "cfx_getStatus @ 155333043 -> epochNumber 0x942318e-ish, blockNumber 0x166b396a, latestState = epochNumber-4, latestConfirmed = -46, latestFinalized = -183..-239"
  note: >-
    ORDERING COMMITS LONG BEFORE EXECUTION, AND IT IS A DAG, NOT A CHAIN.

    (a) Miners produce blocks into a directed acyclic graph. Each block names one
    `parentHash` and any number of `refereeHashes`. GHAST picks a PIVOT CHAIN
    through the DAG; each pivot block defines an EPOCH, whose ordered block set is
    every block newly reachable from that pivot. Total order = epoch order, then a
    deterministic order within the epoch, then transaction index. Ordering is
    therefore fixed the moment the pivot chain is fixed — which is before anybody
    has executed a byte.

    THE DEFERRAL IS FIVE EPOCHS. `DEFERRED_STATE_EPOCH_COUNT = 5`: the header of
    the pivot block at height H commits `deferred_state_root`, `deferred_receipts_root`
    and `deferred_logs_bloom_hash` for epoch H-5, not for H. This is the same
    invariant break as Monad's deferred execution and a DIFFERENT SHAPE. Monad
    puts a REAL post-state root of block N in block N's header and defers only the
    AGREEMENT (block N+3 carries the executed header). Conflux puts a root that
    belongs to a DIFFERENT EPOCH in the header field named `stateRoot`, and the
    eSpace RPC republishes it verbatim under the Ethereum key `stateRoot`. Monad's
    field is right and early; Conflux's field is wrong and on time.

    (b) Execution is sequential within an epoch, single-threaded over the ordered
    block set. There is no optimistic parallel execution in the consensus rules;
    an `enable_optimistic_execution` node option exists and is a local
    speculation, not a protocol feature. Two implementations cannot disagree about
    conflict resolution because there is no conflict resolution.

    (c) See `gotchas` and `system_transactions`. Short version: a transaction that
    is ordered but invalid at execution time gets `TransactionStatus::Skipped`,
    which the eSpace RPC ERASES — no receipt, no transaction lookup, no entry in
    the block.

    (d) There is no early receipt. `eth.rs:transaction_receipt` returns `None`
    while `epoch_num > best_executed_state_epoch_number` ("the receipt is only
    visible to optimistic execution"), and `BlockId::Latest` maps to
    `EpochNumber::LatestState`, so `eth_blockNumber` itself reports the last
    EXECUTED epoch, four to five behind the tip. Conflux is the mirror image of
    MegaETH: MegaETH shows you a receipt before the block exists; Conflux hides
    the block until after the state exists.

baseline_fork: osaka
baseline_note: >-
  Claimed at the OPCODE AND PRECOMPILE SET only, and only since 2026-08-25.
  Conflux's V3.1 hardfork activated at epoch 155,140,000 (timestamp 1787624438,
  two days before this row was written) and brought CIP-166 (EIP-7939 CLZ),
  CIP-167 (P256VERIFY at 0x0100 with the Osaka gas), CIP-174 (EIP-7823 + EIP-7883
  MODEXP) and CIP-172/175/176. Verified live: `CLZ(1)` returns 255 at the pinned
  block. What "Osaka" does NOT buy you here: blobs (EIP-4844/7594) do not exist,
  EIP-4788 has no contract, EIP-2935's contract address has NO CODE so the
  client's history write is a no-op, the withdrawal/consolidation predeploys are
  absent, and the gas schedule is NOT Ethereum's — see `fee_model` and
  `non_eip_specs.CIP-645`. The devnet-only switch that would make gas identical
  (`align_evm_transition_height`) defaults to `u64::MAX` and is NOT set on
  mainnet.

forks:
  src: "crates/config/src/configuration.rs:osaka_opcode_transition_height, crates/execution/executor/src/spec.rs:TransitionsEpochHeight"
  note: >-
    TWO LADDERS THAT DO NOT LINE UP, AND THE UNITS ARE THE TRAP. Conflux gates
    some CIPs on BLOCK HEIGHT (= pivot-chain height = the eSpace `block.number` =
    the epoch number) and others on BLOCK NUMBER (= the count of blocks in the
    whole DAG, ~2.42x larger). `TransitionsEpochHeight` and
    `TransitionsBlockNumber` are separate structs. At the pinned block the epoch
    number was 155,333,000 and the DAG block number was 376,125,885. A tool that
    reads "cip107_transition_number = 188900000" as an eSpace block number is
    wrong by a factor of 2.4. All activation values below are the mainnet
    defaults compiled into the binary (`Configuration` field defaults), not a
    config file — the shipped `run/hydra.toml` stops at the v2.0 Hydra fork.
  timeline:
  - {name: Tanzanite, activation_condition: "epoch height TANZANITE_HEIGHT", mainnet_equivalent: null,
     note: "v1.1; CIP-39/40, block reward cut. Pre-eSpace."}
  - name: Hydra
    activation_condition: "DAG block number 92060600 / epoch height 36935000"
    mainnet_equivalent: istanbul
    note: >-
      v2.0. CIP-90 CREATES eSPACE. Also CIP-43 (PoS finality chain), CIP-62
      (EC precompiles 0x05-0x08), CIP-64, CIP-71, CIP-78, CIP-92 (BLAKE2F).
      Before this fork chain id 1030 did not exist.
  - {name: "DAO vote", activation_condition: "DAG block number 133800000 / epoch height 56800000",
     mainnet_equivalent: null,
     note: "v2.1. CIP-94 on-chain parameter DAO, CIP-97, CIP-105, and CIP-98 — the fix for a BLOCKHASH bug that made eSpace's BLOCKHASH read the DAG block number instead of the epoch height."}
  - {name: "sigma fix", activation_condition: "DAG block number 137740000", note: "v2.2, undisclosed security fix"}
  - {name: "v2.3", activation_condition: "DAG block number 188900000 / epoch height 79050000",
     note: "CIP-107 (DAO-adjustable storage-collateral burn), CIP-112 (header `custom` serde), CIP-118, CIP-119 (PUSH0)"}
  - name: "Base-fee burn (CIP-1559)"
    activation_condition: "DAG block number 247480000 / epoch height 101900000"
    activation_time: 1722958255
    mainnet_equivalent: london+cancun-opcodes
    note: >-
      v2.4, 2024-08-06. CIP-1559 (a TWO-SPACE fee market), CIP-137 (base-fee
      sharing — only part of the base fee is burnt), CIP-130 (gas limit tied to
      calldata size), CIP-133 (BLOCKHASH from state, 65536-deep), CIP-144
      (KZG point evaluation at 0x0a), CIP-145, and CIP-141/142/143 = the Cancun
      opcodes TLOAD/TSTORE/MCOPY and the removal of the subroutine opcodes.
  - {name: "c2 fix", activation_condition: "epoch height 118580000", note: "v2.5"}
  - name: "EOA code (V3.0)"
    activation_condition: "epoch height 129680000"
    activation_time: 1756602828
    mainnet_equivalent: prague
    note: >-
      2025-08-31. CIP-7702 (EIP-7702), CIP-645 (the big gas realignment: EIP-1108,
      1884, 2028, 2200, 2565, 2929, 3529, 3651, 3860, 684, 1153, 5656 fixes),
      CIP-150 (EIP-3541, reject 0xEF), CIP-151 (EIP-6780 SELFDESTRUCT), CIP-152
      (EIP-3607, reject senders with code), CIP-154 (TLOAD fix), EIP-2537
      (BLS12-381 at 0x0b-0x11), EIP-2935 (nominally), EIP-7623 (calldata floor).
      Conflux reached Berlin/London-era gas pricing in 2025, five years late, in
      one bundle.
  - name: "Osaka opcodes (V3.1)"
    activation_condition: "epoch height 155140000"
    activation_time: 1787624438
    mainnet_equivalent: osaka
    note: >-
      2026-08-25 02:20:38 UTC, TWO DAYS before this row. CIP-166 (EIP-7939 CLZ),
      CIP-167 (P256VERIFY at 0x0100), CIP-172 (canonical transaction RLP
      required), CIP-174 (EIP-7823 + EIP-7883 MODEXP), CIP-175 (resolve EIP-7702
      delegation in cross-space calls), CIP-176 (merge repeated addresses in an
      access list). Confirmed live: CLZ works, P256VERIFY at 0x0100 returns empty
      output for an invalid signature.
  - name: align_evm
    status: pending
    activation_condition: "DEVNET ONLY; mainnet default u64::MAX"
    src: "crates/config/src/configuration.rs:align_evm_transition_height"
    note: >-
      The switch that would make eSpace gas-identical to the canonical EVM:
      `evm_gas_ratio` 2 -> 1, `create_data_limit` 48 KiB -> 24 KiB,
      `per_auth_base_cost` 17000 -> 12500, BLOCKHASH window 65536 -> 256,
      CIP-130 off, and an EVM-style insufficient-balance precheck. It is
      documented as devnet-only and is NOT scheduled for mainnet. Its existence
      is the client's own admission of the size of the gap.

eips:
  1559:
    status: modified
    severity: high
    src: "crates/cfxcore/core/src/verification.rs:check_base_fee, crates/primitives/src/block_header/base_price.rs:compute_next_price, crates/parameters/src/lib.rs:INITIAL_1559_ETH_BASE_PRICE, crates/execution/executor/src/state/state_object/reward.rs:burnt_gas_price"
    src_live: "eth_getBlockByNumber @ 155333000 -> baseFeePerGas 0x4a817c800 (20 gwei); cfx_getBlockByEpochNumber @ same epoch -> baseFeePerGas 0x3b9aca00 (1 gwei)"
    note: >-
      REPLACED, AND THERE ARE TWO OF THEM. `base_price` in a Conflux header is a
      `SpaceMap<U256>`: one base fee for Core Space, one for eSpace, in the same
      block, updated independently. Confirmed live — the same epoch reports 20
      gwei to `eth_getBlockByNumber` and 1 gwei to `cfx_getBlockByEpochNumber`.

      Four differences from EIP-1559, each independently breaking:
      (1) the update input is the SUM OF TRANSACTION GAS LIMITS packed in the
      block, not gas consumed (`verify_sync_graph_ready_block` sums
      `t.gas_limit()` per space); (2) the target is that SPACE's share of the
      block gas limit / 2, and eSpace's share is 50% of the block limit while
      Core's is 90% — they overlap, so the two spaces compete for one budget;
      (3) there is a per-space FLOOR, 20 gwei for eSpace (1 gwei for Core), and
      mainnet eSpace sits exactly on it; (4) the base fee is computed per DAG
      BLOCK against that block's own parent, but EXECUTION uses the epoch PIVOT
      block's base fee (`epoch_execution.rs` takes `pivot_block.base_price()`),
      so a transaction validated against its packing block's base fee can be
      executed against a different, higher one — and is then skipped and erased.

      AND THE INCLUSION RULE IS NOT `gasPrice >= baseFeePerGas`. CIP-137 splits
      the base fee: `burnt_gas_price(base) = base - base*prop/(1e18+prop)` with
      `prop` a DAO-adjustable on-chain parameter initialised to 1 CFX (which would
      burn exactly half). `check_base_price` compares the transaction's gas price
      against the BURNT part only. MEASURED LIVE, and the DAO has moved it: a
      receipt at the pinned epoch reports `gasUsed` 0xa1a60, `effectiveGasPrice`
      0x4a817c800 (20 gwei), `gasFee` 0x2f0bbf433b0000 = gasUsed x 20 gwei, and
      `burntGasFee` 0x115537232a33c0 — 36.84% of the fee, i.e. a burnt gas price
      of 7.368 gwei against an advertised base fee of 20 gwei (implying prop ~=
      1.714 CFX, not the 1 CFX initial value). So the real minimum gas price on
      eSpace mainnet today is roughly ONE THIRD of the number
      `eth_getBlockByNumber` calls `baseFeePerGas`, and it moves by governance.
      Any fee estimator or mempool simulator ported from Ethereum is wrong in both
      directions here.
  2929:
    status: inherited
    fork: "V3.0 (CIP-645)"
    src: "crates/execution/vm-types/src/spec.rs:eip_cold_warm_access"
    note: >-
      cold_sload 2100, sstore_reset 2900, cold_account_access 2600, warm 100 —
      mainnet values, but only since epoch 129,680,000 (2025-08-31). Before that
      Conflux charged Istanbul-era prices with no access lists. Corroborated by
      the SSTORE measurement below, which lands on 40000 + 2100.
  2930:
    status: modified
    fork: "V3.1 (CIP-176)"
    src: "crates/execution/executor/src/state/state_object/warm.rs:set_tx_access_list"
    note: >-
      Access lists are accepted (type 0x01 and the field on 0x02/0x04), but until
      CIP-176 — two days before this row — a repeated ADDRESS in the access list
      REPLACED the storage keys warmed by its earlier entry instead of taking the
      union, so the transaction paid 1900 per key for keys that stayed cold. The
      in-source comment says so. Every eSpace transaction before epoch
      155,140,000 with a duplicated access-list address was overcharged and
      behaved differently from mainnet.
  3529:
    status: inherited
    fork: "V3.0 (CIP-645)"
    src: "crates/execution/vm-types/src/spec.rs:eip_sstore_and_refund_gas"
    note: "refund cap and SELFDESTRUCT refund removal arrived with CIP-645, not at London"
  3541:
    status: inherited
    fork: "V3.0 (CIP-150)"
    src: "crates/execution/executor/src/spec.rs:cip150"
    note: "CIP-150 rejects new code starting with 0xEF"
  3607:
    status: inherited
    fork: "V3.0 (CIP-152)"
    src: "crates/execution/executor/src/executive/fresh_executive.rs:check_from_eoa_with_code"
    note: >-
      CIP-152. Note the failure mode: a transaction from a code-bearing sender is
      `TxDropError::SenderWithCode`, i.e. SKIPPED and erased from the RPC, not
      rejected at the mempool boundary the way mainnet rejects it.
  6780:
    status: inherited
    fork: "V3.0 (CIP-151)"
    src: "crates/execution/executor/src/internal_contract/impls/admin.rs:soft_suicide"
    note: "SELFDESTRUCT only deletes the account when it was created in the same transaction; otherwise it becomes a balance sweep"
  7623:
    status: modified
    fork: V3.0
    src: "crates/execution/vm-types/src/spec.rs:tx_data_floor_non_zero_gas"
    src_live: "eth_estimateGas @ 155333000 for 100 non-zero calldata bytes to an empty account -> 0x61a8 = 25000 = 21000 + 100*40 (the FLOOR, not 21000 + 100*16)"
    note: >-
      The floor (10 / 40 per byte) is mainnet's. `modified` because it composes
      with CIP-130, which is a stricter and unrelated rule on the same input: the
      transaction's declared GAS LIMIT must be at least 100 x calldata length or
      the transaction is invalid outright. Mainnet has no such rule.
  7702:
    status: modified
    fork: "V3.0 (CIP-7702)"
    src: "crates/execution/vm-types/src/spec.rs:per_auth_base_cost, crates/execution/executor/src/executive/mod.rs:authorization_gas"
    note: >-
      SetCode transactions (type 0x04) are accepted, but the intrinsic
      authorization cost is NOT EIP-7702's. `per_auth_base_cost` is 17000 here
      against the spec's PER_AUTH_BASE_COST of 12500, and the per-authorization
      empty-account charge is `per_empty_account_cost * evm_gas_ratio` = 25000 * 2
      = 50000 against mainnet's 25000. `align_evm` would set 12500 and ratio 1;
      mainnet does not. CIP-175 (V3.1) additionally makes cross-space calls
      resolve a 7702 delegation, which has no mainnet analogue because mainnet has
      no second space.
  170:
    status: modified
    severity: high
    src: "crates/execution/vm-types/src/spec.rs:create_data_limit, crates/execution/executor/src/context.rs:create_data_gas"
    src_live: "eth_call @ 155333000 with initcode returning 49152 bytes -> 49152 bytes returned; 49153 bytes -> 'execution reverted: Out of gas'"
    note: >-
      MAX CONTRACT CODE SIZE IS 49152 BYTES — EXACTLY 2x EIP-170 — and the code
      deposit costs 400 GAS PER BYTE instead of 200. Both confirmed live: a
      49152-byte deployment succeeds and a 49153-byte one fails, and a binary
      search on the gas needed to deploy 1000 vs 2000 bytes gives 453194 and
      853292, a slope of 400.1 gas/byte. The size limit is `create_data_limit`,
      which `align_evm` would set back to 24576; the doubled price is
      `create_data_gas * evm_gas_ratio` with `evm_gas_ratio = 2`. The failure mode
      for an oversized contract is `OutOfGas`, not a distinct "max code size
      exceeded" error, so tooling cannot tell the two apart. Contracts exist on
      eSpace that no mainnet-equivalent chain can hold, and every deployment
      costs twice what the same bytecode costs anywhere else.
  3860:
    status: inherited
    fork: "V3.0 (CIP-645)"
    src: "crates/execution/vm-types/src/spec.rs:init_code_data_limit"
    note: "48 KiB initcode limit and 2 gas/word — the mainnet numbers, which here coincide with the DOUBLED runtime limit above; initcode and runtime code share the value 49152 for unrelated reasons"
  2200:
    status: modified
    severity: high
    src: "crates/execution/vm-interpreter/src/interpreter/gasometer.rs:sstore_set_gas, crates/execution/vm-types/src/spec.rs:evm_gas_ratio"
    src_live: "eth_call @ 155333000, binary search: noop CREATE needs 53064 gas, the same CREATE plus one zero->non-zero SSTORE needs 95238 — a delta of 42174 = 40000 + 2100 cold + pushes"
    note: >-
      SSTORE ZERO-TO-NON-ZERO COSTS 40000 GAS, NOT 20000. `sstore_set_gas` is
      multiplied by `evm_gas_ratio` (2) on every eSpace path in the gasometer.
      The net-metering RULES are EIP-2200's; the SET price is doubled. Nothing
      reverts, nothing warns: a contract that fits in a block on mainnet may not
      fit here, and every storage-cost model is out by 2x on the dominant term.
  4844:
    status: removed
    src: "crates/primitives/src/transaction/mod.rs:EIP7702_TYPE, crates/execution/vm-interpreter/src/interpreter/mod.rs:BLOBBASEFEE"
    src_live: "eth_call @ 155333000 -> BLOBHASH(0) = 0, BLOBBASEFEE = 0; block header has no blobGasUsed / excessBlobGas keys at all"
    note: >-
      There is no type-0x03 constant in the transaction enum; the type byte simply
      does not decode. CIP-144 took ONLY the point-evaluation precompile at 0x0a.
      BLOBHASH and BLOBBASEFEE are present in the jump table and hardcoded to push
      zero. Unlike Monad, the blob header fields are ABSENT rather than pinned to
      zero — a header consumer gets a missing key, not a wrong value.
  4788:
    status: removed
    src_live: "eth_getCode(0x000F3df6D732807Ef1319fB7B8bB8522d0Beac02) @ 155333000 -> 0x"
    note: >-
      No beacon chain, no beacon-roots contract, and no `parentBeaconBlockRoot`
      key in the eSpace header.
  2935:
    status: tombstoned
    severity: high
    src: "crates/execution/executor/src/state/state_object/storage_entry.rs:set_eip2935_storage, crates/cfxcore/core/src/consensus/consensus_inner/consensus_executor/epoch_execution.rs:before_epoch_execution"
    src_live: "eth_getCode(0x0000F90827F1C53a10cb7A02335B175320002935) @ 155333000 -> 0x"
    note: >-
      DECLARED, IMPLEMENTED, AND INERT. `set_eip2935_storage` writes the parent
      hash into slot `(height-1) % 8191` of 0x0000F908..2935 in eSpace, at the
      START of every epoch since V3.0 — but its first statement is
      `if self.has_no_code(&EIP2935_ADDRESS) { return Ok(()) }`, and the client
      never deploys the contract. Confirmed live: the address has no code. So the
      ring buffer is never written and a `CALL` to the history contract returns
      empty output like any empty account, which a caller reads as the zero hash.
      `tombstoned` rather than `removed` because the address is permanently
      consumed by client logic that will start writing to it the moment anyone
      deploys code there — an unusual and worth-knowing footgun.

      Conflux does not need it: BLOCKHASH already reaches 65536 blocks back
      through a different mechanism (CIP-133), which is why nobody noticed.
  7212:
    status: modified
    fork: "V3.1 (CIP-167)"
    src: "crates/execution/executor/src/machine/mod.rs:P256VERIFY_ADDRESS"
    src_live: "eth_call(0x0100, 160 zero bytes) @ 155333000 -> 0x (empty output)"
    note: "P256VERIFY at 0x0100, priced at P256VERIFY_BASE_GAS_FEE_OSAKA, live since 2026-08-25"
  7951:
    status: inherited
    fork: "V3.1 (CIP-167)"
    src: "crates/execution/executor/src/machine/mod.rs:P256VERIFY_BASE_GAS_FEE_OSAKA"
    src_live: "eth_call(0x0100, 160 zero bytes) @ 155333000 -> empty output, i.e. EIP-7951 invalid-signature semantics"

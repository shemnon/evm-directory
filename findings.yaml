# Notes — the interpretive layer over chains/*/chain.yaml.
#
# This file is CONTENT, not derived data: it is the one place in the pipeline where a
# human states what a set of rows adds up to. A note is written once and reaches the
# reader in two voices: the full cross-chain survey on its axis page, and one chain's
# own slice of it on that chain's page. `tools/site.py` renders both, and indexes
# every note on the home page.
#
# Keep these descriptive. State what the data shows, cite the rows, and stop; the
# reader is looking something up, not being persuaded.
#
#   id      stable anchor — do not rename once published, it is a URL
#   axis    which axis page carries it: precompiles | tx-types | cryptography |
#           eips | opcodes | system-contracts | fees-envelope | lineage | method
#   rank    listing order on the home-page index
#   lede    the shared premise, chain-neutral. Chain pages only — on the axis page the
#           body already opens with it.
#   chains  slug -> what THIS chain contributes, and nothing about any other. That
#           gloss is the whole of what the chain's page says; the survey stays one
#           link away on the axis page. A note naming more than one chain MUST use
#           this mapping form — the build refuses a bare list — because the list
#           form routes a chain page to prose about other chains. Single-chain notes
#           keep the list form: there the body IS that chain's slice.
#   body    the cross-chain reading. Axis page and home-page index only.

- id: address-collisions
  title: Address collisions at 0x64–0x69 and 0x…1000
  axis: precompiles
  rank: 1
  lede: >-
    Unrelated chains have independently claimed the same precompile addresses, so a
    single global address-keyed map is incorrect for at least one major chain whichever
    way it is populated.
  chains:
    arbitrum: >-
      ArbSys, ArbInfo, ArbAddressTable, ArbBLS, ArbFunctionTable and ArbosTest occupy
      `0x64`–`0x69` — the same six addresses BSC uses for its cross-chain and consensus
      precompiles, and two of them, `0x66` and `0x67`, are opBNB's as well. The sets
      share no code and serve unrelated functions.
    bnb: >-
      BSC's cross-chain and consensus precompiles occupy `0x64`–`0x69`, the same six
      addresses Arbitrum uses for its Arb* precompiles; `0x66` and `0x67` are opBNB's
      too, making those two three-way. BSC also places a `ValidatorContract` at
      `0x…1000`, a name and address it shares with Polygon's, with different code and a
      different ABI.
    opbnb: >-
      opBNB occupies `0x66` and `0x67`, which are also Arbitrum's ArbAddressTable and
      ArbBLS and BSC's cross-chain precompiles — the only three-way address collisions
      in the dataset.
    polygon: >-
      Polygon places a contract named `ValidatorContract` at `0x…1000`. BSC places one
      there too, with different code and a different ABI, so the name is not a usable
      discriminator either.
  body: >-
    Arbitrum's ArbSys, ArbInfo, ArbAddressTable, ArbBLS, ArbFunctionTable and ArbosTest
    occupy `0x64`–`0x69`, the same six addresses BSC uses for its cross-chain and
    consensus precompiles. The two sets share no code and serve unrelated functions.
    opBNB occupies `0x66` and `0x67` as well, making those two three-way. Polygon and
    BSC both place a contract named `ValidatorContract` at `0x…1000`, with different
    code and different ABIs. A single global address-keyed map is therefore incorrect
    for at least one major chain whichever way it is populated.

- id: type-byte-frontiers
  title: Type-byte allocation from both ends of the range
  axis: tx-types
  rank: 2
  lede: >-
    EIP-2718 permits `0x00`–`0x7f`. Mainnet allocates upward from `0x00`; other chains
    allocate downward from the ceiling, and there is no registry between the two
    frontiers. Current occupancy is computed from the data on the [transaction types
    axis](axes/tx-types.html#frontier).
  chains:
    arbitrum: >-
      Allocates downward from the ceiling at `0x78` — a byte Kaia also took.
    base: >-
      Allocates downward from the ceiling at `0x79`.
    op-stack: >-
      The OP family allocates downward from the ceiling at `0x7d` and `0x7e`.
    polygon: >-
      Takes `0x7f`, the last byte the envelope permits.
    celo: >-
      Allocates downward from the ceiling at `0x7b` and `0x7c`.
    kaia: >-
      Allocates downward from the ceiling at `0x78`, a byte Arbitrum also took — and
      Kaia's type numbers do not fit in a byte at all. They are `uint16`
      (`0x7801`–`0x7804`), and Ethereum transactions are re-wrapped as `0x78 || ethType
      || rlp`, so the RPC representation is standard while the consensus encoding is
      not.
    zksync-era: >-
      Allocates downward from the ceiling at `0x71`, the lowest of the downward
      allocations in the dataset.
  body: >-
    EIP-2718 permits `0x00`–`0x7f`. Mainnet allocates upward from `0x00`; other chains
    allocate downward from the ceiling — zkSync `0x71`, Arbitrum and Kaia both `0x78`,
    Base `0x79`, Celo `0x7b` and `0x7c`, the OP family `0x7d` and `0x7e`, Polygon
    `0x7f`. There is no registry between the two frontiers. Current occupancy is
    computed from the data on the
    [transaction types axis](axes/tx-types.html#frontier). Kaia's type numbers do not
    fit in a byte at all: they are `uint16` (`0x7801`–`0x7804`), and Ethereum
    transactions are re-wrapped as `0x78 || ethType || rlp`, so the RPC representation
    is standard while the consensus encoding is not.

- id: non-enumerable-precompiles
  title: Base resolves precompiles by predicate rather than from a map
  axis: precompiles
  rank: 3
  chains: [base]
  body: >-
    From the Beryl upgrade, Base installs a `PrecompileLookup` that tests an address
    against a pattern instead of looking it up in a fixed table. Every `0xb2`-prefixed
    address matching the B-20 predicate is a precompile — roughly 2^72 addresses per
    variant. No address-keyed table can represent this, so the schema records the
    predicate and the site renders it separately from the grid. Tools that build a
    fixed precompile set treat these as ordinary accounts, with no error raised.

- id: enumeration-not-enough
  title: OP Stack has zero custom precompile addresses and six divergent precompiles
  axis: precompiles
  rank: 4
  chains: [op-stack]
  body: >-
    The divergences are input caps on BN256 and BLS12-381 — a fault-proof constraint
    expressed in consensus rules — and P256VERIFY at half mainnet's gas. A comparison
    that diffs address lists finds no difference here.

- id: four-flavours
  title: Same-address divergence, and every flavour is quieter than enumeration
  axis: precompiles
  rank: 5
  lede: >-
    An address that exists on two chains can differ in ways no address diff sees, and
    every one of those flavours is quieter than adding or removing the address.
  chains:
    op-stack: >-
      **Caps inputs** to BN256 and BLS12-381 — a fault-proof constraint expressed in
      consensus rules — so an oversized call reverts at an address that is present and
      otherwise mainnet's.
    avalanche-c: >-
      **Omits** the feature at an address mainnet has allocated.
    polygon: >-
      **Reprices** — an identical result, at up to 22× mainnet's gas.
    tron: >-
      **Replaces**: `0x03` returns something that is not RIPEMD160.
    taiko: >-
      The quietest flavour — the address is **canonical and empty**, so the call
      succeeds with no data and no error. It holds for all five Cancun/Prague system
      contracts, which were never deployed because three forks activated at one
      timestamp.
    gnosis: >-
      **Canonical and empty** at Ethereum's own deposit contract: the call succeeds with
      no data and no error.
    scroll: >-
      The mirror image — OP's GasPriceOracle **ABI at a different address**, while OP's
      own `0x42..0F` is an empty account, so OP-derived code reads an L1 fee of zero and
      reports no error.
    polygon-zkevm: >-
      Supplies a detection channel the other flavours lack: disabled precompiles stay in
      the map and so stay WARM (122 gas) while genuinely absent addresses are COLD
      (2622), which separates the two cases by gas alone.
  body: >-
    An address that exists on two chains can differ in ways no address diff sees. OP
    Stack **caps inputs**, so the call reverts. Avalanche **omits** the feature.
    Polygon **reprices** — identical result, up to 22× the gas. Tron **replaces**:
    `0x03` returns something that is not RIPEMD160. Taiko and Gnosis add a quieter one:
    the address is **canonical and empty**, so the call succeeds with no data and no
    error — on Taiko for all five Cancun/Prague system contracts, which were never
    deployed because three forks activated at one timestamp; on Gnosis for Ethereum's
    own deposit contract. Scroll adds the mirror image: OP's GasPriceOracle **ABI at a
    different address**, while OP's own `0x42..0F` is an empty account, so OP-derived
    code reads an L1 fee of zero and reports no error. Polygon zkEVM supplies a
    detection channel the others lack — disabled precompiles stay in the map and so
    stay WARM (122 gas) while genuinely absent addresses are COLD (2622), which
    separates the cases by gas alone.

- id: proof-constraints-leak
  title: Proof-system constraints leak into consensus — and they expire
  axis: precompiles
  rank: 6
  lede: >-
    A proof system's constraints leak into consensus rules by unrelated mechanisms — and
    they are not permanent, so the claim needs a DATE, not just a chain name.
  chains:
    op-stack: >-
      Caps precompile *input size*, so an oversized call reverts. The leak is visible to
      `eth_call`.
    linea: >-
      Budgets prover *work per block* — `RIPEMD_BLOCKS=0`, `BLAKE_ROUNDS=0` — so those
      precompiles execute in `eth_call` and can never be mined. This is the one row here
      where `eth_call` cannot see the constraint.
    zksync-era: >-
      Caps modexp *operand width* at 32 bytes, 32× tighter than EIP-7823.
    scroll: >-
      Disabled `0x03`/`0x09` outright and capped MODEXP the same 32-byte way — then
      lifted that cap at Galileo (2025-12-16) for EIP-7823's 1024 bytes, lifted its
      SHA256 and BN256 restrictions earlier, and retired the block-level checker
      entirely, keeping the two hash tombstones. Scroll is the proof that these
      constraints expire.
    polygon-zkevm: >-
      Runs the arc backwards: MODEXP disabled at forkID 8 and never restored. The leak
      is visible to `eth_call`.
    taiko: >-
      The modern form — prover cost as a metered resource (`zk gas`) rather than a
      prohibition.
  body: >-
    Four chains, four unrelated mechanisms, one cause. OP Stack caps precompile *input
    size*, so the call reverts. Linea budgets prover *work per block* —
    `RIPEMD_BLOCKS=0`, `BLAKE_ROUNDS=0` — so those precompiles execute in `eth_call` and
    can never be mined. zkSync caps modexp *operand width* at 32 bytes, 32× tighter than
    EIP-7823. Scroll disabled `0x03`/`0x09` outright and capped MODEXP the same way.
    But Scroll also shows the constraints are **not permanent**: it lifted the 32-byte
    MODEXP cap at Galileo (2025-12-16) for EIP-7823's 1024 bytes, lifted its SHA256 and
    BN256 restrictions earlier, and retired the block-level checker entirely — while
    keeping the two hash tombstones. Polygon zkEVM runs the arc backwards, disabling
    MODEXP at forkID 8 and never restoring it. So the claim needs a DATE, not just a
    chain name, and the leak is visible to `eth_call` on Scroll and Polygon zkEVM but
    not on Linea. Taiko is the modern form: prover cost as a metered resource
    (`zk gas`) rather than a prohibition.

- id: universal-address-broke
  title: 0x0100 across the dataset
  axis: cryptography
  rank: 7
  lede: >-
    Eleven rows carry P256VERIFY at `0x0100`, reached through five unrelated forks.
    Presence at this address indicates neither shared lineage nor a particular fork
    level, and absence from it does not mean the chain cannot verify P-256.
  chains:
    ethereum: >-
      Reaches `0x0100` through Osaka, and is the semantics and gas the other ten rows
      are compared against. Mainnet's own note anticipates the problem: the precompile
      shipped on L2s as RIP-7212 years earlier, at the same address under an earlier
      fork name.
    bnb: >-
      Carries P256VERIFY at `0x0100` with mainnet semantics and mainnet gas, but reaches
      it at its own Osaka — five months after mainnet activated the fork of that name.
    avalanche-c: >-
      Reaches `0x0100` through Granite, out of Ethereum's fork order entirely — an Osaka
      feature on a chain with no Osaka.
    op-stack: >-
      Reaches `0x0100` through Fjord as RIP-7212, long before mainnet Osaka, and
      diverges on gas: 3450 against mainnet's 6900.
    tron: >-
      Reaches `0x0100` by SR governance proposal rather than a client fork — the fourth
      independent arrival at the address.
    kaia: >-
      The control case: mainnet address, mainnet gas, reached through mainnet's own
      Osaka, with no RIP-7212 early adoption. One of the few rows where `0x0100` is
      genuinely equivalent rather than merely present.
    sei: >-
      The counter-example in one direction: `0x0100` is an ordinary empty account, while
      Sei's P-256 verifier is at `0x1011` behind an ABI method selector. Reading the
      address alone puts Sei in the wrong column twice over.
    hyperliquid: >-
      The counter-example in the other direction: `0x0100` is absent and behaves exactly
      like the unallocated `0x0101` — empty success, 21000 gas — with a mainnet control
      on identical calldata returning `0x00..01`.
  body: >-
    Eleven rows carry P256VERIFY at `0x0100`, reached through five unrelated forks:
    mainnet Osaka, OP Stack Fjord/RIP-7212, Avalanche Granite, Tron, and Kaia. Most
    diverge from mainnet in semantics, gas, or both. Presence at this address therefore
    indicates neither shared lineage nor a particular fork level.

- id: p256-silent-invalid
  title: P-256 verification returns empty output on five chains, for five reasons
  axis: cryptography
  rank: 8
  lede: >-
    EIP-7951 signals an invalid signature by returning empty output — byte-identical to
    what a call to an absent precompile returns. Where `0x0100` is empty, every P-256
    verification against it reports "invalid" with no revert and no error, and a passkey
    wallet ported there is broken but looks merely strict.
  chains:
    hyperliquid: >-
      `0x0100` is simply an empty account: no P256VERIFY, and nothing to distinguish
      that from a signature the precompile rejected.
    sei: >-
      `0x0100` is empty even though Sei DOES implement P256VERIFY — at `0x1011`,
      ABI-dispatched as `verify(bytes)` with per-byte gas, where a raw 160-byte RIP-7212
      call reverts. Code written against `0x0100` finds nothing and is told "invalid";
      code written against `0x1011` runs.
    sonic: >-
      `0x0100` is empty because the precompile map is Prague's and Osaka never
      activated.
    injective: >-
      `0x0100` is empty because the fork level cannot reach Osaka at all, overriding the
      Cosmos EVM framework's entry, which does carry it. Proven live with a known-valid
      vector rather than an absence test: geth's own `CallP256Verify` fixture returns
      `0x` while sha256 at `0x02` on the same call batch returns the correct digest.
    polygon-zkevm: >-
      P256VERIFY is implemented as `p256Verify_zkevm` and present only in a forkID that
      has never activated, so `0x0100` answers empty.
  body: >-
    EIP-7951 signals an invalid signature by returning empty output — byte-identical to
    what a call to an absent precompile returns. On five rows here `0x0100` is empty, so
    every P-256 verification against it reports "invalid" with no revert and no error,
    and each row gets there differently. On Hyperliquid the address is simply an empty
    account. On Sei it is empty even though the chain DOES implement P256VERIFY, at
    `0x1011`, ABI-dispatched as `verify(bytes)`, where a raw 160-byte call reverts. On
    Sonic the precompile map is Prague's and Osaka never activated. On Injective the
    fork level cannot reach Osaka at all, overriding the Cosmos EVM framework's entry,
    which does carry it. On Polygon zkEVM it is implemented as `p256Verify_zkevm` and
    present in a forkID that has never activated. A passkey wallet ported to any of them
    is broken and looks merely strict. Distinguishing the cases requires a **valid**
    signature plus a mainnet control on identical calldata; calling the address and
    checking for output cannot separate them — which is why an address-diff survey
    reports all five as fine.

- id: verify-is-not-sign
  title: Precompile verification and transaction authorization are independent
  axis: cryptography
  rank: 9
  lede: >-
    Whether a precompile can verify a signature scheme and whether that scheme can
    authorize a transaction are separate properties. Eleven rows carry P256VERIFY; on
    almost all of them a P-256 key cannot authorize a transfer, because the precompile
    is callable by contracts and is not an authentication method for senders.
    `tx_authorization` records the two separately.
  chains:
    base: >-
      The sharpest counter-example in the dataset. EIP-8130 enshrines a CLOSED set of
      authenticators in the client — `AuthenticatorDispatch` routes a 20-byte selector
      through a hardcoded chain over four canonical values — so on Base a P-256 or
      WebAuthn key really can move a wei, and it is the CLIENT verifying the signature,
      not account code. The same curve that is a contract tool elsewhere is a
      first-class transaction signer here.
    sei: >-
      Sei has two authorization surfaces and only one is Ethereum's. An Ethereum
      transaction is secp256k1, recovered and stamped with no alternative branch — so
      `0x1011`'s P-256 verifier is a tool for contracts and nothing more. The Cosmos
      ante chain beside it admits a different key set entirely.
    kaia: >-
      Kaia closes the usual gap in one direction and not the other: the `validateSender`
      precompile at `0x03ff` runs the exact same `ValidateAccountKey` the consensus path
      runs, weighted-multisig arithmetic included, so bytecode CAN check the chain's own
      authorization scheme — but it hardcodes `RoleTransaction`, leaving two of three
      roles unreachable.
    zksync-era: >-
      The opposite pole: there is NO protocol-level signature check at all. The
      bootloader accepts a transaction if the sender's own account returns the
      validation magic, so the account's CODE is the authentication rule and the scheme
      set is open and unbounded. Which precompiles exist says nothing about what can
      authorize.
  body: >-
    Whether a precompile can verify a signature scheme and whether that scheme can
    authorize a transaction are separate properties. Eleven rows carry P256VERIFY; on
    almost all of them a P-256 key cannot authorize a transfer. The precompile is
    callable by contracts, not an authentication method for senders. `tx_authorization`
    records the two separately.

- id: unpaired-schemes
  title: Schemes that authorize transactions with no precompile able to verify them
  axis: cryptography
  rank: 10
  lede: >-
    `authorizes: protocol` together with `precompile: none` is the pairing to look for:
    the chain accepts transaction signatures that its own contracts cannot check, so an
    on-chain multisig, verifier or recovery contract cannot validate what the protocol
    accepted.
  chains:
    sei: >-
      Two of the three unpaired schemes in the dataset are Sei's: **sr25519**
      (Schnorrkel over Ristretto255, a curve family this chain's EVM cannot compute) and
      its Cosmos **multisig**. A bank send authorized by an sr25519 signature moves a
      balance the EVM reads directly — `GetBalance` byte-casts the address — yet nothing
      on the chain, not Sei's `0x1001`–`0x1011` block nor the geth fork's `0x01`–`0x11`,
      can verify that signature.
    kaia: >-
      Kaia's **role-based keys** are unpaired for two of their three roles.
      `validateSender` at `0x03ff` hardcodes `accountkey.RoleTransaction`, while a
      RoleBased account indexes its key list BY ROLE — so the `RoleFeePayer` and
      `RoleAccountUpdate` keys authorize at the protocol level and no precompile on the
      chain can check either. A query about a fee-payer authorization returns an
      incorrect answer without reverting.
  body: >-
    Three schemes have `authorizes: protocol` with `precompile: none`: the chain
    accepts transaction signatures that its own contracts cannot check, so an on-chain
    multisig, verifier or recovery contract cannot validate what the protocol accepted.
    Sei's **sr25519** (Schnorrkel over Ristretto255, a curve family that chain's EVM
    cannot compute) and its Cosmos **multisig**; and Kaia's **role-based keys**, which
    are unpaired for two of their three roles — `validateSender` hardcodes
    `RoleTransaction`, so a query about a fee-payer authorization returns an incorrect
    answer without reverting. The reverse pairing also occurs: Base's EIP-8130
    enshrines a closed set of authenticators in the client, so a P-256 or WebAuthn key
    can authorize a transaction there.

- id: no-post-quantum
  title: No post-quantum scheme in the dataset
  axis: cryptography
  rank: 11
  chains: []
  body: >-
    Across all nineteen rows the signature schemes are secp256k1, secp256r1 (P-256),
    BLS12-381, BN254, ed25519, sr25519 and SM2 — all discrete-log-based. No row carries
    ML-DSA, SLH-DSA, Falcon or any other lattice- or hash-based scheme, as a
    transaction signer, as a precompile, or as `status: pending`. Recorded explicitly
    because an empty column is otherwise indistinguishable from an unfinished survey.

- id: op-stack-constrains-little
  title: Variation among OP Stack descendants
  axis: lineage
  rank: 12
  lede: >-
    Resolving `ethereum → op-stack → X` does not determine X's type-byte set, its
    precompiles, or even its fork schedule.
  chains:
    optimism: >-
      OP Mainnet's delta file is empty — it is the stack itself, with nothing added on
      top.
    base: >-
      On the same stack and the same client version as OP Mainnet, Base reimplements the
      EVM layer in Rust and adds five fixed precompiles, a dynamic precompile range,
      native account abstraction (EIP-8130) with its own type byte `0x79`, and four
      chain-specific forks.
    opbnb: >-
      opBNB carries BSC's precompiles rather than the stack's, and is pinned three fork
      generations back.
    celo: >-
      Celo adds type `0x7b` (CIP-64, gas paid in an ERC-20), which accounts for 61% of
      transactions in the blocks sampled.
    worldchain: >-
      World Chain adds no type byte and no precompile, and diverges on the schedule
      instead: Isthmus landed 2025-11-25, over six months after mainnet Prague and after
      OP Mainnet's own Isthmus, and there is no `karst_time` in the registry at all
      while OP Mainnet activated Karst on 2026-07-08. Two chains on one stack are not on
      one fork level.
  body: >-
    OP Mainnet's delta file is empty. Base, on the same stack and client version,
    reimplements the EVM layer in Rust and adds five fixed precompiles, a dynamic
    precompile range, native account abstraction (EIP-8130) with its own type byte
    `0x79`, and four chain-specific forks. opBNB carries BSC's precompiles and is
    pinned three fork generations back. Celo adds type `0x7b` (CIP-64, gas paid in an
    ERC-20), which accounts for 61% of transactions in the blocks sampled. Resolving
    `ethereum → op-stack → X` does not determine X's type-byte set.

- id: fork-names-lie
  title: Fork names and EIP sets diverge in both directions
  axis: eips
  rank: 13
  lede: >-
    Fork names are recorded as claims; the `eips:` map is the measurement. The two
    diverge in both directions.
  chains:
    bnb: >-
      BSC activated Prague seven weeks BEFORE mainnet and Osaka five months AFTER — the
      same two names, on both sides of mainnet's own dates.
    avalanche-c: >-
      Avalanche has P256VERIFY (an Osaka feature) without BLS12-381 (a Prague feature),
      so no mainnet fork name describes its EIP set.
    op-stack: >-
      The precompile switch tests `IsOptimismJovian` before `IsOsaka`, so activating
      Osaka does not restore mainnet semantics.
  body: >-
    BSC activated Prague seven weeks before mainnet and Osaka five months after.
    Avalanche has P256VERIFY (an Osaka feature) without BLS12-381 (a Prague feature).
    OP Stack's precompile switch tests `IsOptimismJovian` before `IsOsaka`, so
    activating Osaka does not restore mainnet semantics. Fork names are recorded as
    claims; the `eips:` map is the measurement.

- id: fork-activation-mechanisms
  title: At least thirteen ways a chain decides a feature is active
  axis: eips
  rank: 14
  lede: >-
    "When does feature X become active on chain Y" has no general answer. Mainnet uses a
    timestamp; reading a fork timestamp is not a portable method, because on much of
    this dataset there is no timestamp and on some of it no client-side schedule to read
    at all.
  chains:
    op-stack: >-
      A timestamp — whose equality with its own fork name is ENFORCED at startup.
    avalanche-c: >-
      Aliases mainnet fork names onto its own timestamps (`ShanghaiTime = durango`), so
      the mainnet name is a label, not a schedule.
    arbitrum: >-
      Gates on an ArbOS version counter and short-circuits the timestamp path entirely.
    polygon: >-
      Uses block numbers (`CancunBlock`), so a tool grepping for `cancunTime` finds
      nothing.
    kaia: >-
      Uses block numbers too, spelled `<Fork>CompatibleBlock` — so a tool grepping for
      either `cancunTime` or `CancunBlock` finds nothing.
    sonic: >-
      Boolean flags in on-chain network rules, changed by a governed call and effective
      at the next epoch, with the block height recorded only after the fact.
    moonbeam: >-
      No fork names, times, block numbers or client-side gate at all: the EVM ruleset is
      a constant inside a WASM runtime that governance replaces wholesale in state.
    polygon-zkevm: >-
      The `forkID` is not in the client. It is announced by an EVENT ON ETHEREUM L1,
      applies from a BATCH number, and is translated to an L2 block only at sync time —
      and forkID 10 covered zero batches while still changing two consensus rules.
    zksync-era: >-
      Ships upgrades as transaction type `0xfe` carrying new system bytecode hashes,
      with no fork name or timestamp anywhere.
    cosmos-evm: >-
      Keeps the fork level in module state, movable by governance, with the real upgrade
      axis being named SDK upgrade handlers scheduled at a height.
    monad: >-
      Gates its params ladder on the consensus ROUND — a different axis from its own
      timestamped EVM ladder, so the chain has two schedules at once.
    tron: >-
      Activates features by SR governance proposal, not by client release.
    hyperliquid: >-
      Publishes no schedule at all: no fork names, no timestamps over RPC. Its
      small-block gas limit changed somewhere between block 10,000,000 and 20,000,000,
      with no fork to name.
  body: >-
    "When does feature X become active on chain Y" has no general answer. Mainnet uses
    a timestamp. Polygon and Kaia use block numbers (`CancunBlock`, and Kaia's
    `<Fork>CompatibleBlock`, so a tool grepping for `cancunTime` finds nothing). OP
    Stack uses a timestamp whose equality with its own fork is ENFORCED at startup.
    Avalanche and Flare alias mainnet fork names onto their own timestamps
    (`ShanghaiTime = durango`). Arbitrum gates on an ArbOS version counter and
    short-circuits the timestamp path entirely. Monad gates its params ladder on the
    consensus ROUND, on a different axis from its timestamped EVM ladder. Sonic uses
    boolean flags in on-chain network rules, changed by a governed call and effective
    at the next epoch, with the block height recorded only after the fact. The Cosmos
    EVM family keeps the fork level in module state, movable by governance, with the
    real upgrade axis being named SDK upgrade handlers scheduled at a height. Moonbeam
    has no fork names, times, block numbers or client-side gate at all: the EVM ruleset
    is a constant inside a WASM runtime that governance replaces wholesale in state.
    Polygon zkEVM's `forkID` is not in the client — it is announced by an EVENT ON
    ETHEREUM L1, applies from a BATCH number, and is translated to an L2 block only at
    sync time; forkID 10 covered zero batches and still changed two consensus rules.
    zkSync Era ships upgrades as transaction type `0xfe` carrying new system bytecode
    hashes, with no fork name or timestamp anywhere. Tron activates features by SR
    governance proposal. And Hyperliquid publishes no schedule at all — its small-block
    gas limit changed between block 10,000,000 and 20,000,000 with no fork to name.
    Reading a fork timestamp is not a general method; on much of this dataset there is
    no timestamp, and on some of it there is no client-side schedule to read.

- id: no-type-byte
  title: Transactions outside the EIP-2718 envelope
  axis: tx-types
  rank: 15
  lede: >-
    Not every transaction a chain executes carries an EIP-2718 type byte. The ones that
    do not need their own `non_evm_transactions` section, and an indexer enumerating
    through the EVM envelope does not see them.
  chains:
    avalanche-c: >-
      The atomic import and export transactions (UTXO, Avalanche codec) carry no type
      byte, so an indexer reading the EVM envelope does not see the chain's cross-chain
      value movement at all.
    tron: >-
      All 43 protobuf contract types carry no type byte — the whole transaction set sits
      outside the envelope.
    sei: >-
      Two populations sit outside the envelope: Sei's own EVM-module Cosmos messages,
      which change EVM-visible state without ever being an Ethereum transaction, and a
      synthetic receipt kind emitted for Cosmos/CosmWasm transactions that produced
      EVM-shaped logs. `AssociateTx` is the sharp case — no type byte (`TxType()`
      panics), no nonce, no gas limit, no gas price, no recipient, no value, and free: a
      state-changing, zero-fee, nonce-less transaction no Ethereum tooling can
      construct, decode or account for.
  body: >-
    Avalanche's atomic import and export transactions (UTXO, Avalanche codec) and all
    43 of Tron's protobuf contract types carry no EIP-2718 type byte. Two chains with
    no shared ancestry required the same `non_evm_transactions` schema section. An
    indexer enumerating transactions through the EVM envelope does not see Avalanche's
    cross-chain value movement.

- id: placement-vs-fidelity
  title: Opcode placement and semantic fidelity vary independently
  axis: opcodes
  rank: 16

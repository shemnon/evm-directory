opcodes:
  added: []
  removed:
  - op: "0x4f"
    name: MILLIS_TIMESTAMP
    note: >-
      ADDED AT GENESIS AND REMOVED AT T1C — the only opcode in this dataset that
      a chain invented and then withdrew. It pushed `block.timestamp` in
      MILLISECONDS for 2 gas. The instruction table installs it only while
      `!spec.is_t1c()`, so from 2026-03-12 the opcode is undefined again and
      contracts compiled against it fail with an invalid-opcode error. Mainnet
      has never assigned 0x4F. Recorded under `removed` because that is its state
      at the baseline; the note is the whole finding.
    src: crates/revm/src/instructions.rs:MILLIS_TIMESTAMP
  modified:
  - op: "0x55"
    name: SSTORE
    note: >-
      Repriced twice and then given a Tempo instruction. TIP-1000 (T1+): a
      0->nonzero SSTORE costs 250,000 gas, 12.5x mainnet's 20,000. TIP-1060 (T7+):
      the gas function charges only a 5,000-gas residual and the SSTORE opcode is
      REPLACED in the instruction table by `gas_credits::sstore`, which mints and
      spends storage credits at the StorageCredits precompile — a slot clear mints
      a 245,000-gas credit instead of a refund, and a later creation by the same
      account consumes it. `sstore_clearing_slot_refund` is 0.
    src: crates/revm/src/instructions.rs:gas_credits, crates/revm/src/gas_params.rs:t7_gas_params
  - op: "0xf0"
    name: CREATE
    note: >-
      500,000 gas from T1 — 15.6x mainnet's 32,000 — under TIP-1000, on the
      argument that contract creation is permanent state. Account creation is
      250,000 (mainnet 25,000) and CODEDEPOSIT is 1,000 (mainnet 200 per byte,
      i.e. Tempo makes it a flat fee). The TIP-1016 "regular vs state gas" split
      that would decompose these is implemented in `amsterdam_gas_params` but is gated
      behind `cfg.enable_amsterdam_eip8037`, which is set only in tests — so at
      the probe block the T1 flat costs are what applies.
    src: crates/revm/src/gas_params.rs:CONTRACT_CREATE_COST, crates/revm/src/gas_params.rs:tempo_gas_params_with_amsterdam
  - op: "0x31"
    name: BALANCE
    note: "always returns 0 for every address — there is no native asset. Not disabled, just permanently zero. See gotchas: the RPC does NOT agree with the opcode."
    src_live: "eth_call with state-override code 0x5f3531 5f5260205ff3 (BALANCE of calldata address) @ 36217459 -> 0x00..00"
  - op: "0x47"
    name: SELFBALANCE
    note: "always returns 0. Same reason."
    src_live: "eth_call with state-override code 0x475f5260205ff3 @ 36217459 -> 0x00..00"
  - op: "0xf1"
    name: CALL
    note: >-
      The value argument is structurally unusable: no account can ever hold a
      nonzero native balance, so any CALL carrying value fails for insufficient
      funds. For 0x76 transactions the check is earlier and harder — every entry
      in `calls[]` is rejected at validation with `ValueTransferNotAllowedInAATx`
      if `value != 0`, before execution begins.
    src: crates/revm/src/handler.rs:ValueTransferNotAllowedInAATx

fee_model:
  metering: gas, priced in attodollars, settled in a 6-decimal TIP-20 token
  fee_market: EIP-1559 formula, fixed 10M target, elasticity 1, hard-clamped
  gas_token: "TIP-20 stablecoin precompile (default pathUSD, 0x20C0..0000); no native token exists"
  burn: none
  note: >-
    THIS IS THE ROW'S CENTRAL FINDING, AND IT IS A UNIT PROBLEM, NOT A TOKEN
    PROBLEM.

    THE HEADER BASE FEE IS NOT DENOMINATED IN ANY TOKEN. `baseFeePerGas` is in
    ATTODOLLARS — 10^-18 USD — an accounting unit with no asset behind it. The
    settlement asset, a TIP-20, has SIX decimals (microdollars, 10^-6 USD). The
    protocol therefore carries an explicit conversion constant,
    `TEMPO_GAS_PRICE_SCALING_FACTOR = 10^12`, and charges
    `ceil(gas_limit * gas_price / 10^12)` token units. Every tool that assumes
    `baseFeePerGas` is wei of the chain's asset is off by exactly 10^12 here, and
    the direction of the error is "fees look 10^12 times larger than they are".
    The observed base fee, 600,000,000 attodollars, is 0.0000006 USD per gas: a
    50,000-gas transfer costs 0.03 USD at the cap and 0.0003 USD at the floor.

    THE FEE TOKEN IS CHOSEN PER TRANSACTION AND VALIDATED AGAINST ON-CHAIN STATE.
    A 0x76 transaction may name any `feeToken`; the client checks (a) the TIP-20
    address prefix and (b) that the token's `currency` STORAGE FIELD reads exactly
    the three bytes "USD", rejecting with `FeeTokenNotUsdCurrency` otherwise. A
    transaction's validity thus depends on a string stored in another account's
    state — a consensus rule keyed to a specific ERC-20-like token's contents,
    which is new to this dataset. Legacy/2930/1559 transactions have no feeToken
    field and fall back to `DEFAULT_FEE_TOKEN` = pathUSD.

    PAYER AND VALIDATOR NEED NOT AGREE ON THE TOKEN. The validator declares a
    preferred fee token in TipFeeManager; if it differs from the payer's, the
    protocol routes the fee through an enshrined AMM (`plan_fee_route` /
    `execute_fee_swap`) inside fee collection, and a transaction can be rejected
    for `InsufficientAmmLiquidity` — a liquidity failure as a transaction
    validity error. Fees are collected pre-execution at the max and settled
    post-execution.

    THERE IS NO BURN. Nothing is burned because there is nothing to burn; the
    base fee is credited through the fee manager, not destroyed.
  extra_components:
  - {name: attodollar/microdollar scaling, note: "10^12, applied at charge time and again in eth_estimateGas's affordability check", src: "crates/primitives/src/transaction/mod.rs:TEMPO_GAS_PRICE_SCALING_FACTOR"}
  - {name: USD-currency fee-token rule, src: "crates/revm/src/common.rs:ensure_tip20_usd"}
  - {name: fee AMM routing, src: "crates/precompiles/src/tip_fee_manager/amm.rs:execute_fee_swap"}
  - {name: fee payer sponsorship, src: "crates/revm/src/tx.rs:fee_payer"}
  - {name: payment lane gas budget, note: "payment-classified transactions draw on the full block gas limit; everything else is capped at the header's general gas limit. See header_fields.", src: "crates/evm/src/block.rs:is_payment"}
  - {name: TIP-1067 clamped base fee, src: "crates/hardfork/src/constants.rs:tempo_t7_next_block_base_fee"}
  src: crates/revm/src/fee_manager.rs:ProtocolFeeManager
  src_live: "eth_gasPrice @ 36217459 -> 0x23c34600; eth_maxPriorityFeePerGas -> 0x0; eth_getTransactionReceipt(0x265549d2...) -> effectiveGasPrice 0x5f5e1000, feeToken 0x20c0..0000, feePayer == from"

header_fields:
  added:
  - name: mainBlockGeneralGasLimit
    note: >-
      A SECOND, SMALLER GAS LIMIT IN THE SAME HEADER, AND THE PAYMENT LANE IS
      THE GAP BETWEEN THEM. `gasLimit` is 500,000,000; this field is 30,000,000.
      The block executor tracks `non_payment_gas_left` initialised to THIS value
      and decrements it only for transactions that fail the payment predicate, so
      a non-payment transaction is capped at 30M per block while payment traffic
      may use the full 500M. Which side a transaction lands on is not a builder
      heuristic — from T5 it is consensus: `is_payment_v2` requires that EVERY
      call match an allow-list of (target, selector) pairs (TIP-20 transfer,
      transferFrom, approve, mint, burn, their WithMemo variants, and the
      TIP20ChannelReserve channel operations), with exact ABI-encoded calldata
      length, an EMPTY access list, EMPTY 7702 and Tempo authorization lists, and
      any key authorization under 1024 RLP bytes. Adding one access-list entry to
      an otherwise identical transfer moves it out of the lane and into a budget
      16x smaller. Pre-T5 the test was only "does it target a TIP-20 address".
    src: crates/primitives/src/header.rs:general_gas_limit, crates/evm/src/block.rs:non_payment_gas_left, crates/primitives/src/transaction/envelope.rs:is_payment_v2
    src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> mainBlockGeneralGasLimit 0x1c9c380 (30,000,000) vs gasLimit 0x1dcd6500 (500,000,000)"
  - {name: sharedGasLimit, note: "budget for the subblock section; zero from T4", src: "crates/primitives/src/header.rs:shared_gas_limit", src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> 0x0"}
  - {name: timestampMillisPart, note: "sub-second part of the timestamp; the RPC also synthesises a `timestampMillis` convenience field. Block time is ~200ms, so a second-resolution timestamp would be ambiguous across five blocks.", src: "crates/primitives/src/header.rs:timestamp_millis", src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> timestampMillisPart 0x195 (405ms), timestampMillis 0x1a031fcc99d"}
  - {name: consensusContext, note: "epoch, view, parentView, Ed25519 proposer key. RLP-trailing, omitted for pre-fork blocks.", src: "crates/primitives/src/header.rs:TempoConsensusContext", src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> {epoch: 1676, view: 15860, parentView: 15859, proposer: 0x89dbf7ef3c69bccb6ff5fb68cbebff5145cb4a42bc108b5be6453c901f9e6bc8}"}
  removed: []
  modified:
  - {name: baseFeePerGas, note: "denominated in attodollars (10^-18 USD), not wei of any asset. See fee_model.", src: "crates/hardfork/src/constants.rs:TEMPO_T1_BASE_FEE"}
  - {name: parentBeaconBlockRoot, note: "present but always zero; no beacon chain", src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> 0x00..00"}
  - {name: blobGasUsed / excessBlobGas, note: "present but always zero; blob transactions do not exist", src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> 0x0 / 0x0"}
  note: >-
    Receipts also gain two fields not on mainnet: `feeToken` and `feePayer`. Both
    appear on ORDINARY type-0x2 receipts, not only on 0x76 — which is how a
    reader discovers that a legacy transaction here is also paying in a TIP-20.
  receipts_src_live: "eth_getTransactionReceipt(0x265549d2d9e57364682a4b6cbf6364de4e721a0850ffb8cbf0c22d8eb2bf1d2f) @ 36217459 -> {feeToken: 0x20c0...0000, feePayer: 0x7a19d608...}"

gotchas: >-
  `eth_getBalance` RETURNS A FABRICATED NUMBER, AND IT DISAGREES WITH THE EVM.
  Tempo's RPC overrides `EthState::balance` to return
  `NATIVE_BALANCE_PLACEHOLDER` — the U256 whose decimal digits are "42" repeated
  38 times — for EVERY address at EVERY block, ignoring both arguments. The
  BALANCE and SELFBALANCE opcodes, meanwhile, correctly return 0. So the RPC and
  the EVM give different answers about the same account in the same block, and
  the RPC's is not a rounding error or a stale read: it is a constant chosen to
  be obviously absurd. Anything that gates on native balance — a wallet's
  "insufficient funds for gas" check, a bridge's sweep threshold, an indexer's
  balance table, a monitoring alert — reads 4.2e75 and concludes the account is
  unimaginably rich. This is `severity: high` in SCHEMA.md's exact sense: it
  fails silently, with no error and no signal. The placeholder is deliberate and
  documented in a doc comment ("because the native token balance is N/A on
  Tempo"), which makes it a considered decision rather than a bug, but it does
  not make it safe.

  A TRANSACTION WITH NONZERO `value` IS REJECTED, NOT REVERTED. `validate_env`
  returns `ValueTransferNotAllowed` before execution, so the transaction never
  enters a block and there is no receipt to inspect — it fails at admission, the
  way a bad nonce does. `eth_call` with a value field errors out the same way.
  Inside a 0x76 batch each individual call is checked separately
  (`ValueTransferNotAllowedInAATx`). Any code path that expresses "send the
  chain's native asset" is unreachable, including the ordinary
  `to`+`value` transfer that most tooling treats as the primitive operation.

  `eth_getCode` AT A PRECOMPILE RETURNS `0xef`, NOT `0x`. Tempo writes a
  one-byte marker into every one of its own precompile accounts at the fork that
  activates them, so the standard "empty code means native" test inverts:
  Tempo's precompiles look like contracts and the inherited Ethereum precompiles
  (0x01..0x11, 0x0100) look empty. `EXTCODESIZE` reports 1.

  A LEGACY TRANSACTION IS NOT A LEGACY TRANSACTION. Type 0x00/0x01/0x02 are
  accepted, but they carry no fee-token field, so they are billed in pathUSD, and
  their `value` must be zero. The familiar envelope is there; the familiar
  semantics are not.

  OPCODE 0x4F WAS VALID AND IS NOT. Contracts deployed before 2026-03-12 that
  used MILLIS_TIMESTAMP still exist and now hit an undefined opcode.

  THE KZG PRECOMPILE WORKS ON A CHAIN WITH NO BLOBS. 0x0a is present and
  functional because the Osaka built-in set is installed wholesale, while type
  0x03 is rejected at the envelope. Verifier without payload.

  FEE FAILURE MODES THAT DO NOT EXIST ELSEWHERE: `FeeTokenNotUsdCurrency` (the
  named token's on-chain `currency` string is not "USD"),
  `InsufficientAmmLiquidity` (no pool depth to convert the payer's stablecoin
  into the validator's), and `SelfSponsoredFeePayer` (sponsor == sender).

gotchas:
  - >-
    SINCE BLOCK 53556127 (2026-11-05 18:00 UTC), FIVE BLOCKS SHARE ONE `block.timestamp`.
    Denim's blocks are 200ms apart and TIMESTAMP stays in seconds, so code that treats a new
    block as a new time, or divides elapsed seconds by a block interval, is wrong. Measured
    on mainnet. `BaseTime.timestampMs()` is the sub-second source. Block-count time constants
    written for 2s blocks run ten times faster, and PREVRANDAO repeats for 60 blocks.
  - >-
    BASE PRECOMPILES ARE NOT ENUMERABLE. From Beryl, a lookup predicate makes every
    0xb2-prefixed address matching the B-20 pattern a precompile. Any tool that
    builds a fixed precompile address set — decompiler, tracer, static analyser,
    or this dataset's own PRECOMPILES.md — is structurally unable to represent Base.
  - >-
    Base implements native account abstraction (EIP-8130) as an ENSHRINED feature,
    not a precompile, with its own transaction type 0x79, 2D nonces and a
    sender/payer split. It supports EIP-7702 as well, so two distinct AA mechanisms
    coexist.
  - >-
    Base uses its own chain ID as a precompile address prefix (0x8453..). Cute, and
    collision-free by construction, but only if every chain does it.
  - >-
    Base is absent from the superchain-registry mainnet configs, so its fork
    timestamps are not obtainable the way OP Mainnet's and World Chain's are.
  - >-
    The obvious repo (base/node) is Docker packaging only. The real client is
    base/base. Reading the obvious one produces a confidently empty, wrong row.

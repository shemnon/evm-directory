schema_version: 2

chain:
  name: World Chain
  slug: worldchain
  chain_id: 480
  role: fork
  live: true
  chain_id_src: crates/rpc/tests/fork_simulate.rs:46

lineage:
  upstream: op-stack
  ancestry: [ethereum, op-stack]
  fork_of: null
  note: >-
    Not a client fork. World Chain runs stock OP Stack execution (op-reth / op-geth)
    and adds an external block BUILDER. The repo pinned here is the builder, not a
    node. All EVM semantics are inherited unchanged from op-stack; consult that file.
  sync_point: >-
    Follows the OP Stack upgrade sequence through Karst, then diverges to its own
    schedule (crates/chainspec/src/hardfork.rs). Currently defaulted to Jovian.

client:
  name: world-chain (builder)
  repo: https://github.com/worldcoin/world-chain
  version: v2.4.2
  commit: 33281430d5458697ef92ffba035bba245c5a0691
  language: rust
  built_on: reth / op-reth
  note: >-
    A block-building sidecar, not an execution client. Execution is stock OP Stack.

consensus:
  engine: OP Stack (sequencer) + rollup-boost external block production
  block_time: 2s
  note: >-
    rollup-boost multiplexes engine API calls to both the default EL and the World
    Chain builder, and falls back to the default EL block if the builder is late or
    returns an invalid block. The builder therefore cannot change state-transition
    rules — only ordering.

baseline_fork: osaka

forks:
  src: crates/chainspec/src/hardfork.rs
  activation_src: "op-stack/repos/superchain-registry/superchain/configs/mainnet/worldchain.toml"
  note: >-
    Inherits the OP Stack sequence Bedrock..Karst verbatim, then declares two
    World-Chain-specific forks. Both are ForkCondition::Never in the shipped spec
    (asserted at crates/chainspec/src/spec.rs:578-579) — declared, not scheduled.
  timeline:
  - {name: "canyon/delta/ecotone", activation_time: 0, mainnet_equivalent: "shanghai+cancun",
     note: "active from genesis (l2_time 1719335639)"}
  - {name: fjord,    activation_time: 1721826000, mainnet_equivalent: null}
  - {name: granite,  activation_time: 1727780400, mainnet_equivalent: null}
  - {name: holocene, activation_time: 1738238400, mainnet_equivalent: null}
  - {name: isthmus,  activation_time: 1764072000, mainnet_equivalent: prague,
     note: "2025-11-25 — over six months after mainnet Prague, and after OP Mainnet's Isthmus"}
  - {name: jovian,   activation_time: 1777593600, status: active,
     note: "2026-05-01; current fork. hardfork.rs marks Jovian #[default]"}
  - {name: karst,    activation_time: null, status: pending,
     note: "no karst_time in the registry, unlike OP Mainnet which activated Karst 2026-07-08"}
  - {name: tropo,  status: pending, activation_time: null, note: "ForkCondition::Never"}
  - {name: strato, status: pending, activation_time: null, note: "ForkCondition::Never"}

eips:
  # Everything inherited from op-stack. No World Chain EIP-level divergence today.
  note: >-
    No deltas beyond op-stack's. World Chain's own EIP-shaped changes live in the
    WIP series and are all Draft (see non_eip_specs).

non_eip_specs:
  - id: WIP-1001
    name: World Chain Native Account Abstraction
    adoption: draft
    created: 2026-03-27
    src: specs/wips/wip-1001.md
    note: >-
      Would add typed tx 0x1D and a WORLD_CHAIN_ACCOUNT_MANAGER predeploy. The spec
      states it "MUST NOT activate until every parameter below is assigned in fork
      configuration"; no such parameters are assigned in this tree. Not implemented:
      crates/node/src/node.rs:81-83 describes WorldChainTxEnvelope as future work.
  - id: WIP-1002
    name: WorldID Subsidy Accounting
    adoption: draft
  - id: WIP-1003
    name: World ID Transaction Subsidies
    adoption: draft
  - id: WIP-1004
    name: EdDSA (Ed25519) Verification Precompile
    adoption: draft
    src: specs/wips/wip-1004.md
    note: >-
      Proposes Ed25519 verification at 0x0100 with 2000 base gas + 12/word.
      That address is ALREADY OCCUPIED — see precompiles."0x0100".
  - id: WIP-1005
    name: Proof System Upgrade
    adoption: draft
  - id: WIP-1006
    name: Proof System Architecture
    adoption: draft
  - id: WIP-1007
    name: Flashblock Access Lists
    adoption: draft
    category: Networking
  - id: WIP-1008
    name: Staked Subblocks and Unsafe-Head BFT
    adoption: draft
  - id: PBH
    name: Priority Blockspace for Humans
    adoption: adopted
    src: specs/pbh/
    note: >-
      NOT an EVM change. A transaction-ordering policy: txs calling pbhMulticall()
      or handleAggregatedOps() on the PBHEntryPoint contract, carrying a valid World
      ID PBHPayload, get top-of-block priority. PBH transactions are "standard OP
      transactions" (specs/pbh/txs.md:3) and PBHEntryPoint is an ordinary deployed
      contract, not a predeploy or precompile. Belongs in a block-policy column, not
      an EVM-difference column.

tx_types:
  "0x1D":
    name: WorldChainTx
    status: pending
    spec: WIP-1001
    src: specs/wips/wip-1001.md
    note: >-
      Draft only; not implemented in this tree. COLLISION RISK: mainnet's typed-tx
      allocations grow upward from 0x04 (currently at 0x04/EIP-7702), and 0x1D (29)
      sits inside that growth path. Contrast OP Stack's 0x7e, deliberately placed at
      the top of the legal 0x00-0x7f range for exactly this reason.
  note: >-
    Live set = op-stack's (0x00-0x04 plus 0x7e deposit). No live additions.

tx_authorization:
  note: >-
    LIVE: no delta from op-stack. Execution is stock OP Stack, so secp256k1 is the
    only scheme that authorizes, key_binding is derived, and 0x7e deposits are
    unsigned. World ID does NOT authorize transactions and this is the axis where
    that matters most. The semaphore proof travels in the `signature` field of an
    ERC-4337 PackedUserOperation inside a bundle addressed to the PBHEntryPoint,
    which is an ordinary deployed contract; the builder's pool validator checks the
    proof only AFTER `inner.validate_one` has already accepted the transaction as a
    valid OP transaction — i.e. after ordinary secp256k1 sender recovery has
    succeeded — and the check buys top-of-block PRIORITY, not authority. It is not
    even `authorizes: account_code`: ERC-4337 is contract-level, so the protocol runs
    no account validator. rollup-boost falls back to the default EL's block if the
    builder returns an invalid one, so the builder cannot make a proof authorize
    anything the EL would not have accepted regardless.
  src: "crates/pool/src/validator.rs:validate_pbh_bundle, crates/pbh/src/payload.rs:verify_proof"
  schemes:
    programmable_eip1271:
      status: pending
      authorizes: account_code
      precompile: none
      spec: WIP-1001
      note: >-
        DRAFT (created 2026-03-27), 654 lines, every activation parameter TBD. The name
        understates it: WIP-1001 reuses EIP-1271's INTERFACE while inverting its
        semantics. Standard 1271 is a pure predicate over a hash, decided before
        anything happens. Here authorization is TWO calls that STRADDLE EXECUTION.

        Step 6 is the familiar one — isValidSignatureForVerifier over a signingHash. Step
        12 is not: after the payload has ALREADY RUN tentatively (step 9), the protocol
        hands the session verifier an ExecutionTraceContext and asks
        evaluateSessionPolicy whether what just happened was allowed. If it answers
        false, the tentative state is DISCARDED (step 13). A transaction can be fully
        executed and then un-executed because a contract disliked the trace.

        What the verifier sees is not a hash but a WorldChainExecutionTrace: every
        Call/StaticCall/DelegateCall/Create/Create2 with depth, caller, target, value,
        selector, input and output hashes, success and gasUsed, plus every log with
        emitter, topics and callIndex. That is what "programmable" buys — spending
        limits, MFA on high-value transfers, scoped agent delegation and subscriptions
        are expressible as policy over observed behaviour, with no protocol branch per
        scheme. The spec states the principle: no signer-specific authentication as a
        native execution path.

        Determinism is enforced, not trusted. Both calls run in restricted validation
        frames policed by a runtime tracer derived from ERC-7562: 13 rules forbidding
        block context, tx context, external account inspection, SSTORE/TLOAD/TSTORE,
        logs, CALL/CREATE and SELFDESTRUCT, permitting STATICCALL only to allowlisted
        precompiles and DELEGATECALL only to bytecode satisfying the same rules,
        validated RECURSIVELY (WIP1001-VR-9). A verifier is therefore a pure function of
        its own storage, its own code, its calldata, and the precompile allowlist.

        THE CONSEQUENCE FOR THIS AXIS: "Adding a new precompile to the validation
        allowlist is a hard-fork change." So although authentication is programmable,
        the set of CRYPTOGRAPHY a verifier can reach is closed by the protocol and
        widened only by hard fork. This is the direct opposite of zkSync Era, where the
        equivalent question has no closed answer (see chains/zksync-era) — and a third
        distinct answer from Base, which enshrines a closed authenticator set in the
        client with no user code at all. Three designs, three different places to draw
        the same boundary.

        Two further protocol-level oddities if it ships. Validation gas is NOT deducted
        from the envelope gasLimit and is charged instead against a per-block
        BLOCK_VALIDATION_GAS_BUDGET, so block capacity gains a second dimension and a
        0x1D transaction that does not fit is DEFERRED rather than failed. And the
        failure classes give "failed" two meanings: a payload that REVERTS with an
        accepted policy is committed as a revert, while a payload the policy REJECTS is
        discarded — both after burning the nonce and charging a fee.

        If it ships, this row's key_binding becomes `account_code` for 0x1D and stays
        `derived` for every other type. Nothing is scheduled: every parameter above is
        TBD, including EDDSA_PRECOMPILE, whose address WIP-1004 separately proposes to
        put at 0x0100 where P256VERIFY already lives (see precompiles."0x0100").
      src: "specs/wips/wip-1001.md:WORLD_CHAIN_ACCOUNT_MANAGER, specs/wips/wip-1001.md:evaluateSessionPolicy, specs/wips/wip-1001.md:WorldChainExecutionTrace, specs/wips/wip-1001.md:BLOCK_VALIDATION_GAS_BUDGET, specs/wips/wip-1001.md:EIP1271_VALIDATION_GAS_LIMIT"
precompiles:
  base_map:
    status: inherited
    present: "0x01-0x11"
    p256verify: true
    src: inherits OP Stack's op-geth base map (PrecompiledContractsJovian); the
      world-chain builder tree carries no precompile changes of its own
    note: >-
      Live base map is identical to OP Stack's, including all six same-address
      divergences. WIP-1004 proposes an EdDSA precompile at 0x0100 — the address
      P256VERIFY already occupies — but that is an unshipped draft to fix, see the
      0x0100 row.
  "0x0100":
    name: "P256VERIFY (live); EdDSA proposed"
    status: modified
    inherited_from: op-stack
    pending_conflict: WIP-1004
    spec: "EIP-7951 live / WIP-1004 proposed"
    src: specs/wips/wip-1004.md
    conflict: true
    note: >-
      WIP-1004 specifies EDDSA_PRECOMPILE_ADDRESS = 0x0100. That address already
      holds P256VERIFY on World Chain today — inherited from OP Stack Fjord
      (RIP-7212) and matching mainnet EIP-7951. The draft does not acknowledge the
      overlap, and its stated rationale (wip-1004.md:105) rests on two stale
      premises: that Ethereum reserves only "0x01-0x0A" (mainnet has reserved
      0x01-0x11 since Prague/EIP-2537), and that RIP-7212 established a convention
      of "placing non-mainnet precompiles starting at 0x0100" (RIP-7212 OCCUPIES
      0x0100 rather than opening the range above it). The spec does say the address
      "MAY be revised by maintainers before activation," so this is a draft to fix,
      not shipped behaviour. Recorded because it is exactly the allocation-collision
      class this dataset exists to surface.
  note: >-
    Live set is identical to op-stack's, including all six of op-stack's semantic
    divergences from mainnet. World Chain adds nothing live.

system_contracts:
  note: >-
    Inherits the OP Stack 0x42.. set. PBHEntryPoint is a normal deployed contract
    (pkg/contracts/src/pbh/PBHEntryPointImplV1.sol), NOT a predeploy — it holds no
    reserved address and requires no client support.

opcodes:
  added: []
  removed: []
  modified: []

fee_model:
  metering: gas
  note: inherits op-stack's three-component model (L2 1559 + L1 data fee + operator fee)
  extra_components:
  - name: nonce on failure
    status: pending
    src: "specs/wips/wip-1001.md:evaluateSessionPolicy, specs/wips/wip-1001.md:BLOCK_VALIDATION_GAS_BUDGET"
    note: >-
      NONCE ON FAILURE: TODAY, PRESERVED — mainnet semantics, inherited whole
      from OP Stack. World Chain does not separate ordering from execution and
      has zero live EVM divergence, so an invalid transaction is never included
      and the sender resubmits at the same nonce. Recorded here only because the
      UNSHIPPED type-0x1D proposal would change the answer.

      IF WIP-1001 SHIPS. Authorization for a 0x1D transaction straddles
      execution: the payload runs tentatively, then `evaluateSessionPolicy` is
      asked whether the resulting `WorldChainExecutionTrace` was allowed. The
      spec gives "failed" two meanings, and both spend the nonce — a payload that
      REVERTS under an accepted policy is committed as a revert, and a payload
      the policy REJECTS is DISCARDED, both "after burning the nonce and charging
      a fee". A discarded-but-charged transaction is the shape that makes Artela
      dangerous, so whether the discarded case still produces a RECEIPT is the
      question to settle before this ships; the WIP does not say, and no client
      implements it. NOTHING IS SCHEDULED — every parameter in WIP-1001 is TBD,
      and this entry is a spec reading, not an observation.

header_fields:
  added: []
  removed: []
  modified: []
  note: inherits op-stack's repurposed blobGasUsed

gotchas:
  - >-
    World Chain has ZERO live EVM divergence from OP Stack. Its differentiator (PBH)
    is a block-ordering policy enforced by an external builder that cannot alter the
    state transition — rollup-boost falls back to the default EL block if the
    builder misbehaves. Anyone expecting "the World ID chain" to have custom
    precompiles or account types today is reading the roadmap, not the chain.
  - >-
    The entire WIP series (1001-1008) is Draft, and the two World-Chain-specific
    hardforks (Tropo, Strato) are ForkCondition::Never. This chain's interesting
    deltas are all in the future tense.
  - >-
    WIP-1004 proposes EdDSA at 0x0100, already occupied by P256VERIFY. Draft-stage
    and explicitly revisable, but it shows how quickly the "custom precompiles live
    far from mainnet" convention erodes once 0x0100 itself became a mainnet address
    at Osaka.

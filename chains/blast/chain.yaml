gotchas:
  - >-
    THE ACCOUNT IS NOT AN ETHEREUM ACCOUNT. `types.StateAccount` is
    `{Nonce, Flags, Fixed, Shares, Remainder, Root, CodeHash}` — seven RLP items, and
    `Balance` is gone. Anything that decodes a four-item account against Blast's state
    root is wrong: light clients, `eth_getProof` verifiers, cross-chain state bridges,
    archive tooling. Verified live: the leaf for 0x4300…0002 is
    `f847 80 01 80 80 80 a0<storageRoot> a0<codeHash>`.
  - >-
    BALANCES CHANGE WITH NO TRANSACTION. `Balance()` returns
    `sharePrice * Shares + Remainder` for a YieldAutomatic account. Between blocks
    40051136 and 40051137 the share price rose from 1,078,139,877 to 1,078,214,892,
    and two accounts that appear nowhere in block 40051137's seven transactions
    gained 97,448,085,720 wei and 1,875,668,833,755 wei respectively. No log, no
    receipt, no trace, no change to their account leaves. An indexer that reconstructs
    balances from transfers is wrong on Blast from the first yield report onward.
  - >-
    DEFAULTS DIFFER BY ACCOUNT KIND, AND NEITHER IS CONFIGURABLE AT CREATION. A new
    account defaults to `Flags = 0` (YieldAutomatic) — every EOA earns yield — while
    `EVM.create` sets `YieldDisabled` immediately after the endowment transfer, so
    every CREATE'd contract starts VOID and its share of the yield is forfeited to
    the protocol until someone calls `configure`. Deployment scripts ported from
    another OP Stack chain silently leave yield on the table.
  - >-
    `block.coinbase` receives nothing on the normal path. See fee_model — and note
    that the fallback branch that DOES pay the coinbase fires precisely when the
    client's two gas counters disagree, which is not observable from outside.
  - >-
    THE PRECOMPILE INTERFACE IS DIFFERENT. `PrecompiledContract.Run` takes a caller,
    a `StateDB` and a `readOnly` flag. On this chain a precompile can mutate state —
    the schema's own definition ("native code at an address, no bytecode in state")
    still holds, but the usual corollary that precompiles are pure does not.
  - >-
    0x0100 IS OCCUPIED. Not empty (Hyperliquid), not moved (Sei) — occupied by an
    unrelated, ABI-dispatched, state-writing precompile. Any code that treats that
    address as "P256VERIFY or nothing" is wrong here in a third way.
  - >-
    CALL COSTS DEPEND ON DEPTH. +7,100 gas past frame 5 on the first touch of an
    address. Gas estimates taken at the top level under-predict the same code called
    from inside a router or a multicall.

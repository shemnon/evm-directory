  modified: []

gotchas:
  - >-
    CANCUN OPCODES ON A CONSTANTINOPLE GAS SCHEDULE. PUSH0, MCOPY, TLOAD and TSTORE
    all work; SLOAD costs 200, BALANCE 400, SELFDESTRUCT refunds 24,000 and the
    refund cap is gasUsed/2. Nothing about the opcode set tells you the gas set, and
    every gas-based security argument written for mainnet has to be rechecked here.
  - >-
    THERE IS NO EIP-2718 ENVELOPE. Not "type 2 is rejected" — the transaction class
    decodes nine RLP items and has no type branch. Any library that signs an
    EIP-1559 transaction produces something Rootstock cannot parse.
  - >-
    A MAXIMUM GAS PRICE, ENFORCED AT BLOCK VALIDATION. 100x the block's
    minimumGasPrice, or the block is invalid. Wallet fee presets built for mainnet
    congestion can exceed it.
  - >-
    `block.prevrandao` RETURNS THE MINING DIFFICULTY, and `mixHash` in the block JSON
    is a fabricated zero that is not in the header at all.
  - >-
    PRECOMPILE INPUT IS TRUNCATED, NOT REJECTED. Since RSKIP516 a call to 0x01, 0x06,
    0x07, 0x09, 0x01000016 or 0x01000017 with too much calldata has the excess
    silently dropped. On 0x09 that turns a mainnet revert into a success.
  - >-
    FOUR OPCODE BYTES ARE TOMBSTONED, THREE OF THEM BY A FORK THAT TURNED THEM OFF.
    0xa8 DUPN, 0xa9 SWAPN and 0xaa TXINDEX were live until block 3,614,800; 0xfc
    HEADER was defined never to be valid. Old contracts containing them still exist.
  - >-
    THE BTC PEG IS A PRECOMPILE THAT MOVES NATIVE VALUE. `eth_getCode` on
    0x…01000006 returns `0x`, indistinguishable from an empty account, and a peg-in
    credits RBTC with no EVM transfer to observe.
  - >-
    EVERY BLOCK ENDS WITH AN UNSIGNED TRANSACTION whose sender is the zero address
    encoded as a single zero byte — a pre-launch bug that is now consensus. An
    indexer that assumes every type-0x0 transaction has a recoverable signature will
    fail on one transaction per block, forever.

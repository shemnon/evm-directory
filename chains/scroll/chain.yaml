schema_version: 2

chain:
  name: Scroll
  slug: scroll
  chain_id: 534352
  role: fork
  live: true
  evidence: source
  note: >-
    A go-ethereum fork whose EVM stops at SHANGHAI and then cherry-picks single EIPs
    out of Cancun, Prague and Osaka without ever declaring those forks. `params/config.go`
    contains no CancunTime, PragueTime or OsakaTime field at all — grep the whole tree
    for "Cancun" and you get nothing — yet TSTORE, MCOPY, EIP-7702, EIP-7623, EIP-2935,
    EIP-7823/7883 and CLZ are all live. Any tool that maps a chain to a mainnet fork
    name and derives capabilities from it is wrong here in both directions at once.

lineage:
  upstream: ethereum
  ancestry: [ethereum]
  fork_of: go-ethereum
  sync_point: >-
    A DEEP fork, not a rebase. params/version.go declares Major 5 / Minor 10 / Patch 2
    with VersionMeta "mainnet" — Scroll renumbered geth's version scheme, so the client
    does not announce which upstream geth it descends from and web3_clientVersion
    reports "Geth/v5.10.2-mainnet". The fork ladder in params/config.go ends at
    ShanghaiBlock; everything past Shanghai was back-ported EIP by EIP into
    Scroll-named forks (Archimedes, Bernoulli, Curie, Darwin, Euclid, Feynman,
    Galileo) rather than by tracking upstream. There is no Cancun, Prague or Osaka
    fork field to set.
  note: >-
    Neither the client repo nor the org has moved: scroll-tech/go-ethereum is live and
    scroll-tech/scroll (the monorepo) is unarchived. The contracts moved OUT of the
    monorepo into scroll-tech/scroll-contracts, but no predeploy fact in this row
    needed it — the client carries the predeploy addresses AND their deployed bytecode
    as Go constants (rollup/rcfg/config.go), so contracts facts are established from
    the execution client itself and confirmed live. No companion repo is pinned.

client:
  name: scroll-tech/go-ethereum (l2geth)
  repo: https://github.com/scroll-tech/go-ethereum
  version: scroll-v5.10.2
  commit: d67dd0baa0ff3607c23f8f23bc94be26aabaa290
  language: go
  note: >-
    The running network is at exactly this release: web3_clientVersion @ block
    34765788 returns "Geth/v5.10.2-mainnet/linux-amd64/go1.22.2". Unusually for this
    dataset the pinned tag and the deployed client are the same build.

live_probe:
  endpoint: https://rpc.scroll.io
  chain_id: 534352
  observed_at_block: 34765788      # 0x21279dc, `finalized` at probe time

consensus:
  engine: "Clique -> SystemContract (single sequencer, signer key read from L1 storage)"
  finality: inherits L1 finality once the validity proof is verified on Ethereum
  block_time: 3s
  note: >-
    From EuclidV2 the engine is `system_contract`, which is Clique with the authorised
    signer taken not from an on-chain vote but from ONE STORAGE SLOT ON ETHEREUM
    MAINNET: eth_getStorageAt(0x8432728A257646449245558B8b7Dbe51A16c7a4D, slot 0x67).
    A Scroll node therefore cannot validate a header without an L1 RPC endpoint, and
    the L2's block-producer authorisation is mutable from L1 with no L2 fork.
  src: "params/config.go:SystemContractConfig, consensus/system_contract/system_contract.go:signerAddressL1, eth/ethconfig/config.go:CreateConsensusEngine, consensus/wrapper/consensus.go:NewUpgradableEngine"

baseline_fork: shanghai
baseline_note: >-
  Derived from the config, not from a blog post: ScrollMainnetChainConfig sets
  ShanghaiBlock: big.NewInt(0) and has NO field for any later mainnet fork. The chain
  is Shanghai-equivalent plus a hand-picked set of later EIPs and minus several
  Shanghai ones (4895). Read every `added` below as "not on mainnet at Shanghai" and
  see the note for which mainnet fork it really belongs to.

forks:
  src: "params/config.go:ScrollMainnetChainConfig"
  note: >-
    THREE activation mechanisms in one config. London and Shanghai are block numbers
    pinned to 0; Bernoulli and Curie are real block numbers; everything from Darwin on
    is a timestamp. Nothing maps to a mainnet fork name, and the client has no way to
    express one — so `mainnet_equivalent` is null for every Scroll-named fork and the
    equivalence has to be read out of the EIP table instead.
  timeline:
  - {name: "homestead..london", activation_block: 0, mainnet_equivalent: london,
     note: "genesis-active; MuirGlacier and ArrowGlacier are nil"}
  - {name: archimedes, activation_block: 0, mainnet_equivalent: null,
     note: "genesis-active. Scroll's own fork that DISABLES SHA256, RIPEMD160 and BLAKE2F and caps BN256_PAIRING at 4 pairs — the chain launched already diverged.",
     src: "core/vm/contracts.go:PrecompiledContractsArchimedes"}
  - {name: shanghai, activation_block: 0, mainnet_equivalent: shanghai,
     note: "PUSH0 and EIP-3860 from genesis; EIP-4895 withdrawals never adopted",
     src: "core/vm/jump_table.go:newShanghaiInstructionSet"}
  - {name: bernoulli, activation_block: 5220340, mainnet_equivalent: null,
     note: "re-enables SHA256 (0x02) after ~1 year tombstoned",
     src: "core/vm/contracts.go:PrecompiledContractsBernoulli"}
  - {name: curie, activation_block: 7096836, mainnet_equivalent: null,
     note: "EIP-1153 + EIP-5656 (Cancun opcodes) and EIP-3198; rewrites L1GasPriceOracle bytecode for blob DA",
     src: "core/vm/jump_table.go:newCurieInstructionSet, consensus/misc/curie.go:applyCurieHardFork"}
  - {name: darwin, activation_time: 1724227200, mainnet_equivalent: null}
  - {name: darwinV2, activation_time: 1725264000, mainnet_equivalent: null}
  - {name: euclid, activation_time: 1744815600, mainnet_equivalent: null,
     note: "zkTrie -> MPT state-trie migration; retires the in-client circuit-capacity checker",
     src: "rollup/ccc/async_checker.go:Check"}
  - {name: euclidV2, activation_time: 1745305200, mainnet_equivalent: null,
     note: "EIP-7702 (a Prague EIP); P256VERIFY at 0x0100 at 3450 gas; Clique -> SystemContract engine; block seal moves out of extraData",
     src: "core/vm/jump_table.go:newEuclidV2InstructionSet, core/vm/contracts.go:PrecompiledContractsEuclidV2"}
  - {name: feynman, activation_time: 1755576000, mainnet_equivalent: null,
     note: "EIP-7623 and EIP-2935 (Prague EIPs); lifts the 4-pair BN256_PAIRING cap; rewrites L1GasPriceOracle bytecode again",
     src: "core/state_transition.go:FloorDataGas, core/state_processor.go:ProcessParentBlockHash, consensus/misc/feynman.go:applyFeynmanHardFork"}
  - {name: galileo, activation_time: 1765868400, mainnet_equivalent: null,
     note: "EIP-7823 + EIP-7883 + EIP-7951 + EIP-7939 (all Osaka EIPs). Lifts the 32-byte MODEXP cap and raises P256VERIFY from 3450 to 6900 gas.",
     src: "core/vm/contracts.go:PrecompiledContractsGalileo, core/vm/jump_table.go:newGalileoInstructionSet"}
  - {name: galileoV2, activation_time: 1766041200, mainnet_equivalent: null,
     note: "third client-driven rewrite of the L1GasPriceOracle bytecode",
     src: "consensus/misc/galileoV2.go:applyGalileoV2HardFork"}

eips:
  # Relative to MAINNET AT SHANGHAI. `added` therefore means "Scroll has it and
  # mainnet-at-Shanghai did not" — the note names the mainnet fork it came from.
  4895:
    status: removed
    note: >-
      Withdrawals were never adopted. types.Body has only Transactions and Uncles —
      there is no Withdrawals field to decode — while the HEADER still carries an
      optional withdrawalsRoot, commented "Included for Ethereum compatibility in
      Scroll SDK". Live, the field is absent from the JSON entirely.
    src: "core/types/block.go:Body"
    src_live: "eth_getBlockByNumber @ 34765788 -> no withdrawalsRoot key in the result"
  3651: {status: inherited, note: "warm coinbase — but the warmed address is the fee vault, not the header miner; see opcodes.modified COINBASE",
         src: "core/state/statedb.go:Prepare"}
  1153:
    status: added
    note: "TSTORE/TLOAD, a CANCUN EIP, active since Curie (block 7096836) on a chain with no Cancun fork."
    src: "core/vm/jump_table.go:newCurieInstructionSet"
    src_live: "eth_call @ 34765788 -> TSTORE 0xaa then TLOAD returns 0xaa"
  5656:
    status: added
    note: "MCOPY, a Cancun EIP, active since Curie."
    src: "core/vm/jump_table.go:newCurieInstructionSet"
    src_live: "eth_call @ 34765788 -> MCOPY copies 0xff from m[0] to m[32]"
  4844:
    status: removed
    note: >-
      No blob transactions and no blob opcodes. BLOBHASH (0x49) and BLOBBASEFEE (0x4a)
      are both undefined opcodes live. The BlobTx type is still DECODABLE — the
      0x03 case survives in transaction.go and transaction_signing.go — but nothing
      activates it and blobGasUsed/excessBlobGas are header fields kept only "for
      Ethereum compatibility in Scroll SDK" and absent from live headers.
    src: "core/types/transaction.go:BlobTxType, core/types/block.go:BlobGasUsed"
    src_live: "eth_call @ 34765788 -> opcode 0x49 not defined; opcode 0x4a not defined; block has no blobGasUsed key"
  4788:
    status: removed
    note: "No beacon chain, no beacon-roots contract, no parentBeaconBlockRoot in live headers. The header field exists as an optional for SDK compatibility only."
    src: "core/types/block.go:ParentBeaconRoot"
    src_live: "eth_getBlockByNumber @ 34765788 -> no parentBeaconBlockRoot key"
  6780:
    status: removed
    severity: high
    note: >-
      Not "SELFDESTRUCT restricted to the same transaction" — SELFDESTRUCT DOES NOT
      EXIST. jump_table.go sets `SELFDESTRUCT: nil` with the comment "SELFDESTRUCT has
      the same behavior as INVALID", and eips.go carries two commented-out gas
      assignments marked "SELFDESTRUCT is disabled in Scroll". Live, the opcode aborts
      with "invalid opcode: SELFDESTRUCT". EIP-6780 is therefore moot here, and any
      contract whose withdrawal or upgrade path ends in SELFDESTRUCT is bricked rather
      than merely limited.
    src: "core/vm/jump_table.go:SELFDESTRUCT, core/vm/eips.go:enable3529"
    src_live: "eth_call @ 34765788 -> `invalid opcode: SELFDESTRUCT`"
  7702:
    status: added
    note: >-
      A PRAGUE EIP live since EuclidV2. Type 0x04 is accepted by the pool gated on
      IsEuclidV2, the authorisation list is validated in state_transition.go, and
      enable7702 is in the EuclidV2 instruction set.
    src: "core/vm/jump_table.go:newEuclidV2InstructionSet, core/tx_pool.go:eip7702, core/state_transition.go:validateAuthorization"
  7623:
    status: added
    note: >-
      Calldata floor pricing, a Prague EIP, active since Feynman. Confirmed live: 100
      zero calldata bytes to an EOA estimate at 22000 gas (21000 + 10 x 100 tokens),
      not the 21400 that pre-7623 pricing gives.
    src: "core/state_transition.go:FloorDataGas"
    src_live: "eth_estimateGas @ 34765788 -> 0x55f0 (22000) for 100 zero calldata bytes"
  2935:
    status: added
    note: >-
      A Prague EIP, active since Feynman, and implemented FULLY: the canonical
      0x0000F90827F1C53a10cb7A02335B175320002935 holds the canonical 0x3373...
      bytecode, HistoryServeWindow is 8191, and BLOCKHASH was rewritten to read the
      ring buffer out of that contract's storage rather than from the header chain.
    src: "core/vm/instructions.go:opBlockhashPostFeynman, core/state_processor.go:ProcessParentBlockHash, params/protocol_params.go:HistoryStorageAddress"
    src_live: "eth_getCode @ 34765788 -> 0x3373fffffffffffffffffffffffffffffffffffffffe14604657...; BLOCKHASH(n-1) returns the block's parentHash"
  7823:
    status: added
    severity: high
    note: >-
      THE headline Scroll divergence, and it CLOSED at Galileo. From genesis until
      1765868400 `bigModExp.Run` rejected any base/exp/modulus longer than 32 bytes
      with errModexpUnsupportedInput — "modexp temporarily only accepts inputs of 32
      bytes (256 bits) or less" — making RSA-2048 verification impossible on-chain.
      Galileo sets eip7823: true, replacing the 32-byte cap with EIP-7823's 1024-byte
      bound. Exactly the arc Linea's 512-byte modexp cap took: a private proving
      constraint absorbed by a mainnet consensus rule. Recorded as `added` because at
      the Shanghai baseline mainnet had no 7823 at all; the dangerous half is that the
      dead 32-byte branch is still in the source, gated only on `!(eip7823 || eip7883)`.
    src: "core/vm/contracts.go:errModexpUnsupportedInput, core/vm/contracts.go:PrecompiledContractsGalileo"
    src_live: "eth_call @ 34765788 -> 0x05 with 64-byte base and modulus returns 3^3 mod 10 = 7 as 64 bytes"
  7883: {status: added, note: "MODEXP repricing (Osaka), live since Galileo via galileoModexpGas",
         src: "core/vm/contracts.go:galileoModexpGas"}
  7951:
    status: added
    note: >-
      P256VERIFY at 0x0100. Arrived at EuclidV2 at RIP-7212's 3450 gas and was raised
      to EIP-7951's 6900 at Galileo — so Scroll is one of the few rows where the
      P256VERIFY gas now MATCHES mainnet rather than halving it. Semantics are
      EIP-7951's: 32-byte 0x01 for valid, EMPTY for invalid.
    src: "params/protocol_params.go:P256VerifyGasGalileo, core/vm/contracts.go:p256Verify"
    src_live: "eth_call @ 34765788 -> valid P-256 signature returns 0x...01; one flipped hash byte returns 0x"
  7939:
    status: added
    note: "CLZ (0x1e), an OSAKA opcode, live since Galileo on a chain with no Cancun or Prague fork."
    src: "core/vm/jump_table.go:newGalileoInstructionSet"
    src_live: "eth_call @ 34765788 -> CLZ(1) returns 255 (0xff)"
  2537: {status: removed,
         note: "BLS12-381 precompiles 0x0a-0x12 exist in the source as PrecompiledContractsBLS but are wired into NO active set. See precompiles 0x0a.",
         src: "core/vm/contracts.go:PrecompiledContractsBLS, core/vm/contracts.go:ActivePrecompiles"}
  7928:
    status: unrecorded
    note: "Not established. Nothing in the tree references block access lists or an Amsterdam fork; no timestamp exists to gate one."
  3529:
    status: modified
    note: >-
      London's refund reduction applies, but its SELFDESTRUCT half is dead code:
      enable3529 carries `// SELFDESTRUCT is disabled in Scroll` above a commented-out
      gasSelfdestructEIP3529 assignment. Refund accounting for SELFDESTRUCT can never
      be reached.
    src: "core/vm/eips.go:enable3529"
  1559:
    status: modified
    note: >-
      EIP-1559 is active and the base fee is real, but it is not computed from L2
      congestion alone: the L2 base fee is derived with baseFeeOverhead and
      baseFeeScalar read from the L2SystemConfig predeploy's storage (slots 101 and
      102), i.e. from contract state the sequencer writes. Observed flat at 0x1d4c8
      (120,008 wei) across the sampled range with gasUsedRatio under 3%.
    src: "rollup/rcfg/config.go:L2BaseFeeOverheadSlot, rollup/l2_system_config/abi.go"
    src_live: "eth_feeHistory @ 34765788 -> baseFeePerGas 0x1d4c8 for three consecutive blocks, gasUsedRatio 0.006 / 0.021"

# non_eip_specs: deliberately absent. Scroll publishes no numbered spec series (no
# SIP/RIP/ACP/BEP analogue). Its upgrades are named after mathematicians and specified
# in blog posts and in client code, versioned as release tags rather than as specs, so
# there is nothing to record on the adoption axis.

tx_types:
  envelope:
    status: inherited
    present: "0x00-0x02, 0x04"
    src: derived from the eips map (2930 / 1559 / 4844 / 7702); see those entries
    note: >-
      The EIP-2718 envelope this chain accepts in mainnet shape; no blob transactions
      (EIP-4844). Derived from the eips map (2930/1559/4844/7702); per-type divergences and
      their evidence are on the rows below.
  "0x7e":
    name: L1MessageTx
    status: added
    severity: high
    src: "core/types/transaction.go:L1MessageTxType, core/types/l1_message_tx.go:L1MessageTx"
    fields: [QueueIndex, Gas, To, Value, Data, Sender]
    src_live: "eth_getTransactionByHash 0x9b24c569894dd98c75daba1b2fdc240712cc8e9d1ea4b978fa1ae440e74abbc6 @ 34760253 -> type 0x7e, v/r/s all 0x0, nonce 0x0, gasPrice 0x0, extra JSON fields `sender` and `queueIndex` 0xf3dc8"
    note: >-
      A THIRD, INDEPENDENT CLAIMANT TO 0x7e. OP Stack's deposit transaction and
      Scroll's L1 message transaction are the same type byte, different RLP payloads,
      different field counts, no shared code. The dataset already records 0x7e as "the
      OP family"; it is not. Scroll's payload is
      (QueueIndex, Gas, To, Value, Data, Sender) — six fields, no chain id, no
      signature, no nonce, no gas price, and `To` may not be nil (no contract creation
      from L1). A decoder that sees 0x7e and reaches for OP's DepositTx layout
      mis-parses every L1 message on Scroll.
      Two further traps: the JSON carries non-standard `sender` and `queueIndex` keys,
      and the type is invisible in ordinary traffic — a 50-block census at the probe
      height found 40 legacy and 11 dynamic-fee transactions and ZERO 0x7e, and a
      389-block sweep found none either, so an integration can pass every test and
      still meet this type in production.
  "0x03":
    name: BlobTx
    status: removed
    note: >-
      Decodable but unreachable: the type constant, the RLP shape and the signer
      branch all exist, and nothing ever activates them — there is no Cancun fork to
      gate on. Distinct from Linea's blob removal, which is an explicit plugin
      rejection with a named error; here it is simply never switched on.
    src: "core/types/transaction.go:BlobTxType, core/types/blob_tx.go:BlobTx"
  "0x04":
    name: SetCodeTx
    status: modified
    note: "Mainnet's EIP-7702 type, admitted from the EuclidV2 fork (later than mainnet); the pool additionally requires a non-empty authorization list, which mainnet does not."
    src: "core/tx_pool.go:eip7702"
  note: >-
    Live set at the probe height is 0x00, 0x01, 0x02, 0x04 and 0x7e. Scroll took its
    byte from the SAME end of the space as everyone else — the 0x7f ceiling — and
    landed on one that was already occupied.

tx_authorization:
  key_binding: derived
  signers_per_tx: 1
  note: >-
    Two schemes, and the second one is the interesting cell. Ordinary Scroll
    transactions are plain secp256k1 with mainnet's derived binding. L1 messages are
    not signed at all: the sender is a FIELD, the signature values are hard-coded to
    zero, and the signing hash does not exist — londonSigner.Hash PANICS with "l1
    message tx cannot be signed and do not have a signing hash". Authority comes from
    the L1MessageQueue contract on Ethereum, replayed into the L2 block by the
    sequencer, so `key_binding` for that path is `declared` and there is no precompile
    on Scroll that can check it. signers_per_tx stays 1 because an L1 message has
    exactly one (unverifiable-on-L2) party.
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      src: "core/types/transaction_signing.go:londonSigner, core/vm/contracts.go:ecrecover"
    l1_message_queue:
      status: added
      authorizes: protocol
      precompile: none
      key_binding: declared
      severity: high
      note: >-
        `authorizes: protocol` with `precompile: none` — the pairing SCHEMA.md flags as
        the finding to look for. The client authorises a 0x7e transaction by reading
        `tx.AsL1MessageTx().Sender` and returning it; no cryptography runs on L2 at
        all. An L2 contract handed an L1 message cannot verify that the claimed sender
        authorised it, because the authorising signature was consumed on Ethereum and
        never crosses the bridge. The pool refuses to accept the type from the network
        ("No unauthenticated deposits allowed in the transaction pool"), so the only
        producer is the sequencer's L1 sync service — which makes sequencer honesty,
        not a signature, the thing an L2 contract is trusting. Shape-identical to OP
        Stack's deposit authorization; independently arrived at, on the same type byte.
      src: "core/types/transaction_signing.go:londonSigner, core/types/l1_message_tx.go:setSignatureValues, core/tx_pool.go:validateTx"
      src_live: "eth_getTransactionByHash 0x9b24c569894dd98c75daba1b2fdc240712cc8e9d1ea4b978fa1ae440e74abbc6 @ 34760253 -> v=0x0 r=0x0 s=0x0, sender 0x7885bcbd5cecef1336b5300fb5186a12ddd8c478"
    secp256r1:
      status: added
      authorizes: never
      precompile: "0x0100"
      note: "P256VERIFY is present from EuclidV2 and at mainnet's 6900 gas from Galileo, but a P-256 key cannot authorize a Scroll transaction. The ordinary pairing."
      src: "core/vm/contracts.go:p256Verify"

precompiles:
  base_map:
    status: inherited
    present: "0x01-0x02, 0x04-0x08"
    p256verify: true
    src: core/vm/contracts.go:PrecompiledContractsGalileo
    note: >-
      Shanghai-level base. RIPEMD160 (0x03) and BLAKE2F (0x09) have been tombstoned
      since genesis — a call consumes all forwarded gas and errors. No KZG at 0x0a,
      no EIP-2537 BLS. SHA256 (0x02) and MODEXP (0x05) were tombstoned for the
      chain's first ~5.2M blocks and only later restored. P256VERIFY at 0x0100 is
      an `added` precompile (see the 0x0100 row).
  "0x0000000000000000000000000000000000000003":
    name: RIPEMD160
    status: tombstoned
    severity: high
    src: "core/vm/contracts.go:ripemd160hashDisabled, core/vm/contracts.go:errPrecompileDisabled, core/vm/contracts.go:PrecompiledContractsGalileo"
    src_live: "eth_call @ 34765788 -> error -32000 `sha256, ripemd160, blake2f precompiles temporarily disabled`"
    note: >-
      Disabled since GENESIS (PrecompiledContractsArchimedes, block 0) and still
      disabled at Galileo, ten forks later. `ripemd160hashDisabled` keeps
      ripemd160hash's RequiredGas — so the caller is charged the full RIPEMD160 price
      and then gets an error, and because the error is not ErrExecutionReverted the
      CALL consumes ALL forwarded gas. "temporarily" has now held for the chain's
      entire life. Note the error string still names sha256, which was re-enabled at
      Bernoulli — the message is stale by two years.
  "0x0000000000000000000000000000000000000009":
    name: BLAKE2F
    status: tombstoned
    severity: high
    src: "core/vm/contracts.go:blake2FDisabled, core/vm/contracts.go:PrecompiledContractsGalileo"
    src_live: "eth_call @ 34765788 -> error -32000 `sha256, ripemd160, blake2f precompiles temporarily disabled`"
    note: "Same mechanism and same genesis-to-now lifetime as 0x03. blake2FDisabled.RequiredGas returns 0, so unlike 0x03 the caller is not pre-charged before the failure."
  "0x0000000000000000000000000000000000000002":
    name: SHA256
    status: inherited
    src: "core/vm/contracts.go:PrecompiledContractsBernoulli"
    src_live: "eth_call @ 34765788 -> 0xe3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 (SHA256 of empty input)"
    note: >-
      Recorded although it is now identical to mainnet, because it was TOMBSTONED for
      the first 5,220,340 blocks of the chain (Archimedes -> Bernoulli) and any
      historical replay or archive query below that height must model it as failing.
      A chain's precompile set is a function of height, not just of address.
  "0x0000000000000000000000000000000000000005":
    name: MODEXP
    status: inherited
    src: "core/vm/contracts.go:PrecompiledContractsGalileo, core/vm/contracts.go:errModexpUnsupportedInput"
    src_live: "eth_call @ 34765788 -> 64-byte operands accepted, 3^3 mod 10 returned as 64 bytes"
    note: >-
      Inherited AS OF GALILEO and not before. From genesis to 1765868400 any operand
      wider than 32 bytes was rejected outright — 32x tighter than EIP-7823 and the
      same restriction, at the same width, that zkSync Era still enforces. Scroll's
      version is now gone; zkSync's is not. Below Galileo this address is `modified`.
  "0x0000000000000000000000000000000000000008":
    name: BN256_PAIRING
    status: inherited
    src: "core/vm/contracts.go:bn256PairingIstanbul, core/vm/contracts.go:PrecompiledContractsFeynman"
    note: >-
      Inherited as of FEYNMAN. From genesis to 1755576000 `limitInputLength: true`
      rejected any input longer than 4x192 bytes with errBadPairingInput — a cap on a
      SINGLE CALL's input size, the identical mechanism OP Stack still uses for its
      fault-proof caps, and unlike Linea's per-block work budget. Two of Scroll's
      three prover-driven precompile restrictions have now been lifted; the two hash
      tombstones have not.
  "0x0000000000000000000000000000000000000100":
    name: P256VERIFY
    status: added
    src: "core/vm/contracts.go:p256Verify, params/protocol_params.go:P256VerifyGasGalileo"
    src_live: "eth_call @ 34765788 -> valid signature returns 0x00..01; corrupted hash returns 0x; eth_getCode returns 0x (native, not a predeploy)"
    note: >-
      Gas went 3450 (EuclidV2, RIP-7212's price) -> 6900 (Galileo, EIP-7951's price),
      so Scroll is one of the few rows in this dataset whose 0x0100 now costs exactly
      what mainnet charges. Failure signalling is EIP-7951's empty return, which on
      this chain is INDISTINGUISHABLE from the empty return of an unoccupied address —
      the same silent-failure shape recorded for Hyperliquid and Sei, except here the
      precompile is genuinely present and answering.
  "0x000000000000000000000000000000000000000a":
    name: BLS12_G1ADD (EIP-2537, 0x0a-0x12)
    status: removed
    src: "core/vm/contracts.go:PrecompiledContractsBLS, core/vm/contracts.go:ActivePrecompiles"
    src_live: "eth_call @ 34765788 -> 0x (success, empty output)"
    note: >-
      THE CONTROL CASE FOR THE TOMBSTONE DISTINCTION. All nine EIP-2537 addresses are
      implemented in this client and wired into nothing: ActivePrecompiles never
      returns PrecompiledAddressesBLS because no such list is built. Calling 0x0a at
      the same block as 0x03 SUCCEEDS with empty output, while 0x03 ERRORS — so on one
      chain, at one height, `removed` and `tombstoned` are directly distinguishable by
      a two-line probe. Recorded on 0x0a as the representative of the run.
  note: >-
    ZERO added addresses outside 0x0100, and four same-address divergences, two of
    which are still live. Scroll's whole precompile story is subtraction: it launched
    with three hash precompiles disabled and a 32-byte MODEXP cap because the zkEVM
    circuits could not prove them, then restored them one fork at a time as the
    circuits improved. SHA256 came back at Bernoulli, BN256_PAIRING's input cap at
    Feynman, MODEXP's operand cap at Galileo. RIPEMD160 and BLAKE2F never came back.

system_contracts:
  "0x5300000000000000000000000000000000000002":
    name: L1GasPriceOracle
    status: added
    severity: high
    src: "rollup/rcfg/config.go:L1GasPriceOracleAddress, rollup/rcfg/config.go:GalileoV2L1GasPriceOracleBytecode, consensus/misc/galileoV2.go:applyGalileoV2HardFork"
    src_live: "eth_getCode @ 34765788 -> 3782 bytes, sha256 0b32912d09bc322afbc270c1bdbf8979404e06d49de070804905fc5f105ac07b, byte-identical to rcfg.GalileoV2L1GasPriceOracleBytecode; l1BaseFee() 0x4086d28, overhead() 0x38, scalar() 0x3e95ba80; slots 8/11/12 (isCurie/isFeynman/isGalileo) all 1"
    note: >-
      NOT OP's oracle, and the difference is the address, not the interface. Scroll's
      L1 fee oracle answers `l1BaseFee()` (0x519b4bd3), `overhead()` (0x0c18c162),
      `scalar()` (0xf45e65d8), `getL1Fee(bytes)` (0x49948e0e) and `getL1GasUsed(bytes)`
      (0xde26c4a1) — OP's GasPriceOracle ABI — from 0x53..02 instead of
      0x420000000000000000000000000000000000000F, WHICH IS EMPTY ON SCROLL. So the
      collision here is the mirror image of the ones this dataset usually records:
      same interface at a different address, rather than a different interface at the
      same address. Code written against OP's oracle compiles, the address returns
      success with no data, and the decoded L1 fee is zero.
      The bytecode is also not deployed by anyone — the CLIENT writes it. Curie,
      Feynman and GalileoV2 each call statedb.SetCode with a hard-coded Go byte array
      and seed new storage slots, so three of Scroll's ten forks exist mainly to
      upgrade this one contract, and its code is a client constant rather than a
      deployment artefact.
  "0x5300000000000000000000000000000000000005":
    name: L2TxFeeVault
    status: added
    severity: high
    src: "rollup/rcfg/config.go:ScrollFeeVaultAddress, core/evm.go:NewEVMBlockContext"
    src_live: "eth_call @ 34765788 -> COINBASE returns 0x5300000000000000000000000000000000000005 while the header's miner is 0x0000000000000000000000000000000000000000; balance 0x50926b2231aa187c9"
    note: >-
      This address IS the EVM's coinbase. See opcodes.modified — the divergence is not
      the vault, it is that `block.coinbase` and `eth_getBlockByNumber().miner`
      disagree.
  "0x5300000000000000000000000000000000000000":
    name: L2MessageQueue
    status: added
    src: "rollup/rcfg/config.go:L2MessageQueueAddress, rollup/rcfg/config.go:WithdrawTrieRootSlot"
    src_live: "eth_getCode @ 34765788 -> bytecode present (0x608060405234801561001057600080fd5b50...)"
    note: "Withdrawal (L2->L1) message trie. Its slot 0 is read by the client as the withdraw-trie root, so ordinary contract storage is protocol-visible state."
  "0x0000F90827F1C53a10cb7A02335B175320002935":
    name: HistoryStorage (EIP-2935)
    status: added
    src: "params/protocol_params.go:HistoryStorageAddress, core/genesis.go:HistoryStorageCode"
    src_live: "eth_getCode @ 34765788 -> 0x3373fffffffffffffffffffffffffffffffffffffffe1460465760203603604257... (canonical, 100 bytes)"
    note: "At the canonical mainnet address with the canonical bytecode — the one Prague system contract Scroll has, and it did not drift."
  note: >-
    Scroll's predeploy namespace is 0x53.., not OP's 0x42.., and the two do not
    overlap at all: 0x420000000000000000000000000000000000000F and
    0x4200000000000000000000000000000000000015 are both EMPTY at the probe height.
    That is safer than a collision and more dangerous than an error, because an empty
    account answers every staticcall with success and no data.

system_transactions:
  eip2935_history_write:
    name: "SYSTEM_ADDRESS -> HistoryStorage(parentHash)"
    status: added
    src: "core/state_processor.go:ProcessParentBlockHash"
    note: >-
      Runs before the first transaction of every post-Feynman block, from
      params.SystemAddress with a 30M gas limit, and PANICS the client on error rather
      than skipping. No 4788 counterpart exists — there is no beacon chain.
  fork_bytecode_rewrite:
    name: "L1GasPriceOracle code + storage replacement at Curie / Feynman / GalileoV2"
    status: added
    src: "consensus/misc/forks.go:ApplyForkStateTransitions, consensus/misc/curie.go:applyCurieHardFork"
    severity: high
    note: >-
      A protocol-driven state change with no transaction, no log and no receipt: at
      three named fork boundaries the client overwrites a live contract's bytecode and
      writes new storage slots directly. Nothing in the block or its receipts records
      that the contract changed. An indexer tracking contract upgrades by watching
      events or by diffing code at deployment sites sees nothing at all.

opcodes:
  added:
    - {name: CLZ, opcode: "0x1e", fork: galileo, note: "EIP-7939, an Osaka opcode", src: "core/vm/jump_table.go:newGalileoInstructionSet"}
    - {name: TLOAD, opcode: "0x5c", fork: curie, note: "EIP-1153, a Cancun opcode", src: "core/vm/jump_table.go:newCurieInstructionSet"}
    - {name: TSTORE, opcode: "0x5d", fork: curie, src: "core/vm/jump_table.go:newCurieInstructionSet"}
    - {name: MCOPY, opcode: "0x5e", fork: curie, note: "EIP-5656, a Cancun opcode", src: "core/vm/jump_table.go:newCurieInstructionSet"}
  removed:
    - name: SELFDESTRUCT
      opcode: "0xff"
      severity: high
      src: "core/vm/jump_table.go:SELFDESTRUCT"
      src_live: "eth_call @ 34765788 -> `invalid opcode: SELFDESTRUCT`"
      note: >-
        Set to nil in the jump table with the comment "SELFDESTRUCT has the same
        behavior as INVALID". Not EIP-6780's restriction — total removal, since
        genesis. The only chain in this dataset that removes a mainnet opcode outright
        rather than repricing or restricting it.
    - {name: BLOBHASH, opcode: "0x49", note: "never added (no 4844)", src_live: "eth_call @ 34765788 -> opcode 0x49 not defined"}
    - {name: BLOBBASEFEE, opcode: "0x4a", note: "never added (no 4844)", src_live: "eth_call @ 34765788 -> opcode 0x4a not defined"}
  modified:
    - name: COINBASE
      opcode: "0x41"
      severity: high
      src: "core/vm/instructions.go:opCoinbase, core/vm/evm.go:FeeRecipient, core/evm.go:NewEVMBlockContext"
      src_live: "eth_call @ 34765788 -> COINBASE = 0x5300000000000000000000000000000000000005; eth_getBlockByNumber @ 34765788 -> miner = 0x0000000000000000000000000000000000000000"
      note: >-
        SILENT AND CHEAP TO MISS. NewEVMBlockContext sets the block context's Coinbase
        to the FEE VAULT ADDRESS whenever FeeVaultEnabled(), never consulting
        Engine.Author(header). So `block.coinbase` inside the EVM is
        0x5300000000000000000000000000000000000005, the header's `miner` field is the
        zero address, and the sequencer that actually produced the block is neither of
        them — it is recovered from the header's block signature. Three different
        answers to "who mined this block", none of which agree, no error anywhere.
        EIP-3651 then warms the fee vault instead of the miner, so the gas cost of
        touching `block.coinbase` also differs from mainnet.
    - name: BLOCKHASH
      opcode: "0x40"
      fork: feynman
      src: "core/vm/instructions.go:opBlockhashPostFeynman"
      note: "Reads the EIP-2935 history contract's storage ring instead of walking headers; the 256-block window is unchanged, so behaviour matches mainnet Prague."

fee_model:
  metering: gas
  fee_market: "EIP-1559 on L2, with baseFeeOverhead/baseFeeScalar read from a predeploy's storage"
  extra_components:
    - name: L1 data fee
      src: "rollup/fees/rollup_fee.go:CalculateL1DataFee"
      note: >-
        Charged in addition to gas x gasPrice and paid to the fee vault, computed from
        the L1GasPriceOracle's storage. Four generations of formula coexist in the
        client — calculateEncodedL1DataFee, ...Curie, ...Feynman, ...Galileo — selected
        by which isXxx flag the oracle's own storage has set, so the fee formula is
        chosen by CONTRACT STATE rather than by the chain config.
    - name: compression penalty
      src: "rollup/rcfg/config.go:PenaltyThresholdSlot"
      note: >-
        From Feynman the L1 fee includes a penalty term keyed on how well the
        transaction's calldata compresses (penaltyThreshold / penaltyFactor, slots 9
        and 10). Two transactions with identical length and identical gas can pay
        different L1 fees because one compresses worse.
    - name: L1 messages are free
      src: "rollup/fees/rollup_fee.go:EstimateL1DataFeeForMessage"
      note: "IsL1MessageTx() short-circuits to zero; the receipt's l1Fee is 0x0 and no refund is issued (TransitionDb returns early for L1 messages)."
  note: >-
    `eth_estimateGas` covers the L2 gas only. The receipt carries an `l1Fee` field,
    but — unlike Celo's CIP-66 base fee — it lives in storedReceiptRLP and NOT in
    receiptRLP, so receiptsRoot is standard and the extra field is a database and
    JSON-RPC extension, not a consensus one.
  src: "core/state_transition.go:TransitionDb, core/types/receipt.go:storedReceiptRLP"

header_fields:
  added:
    - name: BlockSignature
      severity: high
      src: "core/types/block.go:PrepareForNetwork, consensus/system_contract/consensus.go:ecrecover"
      src_live: "eth_getBlockByNumber @ 34765788 -> extraData 0x, miner 0x00..00, difficulty 0x1"
      note: >-
        From EuclidV2 the sequencer's 65-byte seal is a header field of its own. It is
        stored in the database, but on the p2p wire it travels INSIDE extraData
        (PrepareForNetwork moves it there and back), and over JSON-RPC it is dropped
        entirely — hence the empty extraData observed live. Header.Hash() explicitly
        strips BlockSignature and blanks Extra before hashing, SO THE BLOCK HASH DOES
        NOT COMMIT TO THE SEAL. Two consequences: the same header has two different
        byte encodings depending on which side of the network boundary you are on, and
        the signature that authorises the block is outside the hash that identifies it.
        Another header field carrying something other than its Ethereum meaning (see
        findings.yaml:fields-outlive-features), and it lands on the same field Linea
        repurposed.
    - name: IsEuclidV2
      src: "core/types/block.go:PrepareFromNetwork"
      note: "A boolean stored beside the header telling the decoder which of the two encodings it is holding. Not hashed, not transmitted, not exposed."
  removed:
    - {name: withdrawalsRoot, note: "declared optional in the struct for SDK compatibility; never populated", src: "core/types/block.go:WithdrawalsHash"}
    - {name: blobGasUsed, note: "same", src: "core/types/block.go:BlobGasUsed"}
    - {name: excessBlobGas, note: "same", src: "core/types/block.go:ExcessBlobGas"}
    - {name: parentBeaconBlockRoot, note: "same", src: "core/types/block.go:ParentBeaconRoot"}
  modified:
    - name: extraData
      src: "core/types/block.go:PrepareForNetwork"
      src_live: "eth_getBlockByNumber @ 34765788 -> 0x"
      note: >-
        Empty over RPC, 65 bytes of secp256k1 seal on the wire. Pre-EuclidV2 it was
        Clique's extraData and held the seal in the normal Clique layout; the
        system_contract engine rejects any non-empty Extra (errInvalidExtra).
    - name: miner
      src_live: "eth_getBlockByNumber @ 34765788 -> 0x0000000000000000000000000000000000000000"
      note: "Always zero (errInvalidCoinbase rejects anything else). The real producer is recovered from the seal; the EVM's COINBASE is the fee vault. See opcodes.modified."
    - name: difficulty
      src_live: "eth_getBlockByNumber @ 34765788 -> 0x1"
      note: "Pinned to 1 (errInvalidDifficulty), and totalDifficulty is therefore a block counter."
  src: "consensus/system_contract/consensus.go:verifyHeader"

gotchas:
  - >-
    A DISABLED PRECOMPILE AND AN ABSENT ONE FAIL DIFFERENTLY, AND SCROLL SHOWS BOTH AT
    ONE HEIGHT. Calling 0x03 (RIPEMD160) or 0x09 (BLAKE2F) ERRORS and burns all
    forwarded gas; calling 0x0a (BLS12-381 G1ADD, simply absent) SUCCEEDS with empty
    output. Same block, same node. Any survey that tests "does this address return
    data" classifies both as missing and is wrong about one of them.
  - >-
    SELFDESTRUCT IS NOT RESTRICTED, IT IS GONE. The opcode is nil in the jump table and
    aborts as INVALID. Contracts whose emergency-withdraw or self-upgrade path ends in
    SELFDESTRUCT are unrecoverable on Scroll, and no EIP-6780 reasoning applies.
  - >-
    `block.coinbase` IS NOT THE MINER. Inside the EVM it is the fee vault
    0x5300000000000000000000000000000000000005; the header's `miner` is the zero
    address; the actual sequencer is recovered from a signature that RPC never shows
    you. A contract paying the block producer via `block.coinbase` pays the fee vault.
  - >-
    THE L1-FEE ORACLE HAS OP'S ABI AT A DIFFERENT ADDRESS. `getL1Fee(bytes)`,
    `l1BaseFee()`, `overhead()`, `scalar()` and `getL1GasUsed(bytes)` all live at
    0x5300000000000000000000000000000000000002. OP's
    0x420000000000000000000000000000000000000F is an EMPTY ACCOUNT here, so
    OP-derived code calls it, gets success and no data, and reads an L1 fee of zero.
  - >-
    TYPE BYTE 0x7e IS NOT OP'S. Scroll's L1MessageTx shares the byte and shares nothing
    else: six fields, no signature, no nonce, no chain id, no gas price, plus
    non-standard `sender` and `queueIndex` JSON keys. It is also RARE — zero
    occurrences in a 389-block sweep — so a decoder can be wrong for months before it
    is wrong in production.
  - >-
    THE CLIENT REWRITES A LIVE CONTRACT'S BYTECODE AT THREE FORKS. Curie, Feynman and
    GalileoV2 each call statedb.SetCode on the L1GasPriceOracle with a byte array
    hard-coded in Go, and seed new storage slots. No transaction, no log, no receipt.
    Contract-upgrade monitoring that watches events sees none of it.
  - >-
    WHETHER THE STATE ROOT IS CHECKED DEPENDS ON A NODE-LOCAL CLI FLAG.
    `shouldValidateStateRoot := config.Scroll.UseZktrie != config.IsEuclid(header.Time)`
    and `UseZktrie` is set from `!--scroll-mpt` at startup. Post-Euclid a node started
    WITHOUT `--scroll-mpt` (the built-in default for `--scroll`) skips the state-root
    comparison entirely; one started WITH it performs it. This was the mechanism that
    let zkTrie and MPT nodes coexist across the Euclid migration, and it is still the
    code at this tag. Which flag production nodes actually run is `unrecorded`.
  - >-
    THE ZK-CIRCUIT LIMITER IS RETIRED, ITS SCARS ARE NOT. `AsyncChecker.Check` returns
    immediately for any post-Euclid block ("Euclid blocks use MPT and CCC doesn't
    support them"), so the 950,000-row per-sub-circuit budget in
    types.RowConsumptionLimit no longer rejects anything. The precompile tombstones,
    the 100-transactions-per-block producer cap and the 120 KB payload cap it
    motivated are all still enforced.
  - >-
    THE FORK NAME TELLS YOU NOTHING. Scroll has TSTORE, MCOPY, EIP-7702, EIP-7623,
    EIP-2935, EIP-7823, EIP-7883, EIP-7951 and CLZ — Cancun, Prague and Osaka features
    — and no Cancun, Prague or Osaka fork field anywhere in its chain config. It also
    lacks EIP-4895, which mainnet shipped in Shanghai, the fork Scroll does claim.

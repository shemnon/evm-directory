schema_version: 2

chain:
  name: OP Stack
  slug: op-stack
  chain_id: null
  role: stack
  live: true
  note: >-
    Not a chain. The shared codebase behind Optimism, Base, World Chain, Zora and
    others. Descendant chains declare only their own deltas on top of this file.

lineage:
  upstream: ethereum
  ancestry: [ethereum]
  fork_of: go-ethereum
  sync_point: >-
    op-geth v1.101702.2 tracks go-ethereum through Osaka. Header struct is identical
    to geth v1.17.5 except that op-geth lacks EIP-7928 BlockAccessListHash (an
    unshipped Amsterdam field) and repurposes BlobGasUsed. Rebase, not divergence.

client:
  name: op-geth
  repo: https://github.com/ethereum-optimism/op-geth
  version: v1.101702.2
  commit: e8800cffe53d459cde8a07c8e8f1de9d86e79e07
  language: go
  note: >-
    The EL only. Predeploy bytecode and per-chain fork schedules live in separate
    repos, both now cloned under this row and cited by descendants.
  companion_repos:
  - {name: optimism, repo: "https://github.com/ethereum-optimism/optimism",
     version: op-contracts/v7.0.0, commit: a7c88c8d636ceb9944ea0edaf7d033da258778ab,
     provides: "predeploy definitions (Predeploys.sol)"}
  - {name: superchain-registry, repo: "https://github.com/ethereum-optimism/superchain-registry",
     commit: bb104b09fcd60fc01c8f8daf0f534aee88ff26de,
     provides: "per-chain fork activation timestamps"}

consensus:
  engine: derived from L1 (single sequencer + fault proofs)
  finality: inherits L1 finality after challenge window
  block_time: 2s (typical)

baseline_fork: osaka

forks:
  src: params/config.go
  mapping_src: params/config.go:1687-1694
  note: >-
    OP fork times are independent config fields, but CheckConfigForkOrder ENFORCES
    equality with their Ethereum counterparts — a config that violates this is
    rejected at startup. This makes the fork mapping a verified fact, not a claim.
  timeline:
  - {name: bedrock,  mainnet_equivalent: null,     note: OP genesis of the current architecture}
  - {name: regolith, mainnet_equivalent: null}
  - {name: canyon,   mainnet_equivalent: shanghai, enforced: "ShanghaiTime == CanyonTime"}
  - {name: ecotone,  mainnet_equivalent: cancun,   enforced: "CancunTime == EcotoneTime"}
  - {name: fjord,    mainnet_equivalent: null,     note: introduced P256VERIFY at 0x0100 as RIP-7212}
  - {name: granite,  mainnet_equivalent: null,     note: capped BN256 pairing input}
  - {name: holocene, mainnet_equivalent: null}
  - {name: isthmus,  mainnet_equivalent: prague,   enforced: "PragueTime == IsthmusTime"}
  - {name: jovian,   mainnet_equivalent: null,     note: capped BLS12-381 inputs; repurposed blobGasUsed for DA}
  - {name: karst,    mainnet_equivalent: null,     note: newest predicate present in this tree}
  - {name: interop,  mainnet_equivalent: null,     note: cross-L2 inbox at 0x42..22}

eips:
  1559:
    status: modified
    note: >-
      1559 applies to the L2 base fee, but total user cost = L2 execution fee +
      L1 data fee + (from Isthmus) operator fee. Fee estimation that models only
      1559 underestimates cost on every OP chain.
    src: core/types/rollup_cost.go
  4844:
    status: removed
    note: >-
      No blob market on L2. Blobs are an L1 DA mechanism for the batcher; there is
      no user-facing BlobTx. The blobGasUsed header field is repurposed (see
      header_fields), which is strictly worse than absence for anyone parsing it.
    src: "core/txpool/validation.go:ValidateTransaction"
  7702:
    status: inherited
    note: >-
      SetCodeTxType 0x04 is present in core/types/transaction.go, and
      CheckConfigForkOrder enforces PragueTime == IsthmusTime, so Prague's EIPs
      apply once Isthmus activates.
    src: core/types/transaction.go:53, params/config.go:1693
  7951:
    status: modified
    note: >-
      P256VERIFY exists at the same address as mainnet but costs 3450 gas
      (P256VerifyGasFjord, the RIP-7212 value) instead of mainnet's 6900
      (P256VerifyGas). The OP fork branch is checked BEFORE the Osaka branch in
      activePrecompiledContracts, so reaching Osaka does NOT restore mainnet
      pricing. Shipped at Fjord, years before mainnet's Osaka.
    src: params/protocol_params.go:183-184, core/vm/contracts.go:304-316
  7823:
    status: removed
    note: >-
      MODEXP upper bounds. Jovian's precompile map builds bigModExp{eip2565: true}
      with eip7823 false, vs mainnet Osaka's eip7823 true. OP accepts modexp inputs
      that mainnet rejects.
    src: core/vm/contracts.go:PrecompiledContractsJovian
  7883:
    status: removed
    note: >-
      MODEXP gas increase. Same cause as 7823 — MODEXP is CHEAPER on OP Stack than
      on mainnet Osaka. A gas-bound loop calibrated on mainnet behaves differently.
    src: core/vm/contracts.go:PrecompiledContractsJovian
  7928:
    status: removed
    note: BlockAccessListHash header field absent; unshipped on mainnet too, so not yet a divergence.
    src: "core/types/block.go:Header"

non_eip_specs:
  - {id: RIP-7212, name: secp256r1 precompile, adoption: adopted, fork: fjord,
     note: "same address as EIP-7951, different gas — see eips.7951"}

tx_types:
  "0x7d":
    name: PostExecTx
    status: unrecorded
    note: >-
      A SECOND UNSIGNED PATH, and it is not established whether it is reachable. The
      type is fully implemented in the client — marshalling, receipt handling, and a
      signer that returns the ZERO ADDRESS rather than recovering one, with sigHash()
      panicking exactly as DepositTx's does — but the tree contains no producer and no
      fork gate, so nothing here shows it activating on any OP Stack chain. Recorded
      rather than omitted because an omitted entry would fall back to `inherited` and
      silently assert mainnet equivalence for a type mainnet does not have.
    src: "core/types/post_exec_tx.go:PostExecTxType"

  "0x7e":
    name: DepositTx
    status: added
    spec: OP Stack Bedrock
    src: core/types/deposit_tx.go:27
    fields: [SourceHash, From, To, Mint, Value, Gas, IsSystemTransaction, Data]
    note: >-
      Unsigned and unpriced. No nonce, no signature (v/r/s), no gasPrice or
      gasTipCap. Inserted by the derivation pipeline from L1 events, not submitted
      by users. `Mint` creates native ETH from nothing — the only tx type in this
      dataset that increases total supply. Any tool assuming "every tx has a
      recoverable sender signature" breaks here.
  note: >-
    0x7e is the top of the legal typed-envelope range (0x00-0x7f), chosen to
    maximise distance from mainnet's allocations growing upward from 0x04.

tx_authorization:
  key_binding: derived
  signers_per_tx: 1
  note: >-
    For USER transactions there is NO delta from mainnet. op-geth's signer chain is
    geth's, `recoverPlain` is the only recovery path in the tree, and the one OP
    addition to it — NewIsthmusSigner — differs from geth's Prague signer solely by
    REMOVING BlobTxType from the accepted set. It changes which envelopes may carry a
    signature, never how a signature is checked or what an address means. The delta on
    this axis is the deposit path below: transactions the protocol accepts as
    authorized while carrying no signature at all.
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      src: "core/types/transaction_signing.go:recoverPlain, core/types/transaction_signing.go:NewIsthmusSigner"
    unsigned:
      status: added
      authorizes: protocol
      precompile: none
      signers_per_tx: 0
      severity: high
      note: >-
        NOT A SIGNATURE SCHEME. The entry exists because every other row on this axis
        implies "an accepted transaction has a signer", and on the OP Stack that is
        false. A 0x7e deposit has no v/r/s — rawSignatureValues returns 0,0,0 — and
        cannot acquire one: sigHash PANICS with "deposit cannot be signed". The signer
        short-circuits on the type byte before any cryptography and returns the
        envelope's own `From` field verbatim, so the sender is READ OUT OF THE
        TRANSACTION, not recovered from it. This is the one place where the row's
        `key_binding: derived` does not hold, and `signers_per_tx: 0` is recorded on
        this path for the same reason.

        What authorizes it instead is construction by the derivation pipeline, and the
        client says so in as many words: the txpool rejects every deposit with the
        comment "No unauthenticated deposits allowed in the transaction pool ... as the
        external engine-API user authenticates deposits." A deposit can therefore only
        enter through the authenticated engine API, never the public mempool. For USER
        deposits op-node scans L1 receipts for the portal's TransactionDeposited logs
        (UserDeposits) and the portal sets from = msg.sender, aliased by
        applyL1ToL2Alias when the L1 caller is a contract — so those are ultimately
        backed by an L1 secp256k1 signature one layer down. But the pipeline also
        SYNTHESIZES deposits with no L1 event behind them at all: the L1-attributes
        transaction from 0xdead...0001, and the network-upgrade transactions from
        0x4210000000000000000000000000000000000000 and from the ZERO ADDRESS. Nobody
        holds a key for those senders. Those transactions are authorized by protocol
        construction and by nothing else.

        DELIBERATELY NOT the schema's "authorizes: protocol + precompile: none"
        finding. That finding is about a chain accepting SIGNATURES its own contracts
        cannot verify. Here there is no signature, so there is nothing a precompile
        could have been paired with; `precompile: none` records an absence of subject
        matter, not an unpaired verifier. The integrator hazard is the mirror image
        and just as sharp: ecrecover over a 0x7e envelope returns garbage rather than
        failing, because the fields it would read are zero.

        A second unsigned path exists in the same tree: PostExecTxType 0x7D, whose
        signer branch returns the ZERO ADDRESS rather than a stored From. Its sigHash
        also panics. This client contains the type, its marshalling and its receipt
        handling, but no producer and no fork gate, so whether 0x7D is reachable on any
        live OP Stack chain is `unrecorded` here.
      src: "core/types/deposit_tx.go:rawSignatureValues, core/types/deposit_tx.go:sigHash, core/types/transaction_signing.go:DepositTxType, core/types/post_exec_tx.go:PostExecTxType, core/txpool/validation.go:ValidateTransaction, optimism/op-node/rollup/derive/deposits.go:UserDeposits, optimism/op-node/rollup/derive/ecotone_upgrade_transactions.go:L1BlockDeployerAddress, optimism/op-node/rollup/derive/l1_block_info.go:L1InfoDepositerAddress, optimism/packages/contracts-bedrock/src/L1/OptimismPortal2.sol:depositTransaction, optimism/packages/contracts-bedrock/src/vendor/AddressAliasHelper.sol:applyL1ToL2Alias"
precompiles:
  # verified: core/vm/contracts.go:PrecompiledContractsJovian (newest active set)
  "0x05":
    name: MODEXP
    status: modified
    note: "no EIP-7823 bounds, no EIP-7883 repricing — cheaper and more permissive than mainnet Osaka"
    src: "core/vm/contracts.go:PrecompiledContractsJovian"
  "0x08":
    name: BN256_PAIRING
    status: modified
    note: >-
      input capped at 81984 bytes / 427 pairs (Bn256PairingMaxInputSizeJovian);
      Granite capped it at 112687 first. Mainnet has NO cap. Reverts with
      errBadPairingInputSize where mainnet succeeds.
    src: params/protocol_params.go:194
  "0x0c":
    name: BLS12_G1MSM
    status: modified
    note: "input capped at 288960 bytes / 1806 pairs; mainnet uncapped"
    src: params/protocol_params.go:195
  "0x0e":
    name: BLS12_G2MSM
    status: modified
    note: "input capped at 278784 bytes / 968 pairs; mainnet uncapped"
    src: params/protocol_params.go:196
  "0x0f":
    name: BLS12_PAIRING
    status: modified
    note: "input capped at 156672 bytes / 408 pairs; mainnet uncapped"
    src: params/protocol_params.go:197
  "0x0100":
    name: P256VERIFY
    status: modified
    note: "3450 gas vs mainnet's 6900; present since Fjord, long before mainnet Osaka"
    src: params/protocol_params.go:183-184
  note: >-
    Zero added addresses. Every OP Stack precompile divergence is a SEMANTIC change
    at a mainnet address — the hardest kind to detect, because address enumeration
    finds nothing. The four input caps exist so accelerated precompiles stay under
    the fault-proof VM's 16M gas limit (params/protocol_params.go:190).


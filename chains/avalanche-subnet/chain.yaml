schema_version: 2

chain:
  name: Avalanche subnet-evm (L1s / Subnets)
  slug: avalanche-subnet
  chain_id: null
  role: template
  live: true
  note: >-
    Not a single chain — a CHAIN TEMPLATE. Every Avalanche L1/Subnet instantiates it
    with its own chain ID and its own genesis config. Crucially, its custom
    precompiles are OPT-IN per deployment, so no two subnet-evm chains necessarily
    share an EVM. Facts here describe what a subnet-evm chain MAY enable, not what
    any given one does.

lineage:
  upstream: ethereum
  ancestry: [ethereum]
  fork_of: go-ethereum (via libevm)
  sibling: avalanche-c
  note: >-
    Sibling of coreth, not a descendant. Both consume ava-labs/libevm and share the
    RulesExtra hook architecture, the Durango/Etna fork mapping and the 0x0200..
    address range — but their precompile sets differ, so they are separate rows.

client:
  name: subnet-evm
  repo: https://github.com/ava-labs/subnet-evm
  version: v0.8.0
  commit: 44b20d219471a0e08bd163b7466e3d8620ff45f2
  language: go

consensus:
  engine: Snowman++ (per-L1 validator set)
  block_time: configurable

baseline_fork: cancun

forks:
  src: params/extras/network_upgrades.go, params/config_extra.go:75-82
  note: >-
    Same mapping as the C-Chain: ShanghaiTime = durango, CancunTime = etna, and NO
    PragueTime or OsakaTime. Cancun-equivalent.
  timeline:
  - {name: subnet_evm, mainnet_equivalent: null, note: template genesis fork}
  - {name: durango, mainnet_equivalent: shanghai, enforced: "ShanghaiTime = durango"}
  - {name: etna,    mainnet_equivalent: cancun,   enforced: "CancunTime = etna"}
  - {name: fortuna, mainnet_equivalent: null}
  - {name: granite, mainnet_equivalent: null, note: "added P256VERIFY at 0x0100"}

eips:
  2537: {status: removed, note: "no Prague — BLS12-381 0x0b-0x11 unavailable", src: "params/config_extra.go:SetEthUpgrades"}
  7702: {status: removed, note: "no Prague — tx type 0x04 does not exist", src: "params/config_extra.go:SetEthUpgrades"}
  4844: {status: removed, note: "no blob market on subnets",
         src: "plugin/evm/wrapped_block.go:errBlobsNotEnabled"}
  7951:
    status: modified
    note: "P256VERIFY at 0x0100 via Granite, not Osaka — same out-of-order adoption as the C-Chain"
    src: params/hooks_libevm.go:35,68-70

non_eip_specs:
  - {id: Avalanche Warp Messaging, name: cross-L1 messaging, adoption: optional,
     src: "precompile/contracts/warp/module.go:23"}

tx_types:
  "0x04": {name: SetCodeTx, status: removed, note: "EIP-7702 not adopted", src: "params/config_extra.go:SetEthUpgrades"}
  note: "0x00-0x03 from libevm; no subnet-specific envelope types"

tx_authorization:
  key_binding: derived
  signers_per_tx: 1
  note: >-
    A TEMPLATE ROW, and this is the axis where it is LESS variable than expected.
    Nothing in subnet-evm's per-deployment configuration changes what can sign a
    transaction: no genesis key selects a signature scheme, no optional precompile adds
    one, and every deployment recovers senders through libevm's types.Sender exactly as
    mainnet does. Compare Tron, where a node-config key really does swap the curve.

    What IS per-deployment is WHO may transact, not WHAT may sign. If a deployment
    enables TxAllowList (genesis key "txAllowListConfig"), state_transition rejects a
    transaction whose already-recovered msg.From is not allowlisted, with
    ErrSenderAddressNotAllowListed. That narrows the set of accepted senders; it does
    not add or remove a signature scheme, and the transaction is still authorized by a
    secp256k1 signature over the standard digest. It is recorded on the secp256k1 entry
    rather than as a scheme of its own, because an allowlist is an authorization
    RESTRICTION, not an authorization METHOD.

    Unlike its sibling the C-Chain, subnet-evm has NO atomic import/export transactions
    and therefore no UTXO credential path — there is no plugin/evm/atomic tree here.
    Warp's BLS12-381 is present but is consensus signing; see that entry.
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      note: >-
        The 0x01-0x11 implementations come from ava-labs/libevm, outside this clone, so
        the citation is subnet-evm's call site. A deployment with TxAllowList enabled
        additionally requires the recovered sender to be allowlisted — a filter applied
        AFTER recovery, in the same place a nonce or balance check happens.
      src: "core/state_transition.go:TransactionToMessage, core/state_transition.go:ErrSenderAddressNotAllowListed"
    secp256r1:
      status: inherited
      authorizes: never
      precompile: "0x0100"
      note: >-
        P256VERIFY, present from Granite for every deployment (it is a fork feature, not
        one of the opt-in 0x0200.. precompiles). A tool for contracts; a P-256 key
        cannot authorize a transaction on any subnet-evm chain.
      src: "params/hooks_libevm.go:P256VerifyAddress"
    bls12_381:
      status: added
      authorizes: never
      precompile: "0x0200000000000000000000000000000000000005"
      availability: optional
      activation_condition: genesis key "warpConfig"
      note: >-
        WARP IS CONSENSUS SIGNING. The aggregated BLS signature attests that a
        source-L1's validator set signed a MESSAGE; it never authorizes a transaction on
        the receiving chain, and a Warp message has no sender account, nonce or fee. As
        on the C-Chain the verification happens in Config.VerifyPredicate, a block
        predicate evaluated outside EVM execution, and the precompile only reads the
        result — so this is not a general-purpose BLS verifier a contract can point at
        arbitrary signatures.
      src: "precompile/contracts/warp/config.go:VerifyPredicate, precompile/contracts/warp/module.go"

precompiles:
  # verified: precompile/contracts/*/module.go — ALL OPT-IN via genesis config key
  "0x05":
    name: MODEXP
    status: modified
    note: "Cancun-level (eip2565 only) — no EIP-7823 bounds, no EIP-7883 repricing, because Osaka was never adopted"
    src: "params/config_extra.go:SetEthUpgrades"
  "0x0b": {name: BLS12_G1ADD, status: removed, note: "EIP-2537 absent — no Prague", src: "params/config_extra.go:SetEthUpgrades"}
  "0x0c": {name: BLS12_G1MSM, status: removed, note: "EIP-2537 absent — no Prague", src: "params/config_extra.go:SetEthUpgrades"}
  "0x0d": {name: BLS12_G2ADD, status: removed, note: "EIP-2537 absent — no Prague", src: "params/config_extra.go:SetEthUpgrades"}
  "0x0e": {name: BLS12_G2MSM, status: removed, note: "EIP-2537 absent — no Prague", src: "params/config_extra.go:SetEthUpgrades"}
  "0x0f": {name: BLS12_PAIRING, status: removed, note: "EIP-2537 absent — no Prague", src: "params/config_extra.go:SetEthUpgrades"}
  "0x10": {name: BLS12_MAP_FP_TO_G1, status: removed, note: "EIP-2537 absent — no Prague", src: "params/config_extra.go:SetEthUpgrades"}
  "0x11": {name: BLS12_MAP_FP2_TO_G2, status: removed, note: "EIP-2537 absent — no Prague", src: "params/config_extra.go:SetEthUpgrades"}
  "0x0200000000000000000000000000000000000000":
    name: ContractDeployerAllowList
    status: added
    availability: optional
    activation_condition: \'genesis key "contractDeployerAllowListConfig"\'
    src: precompile/contracts/deployerallowlist/module.go:22
    note: >-
      Gates CREATE/CREATE2 on an on-chain allowlist keyed by tx.ORIGIN (not
      msg.sender). Unauthorised deploys fail with gas set to 0.
  "0x0200000000000000000000000000000000000001":
    name: ContractNativeMinter
    status: added
    availability: optional
    activation_condition: \'genesis key "contractNativeMinterConfig"\'
    src: precompile/contracts/nativeminter/module.go:24
    note: >-
      Allowlisted callers mint native coin directly via stateDB.AddBalance
      (contract.go:125). Native token supply is mutable by permissioned accounts —
      no mainnet analogue at all.
  "0x0200000000000000000000000000000000000002":
    name: TxAllowList
    status: added
    availability: optional
    activation_condition: \'genesis key "txAllowListConfig"\'
    src: precompile/contracts/txallowlist/module.go:22
    note: "gates transaction submission on msg.From, enforced in core/state_transition.go:361"
  "0x0200000000000000000000000000000000000003":
    name: FeeManager
    status: added
    availability: optional
    activation_condition: \'genesis key "feeManagerConfig"\'
    src: precompile/contracts/feemanager/module.go:22
    note: "allowlisted callers rewrite the chain's fee config at runtime"
  "0x0200000000000000000000000000000000000004":
    name: RewardManager
    status: added
    availability: optional
    activation_condition: \'genesis key "rewardManagerConfig"\'
    src: precompile/contracts/rewardmanager/module.go:22
    note: "redirects or burns block fee rewards"
  "0x0200000000000000000000000000000000000005":
    name: Warp Messenger
    status: added
    availability: optional
    activation_condition: genesis key
    src: precompile/contracts/warp/module.go:23
    note: "same address as the C-Chain's warp precompile"
  "0x0100":
    name: P256VERIFY
    status: modified
    fork: granite
    src: params/hooks_libevm.go:68-70
  note: >-
    Contiguous 0x0200..00-05. The C-Chain's tombstoned 0x0100..00-02 native-asset
    precompiles do NOT exist here — subnet-evm never carried that legacy, so it has
    a cleaner map than its sibling despite being the more configurable of the two.

system_contracts:
  note: none — no Ethereum system contracts (no Prague, no beacon chain)

opcodes:
  added: []
  removed: []
  modified: []
  note: >-
    No opcode changes, but see gotchas: allowlist hooks alter when CREATE and
    transaction execution SUCCEED, which is a state-transition change reached
    through hooks rather than the jump table.

fee_model:
  metering: gas
  fee_market: ACP-176 style dynamic fee, plus optional runtime reconfiguration
  note: >-
    With FeeManager enabled the fee schedule itself is mutable by allowlisted
    accounts mid-chain — the fee model is not a fixed property of the chain.

header_fields:
  added: []
  removed: []
  modified: []

gotchas:
  - >-
    subnet-evm is a TEMPLATE, not a chain. Its precompiles are opt-in per deployment
    via genesis config keys, so two subnet-evm chains can present entirely different
    EVMs. "Runs subnet-evm" tells you almost nothing about a chain's actual surface —
    the genesis config is the real specification.
  - >-
    The EVM can be PERMISSIONED. ContractDeployerAllowList gates CREATE on tx.origin;
    TxAllowList gates transaction execution on the sender. Neither has a mainnet
    analogue, and both change whether an operation succeeds rather than what it costs.
  - >-
    Deployer permission keys on tx.ORIGIN, not msg.sender — a factory contract's
    ability to deploy depends on who initiated the transaction, not who called it.
  - >-
    ContractNativeMinter lets allowlisted accounts mint native coin arbitrarily.
    Along with OP Stack's depositTx Mint field, this is one of two mechanisms in the
    dataset that increase native supply outside block rewards.
  - >-
    Like the C-Chain: no Prague, no EIP-7702, no BLS12-381 — but P256VERIFY at 0x0100
    via Granite.

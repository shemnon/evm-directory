gotchas: >-
  ONE TRANSFER, TWO `Transfer` EVENTS, TWO DIFFERENT AMOUNTS. A single
  `transfer(to, 92670043)` on the native USDC contract produced two logs in the same
  receipt: one from 0xffff…fffe (the EIP-7708 system address) for
  92,670,043,000,000,000,000, and one from 0x3600…0000 (the ERC-20) for 92,670,043.
  The same movement, logged twice, in units 10^12 apart. An indexer that subscribes to
  the `Transfer` topic without filtering by address will double-count every such
  transfer AND mis-scale one of the two copies. This is measured, not inferred:
  transaction 0xfec9562d882eff1d… at block 29537465.

  THE ERC-20 BALANCE IS A FLOOR OF THE REAL ONE. `USDC.balanceOf(a)` is
  `eth_getBalance(a) / 10^12`, integer division, so up to 10^12 - 1 wei of a user's
  balance is invisible through the token interface. `transfer`ing the full ERC-20
  balance does not empty the account. Reconciliation that treats the ERC-20 view as
  authoritative will find unexplained dust forever.

  EVERY NATIVE MOVEMENT IS LOGGED, EXCEPT SELF-TRANSFERS. SELFDESTRUCT, the
  NativeCoinAuthority paths and value-bearing calls all emit the EIP-7708 log. So indexing
  native movement from logs can work here, which it cannot on Ethereum today, provided
  the indexer filters on the system address.

  A BLOCKLISTED ADDRESS FAILS BEFORE EXECUTION, AND A BLOCKLISTED VALIDATOR
  CANNOT BUILD BLOCKS. `check_blocklist` runs pre-execution on the caller always
  and on the recipient when value is non-zero; the block executor separately
  rejects any block whose beneficiary is blocklisted. Blocklist SLOADs are
  UNMETERED — they cost the transaction no gas, which is a deliberate choice worth
  knowing when modelling worst-case block validation cost.

  THERE IS A SECOND BLOCKLIST. The Denylist's address is fixed per chain in the client,
  and mainnet's is 0x3600…0004, deployed in genesis. There is no denylist-free Arc node
  and no flag to change it, so this is network-wide rather than a per-operator setting.

  `msg.sender` IS NOT PROOF OF A SIGNATURE (Zero7). The CallFrom precompile lets
  the Memo and Multicall3From contracts execute a call with any `sender` they
  choose. The allow-list is two hardcoded addresses in the client, not an on-chain
  registry, so it cannot be inspected or changed from the chain.

  `eth_getCode` AT AN ARC PRECOMPILE RETURNS ONE BYTE, AND MAINNET AND TESTNET DISAGREE.
  Mainnet returns `0xef` and testnet `0x01`, while the inherited Ethereum precompiles
  return `0x`. A tool that recognises Arc precompiles by the testnet's byte fails on mainnet.

  ZERO7 AND ZERO8 WERE NOT THERE FROM THE START. Both activated at block 20156410 on
  2026-09-10, so behaviour at earlier mainnet heights differs: CallFrom does not answer,
  and SELFDESTRUCT uses the older handler. A replay across that block has to account for it.

  `parentBeaconBlockRoot` IS THE PARENT HASH. Not zero, not a beacon root. Any
  consumer that treats a non-zero value as evidence of a beacon chain is wrong.

gotchas:
  - >-
    THE RECEIPT IS MISSING `effectiveGasPrice` AND `type`. `toJson(const
    LocalisedTransactionReceipt&)` emits exactly blockNumber, blockHash,
    transactionIndex, transactionHash, from, to, status, gasUsed,
    cumulativeGasUsed, contractAddress, logsBloom and logs — and nothing else. A
    consumer computing what a transaction actually cost has to join the receipt back
    to the transaction to recover its gas price. `src:
    taraxa-node/libraries/core_libs/network/rpc/eth/Eth.cpp:cumulativeGasUsed`
  - >-
    ORDERING COMMITS BEFORE EXECUTION, AND THE BLOCK THAT COMMITS IT CARRIES THE
    STATE OF FIVE PERIODS AGO. A PBFT block for period N contains: the previous PBFT
    block hash, the anchor DAG block hash, `order_hash` (sha3 of the RLP list of
    ordered DAG block hashes), and `final_chain_hash`. That last field is
    `blockHeader(N - delegationDelay)->hash` — with `delegation_delay: 0x5` on
    mainnet, THE HEADER OF PERIOD N-5. So the object the committee votes on commits
    to an ORDERING for period N and to the EXECUTED RESULT of period N-5, and to
    nothing about period N's own state. Deferred execution, like Monad — but Monad's
    lag is 3 heights and is a stated design; Taraxa's is 5 and falls out of the DPoS
    delegation delay, so the same constant that decides when a delegation becomes
    effective also decides how stale the state commitment is. Before Cornus the field
    was the STATE ROOT of N-5; Cornus changed it to the block HASH of N-5.
  - >-
    THE SAME TRANSACTION IS ROUTINELY IN MANY DAG BLOCKS, AND DEDUPLICATION HAPPENS
    BEFORE EXECUTION, NOT DURING IT. Twenty proposers draw from their own mempools
    with no coordination — `packTrxs` just takes the top of the local pool — so
    duplicate inclusion is the normal case, not an edge case. When the anchor is
    fixed, `pushCertVotedPbftBlockIntoChain_` walks the ordered DAG blocks and builds
    the period's transaction list through `std::unordered_set<trx_hash_t> trx_set`,
    keeping only the FIRST occurrence. The duplicate is therefore never a candidate
    for execution: it is not skipped, not charged, not given a receipt, and does not
    appear twice in the transactions trie. THIS IS A THIRD ANSWER, DISTINCT FROM
    CONFLUX'S. Conflux executes the duplicate, hits `OldNonce`, marks it
    `TransactionStatus::Skipped` and then erases every trace of it; Taraxa never
    orders it in the first place. The observable difference: on Conflux the duplicate
    is in the Core-Space block body and invisible to eSpace, while on Taraxa the DAG
    block that contained the duplicate is fully present in the period data — you can
    see the duplicate in the DAG, just not in the executed list.
  - >-
    DUPLICATE INCLUSION IS PAID FOR IN REWARDS, NOT IN SLASHING, AND THE RULE CHANGED
    AT ASPEN. Before Aspen part one, `processDagBlocks` credited a DAG block with a
    `dag_blocks_count_` share of the block reward ONLY IF it contributed at least one
    unique transaction: a block full of duplicates earned nothing at all. From Aspen
    part one, `processDagBlocksAspen` replaced that with a different test — the block
    reward goes to every DAG block whose VDF difficulty equals the MINIMUM difficulty
    among the period's DAG blocks — while transaction fees still go strictly to the
    first includer. So the penalty for losing a race moved from "you get nothing" to
    "you get the block share but no fees". Nobody is slashed and nobody is charged.
    Against Autonomys, where an invalid bundle slashes the operator automatically,
    Taraxa sits at the far mild end: the worst outcome of racing is forgone revenue.
  - >-
    A TRANSACTION THAT IS ORDERED BUT INVALID WHEN IT EXECUTES IS INCLUDED, CHARGED,
    AND GIVEN A RECEIPT WITH status 0. There is no skip path. `EVM.Main` returns a
    `ConsensusErr` for nonce-too-low, insufficient balance for gas, intrinsic gas not
    covered, and insufficient balance for the top-level transfer, and `finalize_`
    turns `r.code_err.empty() && r.consensus_err.empty()` straight into the receipt's
    status bit. Every one of those transactions is in the block, in the transactions
    trie, in the receipts trie, and returned by `eth_getTransactionReceipt`. The gas
    charged is the FULL GAS LIMIT (`consensusErr(ret, gas_cap, err)`) for
    nonce-too-low, intrinsic-gas and transfer-underflow. This is the opposite pole
    from Conflux, which erases the same transaction entirely, and from Autonomys,
    which drops the whole bundle.
  - >-
    AN UNDERFUNDED TRANSACTION IS EXECUTED AND TAKES ESSENTIALLY THE SENDER'S ENTIRE
    BALANCE. If the sender cannot cover `gas_limit * gas_price`, `EVM.Main` does not
    reject: it computes `available_funds_gas = balance / gas_price`, subtracts
    `available_funds_gas * gas_price` — everything but sub-gas-price dust — and
    reports `gasUsed = available_funds_gas` with a status-0 receipt. From Cornus it
    also bumps the nonce to `tx.nonce + 1`. Mainnet's validity rules make this state
    unreachable, because a transaction that cannot pay is never includable. Conflux
    does the same thing by a different route (`min(gas_cost, balance)`), so this is
    now a two-chain class: DAG chains where inclusion is decided before balances are
    known end up confiscating rather than rejecting.
  - >-
    NONCE SKIPPING IS PERMANENT AND THE ACCOUNT NONCE JUMPS. The nonce-too-high check
    is present in the source but COMMENTED OUT, above the line "Nonce skipping is
    permanently enabled now. Uncomment this part to have strict nonce ordering". Only
    `tx.nonce < account.nonce` is rejected. On success the account nonce is set to
    `tx.nonce + 1`, NOT incremented — so a transaction with nonce 1,000,000 from an
    account at nonce 3 executes, and nonces 3 through 999,999 are burned forever. The
    mainnet invariant "an account's nonce equals the number of transactions it has
    sent" is false here; `eth_getTransactionCount` is a next-nonce oracle and nothing
    more. Contract addresses from CREATE derive from `tx.Nonce`, not from a
    sequential counter, so a deployer can choose its own contract address by choosing
    a nonce.
  - >-
    THERE IS NO EARLY RECEIPT, BUT `eth_getTransactionByHash` IS BROKEN FOR EXACTLY
    THE TRANSACTIONS THAT WOULD NEED ONE. `get_transaction_receipt` looks up
    `transactionLocation` first and returns null when there is none, so a transaction
    sitting in a DAG block that has not yet been anchored has NO receipt — correct,
    and the opposite of MegaETH's 0xffff..ff sentinel. But `get_transaction` calls
    `get_trx(h)` FIRST, which reads the `transactions` column where DAG-included and
    pooled transactions live, and on a hit dereferences `*loc` and
    `*final_chain->blockHash(loc->period)` with NO null check. `transactionLocation`
    returns `std::nullopt` for anything not yet finalized. So the one query a user
    makes about a transaction that is in the DAG but not yet in a period —
    "where is my transaction?" — reads through a disengaged `std::optional`. This is
    a source reading; with no reachable RPC it could not be confirmed against a
    running node, and what a release build actually returns is unspecified.
  - >-
    `block.number` COUNTS PBFT PERIODS. It is not the DAG block count, not the
    transaction count, and not a wall-clock tick: `setFromPbft` sets
    `number = pbft.getPeriod()` and `appendBlock` independently sets it to
    `last_block->number + 1`. A period that anchors 50 DAG blocks and 900
    transactions is ONE block.number; a period whose PBFT proposer found no new DAG
    blocks proposes a NULL ANCHOR and still produces a block, with zero transactions
    and an unchanged state root. So empty blocks on Taraxa mean "the DAG produced
    nothing new", not "nobody transacted".
  - >-
    BLOCKHASH IS HONEST — the negative result. `opBlockhash` is unmodified geth 1.8
    (256-block window, `lower = upper - 256`) and its `get_hash` is
    `FinalChain::blockHash`, which returns the same synthesised header hash that
    `appendBlock` stored and that `eth_getBlockByNumber` reports as `hash` and
    `parentHash`. So `BLOCKHASH(number-1) == parentHash` holds. The DAG is entirely
    invisible to BLOCKHASH: DAG block hashes are not addressable, do not consume
    block numbers, and never appear in the 256-block window. After Polygon zkEVM
    (returns a state root) and Conflux, this is worth stating explicitly rather than
    assuming.
  - >-
    A GAS ESTIMATE IS A BLOCK-VALIDITY RULE. A DAG block carries a `gas_estimation`
    field, and `DagManager::verifyBlock` rejects the block unless that field EXACTLY
    equals `trx_mgr_->estimateTransactions(block_txs, proposal_period)`. For any
    transaction whose gas limit is at most `kEstimateGasLimit` (200,000) the estimate
    is just its declared gas limit; above that, it is the `gas_used` of a
    SPECULATIVE EXECUTION of that transaction against the state at the proposal
    period. So the output of an `eth_call`-style dry run is consensus-critical: two
    implementations that disagree about how much gas a speculative execution consumes
    reject each other's DAG blocks. This is the strongest coupling between the
    estimation path and consensus in this dataset — most chains treat estimation as a
    convenience API with no consensus weight whatsoever.
  - >-
    THE 2,300-GAS STIPEND CAN WRITE STORAGE. Repeated here because it is the finding
    most likely to cost someone money: Taraxa ships EIP-1283 without EIP-1706's
    sentry, so a `transfer()` recipient's fallback can SSTORE a dirty slot for 200
    gas. Ethereum delayed Constantinople by an emergency fork to avoid exactly this.
    Every reentrancy audit that reasons "only 2,300 gas, so no state change" is
    invalid on this chain.
  - >-
    THE FALCON-512 PRECOMPILE RETURNS ZERO FOR VALID. `0x...fa1c` returns
    `bytes32(0)` when the signature verifies and `bytes32(1)` when it does not, and
    it wants an ABI selector (0xde8f50a1) in front of its arguments. Both conventions
    are inverted or unprecedented relative to every other signature precompile on
    every chain in this dataset.
  - >-
    THIS ROW HAS NO LIVE EVIDENCE. Every RPC endpoint the chain's documentation still
    publishes fails DNS resolution, and every third-party proxy advertising chain 841
    answers `eth_chainId` from static config and fails everything else. That is the
    inverse of the Hyperliquid problem — full source, no reachable network — and it
    means nothing here has been checked against what validators run. Where the pinned
    tag and the live chain could differ, this row cannot tell you which is right.

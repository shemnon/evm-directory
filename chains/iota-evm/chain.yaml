schema_version: 2

chain:
  name: IOTA EVM
  slug: iota-evm
  chain_id: 8822
  role: fork
  live: true
  evidence: source
  chain_id_src: "packages/evm/jsonrpc/service.go:ChainId"
  chain_id_src_live: "eth_chainId @ 12793600 -> 0x2276 (8822); net_version -> 8822; eth_call CHAINID @ 12793600 -> 0x2276; GET /v1/chain -> evmChainId 8822"
  note: >-
    IOTA EVM is not a chain in the sense every other row in this dataset is. It is the
    `evm` CORE CONTRACT of a single IOTA Smart Contracts (ISC) chain, and that ISC chain
    is a Move OBJECT on the IOTA L1 (`getChainID()` returns the 32-byte object id
    0x0dc44856...409d, not a chain number). Ethereum blocks, receipts, balances and the
    tx pool are all synthesised by that contract for the benefit of Ethereum tooling;
    the real unit of execution is an ISC *request*, the real unit of state is the ISC
    chain state, and the real gas meter is ISC gas. The EVM interpreter itself is
    genuine go-ethereum v1.15.5 (forked, one patch), so opcode semantics are honest —
    but almost everything wrapped around the interpreter is ISC's, and that is where
    this row's findings are. ShimmerEVM (chain id 1073) is a DIFFERENT ISC chain on a
    different network and is not covered here.

lineage:
  upstream: ethereum
  ancestry: [ethereum]
  fork_of: go-ethereum
  note: >-
    Code lineage is narrow and precise: wasp imports go-ethereum v1.15.5 and redirects
    it, via a single `replace` directive in go.mod, to `iotaledger/go-ethereum`
    v1.15.5-wasp1, whose entire history above upstream is ONE squashed commit titled
    "changes for ISC wasp". That fork is the EVM: interpreter, jump table, precompile
    table, `params.ChainConfig`, `core.ApplyMessage`. Everything above it — blocks,
    state, ordering, fees, finality — is wasp's own ISC machinery and shares no code
    with any Ethereum client. So the usual reading of `role: fork` is inverted here:
    the *interpreter* is inherited and the *chain* is not.
  sync_point: >-
    STOPS AT CANCUN, AND ONLY PARTLY. `emulator.getConfig` builds a `params.ChainConfig`
    by hand with all pre-merge forks at block 0 plus `ShanghaiTime: 0` and
    `CancunTime: 0`, and nothing later. There is no PragueTime, no OsakaTime, no
    fork schedule of any kind, and no genesis file — the config is a Go literal keyed
    only on the EVM chain id. A newer go-ethereum in go.mod would therefore change
    nothing about the active fork.

client:
  name: wasp
  repo: https://github.com/iotaledger/wasp
  version: v2.0.3
  commit: 059538bb0428de48577c83dbbd94dd412d00352f
  language: go
  note: >-
    The pinned tag is confirmed to be what the network runs: the public node answers
    `GET https://api.evm.iotaledger.net/v1/node/version` with `{"version":"2.0.3"}`.
    That is a stronger client-identification than most rows get. `web3_clientVersion`
    over JSON-RPC is unhelpful — it returns the constant string `wasp/evmproxy`.
  companion_repos:
  - {name: go-ethereum, repo: "https://github.com/iotaledger/go-ethereum",
     version: v1.15.5-wasp1, commit: 30f95dc4161e7ea893f93e00f4ffce15585fbcea, language: go,
     provides: "the EVM itself: interpreter, jump table, precompile set, params.ChainConfig, core.ApplyMessage, and the ISC-only `vm.Config.MagicContracts` native-dispatch hook that upstream geth does not have"}

live_probe:
  endpoint: https://json-rpc.evm.iotaledger.net
  chain_id: 8822
  observed_at_block: 12793600      # 0xc33700, timestamp 1787844123 = 2026-08-27 15:22:03 UTC

consensus:
  engine: >-
    ISC committee consensus. Per round the committee runs an Asynchronous Common Subset
    (ACS) over per-node batch proposals; a request enters the batch only if F+1 nodes
    proposed it. The agreed set is then ORDERED by a threshold-BLS common coin, the
    single VM run executes that order deterministically on every node, and the resulting
    state commitment is packed into an IOTA L1 programmable transaction which the
    committee threshold-signs (DSS Schnorr) and posts. There is no leader, no block
    proposer, and no fee-priority ordering.
  finality: >-
    An ISC block is final when the IOTA L1 transaction carrying its anchor is confirmed
    by the L1 (a Move/Sui-derived, post-Rebased IOTA). The JSON-RPC does NOT wait for
    that: it serves `ActiveOrCommittedState`, defined in source as "the state the chain
    build next TX on, can be ahead of ConfirmedState" (sic).
  block_time: >-
    on demand; one ISC block per consensus round, floor 500 ms (`ConsensusDelay`
    default). No fixed cadence and no empty-block production when idle.
  src: "packages/chain/cons/cons.go:uponVMInputsReceived, packages/chain/cons/bp/aggregated_batch_proposals.go:OrderedRequests, packages/chain/node.go:LatestState"
  src_live: "GET /v1/chain @ 12793600 -> isActive true, chainID 0x0dc448563a2c54778215b3d655b0d9f8f69f06cf80a4fc9eada72e96a49e409d"
  src_doc: https://docs.iota.org/developer/iota-evm/explanations/consensus
  note: >-
    See `gotchas.ordering_and_execution` for the full (a)-(d) answer. The short form:
    ordering commits before execution but in the SAME round, execution is a single
    sequential deterministic VM run (no parallelism, no optimism), an ordered-but-invalid
    request is ERASED with no receipt of any kind, and every receipt a client can see is
    pre-L1-confirmation with no field that says so.

baseline_fork: cancun

forks:
  src: "packages/vm/core/evm/emulator/emulator.go:getConfig"
  note: >-
    There is no fork schedule. `getConfig(chainID)` returns a hand-built
    params.ChainConfig with every pre-merge fork at block 0, `ShanghaiTime: 0`,
    `CancunTime: 0` and nothing after. No activation timestamps exist, so no fork can
    be scheduled without a wasp release and a chain migration. The function then
    asserts `if !c.IsShanghai(...) { panic("ChainConfig should report EVM version as
    Shanghai") }` — a stale guard that contradicts the CancunTime it just set; Cancun
    is in fact active, confirmed live (TLOAD/TSTORE, MCOPY, KZG at 0x0a).
  timeline:
  - {name: genesis (all pre-merge forks + Shanghai + Cancun), activation_time: 0,
     mainnet_equivalent: cancun}

eips:
  155:
    status: inherited
    note: >-
      EIP-155 replay protection is the ONLY transaction format this chain understands.
      `evmutil.Signer` returns `types.NewEIP155Signer(chainID)` everywhere — mempool,
      execution and RPC — so a homestead-style unprotected transaction is also rejected.
    src: "packages/evm/evmutil/signer.go:Signer"
  1559:
    status: removed
    severity: high
    note: >-
      There is no fee market of any kind. `NewEVMEmulator` sets `vm.Config.NoBaseFee:
      true` with the comment "gas fee is set by ISC"; `applyMessage` overwrites
      `msg.GasPrice`, `msg.GasFeeCap` and `msg.GasTipCap` with ZERO and sets
      `blockContext.BaseFee` to zero before every execution. The header carries no
      `baseFeePerGas` field at all, `eth_feeHistory` and `eth_maxPriorityFeePerGas` do
      not exist on the node, and type-0x02 transactions cannot be submitted. The price
      is a governance constant (`FeePolicy.GasPerToken`), not an auction. Marked
      severity high because BASEFEE and GASPRICE both return 0 inside the EVM while the
      receipt reports a non-zero `effectiveGasPrice` — see `opcodes.modified`.
    src: "packages/vm/core/evm/emulator/emulator.go:NoBaseFee, packages/vm/gas/feepolicy.go:DefaultGasPriceFullDecimals"
    src_live: "eth_getBlockByNumber @ 12793600 -> no baseFeePerGas key; eth_feeHistory -> -32601 does not exist; eth_maxPriorityFeePerGas -> -32601 does not exist"
  2718:
    status: removed
    severity: high
    note: >-
      The typed-transaction envelope is not implemented at the ingress. `EthService.
      SendRawTransaction` decodes with `rlp.DecodeBytes(txBytes, tx)` instead of
      `tx.UnmarshalBinary`, so any EIP-2718 payload is read as a one-byte RLP string and
      rejected with "typed transaction too short" before its contents are even parsed.
      Even if it decoded, `types.NewEIP155Signer` cannot recover a sender from a typed
      transaction. Consequence: 2930, 1559, 4844 and 7702 transactions are ALL
      unsubmittable, and every transaction on the chain is type 0x00.
    src: "packages/evm/jsonrpc/service.go:SendRawTransaction"
    src_live: "eth_sendRawTransaction @ 12793600 with well-formed type-0x01/0x02/0x04 payloads -> -32000 'typed transaction too short' for all three; the same payload as legacy reaches RLP field validation"
  2930:
    status: removed
    note: "access-list transactions cannot be submitted (EIP-2718 removed). The 2929 gas schedule itself is present."
    src: "packages/evm/jsonrpc/service.go:SendRawTransaction"
  3198:
    status: modified
    severity: high
    note: "BASEFEE is a live opcode and always pushes 0; blockContext.BaseFee is zeroed on every message."
    src: "packages/vm/core/evm/emulator/emulator.go:applyMessage"
    src_live: "eth_call BASEFEE @ 12793600 -> 0x00..00"
  3651:
    status: inherited
    note: "warm COINBASE, but COINBASE is the zero address here — see opcodes.modified."
  3855: {status: inherited, note: "PUSH0 active (Shanghai at time 0)."}
  3860: {status: inherited}
  4399:
    status: modified
    severity: high
    note: >-
      PREVRANDAO always pushes 0. The pending header has no `MixDigest`, so
      `NewEVMBlockContext` derives `Random = &common.Hash{}`. ISC does have real
      committee randomness — a threshold-BLS common coin, reachable as
      `ISCSandbox.getEntropy()` on the magic contract — but it never reaches the EVM's
      own opcode. A contract seeding randomness from `block.prevrandao` gets a constant.
    src: "packages/vm/core/evm/emulator/blockchaindb.go:GetPendingHeader"
    src_live: "eth_call PREVRANDAO @ 12793600 -> 0x00..00; eth_call to 0x1074..00 getEntropy() @ 12793600 -> 0x3e4abae4...ddaf"
  4788:
    status: removed
    note: "no beacon chain, no beacon-roots contract, no parentBeaconBlockRoot header field."
    src_live: "eth_getCode 0x000F3df6D732807Ef1319fB7B8bB8522d0Beac02 @ 12793600 -> 0x"
  4844:
    status: modified
    note: >-
      Split outcome. The Cancun OPCODES are enabled (`CancunTime: 0`) and the KZG
      point-evaluation precompile at 0x0a is live, but blob transactions cannot be
      submitted (EIP-2718 removed) and no blob header fields exist. BLOBHASH returns 0.
      BLOBBASEFEE is worse than absent — see EIP-7516.
    src: "packages/vm/core/evm/emulator/emulator.go:CancunTime"
    src_live: "eth_call to 0x0a with 1 byte @ 12793600 -> -32000 'invalid input length' (precompile present); eth_call BLOBHASH(0) @ 12793600 -> 0x00..00"
  4895:
    status: removed
    note: "no withdrawals, no withdrawalsRoot header field; the EVM has no consensus layer above it."
    src: "packages/vm/core/evm/emulator/blockchaindb.go:makeHeader"
  5656: {status: inherited, note: "MCOPY works.", src_live: "eth_call MCOPY @ 12793600 -> executes, returns 0x..01"}
  6780: {status: inherited, note: "SelfDestruct6780 restricts destruction to the creating transaction.", src: "packages/vm/core/evm/emulator/statedb.go:SelfDestruct6780"}
  1153: {status: inherited, note: "TSTORE/TLOAD backed by an in-memory transient store reset in StateDB.Prepare.", src: "packages/vm/core/evm/emulator/transient_storage.go:newTransientStorage", src_live: "eth_call TSTORE 0x42 then TLOAD @ 12793600 -> 0x..42"}
  7516:
    status: modified
    severity: high
    note: >-
      BLOBBASEFEE is ENABLED by the Cancun rules but the block context never sets
      `BlobBaseFee`, so executing opcode 0x4A dereferences a nil pointer inside the
      interpreter. In `eth_call` this surfaces as a JSON-RPC error; in a transaction the
      panic is caught by `applyMessage` and becomes a `status: 0` receipt whose revert
      reason is the Go runtime message. A contract compiled for Cancun that reads
      `block.blobbasefee` is simply un-executable here.
    src: "packages/vm/core/evm/emulator/emulator.go:applyMessage"
    src_live: "eth_call BLOBBASEFEE @ 12793600 -> -32000 'runtime error: invalid memory address or nil pointer dereference'"
  2935:
    status: removed
    note: "no history-storage contract; the address holds no code."
    src_live: "eth_getCode 0x0000F90827F1C53a10cb7A02335B175320002935 @ 12793600 -> 0x"
  2537: {status: removed, note: "Prague not scheduled; 0x0b-0x11 hold no precompiles.", src_live: "eth_call 0x0b @ 12793600 -> 0x (empty, address absent)"}
  7702: {status: removed, note: "type 0x04 cannot be decoded (EIP-2718 removed); no delegation designator handling.", src: "packages/evm/jsonrpc/service.go:SendRawTransaction"}
  7623: {status: removed, note: "Prague not scheduled; calldata floor pricing absent."}
  7691: {status: removed}
  7840: {status: removed}
  7951: {status: removed, note: "P256VERIFY absent. NOTE: a probe of 0x0100 returns empty output, which on this chain means 'no code at that address', NOT EIP-7951 invalid-signature semantics — the two are indistinguishable by output alone, so the claim rests on the pinned ChainConfig stopping at Cancun.", src: "packages/vm/core/evm/emulator/emulator.go:getConfig"}
  7883: {status: removed}
  7825: {status: removed}
  7594: {status: removed}
  7907: {status: removed}
  1186:
    status: removed
    severity: high
    note: >-
      `eth_getProof` is not implemented and could not be: there is no Merkle-Patricia
      trie over EVM state. EVM state lives in the ISC key-value state, which is
      committed by ISC's own trie; the Ethereum `stateRoot` is left at zero forever.
    src: "packages/vm/core/evm/emulator/blockchaindb.go:makeHeader"
    src_live: "eth_getProof @ 12793600 -> -32601 does not exist"

tx_types:
  "0x00":
    name: LegacyTx (EIP-155 protected only)
    status: modified
    note: >-
      The only transaction type that exists here. Every transaction in every block
      sampled reports `type: 0x0`. Two constraints ride on it: the signer is
      `types.NewEIP155Signer`, so an unprotected pre-155 transaction is also rejected;
      and `gasPrice` must be >= the chain's fixed governance price or the transaction is
      refused at ingress and, if it somehow reached consensus, skipped there too.
    src: "packages/evm/evmutil/signer.go:Signer, packages/evm/evmutil/gasprice.go:CheckGasPrice"
    src_live: "eth_getBlockByNumber @ 12793600 with full txs -> every entry has v=0x450f/0x4510 (EIP-155, chainId 8822) and receipts report type 0x0"
  "0x01":
    status: removed
    spec: EIP-2930
    note: >-
      Undecodable at ingress, because the EIP-2718 envelope is never decoded.
      `EthService.SendRawTransaction` calls `rlp.DecodeBytes(txBytes, tx)` instead of
      `tx.UnmarshalBinary`, so the leading type byte is read as a one-byte RLP string and
      the payload is rejected with "typed transaction too short". Past the decoder it
      would still fail: `evmutil.Signer` is `types.NewEIP155Signer`, which cannot recover
      a sender from any typed transaction.
    src: "packages/evm/jsonrpc/service.go:SendRawTransaction, packages/evm/evmutil/signer.go:Signer"
    src_live: "eth_sendRawTransaction @ 12793600 with a well-formed type-0x01 payload (0x01f868822276808502540be4008252089411111111... , 8822/nonce 0/21000 gas) -> -32000 'typed transaction too short'"
  "0x02":
    status: removed
    spec: EIP-1559
    note: >-
      Undecodable at ingress, because the EIP-2718 envelope is never decoded.
      `EthService.SendRawTransaction` calls `rlp.DecodeBytes(txBytes, tx)` instead of
      `tx.UnmarshalBinary`, so the leading type byte is read as a one-byte RLP string and
      the payload is rejected with "typed transaction too short". Past the decoder it
      would still fail: `evmutil.Signer` is `types.NewEIP155Signer`, which cannot recover
      a sender from any typed transaction. There is no base fee to bid against in any
      case; see eips.1559.
    src: "packages/evm/jsonrpc/service.go:SendRawTransaction, packages/evm/evmutil/signer.go:Signer"
    src_live: "eth_sendRawTransaction @ 12793600 with a well-formed type-0x02 payload (0x02f86d82227680843b9aca008502540be4008252089411111111... ) -> -32000 'typed transaction too short'"
  "0x03":
    status: removed
    spec: EIP-4844
    note: >-
      Undecodable at ingress, because the EIP-2718 envelope is never decoded.
      `EthService.SendRawTransaction` calls `rlp.DecodeBytes(txBytes, tx)` instead of
      `tx.UnmarshalBinary`, so the leading type byte is read as a one-byte RLP string and
      the payload is rejected with "typed transaction too short". Past the decoder it
      would still fail: `evmutil.Signer` is `types.NewEIP155Signer`, which cannot recover
      a sender from any typed transaction. There is no blob market, no blob header fields
      and no blob gas accounting. NOTE ON EVIDENCE: unlike 0x01, 0x02 and 0x04, a
      type-0x03 payload was NOT submitted to the live network, so this entry carries no
      src_live. It rests on the source cause above, which is type-agnostic — the decoder
      rejects the envelope before reading the type byte's value — plus the three sibling
      types that were probed and all failed identically.
    src: "packages/evm/jsonrpc/service.go:SendRawTransaction, packages/evm/evmutil/signer.go:Signer"
  "0x04":
    status: removed
    spec: EIP-7702
    note: >-
      Undecodable at ingress, because the EIP-2718 envelope is never decoded.
      `EthService.SendRawTransaction` calls `rlp.DecodeBytes(txBytes, tx)` instead of
      `tx.UnmarshalBinary`, so the leading type byte is read as a one-byte RLP string and
      the payload is rejected with "typed transaction too short". Past the decoder it
      would still fail: `evmutil.Signer` is `types.NewEIP155Signer`, which cannot recover
      a sender from any typed transaction. No delegation designator is ever installed or
      honoured.
    src: "packages/evm/jsonrpc/service.go:SendRawTransaction, packages/evm/evmutil/signer.go:Signer"
    src_live: "eth_sendRawTransaction @ 12793600 with a well-formed type-0x04 payload (0x04f86e82227680843b9aca008502540be4008252089411111111... , empty authorization_list) -> -32000 'typed transaction too short'"

tx_authorization:
  key_binding: derived
  signers_per_tx: 1
  note: >-
    Ethereum-side authorization is ordinary and narrow: one secp256k1 signature over an
    EIP-155 legacy digest. What is NOT ordinary is that this is only one of two ways to
    move an EVM-visible balance. Every Ethereum address is an ISC "agent" of kind
    EthereumAddressAgentID, and the SAME balance can also be moved by an ISC request
    signed with an Ed25519 IOTA L1 key belonging to a different agent (an on-ledger
    deposit, or an off-ledger request signed by an L1 keypair). Those requests are
    authorized entirely outside the EVM's signature scheme and leave no EVM transaction
    behind — see `system_transactions`.
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      note: "EIP-155 legacy envelope only; typed envelopes are unreachable."
      src: "packages/evm/evmutil/signer.go:Signer"
    ed25519:
      status: added
      authorizes: never
      precompile: none
      note: >-
        ISC's own request signature scheme (`cryptolib`), used by on-ledger and
        non-EVM off-ledger requests. It cannot authorize an EVM transaction — but a
        request it authorizes can change `eth_getBalance` for an Ethereum address. The
        EVM has no precompile to verify it, so an on-chain contract cannot check the
        signatures that moved its own balance.
      src: "packages/chain/mempool/mempool.go:VerifySignature"

non_evm_transactions:
  entries:
  - name: ISC on-ledger request
    description: An IOTA L1 (Move) transaction that deposits assets and a request payload into the
      ISC chain's object. Ordered by the L1 first, then picked up by the committee. It can credit
      base tokens to an Ethereum address, changing `eth_getBalance` with no EVM transaction, no receipt
      and no log.
    src: packages/vm/vmimpl/runreq.go:consumeRequest
  - name: ISC off-ledger request (non-EVM)
    description: A request submitted straight to a node's API and signed with an IOTA keypair, targeting
      any ISC core contract (`accounts`, `governance`, `blocklog`, `root`). It has NO L1 ordering
      guarantee whatsoever — it exists only in node mempools until a committee round picks it up.
      `eth_sendRawTransaction` produces one of these too, wrapped as an EVMOffLedgerTxRequest.
    src: packages/chain/mempool/offledger_pool.go:OffLedgerPool
  - name: ISC anchor transaction (state commitment)
    description: The threshold-Schnorr-signed IOTA L1 programmable transaction the committee posts
      once per ISC block to advance the chain's anchor object. This is the only thing that makes
      an EVM block final, and it is invisible to every Ethereum RPC method.
    src: packages/chain/cons/cons.go:uponTXInputsReady

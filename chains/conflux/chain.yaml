  2537:
    status: inherited
    fork: V3.0
    src: "crates/execution/executor/src/machine/mod.rs:build_bls12_builtin_map"
    src_live: "eth_call(0x0b, 256 zero bytes) @ 155333000 -> 128 zero bytes (G1ADD identity); eth_call(0x11, 64 bytes) -> 'MAP_FP2_TO_G2 input should be 128 bytes'"
  1153:
    status: inherited
    fork: "V2.4 (CIP-142), fixed by CIP-154 in V3.0"
    src: "crates/execution/executor/src/spec.rs:cip154"
    src_live: "eth_call @ 155333000 -> TLOAD(0) = 0"
    note: "TLOAD had an inconsistent implementation between V2.4 and V3.0; CIP-154 fixed it"
  5656:
    status: inherited
    fork: "V2.4 (CIP-143), fixed by CIP-645"
    src: "crates/execution/vm-types/src/spec.rs:fix_eip5656"
  3855:
    status: inherited
    fork: "V2.3 (CIP-119)"
    src: "crates/execution/vm-interpreter/src/instructions.rs:PUSH0"
  4399:
    status: modified
    severity: high
    src: "crates/execution/vm-interpreter/src/interpreter/mod.rs:DIFFICULTY, crates/rpc/rpc-eth-types/src/block.rs:mix_hash"
    src_live: "eth_call @ 155333000 -> opcode 0x44 returns 0x00..00, while the same block's header reports difficulty 0x417b1f0be9 and mixHash 0x00..00"
    note: >-
      PREVRANDAO IS ALWAYS ZERO, ON A PROOF-OF-WORK CHAIN THAT HAS A REAL NONCE
      AND A REAL DIFFICULTY. Opcode 0x44 reads `env.difficulty`, which the eSpace
      environment leaves at its default; the header's `mixHash` is likewise
      hardcoded to `H256::default()` by the RPC layer while `nonce` and
      `difficulty` carry real PoW values. So eSpace exposes the two PoW fields
      that are useless as entropy and zeroes the one field every contract reads
      for entropy. Every `block.prevrandao` / `block.difficulty` consumer gets 0,
      silently, forever. Compare Ethereum pre-Merge (real difficulty) and
      post-Merge (real randomness): eSpace is neither.
  3651:
    status: inherited
    fork: "V3.0 (CIP-645)"
    src: "crates/execution/vm-types/src/spec.rs:eip_cold_warm_access"
    note: "warm COINBASE arrives bundled into CIP-645"
  6110:
    status: removed

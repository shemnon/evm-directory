fee_model:
  metering: gas
  fee_market: "CIP-1559 with two independent per-space base fees, per-DAG-block updates driven by packed gas LIMITS, a 20 gwei eSpace floor, and a DAO-adjustable burn share"
  extra_components:
    - name: "evm_gas_ratio = 2"
      severity: high
      src: "crates/execution/vm-types/src/spec.rs:evm_gas_ratio"
      src_live: "eth_call @ 155333000: code deposit measured at 400.1 gas/byte (453194 gas for 1000 bytes, 853292 for 2000); SSTORE set measured at 42174 = 40000 + 2100"
      note: >-
        A SINGLE MULTIPLIER, APPLIED ONLY IN eSPACE, THAT DOUBLES EVERY
        STATE-GROWTH PRICE: `sstore_set_gas` 20000 -> 40000, `create_data_gas`
        200 -> 400 per byte, `call_new_account_gas` 25000 -> 50000,
        `suicide_to_new_account_cost` 25000 -> 50000, and the EIP-7702
        `per_empty_account_cost` 25000 -> 50000. Core Space uses 1. The comment
        calls it "the magnification of gas storage occupying related operations"
        — it is Conflux charging eSpace for the storage collateral eSpace does not
        post. `align_evm` sets it to 1 and is devnet-only.
    - name: "two base fees, one block"
      severity: high
      src: "crates/primitives/src/block_header.rs:base_price"
      src_live: "eth_getBlockByNumber @ 155333000 -> 0x4a817c800 (20 gwei); cfx_getBlockByEpochNumber @ 155333000 -> 0x3b9aca00 (1 gwei)"
      note: "see eips.1559"
    - name: "base fee floor"
      src: "crates/parameters/src/lib.rs:INITIAL_1559_ETH_BASE_PRICE"
      note: "eSpace's minimum base price is 20 gdrip (20 gwei); mainnet eSpace has sat on the floor at every block sampled"
    - name: "most of the base fee is not burnt"
      severity: high
      src: "crates/execution/executor/src/state/state_object/reward.rs:burnt_gas_price"
      src_live: "eth_getTransactionReceipt(0x8afdf9bd..0205) @ 155332908 -> burntGasFee / gasFee = 0.3684"
      note: "63% of the base fee goes to the miner at the current DAO parameter, and the inclusion threshold is the burnt 37% — see eips.1559 and non_eip_specs.CIP-137"
    - name: "eSpace gets 50% of the block gas limit, Core gets 90%"
      src: "crates/parameters/src/lib.rs:CIP1559_ESPACE_TRANSACTION_GAS_RATIO"
      src_live: "eth_getBlockByNumber @ 155333000 -> gasLimit 0x1c9c380 (30,000,000) with the underlying block limit 60,000,000; the Core RPC reports 0x337f980 (54,000,000) for the same block"
      note: >-
        The two shares sum to 140%, so they are per-space CAPS on a shared budget,
        not a partition. `gasLimit` in the eSpace header is eSpace's cap for ONE
        block; the non-standard `espaceGasLimit` key is the SUM over every
        eSpace-eligible block in the epoch, so it varies between 30M and 60M+
        depending on how many such blocks the epoch contained.
    - name: "only 1 block in 5 may carry eSpace transactions"
      severity: high
      src: "crates/parameters/src/lib.rs:EVM_TRANSACTION_BLOCK_RATIO, crates/execution/executor/src/spec.rs:can_pack_evm_transaction"
      note: >-
        `can_pack_evm_transaction(height) = height % 5 == 0`. Only DAG blocks
        whose HEIGHT is a multiple of five may contain eSpace transactions at all;
        every other block's eSpace gas limit is zero. So eSpace throughput is
        gated on a property of the block's position in the Core-Space chain, and
        an epoch whose pivot height is not a multiple of five can still contain
        eSpace transactions only if some non-pivot block in it qualifies. There is
        no mainnet analogue for "this block is not allowed to contain your
        transaction".
    - name: "CIP-130 gas floor tied to calldata length"
      src: "crates/cfxcore/core/src/verification.rs:check_gas_limit_with_calldata"
      note: "gas limit >= 100 x calldata bytes or the transaction is invalid; see non_eip_specs.CIP-130"
    - name: "cross-space gas retention 9/10"
      src: "crates/parameters/src/lib.rs:CROSS_SPACE_GAS_RATIO"
      note: "a cross-space call forwards gas_left/10 into eSpace, against the EVM's 63/64"
    - name: nonce on failure
      severity: high
      src: "crates/execution/executor/src/executive/fresh_executive.rs:check_all, crates/execution/executor/src/executive/fresh_executive.rs:check_nonce, crates/execution/executor/src/executive/pre_checked_executive.rs:inc_sender_nonce, crates/execution/executor/src/executive/pre_checked_executive.rs:charge_gas"
      note: >-
        NONCE ON FAILURE: SPLIT WITHIN ONE CHAIN, and the two halves are decided
        by whether `FreshExecutive::check_all` rejects the transaction before
        `into_pre_checked` or after. This is the only row in the dataset where
        both answers are live at once.

        PRESERVED, NO RECEIPT, NO CHARGE — everything `check_all` rejects becomes
        `TransactionStatus::Skipped`: nonce-too-low (`check_nonce` →
        `TxDropError::OldNonce`), nonce-too-high, gas price below the base-fee
        threshold at the pivot block, sender-does-not-exist, sender-has-code,
        gas limit below the intrinsic/EIP-7623 floor, and for Core Space an
        expired epoch window. Execution never starts, so `inc_sender_nonce` is
        never reached: the account nonce is UNTOUCHED, no gas is charged, and the
        eSpace RPC erases the transaction outright — the phantom-block builder
        skips it ("we do not return non-executed transaction"), no transaction
        index is written, and `eth_getTransactionReceipt` returns null. This is
        the friendly half: the sender can resubmit at the same nonce freely, and
        it is what makes duplicate DAG packing harmless — the second copy hits
        `OldNonce` and is Skipped.

        BURNED, WITH A RECEIPT, BALANCE CONFISCATED — insufficient balance is NOT
        one of those checks on mainnet. `check_enough_balance` is called only
        `if self.context.spec.align_evm`, which is devnet-only, so an underfunded
        transaction passes into `PreCheckedExecutive`, where `inc_sender_nonce`
        bumps the nonce and `charge_gas` takes `min(gas_cost, balance)` — the
        sender's entire remaining balance. `gasUsed` is reported as the FULL GAS
        LIMIT and the receipt says `status: 0`. NONCE BURNED.

        SO THE SAME QUESTION HAS TWO ANSWERS DEPENDING ON WHICH VALIDITY RULE
        BROKE, and the observable signal is inverted from what a mainnet client
        expects: no receipt means the nonce SURVIVED, a receipt means it was
        spent along with the balance. Compare Taraxa, which took the opposite
        design and gives every one of these cases a status-0 receipt with the
        nonce burned; and Sei, which gates the nonce bump and the receipt on the
        same condition so the two always agree.
    - name: "insufficient balance takes the whole balance"
      severity: high
      src: "crates/execution/executor/src/executive/pre_checked_executive.rs:charge_gas, crates/execution/executor/src/executive/executed.rs:not_enough_balance_fee_charged"
      note: >-
        `actual_gas_cost = min(gas_cost, sender_balance)`. A transaction whose
        balance cannot cover `gas_limit * gas_price + value` is NOT skipped on
        mainnet Conflux — the EVM-style precheck runs only when `align_evm` is on.
        It is executed: the nonce is bumped, the sender's ENTIRE REMAINING BALANCE
        is confiscated as a partial fee, `gas_used` is recorded as the FULL GAS
        LIMIT, and the receipt says `status: 0`. This is the "charged a
        partial/penalty fee" outcome, and it is reachable on mainnet.
  note: >-
    Conflux is the second row in this dataset (after Monad) whose fee market is
    driven by gas LIMITS rather than gas used, and the first whose base fee is
    a per-space vector. It is also the only row where the number an EIP-1559
    client reads as `baseFeePerGas` is twice the actual inclusion threshold.

header_fields:
  added:
    - name: espaceGasLimit
      src: "crates/rpc/rpc-eth-types/src/block.rs:espace_gas_limit"
      src_live: "eth_getBlockByNumber @ 155333000 -> espaceGasLimit 0x1c9c380; @ 155332832 -> 0x3938700"
      note: >-
        A non-standard key, documented in-source as "the real gas limit of the
        block". It is the SUM of the eSpace gas limits of every eSpace-eligible
        block in the epoch, while `gasLimit` is the pivot block's own eSpace
        share. The two are equal in an epoch with one eSpace-eligible block and
        differ otherwise. A generic Ethereum client ignores it and therefore
        misreports block capacity.
  removed:
    - {name: withdrawalsRoot, note: "no withdrawals"}
    - {name: blobGasUsed, note: "key absent, not zeroed — contrast Monad"}
    - {name: excessBlobGas, note: "key absent"}
    - {name: parentBeaconBlockRoot, note: "key absent"}
    - {name: requestsHash, note: "key absent"}
  modified:
    - name: stateRoot
      severity: high
      src: "crates/rpc/rpc-eth-types/src/block.rs:deferred_state_root"
      src_live: "eth_getBlockByNumber(0x94230d0) @ 155332816 -> stateRoot 0x24f37b5a..9109, byte-identical to cfx_getBlockByEpochNumber(0x94230d0).deferredStateRoot"
      note: >-
        NOT THIS BLOCK'S STATE ROOT. It is `pivot_header.deferred_state_root()` —
        the root of the state after epoch N-5, republished under the Ethereum key
        for epoch N. `DEFERRED_STATE_EPOCH_COUNT = 5`. A light client or bridge
        that proves an account against `eth_getBlockByNumber(N).stateRoot` is
        proving against state five epochs stale, and will fail against any account
        touched in the last five epochs. Nothing in the JSON says so.
    - name: receiptsRoot
      severity: high
      src: "crates/rpc/rpc-eth-types/src/block.rs:deferred_receipts_root"
      src_live: "eth_getBlockByNumber(0x94230d0) @ 155332816 -> receiptsRoot 0x57e0321f..d87a = cfx_getBlockByEpochNumber(0x94230d0).deferredReceiptsRoot; blocks with no eSpace transactions instead report the constant 0x56e81f17..b421"
      note: >-
        The DEFERRED receipts root of epoch N-5, covering BOTH SPACES, and it does
        not commit to the receipts this response returns. When the epoch has no
        eSpace transactions the RPC substitutes the empty-trie hash outright — a
        value fabricated by the serialiser rather than read from any header.
    - name: transactionsRoot
      severity: high
      src: "crates/rpc/rpc-eth-types/src/block.rs:from_phantom"
      src_live: "eth_getBlockByNumber(0x94230d0, true) @ 155332816 -> ONE transaction and transactionsRoot 0xc5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470 = keccak256(\"\")"
      note: >-
        THE ROOT DOES NOT COMMIT TO THE TRANSACTIONS IN THE SAME RESPONSE. It is
        the PIVOT BLOCK's own `transactionsRoot`, which covers only the pivot
        block's body — while the eSpace transaction list is gathered from EVERY
        block in the epoch. Verified live at the strongest possible boundary: a
        block reporting one transaction reports the keccak of the empty string as
        its transactions root. When there are no transactions the RPC substitutes
        the empty-trie hash instead. There is no value of `transactionsRoot` from
        which the returned transaction list can be verified.
    - name: mixHash
      severity: high
      src: "crates/rpc/rpc-eth-types/src/block.rs:mix_hash"
      note: "hardcoded H256::default(). See eips.4399 — opcode 0x44 also returns zero."
    - name: nonce
      src: "crates/rpc/rpc-eth-types/src/block.rs:nonce"
      note: >-
        Conflux's PoW nonce is a U256; the eSpace header TRUNCATES it to its low
        64 bits to fit Ethereum's H64. The value is real and lossy — it cannot be
        used to re-verify the block's proof of work.
    - name: difficulty
      note: "a real PoW difficulty (0x417b1f0be9 at the pinned block), unlike post-Merge mainnet's 0"
    - name: totalDifficulty
      src: "crates/rpc/rpc-eth-types/src/block.rs:total_difficulty"
      note: "hardcoded to 0 on every block"
    - name: size
      src: "crates/rpc/rpc-eth-types/src/block.rs:size"
      note: "the sum of the eSpace transactions' RLP sizes, not the block's encoded size; 0 for an empty epoch"
    - name: number
      severity: high
      src: "crates/rpc/rpc-eth-types/src/block.rs:from_phantom"
      src_live: "cfx_getStatus @ 155333043 -> epochNumber 155333043 while blockNumber (DAG block count) was 376125885, a ratio of 2.42"
      note: >-
        `block.number` IS THE EPOCH NUMBER — the pivot-chain height — not a count
        of blocks. Conflux's own `blockNumber` (the number of blocks in the DAG)
        is 2.42x larger and is what several CIP activation heights are expressed
        in. Three distinct height spaces coexist: DAG block number, epoch height
        (= eSpace block.number), and PoS view.
    - name: extraData
      note: "always empty; Conflux's `custom` header field is not surfaced"
    - name: sha3Uncles
      note: "hardcoded to the empty-uncles constant; there are no uncles, there are referee blocks, and they are not exposed"
  src: "crates/rpc/rpc-eth-types/src/block.rs:Header"
  note: >-
    Four of the eSpace header's five roots are wrong, stale, or invented, and
    none of them announces it. This is the densest concentration of
    silently-misleading header fields in the dataset.

gotchas:
  - >-
    `eth_getBlockByNumber(N).stateRoot` IS THE STATE ROOT OF EPOCH N-5. Conflux
    defers execution by DEFERRED_STATE_EPOCH_COUNT = 5 epochs and the eSpace RPC
    republishes the pivot header's `deferred_state_root` under Ethereum's
    `stateRoot` key. `receiptsRoot` is likewise the deferred receipts root, and
    covers Core Space as well. Same invariant break as Monad, opposite direction:
    Monad's header carries a true root that no quorum has voted on yet; Conflux's
    carries a voted-on root that belongs to a different block.
  - >-
    `transactionsRoot` DOES NOT COMMIT TO THE TRANSACTIONS IN THE SAME RESPONSE.
    It is the pivot block's own transaction root, while the transaction LIST is
    assembled from every block in the epoch. Live at block 155332816: one
    transaction returned, `transactionsRoot` = keccak256("") = the empty root.
    For an empty epoch the RPC substitutes the empty-trie constant. No consumer
    can verify an eSpace block's transaction list against its own header.
  - >-
    `eth_blockNumber` IS NOT THE TIP. `BlockId::Latest` maps to
    `EpochNumber::LatestState`, so it reports the last EXECUTED epoch — four to
    five behind the chain's actual height. `eth_getBlockByNumber` at the real tip
    returns null for a block that is mined, ordered and final-ish. `pending` maps
    to the same executed epoch, so it is not pending at all. `safe` maps to
    latestConfirmed (~46 epochs back) and `finalized` to the PoS-finalised epoch
    (~200-240 back).
  - >-
    A TRANSACTION THAT IS ORDERED BUT INVALID AT EXECUTION IS ERASED. Conflux has
    a third receipt outcome, `TransactionStatus::Skipped`, distinct from Failure.
    It is produced by nonce-too-low (permanently dropped), nonce-too-high
    (repackable), gas price below the base-fee threshold AT THE PIVOT BLOCK,
    sender-does-not-exist, sender-has-code, and — for Core-Space transactions —
    an expired `epoch_height` window. The eSpace RPC then removes every trace:
    the phantom-block builder skips it ("we do not return non-executed
    transaction"), no transaction index is written, and
    `eth_getTransactionReceipt` returns null with the in-source comment "a skipped
    transaction is not available to clients if accessed by its hash". No gas is
    charged, the nonce is not bumped, no state changes. From outside it is
    indistinguishable from a transaction that was never submitted.
  - >-
    THE SAME TRANSACTION CAN BE PACKED BY TWO MINERS INTO TWO DAG BLOCKS. Both
    blocks can be in the ordered set. The first occurrence executes; the second
    hits `check_nonce`, gets `TxDropError::OldNonce`, and is Skipped — so it is in
    the Core-Space block body, is not charged, is not in the eSpace block, has no
    receipt, and has no transaction index. Duplicate inclusion is normal and
    invisible.
  - >-
    A TRANSACTION CAN LOSE ITS ENTIRE BALANCE TO FEES. The EVM's
    "balance must cover gas + value" precheck runs ONLY under the devnet-only
    `align_evm` flag. On mainnet an underfunded transaction is executed:
    `actual_gas_cost = min(gas_cost, balance)` takes everything the sender has,
    the nonce is bumped, `gasUsed` is reported as the full GAS LIMIT, and the
    receipt is `status: 0`. Mainnet's validity rules make this state unreachable.
  - >-
    `blockhash(block.number)` RETURNS A NON-ZERO HASH, AND WHICH ONE DEPENDS ON
    WHERE YOU RUN IT. In a mined transaction it is the hash of the block the
    transaction is in (the pivot hash is written to state BEFORE the epoch
    executes). Under `eth_call` it is the hash of the block 65,536 epochs earlier
    — confirmed live: `BLOCKHASH(155333001)` returned the hash of block
    155267465. On mainnet it is zero. Any commit-reveal or "unpredictable
    randomness" pattern built on that identity is broken here in a way testing
    against a local Ethereum node will never show.
  - >-
    BLOCKHASH REACHES 65,536 BLOCKS BACK, NOT 256 (CIP-133), verified live at both
    ends of the range. `blockhash(n) == 0` does not mean "too old" for about 18
    hours.
  - >-
    `block.prevrandao` IS ALWAYS ZERO while the header reports a real PoW
    `difficulty` and a real `nonce`. eSpace exposes no randomness of any kind.
  - >-
    SSTORE zero-to-non-zero COSTS 40,000 GAS AND CODE DEPOSIT COSTS 400 GAS PER
    BYTE — both exactly 2x mainnet, from a single `evm_gas_ratio = 2` multiplier
    that also doubles new-account transfer and EIP-7702 authorization costs. Both
    measured live by binary search over `eth_call` gas limits.
  - >-
    CONTRACTS CAN BE 48 KiB (49,152 bytes), twice EIP-170, and the failure at
    49,153 is `OutOfGas` rather than a distinct size error. Verified live at the
    exact boundary.
  - >-
    THERE ARE TWO BASE FEES IN EVERY BLOCK, and the one `eth_getBlockByNumber`
    reports is not the inclusion threshold. CIP-137 burns only part of the base
    fee — 36.84% at the current DAO parameter, measured from a live receipt's
    non-standard `burntGasFee` key — and a transaction is valid if its gas price
    covers the BURNT part. At the pinned block `baseFeePerGas` was 20 gwei and
    the real minimum was about 7.37 gwei. The split is governance-controlled and
    can change without a fork.
  - >-
    A TRANSACTION'S GAS LIMIT MUST BE AT LEAST 100 x ITS CALLDATA LENGTH (CIP-130)
    or the transaction is invalid. This is a validity rule, not a price. No
    Ethereum wallet computes a gas limit this way.
  - >-
    ONLY DAG BLOCKS AT A HEIGHT DIVISIBLE BY 5 MAY CARRY eSPACE TRANSACTIONS
    (EVM_TRANSACTION_BLOCK_RATIO). eSpace capacity is a function of the Core-Space
    chain's shape.
  - >-
    BLOCKS CONTAIN TRANSACTIONS NOBODY SIGNED. Cross-space calls from Core Space
    are surfaced as pairs of legacy (0x00) transactions with `gas: 0`,
    `gasPrice: 0` and a fabricated signature — the first `from` the ZERO ADDRESS
    with `nonce: 0` (so the zero address has unboundedly many nonce-0
    transactions), the second from a mapped address `keccak256(coreAddress)[12..]`
    whose key nobody holds. They have hashes, receipts and log entries. A block
    can report `gasUsed: 0x0` and still contain two transactions — observed live
    at epoch 155332825.
  - >-
    THE JSON `r` AND `s` OF A PHANTOM TRANSACTION ARE THE CHAIN ID, DELIBERATELY.
    The RPC substitutes `chain_id` whenever the real r or s is zero, because zero
    "is not valid in some ethereum tools". The `raw` field in the same object
    still encodes zeros. Re-deriving the hash or running ecrecover on the JSON
    fields gives an answer that contradicts the response.
  - >-
    CONFLUX'S INTERNAL CONTRACTS ARE NOT VISIBLE FROM eSPACE AT ALL.
    `InternalContractMap::contract` returns None for any non-Native address, so
    0x0888..0000-0007 and ..000a are ordinary empty accounts here: no code, empty
    output on call. Storage collateral and gas sponsorship — Conflux's two most
    distinctive economic mechanisms — are Core-Space only, asserted in one line
    (`assert_eq!(storage_cost, U256::zero())` for every Ethereum-space sender).
    Nothing an eSpace contract can do touches either.
  - >-
    THE EIP-2935 HISTORY ADDRESS IS A TRAP. The client writes epoch hashes into
    0x0000F908..2935 on every epoch — but only `if` that address has code, and it
    has none. Deploying any contract there would activate a client-side writer
    into its storage.
  - >-
    CORE-SPACE TRANSACTIONS SHARE THE BLOCK BODY AND USE A `cfx`-PREFIXED
    ENVELOPE. Typed Core transactions begin with the ASCII bytes `cfx`
    (0x63 0x66 0x78) plus 0x01/0x02, so an EIP-2718 decoder reads them as an
    unknown type-0x63 transaction. Legacy Core transactions are an untyped
    nine-field RLP list carrying `storage_limit` and `epoch_height`.
  - >-
    TWO FORK LADDERS IN TWO DIFFERENT UNITS. Some CIPs activate on DAG BLOCK
    NUMBER and some on EPOCH HEIGHT, and the two differ by a factor of ~2.42.
    "Which fork is Conflux on" needs both numbers to answer.

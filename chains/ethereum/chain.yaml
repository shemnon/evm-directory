  sender: "0xfffffffffffffffffffffffffffffffffffffffe"
  note: >-
    EIP-4788 SYSTEM_ADDRESS. Not a tx type — an implicit pre-block call. Chains that
    add protocol-driven state changes (OP deposits, Avalanche atomic ops) belong in
    this category, not in tx_types, unless they define an actual type byte.
  src: params/protocol_params.go:SystemAddress

opcodes:
  prevrandao:
    source: beacon-randao
    value: the beacon chain's RANDAO mix for the slot — 32 bytes of accumulated entropy
    chooser: >-
      the beacon proposer, by revealing its BLS signature over the epoch; the reveal is
      mixed into the beacon state before the execution payload is built, so no execution
      participant chooses it
    known_at: execution
    note: >-
      THE BASELINE. `NewEVMBlockContext` sets `random = &header.MixDigest` only when
      `header.Difficulty.Sign() == 0` — the post-merge telltale — and `opRandom` pushes
      `evm.Context.Random`. The word in `mixHash` is `get_randao_mix(state, epoch)`,
      built by XOR-ing `sha256(reveal)` into the running mix once per block. A proposer
      can withhold its block to bias the next mix by one bit, which is the known and
      bounded weakness; it cannot choose the value. Every other row on this axis is a
      delta against this sentence, and most of them are not randomness at all.
    src: "core/evm.go:NewEVMBlockContext, core/vm/instructions.go:opRandom"
  added: []
  removed: []
  modified: []
  note: >-
    baseline — the full Osaka jump table is the reference set. `baseline_set` below
    enumerates it so other rows can be rendered against the complete instruction set
    rather than only against each other's deltas: without it, a grid of opcodes has no
    way to distinguish "this chain has ADD, unremarkably" from "nobody recorded
    anything about ADD here".
  baseline_set:
    src: core/vm/jump_table.go:newOsakaInstructionSet
    note: >-
      The 150 entries for which newOsakaInstructionSet() yields an operation with
      `undefined == false`, read out of the pinned tree at the recorded commit. Opcode
      constants exist in core/vm/opcodes.go for instructions that are NOT in the active
      set, so the constant list is not the same question and would overstate this by
      several entries. CLZ (0x1e, EIP-7939) is present, which is what distinguishes
      this from the Prague set.

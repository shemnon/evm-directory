schema_version: 2

chain:
  name: Moonbeam
  slug: moonbeam
  chain_id: 1284
  role: independent
  equivalence: behavioural
  live: true
  evidence: source
  note: >-
    A Polkadot parachain whose EVM is a Substrate runtime module. There is no
    Ethereum client here: `pallet-evm` embeds the `evm` (rust-evm) interpreter
    inside a WASM state machine, `pallet-ethereum` SYNTHESISES an Ethereum block
    out of the extrinsics that executed, and the JSON-RPC layer serves that
    synthetic block. Nothing in the tree descends from go-ethereum, so deltas here
    are behavioural comparisons, not diffs — hence `role: independent` rather than
    `fork`, matching Monad, zkSync Era, Hyperliquid and Tron and NOT matching Sei
    or Kaia (which really do fork geth).

lineage:
  upstream: null
  ancestry: []
  fork_of: null
  second_heritage: null
  sync_point: >-
    The pinned tag is `runtime-4401` and the live network reports
    `state_getRuntimeVersion.specVersion = 4401` — the row is pinned to the exact
    runtime that is executing, not to a client release that may not be adopted
    yet. (The newest CLIENT tag, v0.52.3, carries spec_version 4400 and is one
    runtime behind; on Moonbeam the client tag and the consensus rules are
    different release series, which is why this row pins the runtime one.)
  note: >-
    FRAMING, argued rather than assumed. The brief for this row proposed either
    folding Frontier in, or splitting a `frontier` row with `role: template` that
    Moonbeam and other Substrate EVM chains would inherit from. This file does the
    former, for three reasons that are facts about the code, not preferences:

    (1) Moonbeam does not use `polkadot-evm/frontier`. Every Frontier crate in
    Cargo.toml resolves to `github.com/moonbeam-foundation/frontier`, branch
    `moonbeam-polkadot-stable2512`, locked at 0d6d5b8fed14f70216ddd8dd7823c30510460f47.
    A `template` row pinned to upstream Frontier would be evidence for a codebase
    this chain does not run; a `template` row pinned to Moonbeam's private fork
    would be a shared node with exactly one descendant.

    (2) The fork is not a rebase-with-patches — it is where Moonbeam's own EVM
    framework lives. `precompiles/src/precompile_set.rs` (the PrecompileSet
    builder, the DELEGATECALL/caller/static checks, `RemovedPrecompileAt`) carries
    "Copyright (c) Moonsong Labs" and has no counterpart upstream. Astar and other
    upstream-Frontier chains have none of it.

    (3) Every fact that makes this row diverge from mainnet is set in
    `runtime/moonbeam/src/`, not in the pallet: the precompile address map, the
    Weight/gas ratio, `IdentityAddressMapping` (Frontier's own default is the
    32-byte-hashing `HashedAddressMapping`), the runtime call filter, the fee
    handler, the per-transaction gas cap. Frontier supplies mechanism; Moonbeam
    supplies every value that shows up as a delta. A `template` node would hold
    almost nothing.

    Revisit if a second Frontier chain lands (Astar is the obvious candidate) AND
    it shares an upstream with this one. It currently would not.

client:
  name: moonbeam (runtime)
  repo: https://github.com/moonbeam-foundation/moonbeam
  version: runtime-4401
  commit: c6d58748be27e40126788c3eca48234e85a6e6ec
  language: rust
  built_on: Substrate/Polkadot-SDK stable2512 + rust-evm
  note: >-
    The consensus artefact is the WASM runtime blob, not the node binary. The
    runtime declares `spec_version: 4401`
    (runtime/moonbeam/src/lib.rs:VERSION) and the live chain reports the same, so
    this pin is exact rather than aspirational.
  companion_repos:
  - {name: frontier, repo: "https://github.com/moonbeam-foundation/frontier",
     version: "moonbeam-polkadot-stable2512 (branch)",
     commit: 0d6d5b8fed14f70216ddd8dd7823c30510460f47,
     provides: "pallet-evm, pallet-ethereum, fp-evm (the EVM config), and precompile-utils (the PrecompileSet/checks framework). Moonbeam's OWN fork of Frontier, not polkadot-evm/frontier; the revision is the one Cargo.lock resolves the branch to."}
  - {name: moonkit, repo: "https://github.com/Moonsong-Labs/moonkit",
     version: "moonbeam-polkadot-stable2512 (branch)",
     commit: 8fae4417637f8e55ea04b3548809d7f1c22daf64,
     provides: "pallet-evm-precompile-xcm — the precompile installed at 0x081a"}

live_probe:
  endpoint: https://moonbeam.api.onfinality.io/public
  chain_id: 1284
  observed_at_block: 16790908      # 0x100357c, the finalized head at probe time
  note: >-
    The documented endpoint https://rpc.api.moonbeam.network was not reachable
    from the environment this row was built in (TCP connect timeout, repeatedly,
    while other hosts resolved and answered). Two independent public endpoints —
    onfinality and 1rpc.io/glmr — agreed on chain id, head height, head timestamp
    and the finalized height, so the observations below are not one provider's
    view. onfinality is used because it also exposes the Substrate RPC namespace,
    which is how `specVersion` was read.

consensus:
  engine: Nimbus (parachain collators) + Polkadot relay-chain validation
  finality: relay-chain GRANDPA finality after backing/inclusion
  block_time: 6s
  note: >-
    Not an Ethereum consensus engine at any layer. Blocks are Substrate blocks
    with a Substrate header (parent, number, state root, extrinsics root,
    digest); the "Ethereum block" that eth_getBlockByNumber returns is
    constructed inside the runtime and stored in state. Async backing is
    configured with UNINCLUDED_SEGMENT_CAPACITY 3 and BLOCK_PROCESSING_VELOCITY 1
    against a 6000 ms relay slot.
  src: "runtime/moonbeam/src/lib.rs:ConsensusHook"

baseline_fork: osaka
baseline_note: >-
  Declared by the interpreter, not by a fork schedule: fp-evm hardcodes
  `pub static EVM_CONFIG: Config = Config::osaka()` and pallet-evm's
  `Config::config()` returns it, with no timestamp or block gate anywhere. The
  claim was checked behaviourally rather than taken on trust — PUSH0 (EIP-3855),
  TSTORE/TLOAD (EIP-1153), MCOPY (EIP-5656), BASEFEE, the BLS12-381 set
  (EIP-2537) and EIP-7702 all work live, while BLOBHASH and BLOBBASEFEE are
  rejected as INVALID OPCODES and every Cancun/Prague system contract is absent.
  So: Osaka's EVM, minus everything 4844 and minus the entire system-contract
  half of Cancun/Prague.

forks:
  src: "frontier/primitives/evm/src/lib.rs:EVM_CONFIG"
  note: >-
    THE ACTIVATION MECHANISM THAT BREAKS EVERY READING STRATEGY IN THIS DATASET. Moonbeam has no fork names, no `*Time` fields, no
    `*Block` numbers and no client-side fork gate. The EVM ruleset is a compile-
    time constant inside the WASM runtime, and the runtime is a value IN STATE,
    replaced wholesale by a governance-authorised `set_code` at whatever block
    the upgrade is enacted. A node that never updates its binary still follows
    the new rules, because it executes the runtime it reads out of the chain.
    "Read the fork timestamp" has nothing to read; the only fork identifier is
    `spec_version`, and the only way to date a rule change is to find the block
    where spec_version changed.
  timeline:
  - {name: "runtime 4401", mainnet_equivalent: osaka, status: active,
     activation_time: null,
     note: "the spec_version live at the observed block; EVM config Config::osaka()",
     src: "runtime/moonbeam/src/lib.rs:VERSION"}
  - {name: "earlier runtimes", mainnet_equivalent: null, status: active,
     note: "Moonbeam has shipped 4400, 4304, 4303 ... as tags `runtime-NNNN`. Which EVM ruleset each carried, and the block at which each was enacted, is NOT established here."}

eips:
  # Stated as a delta against mainnet at Osaka. Only entries that differ, plus the
  # handful whose presence was worth proving rather than assuming.
  155:
    status: modified
    note: >-
      Unprotected (pre-155) transactions are REJECTED, not merely discouraged:
      `AllowUnprotectedTxs = false` is passed to pallet-ethereum, so a legacy
      transaction carrying no chain id is invalid. Mainnet still accepts them.
    src: "runtime/moonbeam/src/lib.rs:AllowUnprotectedTxs"
  1559:
    status: modified
    severity: high
    note: >-
      The header carries `baseFeePerGas` and it is NOT an EIP-1559 base fee. It is
      Substrate's transaction-payment congestion multiplier, re-denominated into
      wei per gas: `TransactionPaymentAsGasPrice::min_gas_price()` multiplies
      `TransactionPayment::next_fee_multiplier()` by WEIGHT_FEE * WEIGHT_PER_GAS.
      The update rule is `TargetedFeeAdjustment` — a slow-adjusting controller
      targeting 35% block fullness with AdjustmentVariable 4/1000 — not 1559's
      +-12.5% step against a 50% target. Any fee estimator that models the next
      base fee from parent gasUsed with the 1559 formula is wrong on every block,
      silently, and the error compounds over a congestion episode. The multiplier
      is also driven by TOTAL block weight, which includes non-EVM extrinsics, so
      the EVM base fee moves in response to Substrate traffic that never appears
      in any Ethereum block.
    src: "runtime/moonbeam/src/lib.rs:TransactionPaymentAsGasPrice, runtime/moonbeam/src/lib.rs:SlowAdjustingFeeUpdate"
    src_live: "eth_getBlockByNumber @ 16790908 -> baseFeePerGas 0x746a52880 (31.25 gwei), unchanged across the sampled range"
  1153:
    status: inherited
    src_live: "eth_call CREATE @ 16790908 with 602a60005d60005c60005260206000f3 -> 0x..2a (TSTORE then TLOAD round-trips)"
  2537:
    status: inherited
    note: >-
      The BLS12-381 precompiles are present at 0x0b-0x11 as a Moonbeam-installed
      set (pallet-evm-precompile-bls12381), not as a fork inheritance.
    src: "runtime/moonbeam/src/precompiles.rs:Bls12381Pairing"
    src_live: "eth_call @ 16790908 to 0x0b with 256 zero bytes -> 128 zero bytes (G1ADD of infinity+infinity)"
  2935:
    status: removed
    note: "no history-storage contract at 0x0000F90827F1C53a10cb7A02335B175320002935; BLOCKHASH is served from pallet-ethereum's own BlockHash map instead."
    src: "frontier/frame/ethereum/src/lib.rs:EthereumBlockHashMapping"
    src_live: "eth_getCode @ 16790908 at 0x0000F90827F1C53a10cb7A02335B175320002935 -> 0x"
  3855:
    status: inherited
    src_live: "eth_call CREATE @ 16790908 with 602a5f5260206000f3 -> 0x..2a (PUSH0 executes)"
  4844:
    status: removed
    severity: high
    note: >-
      Removed in three independent places, which is why a single check misses it.
      (a) There is no blob transaction type — pallet-ethereum's `TransactionV3`
      enumerates Legacy / EIP2930 / EIP1559 / EIP7702 and has no 4844 variant.
      (b) BLOBHASH (0x49) and BLOBBASEFEE (0x4a) are not merely zero-valued, they
      are INVALID OPCODES: execution aborts with `InvalidCode(Opcode(73))` /
      `InvalidCode(Opcode(74))`. (c) The point-evaluation precompile at 0x0a is
      absent — see the precompiles section, where the failure is silent rather
      than loud.
    src: "frontier/frame/ethereum/src/lib.rs:store_block"
    src_live: "eth_call CREATE @ 16790908 with 60004960005260206000f3 -> error evm error: InvalidCode(Opcode(73))"
  4788:
    status: removed
    note: "no beacon-roots contract; there is no beacon chain to read."
    src_live: "eth_getCode @ 16790908 at 0x000F3df6D732807Ef1319fB7B8bB8522d0Beac02 -> 0x"
  4895:
    status: removed
    note: "no withdrawals. The synthesised Ethereum header has no withdrawalsRoot field at all — see header_fields."
    src: "frontier/frame/ethereum/src/lib.rs:store_block"
  5656:
    status: inherited
    src_live: "eth_call CREATE @ 16790908 with 602a6000526020600060205e60206020f3 -> 0x..2a (MCOPY executes)"
  7002:
    status: removed
    src_live: "eth_getCode @ 16790908 at 0x00000961Ef480Eb55e80D19ad83579A64c007002 -> 0x"
  7251:
    status: removed
    src_live: "eth_getCode @ 16790908 at 0x0000BBdDc7CE488642fb579F8B00f3a590007251 -> 0x"
  7516:
    status: removed
    note: "BLOBBASEFEE is an invalid opcode, not a zero-returning one."
    src_live: "eth_call CREATE @ 16790908 with 4a60005260206000f3 -> error evm error: InvalidCode(Opcode(74))"
  7702:
    status: inherited
    note: >-
      Live and used. A type-0x04 transaction with a populated authorizationList
      was observed in the last block range that carried any EVM traffic.
    src: "frontier/frame/ethereum/src/lib.rs:store_block"
    src_live: "eth_getBlockByNumber @ 16672831 -> tx 0x7d35d07aa06b004099fe18da475c741dd3ce25e8543cfc2a094ac2b82b2db2a8 type 0x4, authorizationList[0].address 0x45108c593b5b4c1261017d954c9947a5547b57c2"
  7623:
    status: unrecorded
    note: >-
      An eth_estimateGas on a 160-byte-calldata call to the identity precompile
      returned 27673, which is the EIP-7623 floor (21000 + 10*634 = 27340) plus a
      constant 330 that also appears on the P256VERIFY control. Consistent with
      7623 being active, but the floor was not isolated from the estimator's
      constant, so this is not asserted.
    src_live: "eth_estimateGas @ 16790908 to 0x04 with 160 bytes -> 0x6c19 (27673)"
  7825:
    status: modified
    note: >-
      The per-transaction gas cap exists but is not 2^24. Frontier's default
      `TransactionGasLimit` is `MAX_TRANSACTION_GAS_LIMIT` = 16777216, exactly
      EIP-7825; Moonbeam overrides it with TX_MAX_GAS_LIMIT = 35_000_000. So a
      transaction between 16.78M and 35M gas is valid here and invalid on
      mainnet. Exceeding it is rejected as `TransactionGasLimitExceedsCap`.
    src: "runtime/common/src/lib.rs:TX_MAX_GAS_LIMIT, frontier/primitives/evm/src/lib.rs:MAX_TRANSACTION_GAS_LIMIT, frontier/primitives/evm/src/validation.rs:TransactionGasLimitExceedsCap"

non_eip_specs:
  # Moonbeam runs its own proposal series, the MBIPs, in-tree.
  adopted:
  - {id: MBIP-5, title: "Introduce a gas-based storage limit",
     note: "the third metering dimension: a transaction may grow state by at most gas_limit / GasLimitStorageGrowthRatio bytes (366 on Moonbeam), and exceeding it fails as OutOfGas.",
     src: "MBIPS/MBIP-5.md"}
  withdrawn:
  - {id: MBIP-1, title: "Smart Contract Creation Deposit", src: "MBIPS/MBIP-1.md"}
  - {id: MBIP-2, title: "Storage Data Deposit", src: "MBIPS/MBIP-2.md"}
  - {id: MBIP-3, title: "Rent mechanism", src: "MBIPS/MBIP-3.md"}
  - {id: MBIP-4, title: "Introduce a (hidden) storage base fee", src: "MBIPS/MBIP-4.md"}
  - {id: MBIP-6, title: "Externally recordable EVM metrics", src: "MBIPS/MBIP-6.md"}

tx_types:
  envelope:
    status: inherited
    present: "0x00-0x02, 0x04"
    src: derived from the eips map (2930 / 1559 / 4844 / 7702); see those entries
    note: >-
      The EIP-2718 envelope this chain accepts in mainnet shape; no blob transactions
      (EIP-4844). Derived from the eips map (2930/1559/4844/7702); per-type divergences and
      their evidence are on the rows below.
  note: >-
    Moonbeam adds NO type byte. It subtracts one (0x03) and it wraps all of them:
    every Ethereum transaction on this chain is the payload of a Substrate
    `Ethereum::transact` extrinsic. See non_evm_transactions.
  "0x00":
    name: Legacy
    status: modified
    note: "accepted only in EIP-155 protected form; AllowUnprotectedTxs is false."
    src: "runtime/moonbeam/src/lib.rs:AllowUnprotectedTxs"
    src_live: "eth_getBlockByNumber @ 16672830-16672959 -> 70 of 105 transactions are type 0x0"
  "0x01":
    name: EIP-2930 access list
    status: inherited
    src: "frontier/frame/ethereum/src/lib.rs:store_block"
  "0x02":
    name: EIP-1559
    status: modified
    note: >-
      The envelope is standard; what `maxFeePerGas` is measured against is not
      (see eips.1559). Also the shape XCM-originated EVM calls are forced into —
      those appear in blocks as type 0x02 with a constant, invalid signature.
    src_live: "eth_getBlockByNumber @ 16672830-16672959 -> 34 of 105 transactions are type 0x2"
  "0x03":
    name: EIP-4844 blob
    status: removed
    note: "not a variant of pallet-ethereum's transaction enum; there is no blob market and no L1 to post to."
    src: "frontier/frame/ethereum/src/lib.rs:store_block"
  "0x04":
    name: EIP-7702 set code
    status: inherited
    src_live: "eth_getBlockByNumber @ 16672831 -> 1 transaction of type 0x4 with a non-empty authorizationList"

tx_authorization:
  key_binding: derived
  signers_per_tx: 1
  note: >-
    Two findings, opposite in sign.

    (1) The account model is genuinely 20-byte native, and that is stronger than
    it sounds. `AccountId` is `AccountId20`, derived from a secp256k1 public key
    by keccak exactly as on Ethereum, and pallet-evm is configured with
    `IdentityAddressMapping` — the H160 IS the AccountId, with no hashing step.
    Frontier's own default is `HashedAddressMapping`, so this is a Moonbeam
    choice, not a Frontier property, and the usual Substrate hazard (a 32-byte
    account holding funds the EVM cannot see) does not exist here. The
    consequence runs the other way: ONE secp256k1 key authorises BOTH envelopes.
    The same key signs Ethereum transactions and signs Substrate extrinsics, and
    because pallet-evm is configured with `FrameSystemAccountProvider` the two
    share a single nonce counter — a Substrate extrinsic increments the value
    `eth_getTransactionCount` returns.

    (2) sr25519 and ed25519 cannot authorise anything, and the code says so by
    panicking rather than by returning an error: `EthereumSignature`'s
    `From<MultiSignature>` impl has `panic!("Ed25519 not supported")` and
    `panic!("Sr25519 not supported")` arms. Polkadot's two native schemes are
    unrepresentable in this runtime's signature type.

    The interesting cell is the third scheme below.
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      note: "authorises both the EIP-2718 envelope and the Substrate extrinsic envelope, over one shared nonce."
      src: "primitives/account/src/lib.rs:EthereumSignature"
    p256:
      status: added
      authorizes: never
      precompile: "0x0100"
      note: "verifiable at 0x0100 (RIP-7212 shape), never an authentication method for a sender."
      src: "runtime/moonbeam/src/precompiles.rs:P256Verify"
    sr25519:
      status: removed
      authorizes: never
      precompile: none
      note: "Polkadot's default scheme. Not merely unused — `EthereumSignature::from(MultiSignature::Sr25519)` panics."
      src: "primitives/account/src/lib.rs:EthereumSignature"
    ed25519:
      status: removed
      authorizes: never
      precompile: none
      note: "same panic arm. Frontier ships pallet-evm-precompile-ed25519; Moonbeam does not install it, so there is not even a verifier."
      src: "primitives/account/src/lib.rs:EthereumSignature"
    xcm_origin:
      status: added
      authorizes: protocol
      precompile: none
      severity: high
      note: >-
        THE unpaired one. A message from another parachain can execute an EVM
        transaction whose sender is an XCM-derived account, and the runtime
        forges an Ethereum envelope for it: `pallet-ethereum-xcm` builds an
        `EIP1559Transaction` with r = s = H256::from_low_u64_be(1) — a fixed,
        deliberately invalid signature — and stores it in the Ethereum block. The
        result appears over JSON-RPC as an ordinary type-0x02 transaction with a
        `from`, an `r` and an `s`, and `ecrecover` over it does not yield `from`
        and never can. No contract on Moonbeam can verify the authorisation
        behind such a transaction, and no indexer that trusts the signature can
        tell one from a user transaction except by recognising the constant.
        `transact_through_proxy` widens it further: the XCM origin may act as any
        LOCAL account that granted it a zero-delay `ProxyType::Any` proxy, so
        `msg.sender` becomes a Moonbeam account that signed nothing in this
        transaction. `force_transact_as` lets Root do the same with no proxy at
        all.
      src: "primitives/xcm/src/ethereum_xcm.rs:rs_id, pallets/ethereum-xcm/src/lib.rs:transact_through_proxy, runtime/moonbeam/src/lib.rs:EthereumXcmEnsureProxy"

non_evm_transactions:
  note: >-
    Every EVM state transition on this chain arrives inside a Substrate
    extrinsic — the Ethereum envelope is the guest here, not the host. Moonbeam
    shows BOTH shapes the dataset has met: an EIP-2718 payload surviving
    byte-exact inside another encoding (the cosmos-evm shape) and a native
    non-Ethereum call that produces EVM execution (the Tron shape). It also
    closes the obvious third path: `pallet_evm::Call::call`, the textbook
    "Substrate extrinsic that calls the EVM pallet", is unreachable by anyone
    because the runtime call filter has `RuntimeCall::EVM(_) => false`
    unconditionally, with a comment citing re-entrancy.
  entries:
  - id: "Ethereum::transact"
    name: "self-contained extrinsic wrapping a byte-exact EIP-2718 payload"
    note: >-
      The cosmos-evm shape, not the Tron shape: the RLP/2718 transaction survives
      byte-for-byte inside a SCALE-encoded extrinsic, is signature-checked by
      `check_self_contained` rather than by the normal signed-extension pipeline,
      and pays through pallet-ethereum rather than transaction-payment. Not an
      exotic case — it is how 100% of Ethereum traffic reaches this chain. An
      indexer reading Substrate blocks sees extrinsics with no `from`; an indexer
      reading eth_getBlockByNumber sees a block that exists only because the
      runtime built it.
    src: "frontier/frame/ethereum/src/lib.rs:check_self_contained"
  - id: "EthereumXcm::transact"
    name: "SCALE EthereumXcmTransaction (V1/V2/V3) — no type byte, no signature, no sender nonce"
    note: >-
      An EVM execution requested by another parachain. The payload carries only
      gas_limit, action, value, input and access_list (V3 adds a reserved
      authorization_list) — there is no signature field to omit, because there
      never was one. Three further divergences from the Ethereum path: the nonce
      written into the forged transaction is a CHAIN-GLOBAL counter
      (`pallet_ethereum_xcm::Nonce`), not the sender's, so the `nonce` field of
      these transactions bears no relation to `eth_getTransactionCount(from)`;
      validation runs with `base_fee: 0` because the XCM executor already bought
      the weight; and the effective block gas limit for this path is
      `weight_to_gas(ReservedXcmpWeight)` = 20,000,000, a third of the 60,000,000
      the header advertises.
    src: "pallets/ethereum-xcm/src/lib.rs:validate_and_apply, runtime/moonbeam/src/lib.rs:ReservedXcmpWeight"
  - id: "EthereumXcm::transact_through_proxy"
    name: "the same, executed as a LOCAL account that granted the XCM origin an Any proxy"
    src: "pallets/ethereum-xcm/src/lib.rs:transact_through_proxy"
  - id: "EthereumXcm::force_transact_as"
    name: "the same, executed as ANY address, Root only, with an optional forced CREATE address"
    src: "pallets/ethereum-xcm/src/lib.rs:force_transact_as"
  filter_src: "runtime/moonbeam/src/lib.rs:NormalFilter"

precompiles:
  base_map:
    status: inherited
    present: "0x01-0x09, 0x0b-0x11"
    p256verify: true
    src: runtime/moonbeam/src/precompiles.rs
    note: >-
      Ethereum's range answers, but 0x01-0x09 are `modified`: each carries a 5-byte
      dummy CODE (0x60006000fd) so EXTCODESIZE is 5 not 0, flipping every
      isContract/extcodehash check. KZG at 0x0a is removed (no EIP-4844). BLS12-381
      0x0b-0x11 are real precompiles with empty code. P256VERIFY at 0x0100 is present
      (modified). Moonbeam's own precompiles are at 0x0800-0x081a — see the rows.
  note: >-
    47 addresses answer as precompiles, in three bands (0x01-0x0100 Ethereum's,
    0x0400-0x0402 non-Ethereum-but-not-Moonbeam-specific, 0x0800-0x081a
    Moonbeam's own). The address list is the least interesting thing about them —
    see the four cross-cutting facts recorded on the entries below: 5-byte dummy
    CODE at 36 of the 47, DELEGATECALL refusal on the Moonbeam band, caller-class
    restrictions, and state-writing dispatch into non-EVM consensus state.
  "0x0000000000000000000000000000000000000001":
    name: ECRECOVER
    status: modified
    severity: high
    note: >-
      Result-identical to mainnet; the ACCOUNT is not. `eth_getCode` returns the
      5-byte constant 0x60006000fd (PUSH1 0 PUSH1 0 REVERT) and
      `EXTCODESIZE(0x01)` is 5, where mainnet returns 0. The code is never
      executed — the precompile intercepts first — but every `addr.code.length ==
      0` EOA test, every `isContract()` guard and every `extcodehash == 0` check
      gives the opposite answer here than on mainnet, with no revert and no
      signal. The code is written per-address by anyone calling

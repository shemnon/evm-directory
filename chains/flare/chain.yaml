system_transactions:
  note: >-
    Ethereum's one system transaction (EIP-4788's beacon-root write) is absent — no
    beacon chain. Flare replaces it with four client-driven state changes, all
    piggybacked on ordinary user transactions rather than occupying a slot of their
    own, and none of them visible as a transaction in any block.
  entries:
  - name: trigger + mint
    status: added
    note: >-
      Runs after EVERY successful transaction, after the fee has been settled and
      outside the user's call frame. Calls 0x1000..0002 with 100x the block gas
      limit, free, then mints up to 60,000,000 FLR to that contract based on the
      returned word. This is the mechanism by which FTSO rewards, the incentive pool
      and inflation are funded, and it is the second mechanism in this dataset after
      subnet-evm's ContractNativeMinter that increases native supply outside block
      rewards — but unlike that one it is unconditional and needs no allowlist.
    src: "coreth/core/daemon.go:atomicDaemonAndMint, coreth/core/daemon.go:mint, coreth/core/state_transition.go:571"
  - name: State Connector round finalisation
    status: tombstoned
    tombstoned_at: 1754395200
    note: >-
      Ran on any transaction that called submitAttestation on 0x1000..0001 and
      returned a first-buffer-slot flag: nine client-side calls to fixed attestation
      providers, a plurality vote, then a finaliseRound call with msg.sender and
      block.coinbase rewritten to 0x..DEaD1. Gated off at Durango
      (`!isDurango && ...`). A node operator could set SC_LOCAL_ATTESTATORS and
      SC_FORKING_ENABLED=1 to make its own node halt when its local attestors
      disagreed with the default set — a deliberate, configurable consensus split.
    src: "coreth/core/state_connector.go:GetStateConnectorIsActivatedAndCalled, coreth/core/state_connector.go:FinalisePreviousRound"
  - name: governance address / timelock re-execution
    status: added
    note: "re-runs the same calldata against 0x1000..0007 with msg.sender = block.coinbase = 0x..DEaD0, only for arguments the client's own allowlist permits"
    src: "coreth/core/governance_settings.go:SetGovernanceAddress, coreth/core/governance_settings.go:SetTimelock"
  - name: treasury balance sweep
    status: added
    note: >-
      A 4-byte call to either of two hardcoded addresses makes the client move the
      ENTIRE balance of a genesis treasury to another address with SubBalance /
      AddBalance — a value transfer with no transaction, no trace frame, and no log.
    src: "coreth/core/governance_settings.go:UpdateInitialAirdropAddress, coreth/core/governance_settings.go:UpdateDistributionAddress"

opcodes:
  added: []
  removed: []
  modified: []
  note: >-
    No opcode divergence, and no second VM. Flare's changes live entirely in the
    state transition, the fee accounting and the genesis allocation.

fee_model:
  metering: gas
  fee_market: ACP-176 dynamic fee (coreth), with a Flare-specific per-call override
  extra_components: [prioritised-call flat fee]
  severity: high
  note: >-
    TWO FLARE-SPECIFIC RULES.

    (1) EVERYTHING BURNS. The whole fee — base fee and priority fee alike — is
    credited to 0x000000000000000000000000000000000000dEaD. The block producer's
    address is the blackhole 0x0100..0000 in every header and it receives nothing,
    so validator revenue on Flare is not transaction fees.

    (2) PRIORITISED CALLS ARE CHARGED A FLAT FEE, AND THE RECEIPT DOES NOT SAY SO.
    If a transaction targets 0x1000..0003 or 0x2cA6..c33f with an allowlisted
    selector, within the calldata and gas-limit caps, and its call returned a
    non-zero word, then after execution the client computes
    nominalFee = 21000 * 25 gwei, refunds (actualFee - nominalFee) to the SENDER, and
    burns only the nominal amount. gasUsed and effectiveGasPrice in the receipt are
    untouched and describe the charge that did not happen.

    Measured at block 68124744: a submission transaction reports gasUsed 212362 at
    effectiveGasPrice 1625 gwei, implying a fee of 0.34508825 FLR. The sender's
    balance fell by 0.000525 FLR. The receipt overstates the fee by 657x, with
    status 0x1 and no other signal. Across the whole block, receipts imply 1.31034165
    FLR of fees while the burn address received 0.05638215 FLR.

    This is the majority path, not an edge case: 86% of sampled transactions qualify.
    Any fee accounting, gas-cost dashboard, MEV estimate or revenue model built on
    Flare receipts is wrong by two to three orders of magnitude.
  src: "coreth/core/state_transition.go:550-568, coreth/core/daemon.go:IsPrioritisedContractCall, coreth/core/state_transition_params.go:stateTransitionParamsFlare"
  src_live: "receipt of 0x5dbbbce34e3cdf774908dd2931f596cb3eabc6bceba7f6f3dd715a6a10e9446d @ 68124744 -> gasUsed 212362 x 1625 gwei = 0.34508825 FLR; eth_getBalance of its sender 68124743 -> 68124744 delta -0.000525 FLR"

header_fields:
  added:
    - {name: extDataHash, note: "Avalanche atomic-tx data commitment; from coreth, not Flare", src: coreth/plugin/evm/customtypes/header_ext.go:ExtDataHash}
    - {name: extDataGasUsed, note: "gas attributed to atomic transactions", src: coreth/plugin/evm/customtypes/header_ext.go:ExtDataGasUsed}
    - {name: blockGasCost, note: "ACP-176 block cost", src: coreth/plugin/evm/customtypes/header_ext.go:BlockGasCost}
    - {name: timestampMilliseconds, note: "Granite; sub-second block times", src: coreth/plugin/evm/customtypes/header_ext.go:TimeMilliseconds}
    - {name: minDelayExcess, note: "ACP-226 minimum block delay, Granite", src: coreth/plugin/evm/customtypes/header_ext.go:MinDelayExcess}
  removed: []
  modified:
    - {name: blobGasUsed, note: "must be 0", src: coreth/plugin/evm/wrapped_block.go:errBlobsNotEnabled}
    - {name: excessBlobGas, note: "must be 0", src: coreth/plugin/evm/wrapped_block.go:errInvalidExcessBlobGas}
    - {name: parentBeaconBlockRoot, note: "must be the empty hash — no beacon chain", src: coreth/plugin/evm/wrapped_block.go:errParentBeaconRootNonEmpty}
    - {name: miner, note: "always the blackhole 0x0100..0000; header validation rejects any other value, and it receives no fees", src: coreth/plugin/evm/wrapped_block.go:431}
  note: >-
    The five added fields are coreth's, not Flare's, and are recorded here because
    inheritance does not resolve across a `fork` upstream. They are RLP-appended to
    the Ethereum header and therefore inside the block hash. These live observations
    contradicted `chains/avalanche-c/chain.yaml`, which recorded
    `header_fields.added: []`; that row has since been corrected against its own
    pinned coreth, where all five fields are present.
  src_live: "eth_getBlockByNumber @ 68124744 -> extDataHash, extDataGasUsed, blockGasCost, blockExtraData, minDelayExcess, timestampMilliseconds present alongside the Cancun fields"

gotchas:
  - >-
    THE FTSO AND STATE CONNECTOR ARE NOT PRECOMPILES. 0x1000..0001-0007 hold real
    EVM bytecode from the genesis allocation; eth_getCode returns 2.1KB-13.6KB at
    each. Flare adds ZERO precompile addresses to coreth's map. Any survey that went
    looking for oracle precompiles here finds none, and any tool that treats these
    addresses as native code is wrong in the opposite direction.
  - >-
    RECEIPTS OVERSTATE FEES BY UP TO ~657x ON THE MAJORITY OF TRANSACTIONS. FTSO/FDC
    submissions are charged a flat 21000 x 25 gwei and refunded the difference after
    execution, while gasUsed and effectiveGasPrice in the receipt still describe the
    unrefunded amount. Status is 0x1, nothing reverts, and 86% of sampled traffic
    takes this path.
  - >-
    A SYSTEM CALL RUNS AFTER EVERY TRANSACTION AND CAN MINT NATIVE COIN. trigger()
    on 0x1000..0002 executes with 100x the block gas limit, free, and its 32-byte
    return value is minted (up to 60,000,000 FLR) straight onto that contract's
    balance. Its logs appear inside the triggering user's receipt.
  - >-
    THE CLIENT MAKES EVM CALLS AS ADDRESSES WITH NO PRIVATE KEY, and rewrites
    block.coinbase to those addresses for the duration. 0x..DEaD1, 0x..DEaD0,
    0x..dead2, 0x..deAD3. block.coinbase is not a stable observation inside a
    transaction on this chain.
  - >-
    NO PRAGUE, NO OSAKA, NO EIP-7702 — the same Cancun ceiling as the C-Chain, but
    reached about a year later. Flare activated Durango 17 months after Avalanche,
    Etna 11.5 months after, Granite 8 months after. "Runs current coreth" does not
    mean "allows what current coreth allows".
  - >-
    0x0100 IS THE REAL P256VERIFY HERE, at mainnet's exact 6900 gas and mainnet's
    exact semantics, arriving at Granite. Flare is the control case for the
    Hyperliquid/Sei/Sonic failures — but it still has no BLS12-381 at 0x0b-0x11, so
    inferring fork level from precompile presence fails on this chain too.
  - >-
    THE WARP PRECOMPILE HAS BYTECODE. eth_getCode at 0x0200..0005 returns 0x01, a
    deliberate one-byte marker written into state so Solidity's extcodesize guard
    lets contracts call it. "eth_getCode returns 0x" is therefore NOT a sound test
    for precompile-ness on Avalanche-lineage chains.

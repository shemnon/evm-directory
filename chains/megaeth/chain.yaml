schema_version: 2

chain:
  name: MegaETH
  slug: megaeth
  chain_id: 4326
  role: fork
  live: true
  evidence: source
  chain_id_src: "stateless-validator/test_data/mainnet/genesis.json:chainId"
  chain_id_src_live: "eth_chainId @ 24869120 -> 0x10e6 (4326); eth_call CHAINID @ 24869120 -> 0x10e6"
  note: >-
    An OP Stack L2 whose EVM is a revm/op-revm fork, not op-geth. The EVM itself is
    open source and released under tags; the SEQUENCER/full node (`mega-reth`) is not.
    The row is `evidence: source` because two released, pinned repos supply the state
    transition — mega-evm is the EVM the sequencer embeds, and stateless-validator is
    an independent second client that re-executes every block from it — but every claim
    about mini-blocks, block production and the realtime API rests on `src_live:` and
    `src_doc:`, because that code is not published. Both are marked as such below.

lineage:
  upstream: op-stack
  ancestry: [ethereum, op-stack]
  fork_of: null
  note: >-
    MegaETH is an OP Stack chain by derivation and predeploys, but NOT by client code:
    mega-evm builds on revm + op-revm, so it inherits OP semantics as a LIBRARY
    (`OpSpecId::ISTHMUS`) rather than as a diff against op-geth. Every MegaETH EVM spec
    from EQUIVALENCE through REX6 maps to exactly one OP spec — Isthmus — and thence to
    Ethereum Prague. The OP predeploy set is live and unmodified (0x42..11 is the block
    beneficiary in every header observed), and the DA path is EigenDA with the
    certificate batched to Ethereum L1.
  sync_point: >-
    STOPS AT ISTHMUS. `MegaSpecId::into_op_spec` maps all nine MegaETH specs to
    `OpSpecId::ISTHMUS`, and the mainnet genesis schedules OP forks only through
    `isthmusTime: 0`. The op-stack row pins a Jovian/Karst client, so MegaETH has NONE
    of OP Stack's post-Isthmus changes: not Jovian's repurposing of `blobGasUsed` as a
    DA footprint, not Jovian's BLS12-381 input caps, not Karst. Inheriting the op-stack
    row wholesale would over-state this chain. Granite's BN256 pairing cap and Fjord's
    P256VERIFY at 0x0100 ARE inherited (both precede Isthmus).
  src: "mega-evm/crates/mega-evm/src/evm/spec.rs:into_op_spec, stateless-validator/test_data/mainnet/genesis.json:isthmusTime"

client:
  name: mega-evm (MegaEVM)
  repo: https://github.com/megaeth-labs/mega-evm
  version: v1.7.0
  commit: 30ce038cfb0ec108e886ef48105a7ab367a99b33
  language: rust
  built_on: revm 27.1.0 + op-revm
  note: >-
    THE EVM, NOT THE NODE. mega-evm is the state-transition function: spec ladder,
    instruction tables, precompile overrides, resource limits, system contracts and
    the `mega-evme` / `mega-t8n` replay tools. The node that produces blocks is
    `mega-reth`, which is NOT public — the live RPC identifies itself as
    `mega-reth/v2.2.0-ea126e0` and no such repo exists under megaeth-labs
    (`megaeth-labs/reth` is a stale 2025 fork with only `perf-v0.1.0-alpha.*` tags and
    no MegaETH code). Consequently: everything the EVM decides is `src:`; everything
    the SEQUENCER decides — mini-block production, block-building limits, the realtime
    API — is `src_live:` or `src_doc:`.
  companion_repos:
  - {name: stateless-validator, repo: "https://github.com/megaeth-labs/stateless-validator",
     version: v2.0.16, commit: 11078d7b54c0500710a9e7f08d2fc1d76e6ca609, language: rust,
     provides: "an independent re-execution client (chain spec, block executor, withdrawals root) and the canonical mainnet genesis with the full hardfork schedule"}
  note_second_client: >-
    stateless-validator is a genuine second implementation — it depends on mega-evm at
    the same tag (`Cargo.toml: mega-evm ... tag = \"v1.7.0\"`) and re-executes blocks
    against SALT witnesses instead of full state. Its README claims a third executor
    built on the K semantics of the EVM. That is a stronger client-diversity position
    than any other chain in this dataset that keeps its sequencer closed.


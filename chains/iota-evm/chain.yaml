  "0x000000000000000000000000000000000000000b": {name: BLS12-381 G1ADD, status: removed, spec: EIP-2537, note: "Prague not scheduled", src_live: "eth_call @ 12793600 -> 0x (address absent)"}
  "0x000000000000000000000000000000000000000c": {name: BLS12-381 G1MSM, status: removed, spec: EIP-2537}
  "0x000000000000000000000000000000000000000d": {name: BLS12-381 G2ADD, status: removed, spec: EIP-2537}

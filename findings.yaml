    a range mainnet has never allocated. The same chain placed `batchValidateSign` on
    BLAKE2F's `0x09` and made `0x03` return a value that is not RIPEMD160. BSC, the
    most mainnet-faithful EVM here, placed its custom precompiles at `0x64`–`0x69`,
    leaving `0x12`–`0x63` as headroom before mainnet reaches them.

- id: tombstoned-addresses
  title: Tombstoned precompile addresses
  axis: precompiles
  rank: 17
  lede: >-
    A tombstoned address is kept alive as an always-reverting stub rather than removed,
    so it is permanently consumed — and it fails differently from an absent one, which
    returns success with empty output. Two chains adopted the pattern independently.
  chains:
    avalanche-c: >-
      The native-asset trio at `0x0100..00-02` is the clearest example in the dataset of
      precompile addresses being permanently consumed: they cannot be reused and cannot
      be removed, only made to revert.
    bnb: >-
      BSC tombstoned `0x64` and `0x65` at Pasteur rather than removing them.
  body: >-
    Avalanche's native-asset trio and BSC's `0x64` and `0x65` (at Pasteur) are kept
    alive as always-reverting stubs rather than removed. The addresses are permanently
    consumed. Two chains adopted this pattern independently. A tombstoned address fails
    differently from an absent one, which returns success with empty output.

- id: fields-outlive-features
  title: Header fields carrying something other than their Ethereum meaning
  axis: fees-envelope
  rank: 18
  lede: >-
    A header field's name is not its meaning. Reading a header by JSON key name is not a
    portable operation.
  chains:
    op-stack: >-
      `blobGasUsed` carries the DA footprint, not blob gas.
    avalanche-c: >-
      `blobGasUsed` is a pinned zero that REJECTS any other value.
    linea: >-
      `extraData` carries Linea's own payload rather than anything mainnet defines.
    scroll: >-
      `extraData` carries Scroll's payload — and the block seal rides inside it, is
      stripped over RPC, and is excluded from `Header.Hash()`, so the block hash does
      not commit to the signature authorising the block.
    taiko: >-
      The block's zk gas goes in `difficulty` and is recomputed at import, breaking the
      near-universal post-merge `difficulty == 0` test.
    sonic: >-
      Three at once: `blobGasUsed` is a pinned zero from which `BLOBBASEFEE = 1` is
      derived, `extraData` carries block timing that feeds the next block's base fee,
      and the header is a 19-item RLP list with no `parentBeaconBlockRoot` and no
      `requestsHash` while the EVM is Prague — a changed field COUNT, not just a changed
      meaning.
    mantle: >-
      `blobGasUsed` is the DA footprint and — uniquely in this dataset — DRIVES THE BASE
      FEE; `extraData` carries 17 bytes of 1559 parameters.
    berachain: >-
      The header is a 22-item RLP list. The extra field is a 48-byte proposer public
      key, proven by reconstructing the block hash.
    arc: >-
      `extraData` carries an 8-byte required child base fee.
  body: >-
    A header field's name is not its meaning. `blobGasUsed` alone has five: mainnet's
    blob gas, OP Stack's DA footprint, Avalanche's pinned zero that rejects any other
    value, Sonic's pinned zero from which `BLOBBASEFEE = 1` is derived, and Mantle's DA
    footprint which — uniquely — DRIVES THE BASE FEE. `extraData` carries Linea's and
    Scroll's data, Sonic's block timing (feeding the next block's base fee), Arc's
    8-byte required child base fee, and Mantle's 17-byte 1559 parameters. Taiko puts the
    block's zk gas in `difficulty` and recomputes it at import, breaking the
    near-universal post-merge `difficulty == 0` test. Two rows change the field COUNT:
    Sonic's header is a 19-item RLP list with no `parentBeaconBlockRoot` and no
    `requestsHash` while its EVM is Prague, and Berachain's is 22 items — the extra one
    a 48-byte proposer public key, proven by reconstructing the block hash. Scroll's
    seal rides inside `extraData`, is stripped over RPC, and is excluded from
    `Header.Hash()`, so the block hash does not commit to the signature authorising the
    block. Reading a header by JSON key name is not a portable operation.


gotchas:
- >-
  A CHARGED, NONCE-BURNING TRANSACTION CAN HAVE NO RECEIPT WHILE STILL SITTING IN
  THE BLOCK. `CheckEthSenderNonce` bumps the sender's sequence in the ante handler
  and the SDK commits the ante writes before running the message. The
  `ethereumTxHash` event that the CometBFT indexer keys on is emitted by the MSG
  SERVER, after `ApplyTransaction` returns successfully — so any post-ante Cosmos
  error (`failed to commit stateDB`, the gas-overflow guards, a recovered panic)
  leaves the fee deducted and the nonce spent with `eth_getTransactionReceipt`
  returning null. An EVM revert is fine: it returns a response, not an error, and
  gets a `status: 0` receipt.
- >-
  INJECTIVE DOES NOT ERASE FAILED TRANSACTIONS FROM THE BLOCK, AND THAT IS A
  DIVERGENCE FROM ITS OWN FAMILY. `EthMsgsFromTendermintBlock` has NO result filter:
  every `MsgEthereumTx` in the CometBFT block is returned regardless of ABCI code.
  Cosmos EVM's `EthMsgsFromCometBlock` and Artela both gate on
  `TxSuccessOrExceedsBlockGasLimit` and drop failures out of `eth_getBlockByNumber`
  entirely. Injective ports that predicate but uses it only as a decode shortcut in
  `queryTendermintTxIndexer`. So the receiptless-but-charged transaction above is at
  least still visible by block scan — the nonce gap is observable here and is not on
  Artela.
- >-
  A WRONG-NONCE TRANSACTION PRESERVES THE NONCE AND PRODUCES NOTHING. The nonce
  equality check was merged into the ante-handler increment, so a stale or gapped
  nonce fails in ante: the cache is discarded, no fee is taken, the nonce is intact
  — and no `ethereum_tx` event was emitted, so there is no receipt to say so.
- >-
  THE EXCHANGE MOVES YOUR BALANCE BETWEEN BLOCKS. Injective's EndBlocker runs a
  frequent batch auction over the whole order book and settles DEFAULT-subaccount
  results straight into bank balances, which the EVM reads as `address.balance`.
  No EVM transaction, no receipt, no log, no trace — and usually no EVM
  transaction anywhere in the block. Any contract holding a balance invariant
  across a block boundary is wrong here.
- >-
  YOUR EVM BALANCE IS THE SPENDABLE BALANCE, SO IT GROWS ON A TIMER. GetBalance
  calls bankKeeper.SpendableCoin, which excludes vesting-locked coins. A vesting
  account's `address.balance` rises as the schedule unlocks, with no transaction
  of any kind and nothing to observe.
- >-
  THERE ARE NO GAS REFUNDS. RefundGas is disabled with a one-line `return nil`;
  the ante handler has already taken gasLimit x gasPrice. Every transaction pays
  for its full gas limit and every SSTORE-clear refund is discarded, while the
  receipt reports the real gasUsed. Over-estimating gas costs real money here in a
  way it does not on any other chain in this dataset.
- >-
  A 7702 TRANSACTION IS ACCEPTED AND DOES NOTHING. There is no accepted-type mask;
  a SetCodeTx passes ValidateBasic and signature verification, and then
  AsMessage builds the core.Message without SetCodeAuthorizations, so the
  delegation is dropped. No revert, no error. The ante handler charged intrinsic
  gas for the authorization list the executor never saw.
- >-
  P256VERIFY IS ABSENT AT 0x0100 AND FAILS SILENTLY. Proven live with geth's own
  VALID test vector, against a sha256 control on the same batch. Because EIP-7951
  reports an invalid signature as empty output, every passkey verification here
  returns "invalid" forever with no error. In the silent-P256 class — see
  findings.yaml:p256-silent-invalid for the other rows and their causes.
- >-
  BASEFEE RETURNS 0 WHILE THE BLOCK REPORTS A BASE FEE. The EVM hard-codes
  BlockContext.BaseFee to zero and sets NoBaseFee; the JSON-RPC `baseFeePerGas`
  comes from the txfees mempool floor, a node-local admission price that is
  disabled by default. GASLIMIT likewise returns 0 under eth_call while the header
  reports 150,000,000 — so a contract simulates differently from how it executes.
- >-
  receiptsRoot IS A CONSTANT. FormatBlock hard-codes it to the empty trie root on
  every block, including blocks with real receipts. transactionsRoot is the
  CometBFT DataHash over ALL Cosmos transactions, not a trie over the EVM
  transactions listed beside it. No receipt or log inclusion proof can work.
- >-
  gasUsed COUNTS THE EXCHANGE. It is the CometBFT block's total gas. 54 of 60
  consecutive probed blocks had zero EVM transactions and millions of gas used,
  and a receipt's cumulativeGasUsed (0xa75259) was two hundred times its own
  gasUsed (0xd715). Utilisation metrics computed from these fields measure Cosmos
  traffic.
- >-
  FOUR PRECOMPILES AT 0x64-0x67 — THE WORST ADDRESSES AVAILABLE. Exactly where
  Arbitrum puts ArbSys/ArbInfo/ArbAddressTable/ArbBLS and BSC puts its
  cross-chain precompiles, with opBNB already making two of them three-way.
  Injective makes all four four-way. None of the framework's 0x0100/0x0400/
  0x0800-0x0807 addresses exists here.
- >-
  A PRECOMPILE THAT TRADES, AND ONE THAT MINTS. 0x65 can place and cancel spot,
  derivative and binary-option orders, deposit, withdraw and transfer between
  subaccounts, dispatching each through the Cosmos authz keeper — so an EVM
  contract holding a grant can act for a user who signed nothing. 0x64 can mint,
  burn and transfer bank supply, unlike cosmos/evm's query-only bank precompile.
  Both are readonly-guarded, so STATICCALL is still safe.
- >-
  ed25519 CAN AUTHORIZE A TRANSACTION HERE AND NOTHING ON-CHAIN CAN VERIFY IT.
  cosmos/evm and Sei both refuse ed25519 at the same switch; Injective's copy
  returns nil. There is no Ed25519 verifier at any address on the chain, and the
  balances such a signature moves are the ones the EVM reads. `authorizes:
  protocol` with `precompile: none`.
- >-
  AN EIP-712 SIGNATURE SCOPED TO ETHEREUM MAINNET IS ACCEPTED ON INJECTIVE. The
  typed-data domain's chainId may be 1 as well as 1776, deliberately, so that
  MetaMask users need not switch networks. EIP-712's whole cross-chain defence is
  the domain separator, and this disarms it for chain id 1. The same path carries
  an optional FEE PAYER with a second signature — two signers on one transaction.
- >-
  AN ENVIRONMENT VARIABLE DISABLES SIGNATURE VERIFICATION. Setting
  DEVNET_NO_SIGNATURE_VERIFICATION to "true" or "1" replaces both the EIP-712 and
  the ordinary Cosmos signature decorators with a no-op, in the mainnet binary,
  read from os.Getenv at ante-handler construction with no chain-id guard. Clearly
  intended for devnets; nothing in the code confines it to one.
- >-
  UNPROTECTED (PRE-EIP-155) TRANSACTIONS ARE ALLOWED BY DEFAULT.
  DefaultAllowUnprotectedTxs is true.
- >-
  THE REPO MOVED ORGS. InjectiveLabs/injective-core is a 404; the source is at
  InjectiveFoundation/injective-core, while go.mod still replaces the SDK,
  CometBFT, ibc-go, wasmd and go-ethereum with InjectiveLabs forks.

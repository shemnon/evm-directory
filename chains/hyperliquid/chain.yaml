schema_version: 2

chain:
  name: Hyperliquid (HyperEVM)
  slug: hyperliquid
  chain_id: 999
  role: independent
  equivalence: behavioural
  live: true
  evidence: documented
  note: >-
    THE FIRST `documented` ROW. Hyperliquid publishes no execution-client source, so
    there is no repo to clone, no tag to pin and no commit to diff. Every fact below
    rests on `src_live:` (an RPC observation of the running network) or `src_doc:` (a
    Hyperliquid docs URL) — never on `src:`. Deltas are BEHAVIOURAL comparisons
    against mainnet, established by probing, in the same sense as the Tron row.
    The probe is the primary evidence here; the docs are corroboration.

lineage:
  upstream: null
  ancestry: []
  fork_of: null
  note: >-
    No public client, therefore no verifiable ancestry. The node does however LEAK
    its implementation through error strings: invalid opcodes return `OpcodeNotFound`
    and the KZG precompile returns `Revm precompile error: c-kzg feature is not
    enabled`. Both are revm (Rust) error variants — go-ethereum says `invalid opcode`
    and returns a semantic KZG error. This is strong circumstantial evidence that
    HyperEVM embeds revm, but it is an INFERENCE FROM ERROR STRINGS, not a code diff,
    and it is recorded as such. `role: independent` is the honest classification: we
    cannot verify shared ancestry, only observe behaviour.
  inferred_engine: revm (from error strings only — unverified)
  src_live: "eth_call 0x0c opcode @ 43436288 -> EVM error: OpcodeNotFound; eth_call 0x...0a @ 43436288 -> Revm precompile error: c-kzg feature is not enabled"

live_probe:
  endpoint: https://rpc.hyperliquid.xyz/evm
  chain_id: 999
  observed_at_block: 43436288
  observed_at: 2026-08-17
  chain_id_src_live: "eth_chainId @ 43436288 -> 0x3e7 (999); net_version -> 999; web3_clientVersion -> hyperliquid evm Mainnet (no client name or version)"
  block_scan_range: 43436288-43436407
  caveat: >-
    CRITICAL, AND ITSELF A FINDING. This endpoint IGNORES the block parameter on every
    state-reading method. eth_call, eth_getCode, eth_getBalance and
    eth_getTransactionCount return LATEST state no matter what height is requested,
    silently and with no error: eth_call of the NUMBER opcode pinned at block 0x1
    returns the current head, and eth_getCode of CoreWriter pinned at block 0x1
    returns its full 544 bytes even though block 1 predates its deployment by months.
    eth_getBlockByNumber DOES honour the parameter. So `observed_at_block` here means
    "the head at the time of observation", not "the height the result was computed
    at" — the pin records WHEN, and cannot record AT WHAT HEIGHT, because the public
    endpoint will not serve historical state. Replaying these probes needs a true
    archive node, which is not publicly available for this chain. Every src_live entry
    below inherits this caveat.
  caveat_src_live: "eth_call NUMBER @ block param 0x1 -> 43436842 (head at request time); eth_getCode 0x3333...3333 @ block param 0x1 -> 544 bytes"

consensus:
  engine: HyperBFT
  finality: single-slot (BFT), no reorgs by construction
  block_time: 1s (small blocks) / 60s (large blocks) — interleaved in ONE chain
  src_doc: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/hyperevm/dual-block-architecture
  note: >-
    The headline divergence. HyperEVM produces TWO block kinds in a single, strictly
    increasing block-number sequence, drawn from two independent mempools. Observed
    directly over 120 consecutive blocks from 43436288: small blocks carry a 3,000,000
    gas limit and arrive every 1s; large blocks carry a 30,000,000 gas limit and arrive
    every 60s. In the scanned window the large blocks fell at 43436329, 43436390 and
    43436451 — gaps of exactly 61 blocks and exactly 60 seconds.
  src_live: "eth_getBlockByNumber 43436288-43436487 @ 43436288 -> gasLimit histogram {3000000: 197, 30000000: 3}; large blocks at 43436329, 43436390, 43436451; block-number gaps 61, timestamp gaps 60"

baseline_fork: cancun
baseline_note: >-
  Cancun, WITHOUT blobs and WITHOUT the beacon-chain half — and this is measured, not
  claimed. Positive evidence for Cancun: the full Cancun opcode set executes (PUSH0,
  MCOPY, TLOAD/TSTORE, BLOBHASH, BLOBBASEFEE all probed working) and the header carries
  withdrawalsRoot, blobGasUsed, excessBlobGas and parentBeaconBlockRoot. Negative
  evidence against Prague: no `requestsHash` field in any of 120 headers scanned
  (EIP-7685), BLS12-381 absent at 0x0b-0x11 (EIP-2537), and the EIP-2935 history
  contract has no code. Negative evidence against Osaka: P256VERIFY is absent from
  0x0100. Hyperliquid's own docs agree — "The HyperEVM implements the Cancun hardfork
  without blob support" — so for once the doc and the probe say the same thing.

forks:
  note: >-
    No named fork schedule is published, no fork timestamps are exposed by the RPC, and
    with no client source there is no fork-condition table to read. Feature activation
    cannot be reconstructed from outside. What IS observable is that the chain changed
    under its own feet: the small-block gas limit was 2,000,000 at blocks 1 through
    10,000,000 and 3,000,000 by block 20,000,000. That is a live parameter change with
    no fork name attached to it.
  src_live: "eth_getBlockByNumber @ 43436288 -> gasLimit 2000000 at blocks 1/100/1000000/10000000; 3000000 at block 20000000 and 40000000; genesis-adjacent block 1 timestamp 1739849780 = 2025-02-18"
  timeline: []

eips:
  1559:
    status: modified
    note: >-
      Present but altered in two ways. (1) PRIORITY FEES ARE BURNED, not paid to a
      proposer — the docs state this explicitly and attribute it to HyperBFT, and it
      is consistent with `miner` being the zero address in all 120 headers scanned and
      eth_maxPriorityFeePerGas returning 0. (2) The base fee has a HARD FLOOR at
      exactly 100,000,000 wei (0.1 gwei): across blocks 43436384-43436396 the base fee
      stayed pinned at 100000000 through 13 consecutive blocks whose gas used ranged
      from 0 to 1,067,253 against a 3,000,000 limit — far below target, where stock
      EIP-1559 would have decayed it ~12.5% per block. It did not move at all.
      Separately, the 1559 target is ambiguous by construction here: two block kinds
      with a 10x gas-limit difference share one fee series.
    src_live: "eth_getBlockByNumber 43436384-43436396 @ 43436288 -> baseFeePerGas 100000000 in all 13 blocks while gasUsed ranged 0..1067253 of 3000000; eth_maxPriorityFeePerGas -> 0x0; miner 0x00..00 in 120/120 headers"
    src_doc: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/hyperevm
  4844:
    status: removed
    note: >-
      No blobs, confirmed three independent ways: blobGasUsed and excessBlobGas are
      0x0 in all 120 headers scanned, eth_blobBaseFee is not a supported method, and
      the KZG precompile at 0x0a always errors (see precompiles."0x0a", which is
      tombstoned rather than removed — the distinction matters). The BLOBHASH and
      BLOBBASEFEE opcodes remain in the jump table for bytecode compatibility;
      BLOBBASEFEE returns 1, the correct value for excessBlobGas == 0.
    src_live: "eth_getBlockByNumber 43436288-43436407 @ 43436288 -> blobGasUsed 0x0 in 120/120; eth_blobBaseFee -> Method not found; eth_call BLOBBASEFEE @ 43436288 -> 0x..01"
    src_doc: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/hyperevm
  2537:
    status: removed
    note: >-
      BLS12-381 absent. Probed with VALID-LENGTH input and a mainnet control: 0x0b with
      256 zero bytes (infinity + infinity) returns empty on HyperEVM and 128 zero bytes
      on mainnet. All of 0x0b-0x11 behave identically to the known-unallocated address
      0x12 — empty success, 21000 gas. This is `removed`, not `tombstoned`: the calls
      succeed with empty output rather than failing.
    src_live: "eth_call 0x...0b @ 43436288 <- 256 zero bytes -> 0x (empty); mainnet control same input -> 128 zero bytes; 0x0b-0x11 identical to unallocated 0x12"
  7951:
    status: removed
    severity: high
    note: >-
      P256VERIFY IS NOT AT 0x0100. Verified with a locally generated, locally checked
      P-256 signature and an Ethereum mainnet control on the identical calldata:
      mainnet returns 0x...01, HyperEVM returns empty. This is the first row in the
      dataset WITHOUT P256VERIFY at 0x0100 — see gotchas, it is a direct counterexample
      to the "0x0100 is the one universal address" finding. severity: high because
      EIP-7951 signals an invalid signature by returning empty output, which is exactly
      what an absent precompile returns: every P256 verification silently reports
      "invalid" with no revert and no error.
    src_live: "eth_call 0x...0100 @ 43436288 <- valid 160-byte P256 vector -> 0x (empty); Ethereum mainnet control, same calldata -> 0x00..01"
  4788:
    status: removed
    note: >-
      No beacon chain. The header field parentBeaconBlockRoot is retained but is the
      zero hash in all 120 blocks scanned, and the beacon-roots contract at
      0x000F3df6D732807Ef1319fB7B8bB8522d0Beac02 has no code.
    src_live: "eth_getCode 0x000F3df6...Beac02 @ 43436288 -> 0x (empty); parentBeaconBlockRoot 0x00..00 in 120/120 headers"
  2935:
    status: removed
    note: "history-storage contract 0x0000F90827F1C53a10cb7A02335B175320002935 has no code"
    src_live: "eth_getCode 0x0000F908...002935 @ 43436288 -> 0x (empty)"
  7685:
    status: removed
    note: >-
      No execution-layer requests. The `requestsHash` header field is entirely absent
      from every block returned, at every height sampled from block 1 to the head —
      not zero, absent. This is the cleanest single measurement that the chain is
      pre-Prague.
    src_live: "eth_getBlockByNumber @ 43436288 -> requestsHash absent in 120/120 headers 43436288-43436407, and at blocks 1, 100, 1000000, 10000000, 20000000, 30000000, 40000000"
  7002:
    status: removed
    note: "withdrawal-request contract 0x00000961Ef480Eb55e80D19ad83579A64c007002 has no code"
    src_live: "eth_getCode 0x00000961...007002 @ 43436288 -> 0x (empty)"
  7251:
    status: removed
    note: "consolidation-request contract 0x0000BBdDc7CE488642fb579F8B00f3a590007251 has no code"
    src_live: "eth_getCode 0x0000BBdD...007251 @ 43436288 -> 0x (empty)"
  4895:
    status: removed
    note: >-
      No beacon withdrawals. The withdrawalsRoot field is retained and is the
      empty-trie root 0x56e81f17..b421 in all 120 blocks scanned, with an empty
      withdrawals list in every one. There is no beacon chain to withdraw from.
    src_live: "eth_getBlockByNumber 43436288-43436407 @ 43436288 -> withdrawalsRoot 0x56e81f17..b421 and withdrawals [] in 120/120"
  4399:
    status: modified
    severity: high
    note: >-
      PREVRANDAO IS ALWAYS ZERO. The opcode executes and pushes 0, and mixHash is the
      zero hash in all 120 headers scanned. There is no randomness beacon behind it.
      severity: high because it fails silently in the most dangerous possible way — a
      contract using PREVRANDAO as a randomness source gets a constant, publicly known
      value forever, with no revert and no signal. Note this is a DIFFERENT failure
      mode from Tron, which removed the opcode outright: here it is present and lying.
    src_live: "eth_call PREVRANDAO 0x44 @ 43436288 -> 0x00..00; mixHash 0x00..00 in 120/120 headers"
  1153: {status: inherited, note: "TLOAD/TSTORE probed working: TSTORE 1 then TLOAD returns 1",
         src_live: "eth_call initcode 600160005d60005c @ 43436288 -> 0x00..01"}
  5656: {status: inherited, note: "MCOPY executes",
         src_live: "eth_call initcode with MCOPY 0x5e @ 43436288 -> OK, no OpcodeNotFound"}
  3855: {status: inherited, note: "PUSH0 executes; also present in deployed CoreWriter bytecode",
         src_live: "eth_call initcode 5f.. @ 43436288 -> 0x00..00"}
  3198: {status: inherited, note: "BASEFEE returns the block base fee, 100000000 wei at the pinned height",
         src_live: "eth_call BASEFEE 0x48 @ 43436288 -> 0x5f5e100 (100000000)"}
  7702:
    status: unrecorded
    note: >-
      Could not be established. No type-0x04 transaction appeared in a 60-block,
      ~450-transaction sample, and the eth_sendRawTransaction decoder returns an
      identical message for every type byte tried (0x01, 0x02, 0x03, 0x04, 0x05, 0x7e,
      0x7f and legacy all give "failed to decode signed transaction"), so the decoder
      cannot be used to distinguish a supported type from an unsupported one. No public
      source exists to read. Deliberately left unrecorded rather than inferred from the
      Cancun baseline.
  2930: {status: unrecorded, note: "no type-0x01 transaction observed in a ~450-tx sample; absence in a sample is not evidence of absence in the protocol, and the decoder cannot distinguish"}
  6780: {status: unrecorded, note: "SELFDESTRUCT semantics not probed — would require deploying a contract, which needs a funded key"}
  3529: {status: unrecorded}
  7823: {status: unrecorded, note: "MODEXP returns the correct value for 3^2 mod 5, matching a mainnet control, but the EIP-7823 upper bounds were not probed"}
  7883: {status: unrecorded, note: "MODEXP repricing not measured"}
  152:  {status: inherited, note: "BLAKE2F at 0x09 rejects malformed input as a precompile, unlike Tron which displaced it",
         src_live: "eth_call 0x...09 @ 43436288 <- 0 bytes -> EVM error: PrecompileError"}

non_eip_specs:
  note: >-
    Hyperliquid publishes no numbered improvement-proposal series. There is no HIP-style
    spec process for EVM-level changes to record: the docs are the only specification,
    and they are prose. This absence is itself part of why the row is `documented`.

tx_types:
  envelope:
    status: inherited
    present: "0x00-0x02"
    src: derived from the eips map (2930 / 1559 / 4844 / 7702); see those entries
    note: >-
      The EIP-2718 envelope this chain accepts in mainnet shape; no blob transactions
      (EIP-4844), no EIP-7702 set-code transactions. Derived from the eips map
      (2930/1559/4844/7702); per-type divergences and their evidence are on the rows below.
  "0x00":
    name: legacy
    status: inherited
    src_live: "eth_getBlockByNumber with full txs, 60 blocks around 43436494 @ 43436288 -> 36 transactions of type 0x0"
  "0x02":
    name: EIP-1559 dynamic fee
    status: inherited
    src_live: "eth_getBlockByNumber with full txs, 60 blocks around 43436494 @ 43436288 -> 347 transactions of type 0x2, with accessList, maxFeePerGas and maxPriorityFeePerGas"
  "0x01":
    name: EIP-2930 access list
    status: inherited
    note: >-
      RESOLVED by direct observation, replacing an earlier `unrecorded` that rested on
      absence from a ~450-transaction sample. Absence from a sample is not absence from
      the protocol, and this is the case in point: type 0x01 is sporadic — a 140-block
      window sampled later contained none at all, while the window below contains six.
      The decoder still cannot be interrogated (it returns an identical error for every
      type byte), so a live sighting was the only way to settle it.
    src_live: "eth_getBlockByNumber x120 @ 43575085 -> 6 txs of type 0x01, e.g. 0x8fee114da7f5ec59df54173322353e0e44514bcbf9aba71b291cf64131217b49 @ 43575036 (chainId 0x3e7, accessList present)"
  "0x03":
    name: EIP-4844 blob
    status: unrecorded
    note: >-
      Not observed, and unusable in practice regardless: blob validation requires the
      KZG precompile, which always errors here, and blobGasUsed is pinned to zero in
      every header. Recorded as unrecorded rather than removed because the type byte
      itself was never directly tested — the inference is strong but it is an
      inference, and this row does not launder inference into measurement.
  "0x04":
    name: EIP-7702 set code
    status: unrecorded
    note: "see eips.7702 — could not be established from outside"
  note: >-
    Only 0x00 and 0x02 were seen live. No chain-specific type byte was observed, which
    is notable: Hyperliquid moves value between HyperEVM and HyperCore WITHOUT a custom
    transaction type, using ordinary transactions to two system contracts plus off-EVM
    interpretation of the logs they emit. Contrast Arbitrum 0x78, Base 0x79, OP 0x7e
    and Polygon 0x7f, all of which needed a type byte for far less.

tx_authorization:
  key_binding: derived
  signers_per_tx: 1
  note: >-
    ESTABLISHED BY LOCAL RECOVERY, NOT BY ASKING THE NODE. There is no client to read,
    so "secp256k1 authorizes transactions here" was tested the only way it can be from
    outside: pull a live transaction's raw bytes with eth_getRawTransactionByHash,
    recover the sender OFF-CHAIN with standard keccak256 + secp256k1 ECDSA, and compare
    against the `from` the node reports. Both a legacy 0x00 transaction (EIP-155,
    v = 0x7f1 = 2*999+35) and an EIP-1559 0x02 transaction recovered to exactly the
    reported sender. That makes key_binding `derived` a measurement rather than an
    assumption: the address is the hash of the recovered public key, and the digest
    construction is mainnet's.

    THIS PROBE IS UNAFFECTED BY THIS ROW'S BLOCK-PARAMETER CAVEAT. The caveat in
    live_probe applies to STATE reads, which silently ignore the requested height.
    Transaction bytes are immutable and returned by hash, so these two observations are
    reproducible against any node that has the blocks — the only entries in this row of
    which that is true.

    WHAT COULD NOT BE ESTABLISHED, and is left `unrecorded` rather than guessed:
    whether EIP-7702 delegation works (eips.7702 is itself unrecorded, so there is no
    basis for an `account_code` reach); whether any protocol-constructed, unsigned
    transaction exists at all — system_transactions in this row is `unrecorded` for the
    Core-to-EVM direction, the bridge address at 0x2222 carries a nonce of ~1,000,000
    that no ordinary contract could accumulate, and debug_ tracing is not exposed, so
    whether HyperCore originates transactions without a signature is exactly the
    question that cannot be answered from outside. The tx decoder returns the SAME error
    for every type byte, so it cannot even be used to test which envelopes exist.

    No alternative signature scheme was observed and none is claimed. Absence of
    evidence is recorded as absence of evidence.
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      note: >-
        ECRECOVER at 0x01 was separately confirmed to behave as mainnet (see
        precompiles), so the scheme the protocol accepts and the scheme contracts can
        verify are the same one — the ordinary, uninteresting pairing.
      src_live: "eth_getRawTransactionByHash 0x2b49c740..1c93c @ 43575063 (type 0x02) -> off-chain ECDSA recovery gives 0x30270f0e5ce49c8aaf4e907f074440230babb7cd, identical to the reported from; eth_getRawTransactionByHash 0xc4ffb8e4..b3d56 @ 43574984 (type 0x00, v 0x7f1, chainId 999) -> 0x39fa5efb0881c504a313d1aad4dea1df32f66f36, identical to the reported from"
    secp256r1:
      status: removed
      authorizes: never
      precompile: none
      note: >-
        THE REVERSE PAIRING, AND THE WORSE HALF OF IT. On every other chain in this
        dataset a P-256 key cannot authorize a transaction but a contract can at least
        VERIFY one, at 0x0100. Here neither is true: 0x0100 is empty (see eips.7951 and
        gotchas), so P-256 is unusable for authorization AND unverifiable on-chain.

        `authorizes: never` is a negative claim and rests on negative evidence: no P-256
        material appeared in any sampled transaction, no envelope carrying it was
        observed, and the chain cannot check such a signature even if one were
        presented. It is not a source-verified impossibility, because there is no source.
      src_live: "eth_call 0x...0100 @ 43575623 <- 160-byte P256 vector generated and verified off-chain (sha256 digest, low-s) -> 0x (empty); Ethereum mainnet control at block 25787579, identical calldata -> 0x00..01 — independently reproduces the eips.7951 probe recorded at 43436288"

precompiles:
  base_map:
    status: inherited
    present: "0x01-0x09"
    p256verify: false
    src_live: "eth_call @ 43436288: 0x01-0x09 each checked against a known vector or
      a live Ethereum mainnet control and matched; 0x0a returns the tombstone error;
      0x0b-0x11 and 0x0100 succeed empty and cost exactly 21000 gas (unallocated)"
    note: >-
      Established entirely by probing, since no client is public. 0x01-0x09 behave as
      mainnet; 0x0a is tombstoned; BLS 0x0b-0x11 and P256VERIFY 0x0100 are absent.
      The EIP-7823/7883 MODEXP bounds were not probed and stay unrecorded.
  note: >-
    Three regions, established entirely by probing. (1) 0x01-0x09 behave as mainnet —
    ecrecover, sha256, ripemd160, identity, modexp, ecAdd, ecMul, ecPairing and blake2f
    were each checked against a known vector or a live Ethereum mainnet control and all
    matched. (2) 0x0a is tombstoned and 0x0b-0x11 and 0x0100 are absent. (3) 0x0800-
    0x0814 are 21 HyperCore read precompiles, a contiguous block whose boundaries were
    probed in both directions. The DISCRIMINATOR used throughout is the one SCHEMA.md
    names: a live precompile given malformed input FAILS (here: `EVM error:
    PrecompileError`), while an unallocated address SUCCEEDS with empty output and
    costs exactly 21000 gas. Names for the 0x0800 block follow Hyperliquid docs and SDK
    convention; what the PROBE established is the address, the accepted input width and
    the returned output width, which is stated per entry.
  boundary_src_live: "eth_call @ 43436288 <- empty calldata -> 0x07fd/0x07fe/0x07ff return 0x (empty success); 0x0800 through 0x0814 return EVM error: PrecompileError; 0x0815/0x0816/0x0817/0x0820 return 0x (empty success)"
  "0x01":
    name: ECRECOVER
    status: inherited
    note: "verified equal to mainnet on a shared vector, not assumed from the baseline"
    src_live: "eth_call 0x...01 @ 43436288 <- 128-byte vector -> 0x00..7156526fbd7a3c72969b54f64e42c10fbb768c8a; Ethereum mainnet control, same calldata -> identical"
  "0x02":
    name: SHA256
    status: inherited
    src_live: "eth_call 0x...02 @ 43436288 <- empty -> 0xe3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 (sha256 of empty string)"
  "0x03":
    name: RIPEMD160
    status: inherited
    note: "genuinely RIPEMD160, unlike Tron 0x03 which returns something else entirely under the same name"
    src_live: "eth_call 0x...03 @ 43436288 <- empty -> 0x00..9c1185a5c5e9fc54612808977ee8f548b2258d31 (ripemd160 of empty string, left-padded)"
  "0x04":
    name: IDENTITY
    status: inherited
    src_live: "eth_call 0x...04 @ 43436288 <- 0xdeadbeef -> 0xdeadbeef"
  "0x05":
    name: MODEXP
    status: inherited
    note: >-
      Returns the correct value and matches a live mainnet control. Only correctness was
      checked; the EIP-7823 input bounds and EIP-7883 repricing were NOT probed, so those
      two EIPs remain unrecorded.
    src_live: "eth_call 0x...05 @ 43436288 <- 3^2 mod 5 -> 0x04; Ethereum mainnet control, same calldata -> 0x04"
  "0x06":
    name: BN256_ADD
    status: inherited
    src_live: "eth_call 0x...06 @ 43436288 <- 128 zero bytes -> 64 zero bytes (point at infinity)"
  "0x07":
    name: BN256_SCALAR_MUL
    status: inherited
    src_live: "eth_call 0x...07 @ 43436288 <- 96 zero bytes -> 64 zero bytes"
  "0x08":
    name: BN256_PAIRING
    status: inherited
    src_live: "eth_call 0x...08 @ 43436288 <- empty -> 0x00..01 (true, the correct empty-pairing result)"
  "0x09":
    name: BLAKE2F
    status: inherited
    note: "present and validating input length — contrast Tron, which displaced BLAKE2F off 0x09 entirely"
    src_live: "eth_call 0x...09 @ 43436288 <- 0 bytes -> EVM error: PrecompileError (a live precompile rejecting bad input, not an empty address)"
  "0x0a":
    name: KZG point evaluation
    status: tombstoned
    severity: high
    note: >-
      PRESENT IN DISPATCH, PERMANENTLY NON-FUNCTIONAL. Every call — including a
      well-formed 192-byte input — returns `Revm precompile error: c-kzg feature is not
      enabled`. The address is not empty (an empty address would succeed with no
      output); it resolves to a precompile whose implementation was compiled out of the
      binary. Mainnet control on the same 192 zero bytes returns a semantic error,
      `mismatched versioned hash`, proving the mainnet precompile is live and merely
      rejecting the input. This is the exact `tombstoned` vs `removed` distinction
      SCHEMA.md draws, arrived at from the outside by behaviour alone — and it is the
      only tombstone in the dataset caused by a BUILD FLAG rather than a deliberate
      deprecation. The address is consumed either way.
    src_live: "eth_call 0x...0a @ 43436288 <- 192 zero bytes -> Revm precompile error: c-kzg feature is not enabled; same call with 0 bytes -> identical error; Ethereum mainnet control, 192 zero bytes -> mismatched versioned hash"
  "0x0b": {name: BLS12_G1ADD, status: removed, note: "EIP-2537 absent — empty success on valid-length input", src_live: "eth_call 0x...0b @ 43436288 <- 256 zero bytes -> 0x; mainnet control -> 128 zero bytes"}
  "0x0c": {name: BLS12_G1MSM, status: removed, note: "EIP-2537 absent", src_live: "eth_call 0x...0c @ 43436288 -> 0x (empty success, identical to unallocated 0x12)"}
  "0x0d": {name: BLS12_G2ADD, status: removed, note: "EIP-2537 absent", src_live: "eth_call 0x...0d @ 43436288 -> 0x (empty success)"}
  "0x0e": {name: BLS12_G2MSM, status: removed, note: "EIP-2537 absent", src_live: "eth_call 0x...0e @ 43436288 -> 0x (empty success)"}

schema_version: 2

chain:
  name: Berachain
  slug: berachain
  chain_id: 80094
  role: fork
  live: true
  evidence: source
  chain_id_src: tests/fixtures/mainnet-genesis.json:80094
  note: >-
    The backlog predicted a near-empty EVM delta with all divergence in consensus.
    That prediction is REFUTED. Berachain runs its own EL fork (bera-reth, and a
    now-lagging bera-geth), has its own transaction type, a 22-field block header,
    a raised EIP-170 contract size limit, a base-fee floor, and — for nine days in
    November 2025 — a consensus rule that rejected any transaction whose LOGS
    mentioned one of eight blocked addresses. The consensus layer (BeaconKit) does
    diverge too, but it is not where the surprises are.

    Second pass (2026-08-28) added the ordering/execution axis and checked the row
    against Berachain's own BRIP series. Two corrections of emphasis: CometBFT does
    NOT order this chain's transactions (the execution layer does, and BeaconKit
    hands CometBFT two opaque blobs), and there is no protocol fork called
    "Berachain v2" — that name belongs to Proof-of-Liquidity product generations
    that ship behind an upgradeable proxy, not to the fork list.

lineage:
  upstream: ethereum
  ancestry: [ethereum]
  fork_of: reth
  sync_point: >-
    bera-reth v1.4.4 tracks reth and reached Osaka on 2026-07-08, adding its own
    Osaka1 on 2026-08-05. The SECOND execution client, berachain/bera-geth, cannot
    follow: its newest release (v1.011608.0, 2026-01-20) has no OsakaTime for chain
    80094 in params/config.go:BerachainChainConfig and no Osaka1 concept at all, so
    it stops at Prague4. Two clients of the same chain, three fork generations
    apart, and only one of them can validate the current head.
  note: >-
    Not a geth fork despite bera-geth's existence. The client that built the probed
    block identifies itself as `bera-reth/v1.4.4/linux` in extraData, and bera-reth
    is a Reth SDK node (a wrapper around reth's ChainSpec, not a source fork of
    geth). BeaconKit replaces the Ethereum beacon chain entirely: it is a CometBFT
    application, so there is no Ethereum consensus-layer ancestry to record.

client:
  name: bera-reth
  repo: https://github.com/berachain/bera-reth
  version: v1.4.4
  commit: aa9bc73ffd49305ce0953c22b38f2affcbdabbd4
  language: rust
  built_on: reth SDK
  note: >-
    Chosen as primary over bera-geth on evidence, not convention: the probed block's
    extraData decodes to "bera-reth/v1.4.4/linux", and bera-reth is the only pinned
    client whose chain config for 80094 contains osakaTime and osaka1.
  companion_repos:
  - {name: beacon-kit, repo: "https://github.com/berachain/beacon-kit",
     version: v1.4.1, commit: 0a91d178147821bb41b7e1de092b0a501236b4ee,
     provides: "consensus layer: EVM inflation withdrawal, deposit/withdrawal-request processing, the object parentBeaconBlockRoot commits to"}
  - {name: bera-geth, repo: "https://github.com/berachain/bera-geth",
     version: v1.011608.0, commit: e8f8f9681fc2e5fdbc0684e605bf88b35c5d1fbc,
     provides: "second EL implementation of the same rules in Go; the PoL tx type, the Prague1-4 config and the 22nd header field are declared here too. Stops at Prague4."}

live_probe:
  endpoint: https://rpc.berachain.com
  chain_id: 80094
  observed_at_block: 25264103      # 0x18183e7

consensus:
  engine: BeaconKit (CometBFT / Tendermint BFT) driving a forked Engine API EL
  finality: single-slot, instant (CometBFT commit)
  block_time: "2s, held there by BRIP-0003 Stable Block Time (an algorithmic commit delay, not timeout_commit)"
  src: "src/node/evm/config.rs:BERACHAIN_BLOCK_TIME_SECONDS, beacon-kit/consensus/cometbft/service/prepare_proposal.go:PrepareProposalResponse, beacon-kit/beacon/validator/block_builder.go:retrieveExecutionPayload, src/engine/builder.rs:default_berachain_payload, beacon-kit/beacon/blockchain/process_proposal.go:verifyStateRoot, beacon-kit/execution/engine/engine.go:ErrInvalidPayloadStatus, beacon-kit/consensus/cometbft/service/process_proposal.go:PROCESS_PROPOSAL_STATUS_REJECT, beacon-kit/testing/simulated/malicious_proposer_test.go:TestProcessProposal_BadBlock_IsRejected"
  src_live: "web3_clientVersion @ 25415365 -> bera-reth/v1.4.4-aa9bc73/x86_64-unknown-linux-gnu (matches the pinned commit exactly); txpool_status @ 25415365 -> {pending: 0x0, queued: 0x0}"
  note: >-
    There is no Ethereum beacon chain, no attestations, no sync committee and no
    fork choice by LMD-GHOST. BeaconKit keeps the *shape* of an Ethereum CL — a
    BeaconBlockHeader with the same five fields, SSZ hash-tree-roots, BLS12-381
    validator keys, EIP-4788 roots, EIP-4895 withdrawals — on top of CometBFT
    consensus. The Engine API is NOT stock: see system_transactions.engine_api.

    ORDERING. The obvious guess for a CometBFT chain — that CometBFT orders the
    transactions in PrepareProposal and the EL executes what it is handed — is
    WRONG here, and the source says so in one line. `prepareProposal` ignores
    `req.Txs` entirely and returns exactly TWO CometBFT transactions:
    `Txs: [][]byte{blkBz, sidecarsBz}` — the SSZ beacon block and the blob
    sidecars. EVM transactions are never CometBFT transactions, never enter the
    CometBFT mempool, and are never seen by CometBFT as anything but opaque bytes
    inside one blob. The transaction LIST is chosen by the EXECUTION layer:
    BuildBlockAndSidecars -> retrieveExecutionPayload -> localPayloadBuilder
    (RetrievePayload, else RequestPayloadSync) -> engine_getPayloadV4P11, and
    inside bera-reth the selection is reth's stock priority-fee-greedy iterator
    `pool.best_transactions_with_attributes(base_fee, blob_gasprice)`. The CL's
    only ordering decision is whether to propose the payload the EL handed it.
    Ordering therefore does NOT commit before execution: the builder executes
    each transaction as it appends it, so the list and the state root are fixed
    in the same pass. Contrast Monad, where consensus commits the list at height
    N and the state root only at N+3.

    EXECUTION is sequential and non-optimistic — a single-threaded
    `while let Some(pool_tx) = best_txs.next()` loop with no speculation, no
    re-execution and no conflict resolution. The only optimism anywhere is at the
    CL and is node-local, not consensus: during ProcessProposal of block N a node
    that is the next proposer starts building N+1 (handleOptimisticPayloadBuild),
    and throws that work away if N is rejected
    (handleRebuildPayloadForRejectedBlock). Two implementations disagreeing about
    it changes latency, not validity. Parallel execution appears only in
    BRIP-0007's unshipped sequencer.

    A TRANSACTION THAT IS ORDERED BUT INVALID WHEN EXECUTED INVALIDATES THE WHOLE
    BLOCK. Not skipped, not receipted with status 0, not erased — the block dies.
    Path: ProcessProposal -> Blockchain.ProcessProposal -> VerifyIncomingBlock ->
    verifyStateRoot (WithVerifyPayload(true)) -> state_processor_payload.go
    NotifyNewPayload -> engine_newPayloadV4P11. On INVALID the engine wrapper
    returns backoff.Permanent(ErrInvalidPayloadStatus) (execution/engine/engine.go),
    the error propagates, and process_proposal.go answers CometBFT with
    PROCESS_PROPOSAL_STATUS_REJECT. engine_newPayload has no per-transaction skip:
    its verdict is all-or-nothing over the payload. beacon-kit ships a test for
    EXACTLY the gas-price case — TestProcessProposal_BadBlock_IsRejected injects a
    transaction whose maxFeePerGas is below the block base fee, and asserts REJECT
    plus the EL's own message "max fee per gas less than block base fee".

    WHY IT ALMOST NEVER ARISES, and what a client sees when it does. The list is
    built by the proposer's own EL, which executes as it appends: in
    default_berachain_payload a nonce-too-low transaction is skipped
    ("skipping nonce too low transaction"), any other invalidity calls
    best_txs.mark_invalid and drops the transaction's descendants, and both paths
    `continue` INSIDE THE BUILDER, before anything reaches a payload. The base-fee
    case resolves the same way: best_transactions_with_attributes is parameterised
    on the NEW block's base fee, so when Osaka1 restored the 1 gwei floor,
    sub-floor transactions simply stopped being selected. Only a faulty or
    Byzantine proposer can produce the failing block. An RPC client observes
    NOTHING: the rejected proposal never becomes a block, CometBFT re-proposes the
    height with the next proposer, and single-slot finality means the committed
    chain never contains it — no receipt, no status-0 receipt, no orphan block, no
    reorg. The transaction is not consumed and is retried at a later height or
    dropped by the pool. This is the opposite pole from the CometBFT chains that
    ERASE the transaction (Artela, where a CometBFT tx index entry is simply never
    written): there the transaction is in the block and unfindable; here there is
    no block.

    PRECONFIRMATIONS: nothing to report, and that is a finding, not a gap. CometBFT
    gives single-slot finality, so eth_getTransactionReceipt only ever answers for a
    committed, final block and its answer cannot change. There is no early receipt,
    no provisional block hash, no MegaETH-style 0xffff..ff. BRIP-0007 designs one —
    see non_eip_specs.BRIP-0007 — but it is status Review, absent from bera-reth
    v1.4.4, and the public RPC rejects preconf_newPartialBlock with -32601.

baseline_fork: osaka
baseline_note: >-
  Osaka activated 2026-07-08 (osakaTime 1783526400), roughly seven months after
  mainnet. Berachain's Osaka is BRIP-0010, which is Osaka MINUS EIP-7594 (PeerDAS)
  PLUS a contract-size increase — so "Osaka-equivalent" is false in both directions.
  Confirmed live: CLZ (EIP-7939) executes and P256VERIFY (EIP-7951) verifies at
  0x0100 at the probed block.

forks:
  src: "src/hardforks/mod.rs:BerachainHardfork, tests/fixtures/mainnet-genesis.json:berachain"
  note: >-
    Two interleaved axes. Ethereum forks come from the genesis config; Berachain's
    own five forks (Prague1-4, Osaka1) are a separate `berachain` object in the same
    file, each carrying PARAMETERS rather than only a timestamp — a minimum base
    fee, a base-fee denominator, a distributor address, a blocked-address list. A
    fork here is a config record, not just a switch. All of them are gated on the
    corresponding Ethereum fork being active first (bera-geth states the rule
    outright: params/config.go:IsPrague1).

    NAMING. Berachain's own name for the 2026-07-08 fork is FUSAKA (BRIP-0010,
    "Fusaka Hardfork Specification"), because it bundles the EL's `osaka` and the
    CL's `fulu` at one timestamp. This row uses `osaka` because that is the name in
    the client's chain config (`osakaTime`) and the only one a config reader will
    find. There is no fork named "v2", "PoL v2" or "Berachain V2" anywhere in the
    client or the genesis config; the complete list is the eight entries below.
  timeline:
  - {name: genesis, activation_time: 1737381600, mainnet_equivalent: "shanghai+cancun",
     note: "2025-01-20. Shanghai and Cancun both at time 0."}
  - {name: prague, activation_time: 1749056400, mainnet_equivalent: prague,
     note: "2025-06-04. Simultaneous with BeaconKit's Electra."}
  - name: prague1
    activation_time: 1756915200
    mainnet_equivalent: null
    note: >-
      2025-09-03. BRIP-0002 + BRIP-0004. The largest single fork in this row: adds
      the 0x7E PoL transaction, the 22nd header field, a 1 gwei base-fee floor and
      a 6x slower base-fee denominator (48 instead of 8).
  - {name: prague2, activation_time: 1759248000, mainnet_equivalent: null,
     note: "2025-09-30. Base-fee floor back to 0. Four weeks of a 1 gwei floor, then none."}
  - name: prague3
    activation_time: 1762164459
    mainnet_equivalent: null
    note: >-
      2025-11-03 10:07:39 UTC — note the non-round timestamp, an emergency fork
      scheduled to the second. Freezes eight addresses and the BEX vault at
      consensus level. See system_transactions and eips.7685/gotchas.
  - name: prague4
    activation_time: 1762963200
    mainnet_equivalent: null
    note: >-
      2025-11-12. Does nothing except END Prague3. Its whole content is that
      is_prague3_active_at_timestamp returns false once Prague4 is live
      (src/hardforks/mod.rs). A fork whose only job is to switch another fork off.
  - {name: osaka, activation_time: 1783526400, mainnet_equivalent: osaka,
     note: "2026-07-08. BRIP-0010. Simultaneous with BeaconKit's Fulu (same timestamp)."}
  - name: osaka1
    activation_time: 1785945600
    mainnet_equivalent: null
    note: >-
      2026-08-05. Anti-spam: minimum base fee back to 1 gwei AND a minimum blob
      base fee of 1 gwei. Live at the probed block — baseFeePerGas is exactly
      0x3b9aca00 and baseFeePerBlobGas is exactly 0x3b9aca00.
    src: "src/chainspec/mod.rs:osaka1_minimum_blob_base_fee"

eips:
  170:
    status: modified
    severity: high
    note: >-
      THE headline EVM delta. From Osaka the maximum deployed contract runtime size
      is 32768 bytes, not 24576 — BRIP-0010's code-size bump, applied by setting
      revm's limit_contract_code_size. Verified live: a create returning 32768 bytes
      succeeds and 32769 fails with CreateContractSizeLimit. Any tool that treats
      24576 as a protocol constant (a size linter, a deploy guard, a diamond/proxy
      splitter, an audit rule) is wrong here in the SAFE direction for deployment
      and the UNSAFE direction for portability: a 30 KB contract deploys on
      Berachain and cannot be deployed on mainnet or on any other chain in this
      dataset.
    src: "src/node/evm/config.rs:MAX_CODE_SIZE_OSAKA"
    src_live: "eth_call create returning 32768 bytes @ 25264103 -> OK; 32769 bytes -> EVM error: CreateContractSizeLimit"
  3860:
    status: modified
    note: >-
      Initcode limit raised in step with EIP-170: 65536 bytes, not 49152.
      Verified live at the same block — 65536 bytes of initcode is accepted,
      65537 returns "max initcode size exceeded". The per-word initcode gas
      charge is unchanged.
    src: "src/node/evm/config.rs:MAX_INITCODE_SIZE_OSAKA"
    src_live: "eth_call with 65536-byte create input @ 25264103 -> OK; 65537 bytes -> max initcode size exceeded"
  1559:
    status: modified
    severity: high
    note: >-
      Two changes, both live. (a) BASE-FEE FLOOR: the computed base fee is clamped
      up to a per-fork minimum — 1 gwei at Prague1, 0 at Prague2, 1 gwei again at
      Osaka1. It is not a mempool policy; next_block_base_fee returns
      raw.max(min_base_fee), so the floor is inside header validation. (b) The
      base-fee change DENOMINATOR is 48, not 8, from Prague1 — the base fee moves
      six times more slowly per block in both directions. Burn and tip routing are
      otherwise mainnet's: verified by balance delta at the probed block, where the
      block's entire priority fee (6160500532907892 wei) lands on the header's
      `miner` and the base-fee portion (249042000000000 wei) lands nowhere.
    src: "src/chainspec/mod.rs:next_block_base_fee, bera-geth/params/protocol_params.go:BerachainBaseFeeChangeDenominator"
    src_live: "eth_getBalance 0x1daa6d6b90e2375d4262cde3c5553bc31688a969 @ 25264102 vs 25264103 -> +6160500532907892 wei = exactly the block's total priority fee; baseFeePerGas 0x3b9aca00 == osaka1 floor"
  4844:
    status: modified
    note: >-
      A real blob market with real header fields — blobGasUsed and excessBlobGas
      are genuine, not repurposed — but with a smaller schedule and a fee floor.
      Blob target/max is 3/6 at Cancun, Prague AND Osaka, where mainnet moved to
      6/9 at Prague and then higher through the BPO forks; Berachain has no BPO
      forks at all. From Osaka1 the blob base fee has a 1 gwei floor
      (params.min_blob_fee), against mainnet's 1 wei. In 60 consecutive blocks
      around the probed height, zero blobs were posted.
    src: "src/chainspec/mod.rs:blob_params_at_timestamp, tests/fixtures/mainnet-genesis.json:blobSchedule"
    src_live: "eth_feeHistory @ 25264103 -> baseFeePerBlobGas 0x3b9aca00, blobGasUsedRatio 0.0 across the range; 60 blocks scanned to 25264103, none with blobGasUsed > 0"
  7594:
    status: removed
    note: >-
      PeerDAS is part of mainnet Osaka. Berachain activated Osaka WITHOUT it —
      BRIP-0010 keeps EIP-4844 full sidecars as the blob distribution mechanism,
      stated in two independent places in the client. This is the cleanest example
      in the dataset of a chain taking a fork's EVM half and declining its
      networking half, and it is the mirror image of BSC taking Prague's EVM half
      and dropping its beacon half.
    src: "src/engine/builder.rs:323, src/pool/mod.rs:75"
  4788:
    status: modified
    severity: high
    note: >-
      The contract is byte-identical to mainnet's at the identical address, the
      system call runs every block, and the ring buffer fills — but the 32 bytes it
      stores are NOT a root of an Ethereum beacon block. They are the SSZ
      hash-tree-root of a BeaconKit BeaconBlockHeader (payload_requests.go passes
      blk.GetParentBlockRoot()). BeaconKit's BeaconBlockHeader happens to have the
      same five fields as Ethereum's, so the header-level generalized indices
      coincide; everything below does not. The BeaconBlockBody carries empty
      compatibility stubs for attestations, voluntary exits, the sync aggregate and
      BLS-to-execution changes (consensus-types/types/body.go), so a proof written
      against Ethereum's BeaconBlockBody indices resolves to a different field, and
      the BeaconState behind state_root is BeaconKit's, not Ethereum's. Every
      4788-based proof library — validator balance proofs, withdrawal-credential
      proofs, restaking oracles — reads a well-formed 32-byte root and verifies
      against the wrong object.
    src: "beacon-kit/consensus-types/types/payload_requests.go:parentBeaconBlockRoot, beacon-kit/consensus-types/types/header.go:BeaconBlockHeader, beacon-kit/consensus-types/types/body.go:BeaconBlockBody"
    src_live: "eth_getCode 0x000F3df6D732807Ef1319fB7B8bB8522d0Beac02 @ 25264103 -> byte-identical to Ethereum mainnet; header parentBeaconBlockRoot 0xff66acc9b7d43c8af553ead0edd3059b27243c96167139683fcfa4c3a15c4fd1"
  2935:
    status: inherited
    note: >-
      The history contract at 0x0000F90827F1C53a10cb7A02335B175320002935 is
      byte-identical to mainnet's and is written by the same system call. No delta.
    src_live: "eth_getCode 0x0000F90827F1C53a10cb7A02335B175320002935 @ 25264103 -> byte-identical to Ethereum mainnet"
  6110:
    status: modified
    severity: high
    note: >-
      Same request type (0x00), same 192-byte request body, DIFFERENT contract at a
      DIFFERENT address emitting a DIFFERENT event. Berachain's deposit contract is
      at 0x4242424242424242424242424242424242424242 — Ethereum's TESTNET deposit
      address — and emits Deposit(bytes,bytes,uint64,bytes,uint64), topic
      0x68af7516...891d46, not mainnet's DepositEvent(bytes,bytes,bytes,bytes,bytes).
      Mainnet's own deposit address 0x00000000219ab540356cBB839Cbe05303d7705Fa is an
      EMPTY account here, so calls to it succeed with no output and no revert. And
      the EL only emits deposit requests from OSAKA, not from Prague: for the
      thirteen months between the two forks Prague was active while the EIP-6110
      request path was dormant, deposits reaching BeaconKit through a separate
      log-watching store instead.
    src: "src/deposits.rs:DEPOSIT_EVENT_SIGNATURE, src/node/evm/executor.rs:304, beacon-kit/state-transition/core/state_processor_staking.go:validateDepositSource"
    src_live: "eth_getCode 0x4242424242424242424242424242424242424242 @ 25264103 -> 4190 bytes; eth_getCode 0x00000000219ab540356cBB839Cbe05303d7705Fa @ 25264103 -> 0x; eth_call get_deposit_count() on 0x4242.. -> execution reverted (different ABI)"
  7002:
    status: inherited
    note: >-
      The one Ethereum request path that works end to end. The predeploy at
      0x00000961Ef480Eb55e80D19ad83579A64c007002 is byte-identical to mainnet's, and
      BeaconKit actually consumes the requests — "WithdrawalRequest is introduced in
      EIP7002 which we use for withdrawals". Note this is the request queue, not the
      withdrawal LIST; see eips.4895.
    src: "beacon-kit/consensus-types/types/withdrawal_request.go:WithdrawalRequest, beacon-kit/state-transition/core/state_processor_staking.go:processWithdrawalRequest"
    src_live: "eth_getCode 0x00000961Ef480Eb55e80D19ad83579A64c007002 @ 25264103 -> byte-identical to Ethereum mainnet"
  7251:
    status: tombstoned
    severity: high
    note: >-
      The sharpest silent failure in this row. The consolidation predeploy at
      0x0000BBdDc7CE488642fb579F8B00f3a590007251 is byte-identical to mainnet's and
      fully live: it accepts a request, charges the excess-fee, queues it, and the
      EL's system call drains the queue into the block's requests list, where it is
      committed inside requestsHash. BeaconKit then decodes the type-0x02 requests,
      validates their length — and drops them. The source says so in one line:
      "ConsolidationRequest is introduced in Pectra but not used by us"; processing
      iterates requests.Withdrawals and requests.Deposits and never touches
      requests.Consolidations. A validator consolidation therefore succeeds at every
      observable layer and has no effect, with no revert anywhere. Recorded as
      tombstoned rather than removed because the address is occupied, callable, and
      takes payment.
    src: "beacon-kit/consensus-types/types/consolidation_request.go:ConsolidationRequest, beacon-kit/state-transition/core/state_processor_staking.go:processWithdrawalRequest"
    src_live: "eth_getCode 0x0000BBdDc7CE488642fb579F8B00f3a590007251 @ 25264103 -> byte-identical to Ethereum mainnet"
  4895:
    status: modified
    severity: high
    note: >-
      The withdrawals list is real, credits real native BERA, and has almost nothing
      to do with staking. Element 0 of EVERY block is a synthetic "EVM inflation"
      withdrawal with index and validatorIndex both set to 2^64-1, paying a fixed
      per-fork amount to a fixed address; validator withdrawals, when they exist,
      follow it. BeaconKit rejects any block whose first withdrawal is not exactly
      that (ErrFirstWithdrawalNotEVMInflation), which also costs one slot of
      MAX_WITHDRAWALS_PER_PAYLOAD. In 60 consecutive blocks at the probed height
      every block had EXACTLY ONE withdrawal — the inflation mint, 1.705 BERA to
      0x1AE7dD7AE06F6C58B4524d9c1f816094B1bcCD8e — and none had a validator
      withdrawal. Contrast Gnosis, where withdrawals credit zero native token: here
      they credit native BERA and are the chain's entire issuance mechanism.
    src: "beacon-kit/state-transition/core/state_processor_withdrawals.go:processWithdrawals, beacon-kit/state-transition/core/state/statedb.go:EVMInflationWithdrawal, beacon-kit/config/spec/mainnet.go:mainnetEVMInflationPerBlockFulu"
    src_live: "eth_getBlockByNumber @ 25264103 -> withdrawals = [{index: 0xffffffffffffffff, validatorIndex: 0xffffffffffffffff, address: 0x1ae7dd7ae06f6c58b4524d9c1f816094b1bccd8e, amount: 0x65a03c40}]; 60/60 blocks to 25264103 had exactly one withdrawal"
  7685:
    status: modified
    note: >-
      requestsHash exists and is computed the standard way, but only one of its
      three request types has an effect (0x01 withdrawals), one is repurposed
      (0x00 deposits, different contract and event) and one is inert (0x02
      consolidations). At the probed block requestsHash is the empty-requests value
      0xe3b0c442...7852b855.
    src_live: "eth_getBlockByNumber @ 25264103 -> requestsHash 0xe3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
  2718:
    status: modified
    severity: high
    note: >-
      Berachain adds type byte 0x7E — the SAME BYTE the OP Stack uses for its
      deposit transaction, on a chain with no OP Stack ancestry whatsoever. Both are
      unsigned, both are protocol-authored, both come from the system address, and
      they are not remotely the same transaction. Any decoder that maps 0x7E to
      DepositTx will parse a Berachain PoL transaction as an OP deposit and get a
      different field list. It is present in EVERY block, so this is not an edge
      case: 60 of 60 blocks scanned carried exactly one.
    src: "src/transaction/mod.rs:POL_TX_TYPE, bera-geth/core/types/transaction.go:PoLTxType"
  7825:
    status: inherited
    note: "Osaka per-transaction gas cap of 2^24, applied via cfg_env.tx_gas_limit_cap."
    src: "src/node/evm/config.rs:MAX_TX_GAS_LIMIT_OSAKA"
  7934:
    status: inherited
    note: >-
      BRIP-0010 states the 10 MiB block cap with a 2 MiB safety margin, i.e. the
      same 8 MiB effective RLP payload cap as mainnet; the value is taken from
      reth-consensus-common rather than redefined.
    src: "src/node/evm/config.rs:MAX_RLP_BLOCK_SIZE"
  7951:
    status: inherited
    note: >-
      P256VERIFY at 0x0100 with mainnet Osaka semantics and gas (6900). Verified
      live with a valid vector and a corrupted one.
    src: "src/evm/mod.rs:P256VERIFY_OSAKA_GAS"
    src_live: "eth_call 0x0100 valid P-256 vector @ 25264103 -> 0x00..01; one byte of s flipped -> 0x"
  7939:
    status: inherited
    src_live: "eth_call CLZ(0) @ 25264103 -> 0x0000...0100 (256)"
  7823:
    status: inherited
    note: >-
      MODEXP input bounds (8192 bits / 1024 bytes per field) as on mainnet Osaka,
      via revm. Named explicitly in BRIP-0010 and covered by an end-to-end test in
      the client, so it is a deliberate adoption rather than an accident of the
      dependency bump.
    src: "src/evm/mod.rs:test_eip7823_modexp_oversized_input_halts_osaka"
    src_doc: "https://github.com/berachain/BRIPs/blob/main/meta/BRIP-0010.md"
  7883:
    status: inherited
    note: >-
      MODEXP repricing — minimum 500 gas, ~3x general cost — as on mainnet Osaka.
      Recorded because BRIP-0010 enumerates it and the client asserts it; the row
      previously left both MODEXP EIPs unstated, which under this schema would
      have fallen back to an unverified `inherited`.
    src: "src/evm/mod.rs:MODEXP_MIN_GAS_OSAKA"
    src_doc: "https://github.com/berachain/BRIPs/blob/main/meta/BRIP-0010.md"
  7918:
    status: unrecorded
    note: >-
      A SECOND candidate Osaka omission, alongside EIP-7594. BRIP-0010's rationale
      states outright that "EIP-7918 (blob base fee) was excluded as Berachain does
      not use blob transactions" — but unlike PeerDAS, whose exclusion is asserted
      in two places in bera-reth's own source, no source read here confirms that
      the reserve-price floor is actually switched off: bera-reth is a Reth SDK
      wrapper and would inherit upstream reth's Osaka blob-fee rule unless it
      overrides it, and the only Berachain override found in blob_params_at_timestamp
      is Osaka1's 1 gwei min_blob_fee. Left unrecorded rather than guessed. What
      would settle it: an executed blob transaction on Berachain (none were seen in
      the sampled blocks), or a read of the pinned reth dependency's Osaka blob-fee
      path.
    src_doc: "https://github.com/berachain/BRIPs/blob/main/meta/BRIP-0010.md"
  7702:
    status: unrecorded
    note: >-
      Type 0x04 is decodable in bera-reth's envelope (src/transaction/mod.rs) and
      none of the Berachain forks touch delegation, but no source read was done on
      how a 7702 delegation interacts with the PoL system call, and no 0x04
      transaction was observed in the 60 blocks sampled.
  3529:
    status: unrecorded
    note: "Not established. No Berachain fork touches refund accounting, but not read."

non_eip_specs:
  - id: BRIP-0002
    name: Base Fee Change Denominator
    adoption: adopted
    fork: prague1
    src: "bera-geth/params/protocol_params.go:BerachainBaseFeeChangeDenominator"
    note: "Denominator 48 instead of 8 — the source comment calls it a '6x increase'."
  - id: BRIP-0003
    name: "Stable Block Time"
    adoption: adopted
    src: "beacon-kit/consensus/cometbft/service/finalize_block.go:SBTEnableHeight"
    src_doc: "https://github.com/berachain/BRIPs/blob/main/meta/BRIP-0003.md"
    note: >-
      Block CADENCE is a consensus rule here, not a node setting. Vanilla CometBFT
      paces blocks with each validator's local `timeout_commit`; BRIP-0003 replaces
      that with an algorithmic delay computed from an (InitialTime, InitialHeight)
      checkpoint and the drift between actual and expected block time, gated on a
      consensus parameter `Feature.SBTEnableHeight`. A node that reaches a height
      past SBTEnableHeight without the delay state panics outright. Recorded under
      ordering because it is the mechanism that makes "2s block time" a protocol
      claim rather than an average.
  - id: BRIP-0004
    name: "Proof of Liquidity distribution (tx type 0x7E, parentProposerPubkey header field, PoL Distributor)"
    adoption: adopted
    fork: prague1
    severity: high
    src: "bera-geth/core/types/tx_pol.go:PoLTx, src/transaction/pol.rs:create_pol_transaction"
    note: >-
      The single most consequential Berachain spec. It puts the consensus layer's
      proposer identity INSIDE the execution header, and turns validator reward
      distribution into an EVM call the block is invalid without.
  - id: BRIP-0008
    name: "Fulu hysteresis parameters and PoL vNext"
    adoption: adopted
    fork: osaka
    src: "beacon-kit/config/spec/mainnet.go:mainnetHysteresisQuotientFulu"
    note: >-
      Consensus-layer only: changes the effective-balance hysteresis quotient to 100
      and the upward multiplier to 10, and moves EVM inflation to a new address at a
      new rate (1.705 BERA/block, down from 5.75).
  - id: BRIP-0010
    name: "Fusaka Hardfork Specification (Berachain's name for the fork this row calls osaka + the CL's fulu)"
    adoption: adopted
    fork: osaka
    severity: high
    src: "src/node/evm/config.rs:MAX_CODE_SIZE_OSAKA, src/evm/mod.rs:osaka_eip_tests"
    note: >-
      Osaka minus EIP-7594 (PeerDAS) plus a 32 KB / 64 KB code-size bump. The
      client carries end-to-end tests asserting each bundled EIP takes effect,
      which is where the composition is enumerable.
  - id: BRIP-0007
    name: "Berachain Preconfirmations"
    adoption: proposed
    src: ".github/workflows/docker-nightly-preconf.yml:preconf-dev"
    src_live: "preconf_newPartialBlock on https://rpc.berachain.com @ 25415365 -> -32601 Method not found"
    src_doc: "https://github.com/berachain/BRIPs/blob/main/meta/BRIP-0007.md"
    note: >-
      NOT SHIPPED, and recorded so the negative is pinned rather than assumed. Status
      `Review` since 2025-10-22. The design is the MegaETH shape arrived at from the
      other direction: a single Sequencer built as a bera-reth add-on seals a PARTIAL
      block every 200ms, signs it, and pushes it to RPC nodes over a websocket method
      `preconf_newPartialBlock`; those RPC nodes re-execute it and then OVERRIDE
      eth_getBalance / eth_getTransactionCount / eth_estimateGas / eth_getBlockByNumber
      / eth_gasPrice / eth_getTransactionReceipt to serve pre-confirmed state, which is
      held only in memory and discarded on the next fork-choice head. It would also be
      the first place Berachain executes transactions in parallel ("transactions are
      executed in parallel ... transactions with conflicting state access are shuffled
      back to the mempool"). None of it is in bera-reth v1.4.4: `grep -ri preconf src/`
      finds nothing, the only trace in the pinned tree is a nightly Docker job that
      builds the `preconf-dev` BRANCH, and the public RPC answers the method with
      -32601. When it lands the ordering answer for this chain changes shape and this
      row will need re-reading.
  - id: BRIP-0009
    name: "Deprecation of Go-ethereum Execution Client"
    adoption: adopted
    src: "bera-geth/params/config.go:BerachainChainConfig"
    src_doc: "https://github.com/berachain/BRIPs/blob/main/meta/BRIP-0009.md"
    note: >-
      The chain's own, Final (2026-01-11) statement of the two-clients-three-forks
      divergence this row found empirically: bera-geth is deprecated and bera-reth is
      the sole maintained EL. The stated REASON ties client mono-culture to ordering —
      "future protocol enhancements, particularly the preconfirmation network described
      in BRIP-0007, will require deep integration with reth-sdk for block builder and
      RPC modifications". So bera-geth's inability to validate the current head is not
      neglect; it is a deliberate consequence of moving block building into reth.


tx_types:
  "0x7E":
    name: "PoLTx (BRIP-0004 Proof-of-Liquidity distribution)"
    status: added
    spec: BRIP-0004
    severity: high
    fork: prague1
    src: "src/transaction/mod.rs:POL_TX_TYPE, bera-geth/core/types/tx_pol.go:PoLTx"
    fields: [ChainID, From, To, Nonce, GasLimit, GasPrice, Data]
    src_live: "eth_getTransactionByBlockNumberAndIndex @ 25264103 idx 0 -> type 0x7e, from 0xfffffffffffffffffffffffffffffffffffffffe, to 0xd2f1..0761, nonce 0x18183e6, v=r=s=0"
    note: >-
      DIRECT COLLISION WITH OP STACK'S DEPOSIT TYPE. Seven fields, no signature
      (rawSignatureValues returns 0,0,0), sender hardcoded to the system address
      0xfff..ffe, `to` fixed to the PoL Distributor from chain config, and `nonce`
      abused to carry the BLOCK NUMBER BEING DISTRIBUTED FOR (block-1), not an
      account nonce. Its calldata is always distributeFor(bytes pubkey) over the
      PARENT block's proposer BLS key, taken from the parent header's 22nd field.
      Three consensus rules make it unusual even among protocol transactions:
      (1) it MUST be transaction index 0 of every post-Prague1 block and MUST NOT
      appear anywhere else — validate_pol_transaction recomputes the expected
      transaction and compares HASHES, so the entire transaction is a pure function
      of (chain id, distributor, block number, base fee, parent proposer key);
      (2) it consumes ZERO block gas despite running with a 30,000,000 gas limit
      and emitting logs — at the probed block its receipt shows gasUsed 0 with 41
      logs, and cumulativeGasUsed for the block excludes it entirely; and
      (3) it is rejected by the transaction pool, so it can never be submitted.
      The receipt is a normal typed receipt, so an indexer summing receipt gasUsed
      agrees with the header while an indexer summing traced execution does not.
  note: >-
    Live set = mainnet's 0x00-0x04 plus 0x7E. Observed in 60 blocks to 25264103:
    0x7E x60 (one per block, always index 0), 0x02 x25, 0x00 x10.

tx_authorization:
  key_binding: derived
  signers_per_tx: 1
  note: >-
    Unchanged from mainnet for every transaction a user can send: secp256k1,
    derived addresses, ecrecover(sig) == from. The interesting entry is what does
    NOT authorize. Berachain's validators are identified by BLS12-381 keys, one of
    which is written into every block header (parentProposerPubkey) and passed as
    calldata to a protocol transaction — and that key authorizes nothing at the
    execution layer. It signs CometBFT consensus messages and BeaconKit deposits,
    never an EVM transaction, and there is no BLS12-381 signature-verification
    precompile pairing that the EVM could use to check it either: the BLS12-381
    precompiles at 0x0b-0x11 are EIP-2537 curve arithmetic, not a signature
    verifier for this scheme. So the chain writes a public key into consensus state
    that its own contracts cannot verify a signature from. Contrast Sei's sr25519
    and Kaia's role keys, which authorize with no verifier; here the key does not
    even authorize.
  src: "src/primitives/header.rs:BlsPublicKey, src/transaction/pol.rs:create_pol_transaction"
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
    protocol_system_address:
      status: added
      authorizes: protocol
      precompile: none
      severity: high
      src: "src/transaction/pol.rs:SYSTEM_ADDRESS, bera-geth/core/types/tx_pol.go:rawSignatureValues"
      note: >-
        The 0x7E PoL transaction is authorized by nothing at all: v, r and s are
        literal zeros, `from` is the constant 0xfff..ffe, and validity is decided by
        recomputing the transaction and comparing hashes. This is the OP-deposit
        pattern (unsigned, protocol-authored) arrived at independently, and it lands
        on the same type byte. It cannot reach the mempool — the pool rejects
        PoLTxType outright — so the ONLY way one exists is for a block producer to
        synthesise it, and the only way it is accepted is for every other node to
        derive byte-identical bytes from the header.
    bls12_381_validator_key:
      status: added
      authorizes: never
      precompile: none
      src: "beacon-kit/consensus-types/types/withdrawal_request.go:ValidatorPubKey, src/primitives/header.rs:BlsPublicKey"
      note: >-
        48-byte BLS12-381 validator keys authorize CometBFT consensus votes,
        BeaconKit deposits and EIP-7002 withdrawal requests. They never authorize an
        EVM transaction. Recorded because one of them is a CONSENSUS-CRITICAL FIELD
        OF EVERY EVM BLOCK HEADER, which is not true of Ethereum, and because a
        reader seeing a BLS key in the header may reasonably assume otherwise.

precompiles:
  note: >-
    ZERO custom precompiles and zero divergence from mainnet Osaka. bera-reth builds
    its precompile set with the stock revm constructor,
    Precompiles::new(PrecompileSpecId::from_spec_id(spec)) (src/evm/mod.rs), with no
    Berachain insertions and no removals — the one place in this row where the
    "near-empty delta" prediction holds exactly. Verified live: 0x01-0x12 all return
    empty code (native, not predeploys) and 0x0100 verifies a valid P-256 signature
    and rejects a corrupted one at block 25264103. Berachain is the counterexample
    to "a chain with a bespoke consensus layer adds precompiles to reach it": the
    consensus layer is reached through ordinary contracts and the withdrawals list
    instead.

system_contracts:
  "0x4242424242424242424242424242424242424242":
    name: BeaconDeposit
    status: added
    severity: high
    src: "tests/fixtures/mainnet-genesis.json:depositContractAddress, beacon-kit/config/spec/defaults.go:defaultDepositContractAddress, src/deposits.rs:DEPOSIT_EVENT_SIGNATURE"
    src_live: "eth_getCode @ 25264103 -> 4190 bytes of bytecode; eth_call get_deposit_count() (mainnet selector 0x621fd130) -> execution reverted"
    note: >-
      Berachain's staking deposit contract, at the address Ethereum uses for its
      TESTNET deposit contracts (Sepolia, Holesky, Hoodi all use 0x4242..4242) —
      a mainnet chain occupying a well-known testnet address. Different ABI and a
      different event from Ethereum's: Deposit(bytes,bytes,uint64,bytes,uint64),
      topic 0x68af7516...891d46. The EL reads its logs to build EIP-6110 deposit
      requests from Osaka onward.
  "0x00000000219ab540356cBB839Cbe05303d7705Fa":
    name: "Ethereum mainnet BeaconDeposit (absent)"
    status: removed
    src_live: "eth_getCode @ 25264103 -> 0x"
    note: >-
      Empty account. A tool holding Ethereum's deposit address as a constant gets
      silent success with empty output, never an error — the same failure shape
      Gnosis exhibits at the same address.
  "0xD2f19a79b026Fb636A7c300bF5947df113940761":
    name: PoLDistributor
    status: added
    severity: high
    fork: prague1
    src: "bera-geth/params/protocol_params.go:PoLDistributorAddress, tests/fixtures/mainnet-genesis.json:polDistributorAddress"
    src_live: "eth_getCode @ 25264103 -> 202-char proxy bytecode; it is the `to` of the 0x7E transaction in every block"
    note: >-
      An ordinary upgradeable proxy at an ordinary-looking address that the PROTOCOL
      calls once per block. Its address is a chain-config field, so changing it is a
      hard fork; its CODE is behind a proxy, so changing what the protocol call does
      is not. Reward distribution logic is therefore governance-mutable without a
      client release, and the block is invalid if the call is missing.
  "0x1AE7dD7AE06F6C58B4524d9c1f816094B1bcCD8e":
    name: "EVM inflation recipient (Fulu)"
    status: added
    fork: osaka
    src: "beacon-kit/config/spec/mainnet.go:mainnetEVMInflationAddressFulu"
    src_live: "eth_getBalance @ 25264102 and @ 25264103 -> exactly 1705000000000000000 wei at both heights (delta 0)"
    note: >-
      Where the whole of BERA issuance is minted. Its balance is a fixed point:
      exactly one block's inflation, at every height sampled. The withdrawal credits
      1.705 BERA at the end of each block and the next block's PoL transaction — the
      first transaction of that block — spends it, so the account never accumulates.
      Two protocol mechanisms, one at each end of the block, forming a closed loop
      that no user transaction participates in.
  "0x656b95E550C07a9ffe548bd4085c72418Ceb1dba":
    name: "EVM inflation recipient (Deneb1, superseded)"
    status: tombstoned
    tombstoned_at: 1783526400
    src: "beacon-kit/config/spec/mainnet.go:mainnetEVMInflationAddressDeneb1"
    src_live: "eth_getBalance @ 25264103 -> 63650359473954404521836864 wei, delta 0 across the block"
    note: >-
      Received 5.75 BERA per block from Deneb1 until Fulu redirected issuance
      elsewhere. Still holds 63.6M BERA and is no longer credited. Recorded because
      "the inflation address" is a moving target set by CL config, not EL config —
      three different values so far.
  note: >-
    All four Ethereum system contracts (4788, 2935, 7002, 7251) are present at their
    mainnet addresses and BYTE-IDENTICAL to mainnet's, checked by diffing eth_getCode
    against an Ethereum mainnet node. What differs is not their code but what
    consumes their output: see eips.4788, eips.7251.

system_transactions:
  pol_distribution:
    name: "distributeFor(bytes pubkey) — BRIP-0004"
    status: added
    severity: high
    fork: prague1
    src: "src/transaction/pol.rs:create_pol_transaction, src/node/evm/executor.rs:apply_pre_execution_changes, src/consensus/mod.rs:validate_pol_transaction, bera-geth/core/state_transition.go:ApplyPoLMessage"
    src_live: "eth_getBlockReceipts @ 25264103 -> receipt[0] type 0x7e, gasUsed 0, 41 logs, status 0x1; cumulativeGasUsed of the last receipt (249042) equals the sum of the OTHER seven receipts"
    note: >-
      Berachain's answer to "how does a non-Ethereum consensus layer pay validators"
      is neither a coinbase credit nor a withdrawal: it is a mandatory EVM CALL at
      transaction index 0 of every block, executed as a system call
      (ApplyPoLMessage bypasses the whole state-transition path — no nonce check, no
      balance check, no gas purchase, no refund) but SURFACED as a real typed
      transaction with a real receipt. It is simultaneously a system transaction and
      a transaction type, which is why this row declares it in both sections. Its 41
      logs at the probed block are ordinary EVM logs from an ordinary proxy, indexed
      like any other — so an event indexer sees Proof-of-Liquidity payouts and a gas
      accountant sees nothing.

      POSITION IN THE BLOCK, and why it matters for ordering. It runs BEFORE every
      user transaction, and not by convention: `apply_pre_execution_changes` performs
      the EIP-2935 blockhashes call, then the EIP-4788 beacon-root call, then
      `execute_pol_transaction_with_receipt`, and only after all three does the
      builder enter the `while let Some(pool_tx) = best_txs.next()` selection loop.
      The position is then FIXED BY CONSENSUS on the verifying side:
      validate_pol_transaction requires transactions[0] to be a PoL transaction, and
      separately walks indices 1..n rejecting any PoL transaction found there — so
      neither "absent" nor "present but moved" is a valid block. Consequence for the
      ordering question: NO user transaction in the same block can affect the PoL
      call, because none of them has executed when it runs. What CAN affect it is the
      PREVIOUS block — the EIP-4895 inflation withdrawal is credited at the end of
      block N and the PoL call at the top of N+1 is what spends it, so the coupling
      runs across the block boundary, never within it. A second, sharper coupling:
      the expected PoL transaction is derived from (chain id, distributor, block
      number, BASE FEE, parent proposer key) and validated by hash, so any change to
      the base fee — including the base-fee FLOOR being switched on at Prague1, off
      at Prague2 and on again at Osaka1 — changes the bytes of the block's mandatory
      transaction. The fee floor is not only a user-facing rule; it is an input to a
      consensus-critical transaction hash.

      One thing the protocol does NOT require: that the call SUCCEED. The executor
      treats only an EVM-level `Err` from transact_system_call as fatal and never
      inspects `result.is_success()`, so a REVERTING distributeFor would produce a
      status-0 receipt at index 0 inside a perfectly valid block. The block is
      invalid if the transaction is missing, moved or byte-different; it is valid if
      the transaction fails.
  prague3_log_predicate:
    name: "Prague3 blocked-address rule (2025-11-03 to 2025-11-12)"
    status: tombstoned
    tombstoned_at: 1762963200
    severity: high
    src: "src/consensus/mod.rs:validate_block_post_execution, src/engine/builder.rs:258, bera-geth/core/state_processor.go:ValidatePrague3Transaction"
    note: >-
      For nine days a Berachain block was INVALID if any receipt in it contained an
      ERC-20 Transfer(address,address,uint256) log whose from or to matched one of
      eight blocked addresses (unless the destination was a single hardcoded rescue
      address), or any Transfer touching the BEX vault
      0x4be03f78..9e80b, or any InternalBalanceChanged event emitted by that vault.
      Nothing else in this dataset makes transaction validity a predicate over
      EMITTED LOGS. It is not a mempool filter and not a precompile revert: the
      transaction executes to completion and is then rejected, in bera-geth by
      returning an error from ApplyTransactionWithEVM after the receipt is built,
      and in bera-reth in validate_block_post_execution after the whole block has
      executed. Two consequences worth recording. First, an address can be frozen
      for a token that has no freeze function, because the rule is imposed on the
      LOG rather than on the token. Second, bera-reth's payload builder responded by
      building EMPTY BLOCKS for the entire window — `if prague3_active { building
      empty block }` — so the chain kept producing blocks containing nothing but the
      PoL transaction. Prague4 exists only to switch this off, and the rule is dead
      at the probed block; it is recorded because it shipped, and because the
      machinery (a blocked-address list and a rescue address as chain-config fields)
      remains in both clients.

      READ IT AS AN ORDERING/EXECUTION FACT, which is what makes it more than a
      curiosity. Every other validity rule on this chain can be decided when the
      transaction is selected: a signature, a nonce, a balance, a gas price against
      the base fee. Prague3 could not — whether a receipt's logs mention a blocked
      address is a function of EXECUTION OUTPUT, unknowable at ordering time, and it
      was evaluated in bera-reth in validate_block_post_execution, i.e. after the
      ENTIRE BLOCK had run, returning a ConsensusError over the block rather than
      over the transaction. So for nine days Berachain genuinely had the state this
      row otherwise reports as unreachable: a transaction that is validly ordered,
      executes to completion, and then invalidates the block. The chain's answer was
      not to skip the transaction, refund it or receipt it as failed — it was to
      STOP ORDERING ALTOGETHER. bera-reth's builder gates its whole selection loop
      on `while !prague3_active`, and logs "Prague3 is active, building empty
      block". Nine days of blocks containing nothing but the mandatory PoL
      transaction is what "a consensus rule keyed on execution output" costs when
      the block builder cannot predict it.
  engine_api:
    name: "engine_*V4P11 / engine_forkchoiceUpdatedV3P11"
    status: added
    fork: prague1
    src: "src/engine/rpc.rs:48, src/engine/rpc.rs:BERACHAIN_REMOVED_CAPABILITIES, bera-geth/eth/catalyst/api.go:NewPayloadV4P11"
    note: >-
      The Engine API itself is forked. Three non-standard methods —
      engine_newPayloadV4P11, engine_forkchoiceUpdatedV3P11, engine_getPayloadV4P11
      — carry the extra proposerPubkey argument that BRIP-0004 needs, and
      engine_getPayloadV5 is implemented but REMOVED from the advertised capability
      set, so Osaka payloads travel over the V4P11 method instead of the standard V5.
      An unmodified Ethereum consensus client cannot drive this execution layer, and
      an unmodified execution client cannot be driven by BeaconKit. This is a
      cleaner statement of the CL/EL split than "BeaconKit replaces the beacon
      chain": the wire protocol between them is different.
  note: >-
    EIP-4788 and EIP-2935 system calls run unchanged (see eips). The EIP-7002 and
    EIP-7251 queue-drain system calls also run unchanged — but only the 7002 output
    is consumed by the consensus layer.

opcodes:
  added: []
  removed: []
  modified: []
  note: >-
    No opcode divergence. CLZ (EIP-7939) is present because Osaka is, and was
    verified live. Berachain's EVM-level deltas are limits and fees, not opcodes.

fee_model:
  metering: gas
  fee_market: "EIP-1559 with a per-fork base-fee floor and a 6x slower change denominator"
  src: "src/chainspec/mod.rs:next_block_base_fee"
  extra_components:
    - name: nonce on failure
      src: "src/engine/builder.rs:default_berachain_payload, beacon-kit/consensus/cometbft/service/process_proposal.go:PROCESS_PROPOSAL_STATUS_REJECT, beacon-kit/testing/simulated/malicious_proposer_test.go:TestProcessProposal_BadBlock_IsRejected"
      note: >-
        NONCE ON FAILURE: PRESERVED, and there is no receipt because there is no
        block. Berachain does not separate ordering from execution in the way that
        makes this question dangerous elsewhere: the proposer's own EL builds the
        list BY executing as it appends, so an invalid transaction never reaches a
        payload. In `default_berachain_payload`, `execute_transaction` returning
        `InvalidTx` is handled inline — `is_nonce_too_low()` logs "skipping nonce
        too low transaction" and `continue`s, anything else calls
        `best_txs.mark_invalid` (dropping the transaction's descendants) and
        `continue`s. Nothing is committed for either, so the account nonce is
        untouched and the transaction stays resubmittable at the same nonce.

        IF ONE SURVIVES INTO A PROPOSED BLOCK ANYWAY — a faulty or Byzantine
        proposer — `engine_newPayload` is ALL-OR-NOTHING: there is no
        per-transaction skip, the payload is INVALID, and
        `process_proposal` answers CometBFT with
        `PROCESS_PROPOSAL_STATUS_REJECT`. beacon-kit ships
        `TestProcessProposal_BadBlock_IsRejected` for exactly this case. The height
        is re-proposed by the next proposer, and single-slot finality means the
        committed chain never contains the bad block. So the innocent co-passengers
        of the invalid transaction also keep their nonces — nothing was executed —
        and an RPC client observes nothing at all: no receipt, no status-0 receipt,
        no orphan block, no reorg. This is the benign pole of the axis, and it is
        the direct opposite of Artela, where the transaction is in a committed
        block, its nonce is spent, and the RPC hides it.
    - name: base-fee floor
      src: "src/chainspec/mod.rs:next_block_base_fee"
      note: >-
        1 gwei (Prague1) -> 0 (Prague2) -> 1 gwei (Osaka1). Inside header
        validation, not a node policy. Live value at the probed block: 1 gwei.

        Ordering consequence, because this is the exact shape the brief asks about:
        raising the floor CAN invalidate an already-signed transaction, and the
        chain resolves it at selection rather than in a block. The payload builder
        asks the pool for best_transactions_with_attributes(base_fee, ...) computed
        for the block being built, so a transaction whose cap fell below the new
        floor is never selected; it sits in the EL mempool with no receipt and no
        error. If one nevertheless reached a payload, the EL would answer
        engine_newPayload INVALID and the whole block would be rejected — see
        consensus.note. It also re-derives the mandatory PoL transaction: the base
        fee is an input to its hash.
    - name: base-fee change denominator 48
      src: "bera-geth/params/protocol_params.go:BerachainBaseFeeChangeDenominator"
      note: "BRIP-0002. Six times slower response than mainnet's 8, in both directions."
    - name: blob base-fee floor
      src: "src/chainspec/mod.rs:blob_params_at_timestamp"
      note: "1 gwei from Osaka1, against mainnet's 1 wei. Confirmed by eth_feeHistory."
    - name: zero-gas protocol transaction
      src: "src/node/evm/executor.rs:100"
      note: >-
        The 0x7E PoL transaction runs with a 30M gas limit and charges nothing to
        the block gas pool, so a Berachain block can execute more work than its
        gasUsed reports. Block gas accounting and block execution cost diverge by
        the size of the distribution call.
    - name: mempool minimum priority fee
      src: "src/pool/min_priority_fee.rs:MinPriorityFeeValidator"
      note: >-
        NOT consensus. A pool-admission floor on the EFFECTIVE tip (reth's built-in
        checks only dynamic-fee transactions and only the declared cap). The source
        is explicit that "it never changes block validity" — recorded so it is not
        mistaken for a protocol rule, and because it is exactly the kind of thing
        that gets reported as one.

header_fields:
  added:
    - name: parentProposerPubkey
      severity: high
      src: "src/primitives/header.rs:prev_proposer_pubkey, bera-geth/core/types/block.go:ParentProposerPubkey"
      src_live: "RLP-reconstructed from eth_getBlockByNumber @ 25264103: keccak256 of the 21 mainnet fields does NOT equal the block hash; keccak256 of 22 fields with the 48-byte pubkey appended DOES equal 0xd0e09c8b1a862f34950fc506d4296e8d30f2053060a7a64813b35da65fd2aea4"
      note: >-
        A 22nd RLP field: the 48-byte BLS12-381 public key of the PARENT block's
        proposer, appended after requestsHash. Established by reconstruction, not by
        reading JSON keys — the block hash is only reproducible with 22 fields. It
        is rlp:"optional" in the struct, which makes OLD headers decodable but does
        NOT make new ones decodable by a stock client: an Ethereum header decoder
        handed a Berachain header sees one element too many. Consequences: the
        header is 48 bytes larger, the block hash preimage differs in shape, and
        the consensus layer's proposer identity is now consensus-critical EL data
        that the next block's mandatory transaction reads.
  removed: []
  modified: []
  note: >-
    All 21 mainnet fields are present and carry their mainnet meanings — including
    blobGasUsed and excessBlobGas, which are real blob gas here rather than
    repurposed (contrast OP Stack) or pinned to zero (contrast Avalanche), and
    parentBeaconBlockRoot and requestsHash, which Sonic omits entirely.

gotchas:
  - >-
    CometBFT DOES NOT ORDER THE TRANSACTIONS. The intuitive reading of a
    CometBFT-plus-EVM chain — consensus picks the transaction list in
    PrepareProposal, the execution layer runs what it is handed — is false here.
    BeaconKit's prepareProposal ignores the CometBFT mempool entirely and returns
    exactly two opaque blobs, the SSZ beacon block and the blob sidecars. EVM
    transactions are never CometBFT transactions. The list is chosen by bera-reth's
    payload builder over its own mempool, priority-fee greedy and single-threaded,
    and handed up through engine_getPayloadV4P11. Ordering and execution happen in
    the same pass, in the execution layer.
  - >-
    A TRANSACTION THAT IS ORDERED BUT INVALID WHEN EXECUTED KILLS THE BLOCK, NOT
    ITSELF. There is no per-transaction skip at verification time: engine_newPayload
    is all-or-nothing, ProcessProposal answers PROCESS_PROPOSAL_STATUS_REJECT, and
    CometBFT re-proposes the height. An RPC client sees nothing at all — no receipt,
    no status-0 receipt, no orphan, no reorg, because single-slot finality means the
    rejected block never enters the canonical chain. beacon-kit's own test injects a
    transaction priced below the base fee and asserts exactly this. Note the
    contrast with the other CometBFT chain in this dataset: Artela ERASES the
    transaction (in the block, no index entry, receipt null forever); Berachain
    never produces the block. Same consensus engine, opposite failure mode — the
    difference is that Berachain's EVM is a separate process behind the Engine API,
    whose verdict is over the payload rather than over a transaction.
  - >-
    THE ONE TIME IT DID HAPPEN, THE CHAIN STOPPED ORDERING. Prague3's blocked-address
    rule (Nov 2025) is a consensus rule keyed on EXECUTION OUTPUT — a block is
    invalid if any receipt in it logs one of eight addresses — which is exactly the
    predicate a block builder cannot evaluate while selecting transactions.
    bera-reth's answer was to gate its whole selection loop on `while !prague3_active`
    and log "Prague3 is active, building empty block". For nine days every block
    contained nothing but the mandatory PoL transaction. If you want a shipped,
    on-mainnet demonstration of why validity rules that depend on execution output
    are different in kind from rules that do not, this is it.
  - >-
    NO PRECONFIRMATIONS, AND NO EARLY RECEIPT. Single-slot finality means an
    eth_getTransactionReceipt answer is already final and cannot change; there is no
    provisional block hash to look for. BRIP-0007 designs a sequencer that would
    serve 200ms partial-block state through overridden eth_* methods, but it is
    status Review, has no code in bera-reth v1.4.4, and the public RPC answers
    preconf_newPartialBlock with -32601. Anything built on that assumption today is
    building on an unshipped design.
  - >-
    THE PoL TRANSACTION RUNS BEFORE EVERY USER TRANSACTION, and consensus enforces
    it in both directions: index 0 must be a PoL transaction and no other index may
    be. So no user transaction in a block can influence the distribution call. The
    coupling is across blocks instead — the inflation withdrawal at the end of block
    N is what the PoL call at the top of N+1 spends. And because the expected PoL
    transaction is derived from the header's BASE FEE and checked by hash, changing
    the base-fee floor changes the bytes of the block's mandatory transaction.
  - >-
    "BERACHAIN V2" IS NOT A HARD FORK. The chain's protocol forks are genesis,
    prague, prague1-4, osaka and osaka1 — there is no v2 among them, in the client
    or in the genesis config. "V2" names product/tokenomics generations of
    Proof-of-Liquidity (PoL v2 / "PoL Next"), which ship as contract upgrades behind
    the PoL Distributor proxy plus two consensus-layer constants. The protocol
    surface it touches is already in this row: the Fulu inflation address and rate,
    and the fact that the Distributor is an upgradeable proxy the protocol calls
    every block. Do not go looking for a "v2" fork name in a client config.
  - >-
    THE PREDICTION WAS WRONG. Berachain does not have a near-empty EVM delta. It
    raises EIP-170's contract size limit to 32 KB and EIP-3860's initcode limit to
    64 KB, adds a transaction type, adds a 22nd header field, floors the base fee,
    slows the base-fee denominator sixfold, floors the blob base fee, and ships
    Osaka without PeerDAS. What IS empty is the precompile set: zero custom
    precompiles, zero divergences, stock revm.
  - >-
    A 30 KB contract deploys here and nowhere else in this dataset. Size-limit
    tooling that hardcodes 24576 reports a false failure on Berachain; a contract
    developed on Berachain against the 32 KB limit cannot be deployed on mainnet.
  - >-
    Type byte 0x7E is a COLLISION with OP Stack's deposit transaction, on a chain
    with no OP ancestry. Both are unsigned system-authored transactions from
    0xfff..ffe; the field lists are different. Any decoder with a global type-byte
    map mis-parses one chain or the other.
  - >-
    The first transaction of every block consumes ZERO block gas while running with
    a 30,000,000 gas limit and emitting logs (41 at the probed block). Receipt-sum
    gas accounting agrees with the header; execution-cost accounting does not.
  - >-
    parentBeaconBlockRoot is a well-formed 32-byte root of the wrong object. The
    4788 contract is byte-identical to mainnet's and the ring buffer is correct, but
    it commits to a BeaconKit BeaconBlockHeader whose body and state layouts are not
    Ethereum's. Restaking and validator-proof libraries verify against the wrong
    generalized indices and get no error, only a failed proof — or worse, a
    succeeding proof of a different field.
  - >-
    EIP-7251 consolidations are accepted, charged for, queued, drained into
    requestsHash and then silently discarded by the consensus layer. Every layer a
    caller can observe reports success.
  - >-
    Withdrawals are issuance, not staking. Every block carries exactly one
    withdrawal with index and validatorIndex both 2^64-1 — a synthetic entry the
    consensus layer requires to be first and which no validator owns. In 60
    consecutive blocks there were no validator withdrawals at all.
  - >-
    For nine days in November 2025 a block was invalid if any receipt in it logged
    an ERC-20 Transfer involving one of eight addresses. Transaction validity was a
    predicate over emitted logs, decided after execution. bera-reth's response was
    to build empty blocks for the whole window.
  - >-
    Two execution clients, three fork generations apart. bera-geth's newest release
    has no osakaTime for chain 80094 and no Osaka1, so it cannot validate the
    current head; bera-reth is what actually runs. Pinning "the Berachain client"
    without checking which one gives an answer that is wrong about the code size
    limit, the base-fee floor and the blob schedule.
  - >-
    The Engine API is forked: engine_newPayloadV4P11 / forkchoiceUpdatedV3P11 /
    getPayloadV4P11 carry a proposerPubkey argument, and engine_getPayloadV5 is
    implemented but deliberately unadvertised. Stock CL and stock EL cannot be
    mixed in either direction.

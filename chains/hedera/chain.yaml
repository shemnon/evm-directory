system_transactions:
  note: >-
    Hedera has protocol-driven state changes, but they are HAPI transactions in the ordinary
    stream rather than a distinct EVM-visible category, and none of them appears over `eth_*`.
  entries:
  - name: NodeStakeUpdate
    src: "hapi/hedera-protobuf-java-api/src/main/proto/services/transaction.proto:node_stake_update"
    note: "The network issues this to itself at each staking period boundary; it pays staking rewards, which change HBAR balances that BALANCE and eth_getBalance read."
  - name: "post-upgrade setup"
    src: "hedera-node/hedera-app/src/main/java/com/hedera/node/app/workflows/handle/HandleWorkflow.java:doPostUpgradeSetup"
    note: "After a software upgrade the first handled transaction triggers `systemTransactions.doPostUpgradeSetup`, which mutates state outside any user transaction."
  - name: "scheduled transaction execution"
    src: "hedera-node/hedera-app/src/main/java/com/hedera/node/app/workflows/handle/HandleWorkflow.java:executeScheduledTransactions"
    note: >-
      A previously created Schedule executes when its signature threshold is met or its time
      arrives — including in an EMPTY ROUND, where `executeScheduledTransactions` runs with
      the round's consensus time. State can change in a block containing no submitted
      transaction at all. If such a schedule contains a ContractCall, EVM state changes with
      no `eth_*` transaction to attribute it to.
  - name: "hinTS / history-proof ceremony traffic"
    src: "hapi/hedera-protobuf-java-api/src/main/proto/services/transaction.proto:hints_partial_signature"
    note: "Consensus machinery (threshold-signature key publication, partial signatures, CRS publication) submitted as ordinary transactions in the same stream as user traffic."

gotchas:
  - >-
    THE `eth_*` API IS NOT THE STATE TRANSITION. Blocks, hashes, roots, `gasLimit`, `miner`
    and the `latest`/`safe`/`finalized`/`pending` tags are computed in TypeScript by a
    separate process (`hiero-json-rpc-relay`, versioned independently — the live endpoint
    reports `relay/0.78.4` while the network runs consensus software 0.76.2) reading a
    mirror node over HTTP. Nothing it returns is signed, voted on, or reproducible from
    consensus. Everything about ordering, fees, duplicates and execution IS consensus.
    Confusing the two is the root of most wrong beliefs about this chain.
  - >-
    ORDERING IS FINAL BEFORE ANYTHING IS EXECUTED, AND A TRANSACTION THAT IS INVALID WHEN
    IT EXECUTES IS BILLED WITHOUT EXECUTING. Hashgraph assigns every transaction a consensus
    timestamp by virtual voting over gossip, with no reference to its content. Handling
    happens afterwards, sequentially, in that order. `DispatchProcessor.processDispatch`
    charges fees FIRST and only then decides whether to call the handler. A transaction that
    has expired, has a bad payer signature, or fails a due-diligence check charges THE
    SUBMITTING NODE the network fee and the payer nothing. A transaction that is a duplicate,
    or whose payer cannot cover the service fee, charges THE PAYER and never runs. This is a
    fate no other row in this dataset has: not erased (Conflux, IOTA EVM, Artela, Rollkit),
    not executed-and-failed (Taraxa, Monad), but billed-and-skipped.
  - >-
    A TRANSACTION IS IDENTIFIED BY PAYER + VALID-START TIMESTAMP, NOT BY ITS CONTENTS. Two
    submissions are the same transaction iff they share a `TransactionID`; nothing about the
    body enters the key. Submitting the same signed transaction to several nodes — which
    Hedera's own SDKs encourage for reliability — makes duplicates the NORMAL case, and the
    payer pays the node and network fees for every duplicate that reaches consensus, with the
    service fee waived. THE DUPLICATE NEVER EXECUTES, HAS NO EFFECT, AND IS INVISIBLE OVER
    `eth_*`: the Ethereum hash is written into the record only by
    `EthereumTransactionHandler.handle`, which a duplicate never reaches, so
    `eth_getTransactionReceipt` returns null for that occurrence forever while the HBAR is
    gone. If the SAME node submits the duplicate, the node is charged instead and the payer
    is not.
  - >-
    HBAR HAS EIGHT DECIMALS AND THE CONVERSION IS APPLIED INCONSISTENTLY. The signed
    transaction's `value` is divided by 10^10 with integer division and NO remainder check
    (`EthTxData.getAmount`), so any amount below 10^10 weibar silently becomes ZERO and the
    transaction still succeeds. Inside the EVM, `msg.value` and `BALANCE` are in TINYBARS
    (eight decimals) because `weiValue()` is `Wei.of(tinybarValue)`. Over JSON-RPC,
    `eth_getBalance` multiplies back to eighteen decimals. THE SAME ACCOUNT'S BALANCE DIFFERS
    BY 10^10 DEPENDING ON WHETHER YOU ASK THE EVM OR THE RPC, and neither answer carries a
    unit. A contract comparing `msg.value` to `1 ether` can never be satisfied.
  - >-
    CALLING ANY ADDRESS FROM 0x01 TO 0x2EE THAT IS NOT A PRECOMPILE CONSUMES ALL FORWARDED
    GAS AND REPORTS SUCCESS. `Version038AddressChecks.isSystemAccount` covers entity numbers
    up to 750; `CustomMessageCallProcessor.handleNonExtantSystemAccount` calls
    `frame.clearGasRemaining()` and returns success with empty output. On mainnet the same
    call costs 100 gas. Sending value to such an address halts with `INVALID_CONTRACT_ID`
    instead of creating the account. This is also why an `eth_call` to 0x0100 returns empty
    output — it is the sink, not P256VERIFY.
  - >-
    `stateRoot` IS A CONSTANT AND `transactionsRoot` IS THE BLOCK HASH. `BlockFactory`
    hardcodes `stateRoot` to the EMPTY Merkle Patricia trie root in every block since
    genesis, and sets `transactionsRoot` to `txArray.length === 0 ? emptyTrieRoot :
    blockHash`. Neither commits to anything. `receiptsRoot` is the one root actually
    computed, and for an empty block it is 32 zero bytes rather than the empty-trie root the
    same header uses two fields earlier.
  - >-
    THE REAL BLOCK HASH IS 48 BYTES OF SHA-384, TRUNCATED TO 32 EVERYWHERE. Both the relay
    (`toHash32`) and the EVM (`ConversionUtils.ethHashFrom`) keep only the first 32 bytes.
    The negative result matters: BECAUSE BOTH TRUNCATE IDENTICALLY, `BLOCKHASH(n-1)` DOES
    EQUAL `parentHash`. Verified live — the `eth_*` hash at block 99380446 is a byte-exact
    prefix of the mirror node's 48-byte hash.
  - >-
    `eth_getCode` AT 0x167 RETURNS `0xfe` AND THE RELAY INVENTED IT. `ContractService.getCode`
    short-circuits on the HTS address "before consulting nodes" and returns one INVALID
    opcode byte. No such byte is in state. The five other Hedera system contracts —
    0x168, 0x169, 0x16a, 0x16b, 0x16c — return `0x` from the same call. Contract-detection
    by `eth_getCode != "0x"` is therefore wrong in both directions on this chain.
  - >-
    AN ACCOUNT'S CODE DEPENDS ON THE CALLDATA USED TO CALL IT. `ProxyEvmAccount.getEvmCode`
    takes the function selector as a parameter and returns account-proxy bytecode only for
    `hbarAllowance`, `hbarApprove` and `setUnlimitedAutomaticAssociations`, and empty code
    otherwise. Separately, every HTS token has synthesised, address-dependent ERC-20/721
    proxy bytecode generated on demand by `RedirectBytecodeUtils`. There is no Ethereum
    account state that behaves like either.
  - >-
    `block.basefee` IS ZERO AND `block.gaslimit` IS THE TRANSACTION'S OWN GAS LIMIT.
    `HevmBlockValues.getBaseFee()` returns `Wei.ZERO` unconditionally while
    `eth_getBlockByNumber` reports 1.11e12 for the same block; `HevmBlockValues` is
    constructed with the transaction's gas limit, so `block.gaslimit` varies between
    transactions in one block. `COINBASE` returns entity 98
    (0x…0062) while the block's `miner` field is the zero address.
  - >-
    GAS IS PRICED IN DOLLARS, NOT BY DEMAND. `TinybarValues.topLevelTinybarGasPrice` converts
    a tinycent fee-schedule price at the network's HBAR/USD exchange rate, times a congestion
    multiplier. The HBAR gas price therefore moves when the HBAR PRICE moves. There is no
    auction: `eth_maxPriorityFeePerGas` returns 0 and paying more buys nothing. The rate
    itself is readable from EVM code at 0x168.
  - >-
    ONE ETHEREUM TRANSACTION HAS TWO PAYERS. The HAPI payer ("relayer") that wrapped it in an
    `EthereumTransactionBody` and the EVM sender recovered from the inner signature are
    different accounts. `max_gas_allowance` lets the relayer subsidise the sender, and on an
    ABORTED Ethereum transaction `chargeGasForAbortedTransaction` charges the RELAYER the
    intrinsic gas. Two accounts are debited by one transaction and the receipt names one.
  - >-
    A SUCCESSFUL ETHEREUM TRANSACTION IS REFUNDED ITS HAPI FEE AND A FAILED ONE IS NOT.
    `contracts.evm.ethTransaction.zeroHapiFees.enabled` defaults true, so success triggers
    `feeCharging.refund`. Failure keeps the node/network/service fee on top of the gas. The
    surcharge for failing does not appear in `gasUsed * effectiveGasPrice`.
  - >-
    EVERY RECEIPT CLAIMS A `contractAddress`. `TransactionReceiptFactory.getContractAddressFromReceipt`
    returns `receiptResponse.address` for every non-token-creating call, so a plain CALL —
    including a REVERTED one — comes back with `contractAddress` set to the callee. Any tool
    that treats a non-null `contractAddress` as "this was a deployment" misreads every
    transaction on this chain. Receipts also carry BOTH a pre-Byzantium `root` (hardcoded to
    the empty-trie constant) AND a `status`, plus a non-standard `revertReason`.
  - >-
    `eth_getBlockByNumber` SHOWS A MINORITY OF THE BLOCK AND INVENTS SOME OF WHAT IT SHOWS.
    Record file 99380446 contains 7 HAPI transactions; `eth_getBlockByNumber` reported 1.
    Meanwhile `blockWorker` FABRICATES legacy transactions for logs whose transaction is not
    an Ethereum transaction, with `from` = `to` = the log's contract address,
    `input = 0x0000000000000000`, `gasPrice = 0xfe` and a zero signature. They cannot be
    re-encoded to their own hash and they never existed.
  - >-
    `finalized`, `safe`, `pending` AND `latest` ALL RETURN THE SAME BLOCK — and here that is
    HONEST for three of the four. Hashgraph is aBFT: a transaction is final when it gets its
    consensus timestamp, there are no reorgs, and nothing can be revisited, so `finalized`
    and `safe` legitimately equal `latest`. `pending` equalling `latest` is the one that
    misleads: there is no pending pool view. A null `eth_getTransactionReceipt` on this chain
    means "the mirror node has not ingested the record yet", never "gone forever" — the
    opposite of Conflux, IOTA EVM, Artela and Rollkit.
  - >-
    ACCESS LISTS ARE ACCEPTED AND IGNORED. `EthTxData` parses type-0x01 and type-0x02 access
    lists and keeps them only for `equals`/`hashCode`; nothing in the execution module reads
    them. No warming, no discount, no surcharge, no error. Re-encoding one is not even
    implemented.
  - >-
    56 OF THE 59 HAPI TRANSACTION TYPES ARE INVISIBLE TO ETHEREUM TOOLING AND SOME OF THEM
    MOVE YOUR MONEY. `CryptoTransfer` moves HBAR that `BALANCE` reads. `CryptoUpdateAccount`
    can replace the key controlling an account. `TokenWipe` destroys a holder's token balance
    with no ERC-20 event. `ContractDeleteInstance` deletes a contract and sweeps its balance
    with no SELFDESTRUCT in any trace. `TokenAssociate` means a transfer to an unassociated
    account fails for a reason ERC-20 has no word for. An indexer built on `eth_*` sees none
    of it.
  - >-
    A BLOCK IS A TWO-SECOND BUCKET OF CONSENSUS TIME, NOT A PRODUCED OBJECT.
    `BlockRecordManagerImpl.willOpenNewBlock` returns true when
    `floor(consensusSecond / 2)` increments while the node is already iterating an ordered
    round. No quorum votes on a block, no proposer builds one, and `block.number` counts
    buckets since genesis. Inside the EVM `TIMESTAMP` is that bucket's second, so two
    transactions the protocol ordered strictly apart by nanoseconds can read the same
    `block.timestamp`.

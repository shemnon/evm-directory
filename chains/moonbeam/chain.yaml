header_fields:
  note: >-
    The deeper fact first: there IS no Ethereum header at consensus level. The
    block that consensus signs is a Substrate header; `pallet_ethereum::store_block`
    BUILDS an Ethereum header at the end of every block from a `PartialHeader`
    and stores it in state, and the RPC serves that. Two consequences that break
    tooling: `stateRoot` is `sp_io::storage::root(...)` — the Substrate storage
    root, not an Ethereum MPT state root, so it cannot be used with any Ethereum
    state proof — and the `parentHash` chain is a second, independent hash chain
    over these synthetic blocks, unrelated to the Substrate block hashes that
    actually secure the chain.
  added:
  - {name: author, note: "non-standard field carrying the collator; duplicates `miner`.", src_live: "eth_getBlockByNumber @ 16790908"}
  removed:
  - {name: mixHash, note: "set to H256::default() in PartialHeader and omitted from the RPC response entirely.", src: "frontier/frame/ethereum/src/lib.rs:store_block"}
  - {name: withdrawalsRoot, note: "no EIP-4895 withdrawals.", src_live: "eth_getBlockByNumber @ 16790908 -> key absent"}
  - {name: blobGasUsed, note: "no blobs. Unlike OP Stack, the field is absent rather than repurposed.", src_live: "eth_getBlockByNumber @ 16790908 -> key absent"}
  - {name: excessBlobGas, src_live: "eth_getBlockByNumber @ 16790908 -> key absent"}
  - {name: parentBeaconBlockRoot, src_live: "eth_getBlockByNumber @ 16790908 -> key absent"}
  - {name: requestsHash, note: "no EIP-7685 requests.", src_live: "eth_getBlockByNumber @ 16790908 -> key absent"}
  modified:
  - {name: stateRoot, note: "the Substrate storage root, not an Ethereum state trie root.", src: "frontier/frame/ethereum/src/lib.rs:IntermediateStateRoot"}
  - {name: difficulty, note: "hardcoded U256::zero() in PartialHeader; totalDifficulty likewise 0.", src: "frontier/frame/ethereum/src/lib.rs:store_block"}
  - {name: extraData, note: "always empty (`extra_data: Vec::new()`), despite an ExtraDataLength of 30 being configured.", src: "frontier/frame/ethereum/src/lib.rs:store_block"}
  - {name: nonce, note: "always H64::default().", src: "frontier/frame/ethereum/src/lib.rs:store_block"}

gotchas:
  - >-
    THE EVM CAN BE SWITCHED OFF, AND WAS OFF AT THE OBSERVED BLOCK. The runtime's
    `BaseCallFilter` is `MaintenanceMode`, whose maintenance variant returns false
    for `RuntimeCall::Ethereum(_)` and `RuntimeCall::EVM(_)`, and
    `validate_transaction` rejects filtered calls before they enter the pool. At
    block 16790908 the chain was in that state: no block sampled after 16672926
    contains a transaction or a log (the 40 blocks ending at the pin, plus three
    separate 500-block eth_getLogs windows), the last EVM activity ends at a timestamp
    of 2026-08-01T00:00Z, and dispatches through the precompiles reproduce the
    maintenance filter's list exactly — Balances and ParachainStaking return
    `CallFiltered`, while ConvictionVoting, Preimage, AuthorMapping and the
    TreasuryCouncil reach their pallets and return pallet-specific errors. Under
    the normal filter Balances and ParachainStaking would both be permitted, so
    this is not ambiguity. `eth_call` still answers throughout, because it goes
    through the runtime API rather than through the extrinsic filter — the RPC
    looks completely healthy while nothing can be included.
  - >-
    `eth_getCode` proves nothing about precompile-ness in EITHER direction here.
    Mainnet's own precompiles 0x01-0x09 return 5 bytes of code (0x60006000fd);
    genuine Moonbeam precompiles at 0x0b-0x11, 0x0100, 0x0816, 0x0818 and 0x0819
    return `0x`; and the tombstoned addresses 0x0401, 0x0803, 0x080e, 0x080f
    return code AND revert. The code is written per-address by anyone calling
    `PrecompileRegistry.updateAccountCode`, so the set is historical accident.
    Use 0x0815's `isActivePrecompile` if you need an answer.
  - >-
    A precompile CALL can bond stake, vote in governance, register block-author
    keys and send XCM messages to other chains. STATICCALL is safe — the
    `#[precompile::view]` modifier is checked before anything else — but
    DELEGATECALL is not merely unsafe, it is refused: every Moonbeam-band
    precompile reverts with "Cannot be called with DELEGATECALL or CALLCODE",
    while the Ethereum-band ones accept it. Several also refuse callers by CLASS:
    Batch (0x0808) and GMP (0x0816) revert with "Function not callable by smart
    contracts" for any contract caller.
  - >-
    `eth_getTransactionCount` counts Substrate extrinsics too. pallet-evm is
    configured with `FrameSystemAccountProvider`, so the EVM nonce IS the
    frame_system account nonce; a staking extrinsic signed with the same key
    bumps the number your Ethereum wallet is about to reuse.
  - >-
    A transaction in a block may have a signature that cannot be recovered.
    XCM-originated EVM calls are stored as type-0x02 transactions with
    r = s = 1 and a chain-global nonce; they look like ordinary user
    transactions over JSON-RPC.
  - >-
    Fork detection has nothing to read. No fork names, no activation timestamps,
    no block numbers, no client fork gate — the EVM ruleset is a constant inside
    a WASM blob that governance replaces in state. `spec_version` is the only
    handle, and it is not exposed over the Ethereum RPC namespace.

  "0xC077E00000000000000000000000000000000000":
    name: CurrentCommittee
    status: added
    activation_time: 1785420000
    note: "written every block by a system call; exposes the active validator committee to the EVM"
    src: crates/contracts/src/precompiles/mod.rs:CURRENT_COMMITTEE_ADDRESS
    src_live: "eth_getCode @ 36217459 -> 0xef"
  "0x000000000000000000000000000000000000000a":
    name: KZG point evaluation
    status: inherited
    note: >-
      PRESENT AND FUNCTIONING despite blob transactions being removed — the Osaka
      built-in set is installed wholesale, so the verifier for a transaction type
      the chain cannot accept is still callable. A garbage input reverts with a
      precompile error rather than returning empty, proving it is really there.
    src_live: "eth_call(0x...0a, 192 zero bytes) @ 36217459 -> error 'EVM error: PrecompileError'"
  note: >-
    ALL TIP-20 AND SYSTEM PRECOMPILES CARRY ONE BYTE OF CODE, 0xEF. At each
    activation fork boundary `deploy_precompile_at_boundary` writes
    `Bytecode::new_legacy([0xef])` into the account if its code hash is empty.
    So on Tempo `EXTCODESIZE(precompile) == 1` and `EXTCODEHASH(precompile) ==
    keccak(0xef)`, where on mainnet both are the empty-account values — the exact
    inverse of the usual "0x means native" heuristic, and the reason a
    `eth_getCode` probe alone cannot classify an address here. 0xEF is the
    EOF-reserved prefix, so the marker is not a deployable contract and cannot be
    reached as bytecode. Mainnet's own precompiles (0x01..0x11, 0x0100) keep NO

system_transactions:
  - name: SystemAccounting gas-value write
    note: "each block, a call from 0xffff…fffe stores that block's gas values into the SystemAccounting precompile. No transaction appears in the body."
    src: crates/precompiles/src/system_accounting.rs:ARC_SYSTEM_CALLER
  - name: ProtocolConfig fee-params read
    note: "the executor calls ProtocolConfig from the system address during pre-execution to obtain the expected gas limit and fee params for the header it is about to validate."
    src: crates/execution-config/src/protocol_config.rs:retrieve_fee_params
  - name: beneficiary blocklist check
    note: >-
      pre-execution, the executor SLOADs the block beneficiary's blocklist slot out
      of the NativeCoinControl precompile and REJECTS THE WHOLE BLOCK if it is set.
      A validator that gets blocklisted stops being able to produce valid blocks.
      Zero5+.
    src: crates/evm/src/executor.rs:validate_beneficiary_not_blocklisted

opcodes:
  added: []
  removed: []
  modified:
  - number: "0xFF"
    name: SELFDESTRUCT
    note: >-
      Replaced in the instruction table by an Arc implementation with three
      layered behaviours: blocklist checks on both the executing address and the
      beneficiary (failing with "Blocked address"), a transfer log on any non-zero
      balance move (a Circle-specific `NativeCoinTransferred` before Zero5, an
      EIP-7708 `Transfer` from Zero5), and rejection of a self-targeted
      selfdestruct that would increase the account's own balance. Three variants
      across Zero5/Zero6/Zero7.
    src: crates/evm/src/opcode.rs:arc_network_selfdestruct_impl
  - number: "0xF1"
    name: CALL
    note: >-
      Value transfers work normally — Arc HAS a native coin, unlike tempo. What
      changes is that a value-bearing transaction is rejected pre-execution if
      either party is blocklisted, and that a plain CALL does NOT emit the EIP-7708
      log the precompile paths emit. See gotchas.
    src: crates/evm/src/handler.rs:check_blocklist

fee_model:
  metering: gas, denominated in 18-decimal units of the native USDC coin
  fee_market: EIP-1559 formula over an EMA-smoothed gas figure, fixed-point params, contract-governed bounds
  gas_token: "USDC — the native coin itself, mint/burn controlled by the NativeFiatToken contract"
  burn: unrecorded
  note: >-
    THE UNIT ANSWER, AND IT IS THE OPPOSITE OF TEMPO'S. Arc did not remove the
    native asset; it made the native asset a stablecoin and left the EVM alone.
    `msg.value`, BALANCE, SELFBALANCE and CALL-with-value all behave exactly as on
    mainnet, and `baseFeePerGas` is 18-decimal units of that coin — 20 gwei
    observed, so ~0.00042 USDC for a 21,000-gas transfer.

    THE COST IS A DUPLICATED UNIT. The ERC-20 view at 0x3600…0000 reports SIX
    decimals. The relationship is a FLOOR, not a conversion:
    `USDC.balanceOf(a) == eth_getBalance(a) / 10^12`, integer division. Measured on
    three unrelated accounts at the pinned block, exactly. Because minting happens
    in whole microdollars but gas refunds and priority fees are arbitrary wei, live
    balances carry sub-microdollar DUST that the ERC-20 view cannot see and cannot
    move: 808717034443278127 wei displays as 808717 (0.808717 USDC), and the
    trailing 034443278127 wei is spendable as gas but invisible to every ERC-20
    tool. `totalSupply` happens to divide exactly (all mints are whole
    microdollars); individual balances do not.

    THE BASE FEE IS CARRIED IN `extraData`. From Zero5 the header's extraData must
    be exactly 8 bytes, holding the base fee the CHILD block must use, and
    validation requires the child's `baseFeePerGas` to equal it exactly. A field
    mainnet leaves free-form for client vanity strings is consensus-critical here.

    THE FEE PARAMETERS ARE GOVERNED BY A CONTRACT. `retrieve_fee_params` calls
    ProtocolConfig at 0x3600…0001 from the system address; the block gas limit
    comes from the same contract's storage. So the gas limit and the fee-market
    bounds are upgradeable behind an ERC-1967 proxy without a client release.
  extra_components:
  - {name: EMA gas smoothing, src: "crates/execution-config/src/gas_fee.rs:determine_ema_parent_gas_used"}
  - {name: base fee in extraData, src: "crates/execution-config/src/gas_fee.rs:encode_base_fee_to_bytes"}
  - {name: contract-governed fee params and gas limit, src: "crates/execution-config/src/protocol_config.rs:determine_bounded_base_fee"}
  - {name: 20,000 gwei base-fee ceiling, src: "crates/execution-config/src/chainspec.rs:BASE_FEE_CONFIG_MAINNET"}
  src: crates/execution-config/src/gas_fee.rs:arc_calc_next_block_base_fee
  src_live: "eth_getBalance vs USDC.balanceOf @ 58728247 for 0xa693cc18…, 0x5d56c534…, 0x1c831f75… -> 5028673577309960459376547/5028673577309, 808717034443278127/808717, 3048802109906077411/3048802 — floor(x/10^12) in all three, exact in none; eth_gasPrice -> 0x4e3b29200; header baseFeePerGas 0x4a817c800"

header_fields:
  added: []
  removed: []
  modified:
  - name: extraData
    note: >-
      EXACTLY 8 BYTES, AND IT IS CONSENSUS DATA. Holds the base fee the next block
      must use; `arc_validate_extra_data_format` rejects any other length from
      Zero5, and the child's `baseFeePerGas` must equal the decoded value. Observed:
      extraData 0x00000004a817c800 = 20,000,000,000, matching the block's own
      baseFeePerGas.
    src: crates/execution-validation/src/consensus.rs:arc_validate_extra_data_format
    src_live: "eth_getBlockByNumber(0x3801f37) @ 58728247 -> extraData 0x00000004a817c800, baseFeePerGas 0x4a817c800"
  - name: parentBeaconBlockRoot
    note: "set to the parent block hash, not to zero and not to a beacon root. See eips.4788."
    src_live: "eth_getBlockByNumber(0x3801f37) @ 58728247 -> equals parentHash"
  - name: gasLimit
    note: "not chosen by the proposer within the usual 1/1024 band — read from ProtocolConfig storage and validated against it, bounded to [10,000,000, 200,000,000] for mainnet and testnet."
    src: crates/execution-config/src/chainspec.rs:BlockGasLimitProvider
    src_live: "eth_getBlockByNumber(0x3801f37) @ 58728247 -> gasLimit 0x1c9c380 == ProtocolConfig slot value"
  - name: baseFeePerGas
    note: "18-decimal units of native USDC; must equal the parent's extraData."
    src_live: "eth_getBlockByNumber(0x3801f37) @ 58728247 -> 0x4a817c800 (20 gwei)"
  note: >-
    Receipts are stock — no added fields, unlike tempo's feeToken/feePayer.
  receipts_src_live: "eth_getTransactionReceipt(0x134f1abe…) @ 58728247 -> keys are exactly the mainnet set (type, status, cumulativeGasUsed, logs, logsBloom, transactionHash, transactionIndex, blockHash, blockNumber, gasUsed, effectiveGasPrice, from, to, contractAddress)"

gotchas: >-
  ONE TRANSFER, TWO `Transfer` EVENTS, TWO DIFFERENT AMOUNTS. A single
  `transfer(to, 78775)` on the native USDC contract produced two logs in the same
  receipt: one from 0xffff…fffe (the EIP-7708 system address) for
  78,775,000,000,000,000, and one from 0x3600…0000 (the ERC-20) for 78,775. The
  same movement, logged twice, in units 10^12 apart. An indexer that subscribes to
  the `Transfer` topic without filtering by address will double-count every native
  transfer AND mis-scale one of the two copies. This is measured, not inferred.

  THE ERC-20 BALANCE IS A FLOOR OF THE REAL ONE. `USDC.balanceOf(a)` is
  `eth_getBalance(a) / 10^12`, integer division, so up to 10^12 - 1 wei of a user's
  balance is invisible through the token interface. `transfer`ing the full ERC-20
  balance does not empty the account. Reconciliation that treats the ERC-20 view as
  authoritative will find unexplained dust forever.

  EIP-7708 COVERAGE IS PARTIAL. SELFDESTRUCT and the NativeCoinAuthority
  mint/burn/transfer paths emit the log; an ordinary CALL carrying value does not.
  So "index native movement from logs" works for some native movement.

  A BLOCKLISTED ADDRESS FAILS BEFORE EXECUTION, AND A BLOCKLISTED VALIDATOR
  CANNOT BUILD BLOCKS. `check_blocklist` runs pre-execution on the caller always
  and on the recipient when value is non-zero; the block executor separately
  rejects any block whose beneficiary is blocklisted. Blocklist SLOADs are
  UNMETERED — they cost the transaction no gas, which is a deliberate choice worth
  knowing when modelling worst-case block validation cost.

  THERE IS A SECOND BLOCKLIST THAT IS NOT CONSENSUS. The `--arc.denylist.*` flags
  point the mempool and a revm pre-flight at an arbitrary contract's ERC-7201
  storage. Nodes configured differently will accept different transactions.

  `msg.sender` IS NOT PROOF OF A SIGNATURE (Zero7). The CallFrom precompile lets
  the Memo and Multicall3From contracts execute a call with any `sender` they
  choose. The allow-list is two hardcoded addresses in the client, not an on-chain
  registry, so it cannot be inspected or changed from the chain.

  `eth_getCode` AT AN ARC PRECOMPILE RETURNS `0x01`. One byte of marker code, the
  same inversion as tempo's `0xef` with a different byte. The inherited Ethereum
  precompiles return `0x`.

  TESTNET IS A SUPERSET OF THE MAINNET SCHEDULE. Zero7 (CallFrom, Multicall3From,
  Memo) is live on testnet and absent from `ARC_MAINNET_HARDFORKS` at this tag.
  Testing against testnet exercises code mainnet will not have at genesis.

  `parentBeaconBlockRoot` IS THE PARENT HASH. Not zero, not a beacon root. Any
  consumer that treats a non-zero value as evidence of a beacon chain is wrong.

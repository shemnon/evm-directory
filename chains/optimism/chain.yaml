schema_version: 2

chain:
  name: OP Mainnet
  slug: optimism
  chain_id: 10
  role: fork
  live: true

lineage:
  upstream: op-stack
  ancestry: [ethereum, op-stack]
  note: >-
    The canonical OP Stack chain. Its EVM IS the op-stack row; this file exists to
    record activation timestamps and to demonstrate the inheritance model with a
    descendant that adds nothing.

client:
  name: op-geth
  repo: https://github.com/ethereum-optimism/op-geth
  version: v1.101702.2
  commit: e8800cffe53d459cde8a07c8e8f1de9d86e79e07
  language: go
  shared_with: op-stack
  note: >-
    Same client as the op-stack row; no OP-Mainnet-specific fork. Evidence lives in
    chains/op-stack/repos, so this row has no clone of its own.

consensus:
  engine: OP Stack (sequencer) + fault proofs
  block_time: 2s

baseline_fork: osaka

forks:
  src: "superchain-registry/superchain/configs/mainnet/op.toml"
  note: >-
    Read from the superchain registry rather than the client, because OP Stack fork
    times are per-chain configuration, not client constants.
  timeline:
  - {name: canyon,   activation_time: 1704992401, mainnet_equivalent: shanghai}
  - {name: delta,    activation_time: 1708560000, mainnet_equivalent: null}
  - {name: ecotone,  activation_time: 1710374401, mainnet_equivalent: cancun}
  - {name: fjord,    activation_time: 1720627201, mainnet_equivalent: null}
  - {name: granite,  activation_time: 1726070401, mainnet_equivalent: null}
  - {name: holocene, activation_time: 1736445601, mainnet_equivalent: null}
  - {name: isthmus,  activation_time: 1746806401, mainnet_equivalent: prague}
  - {name: jovian,   activation_time: 1764691201, mainnet_equivalent: null}
  - {name: karst,    activation_time: 1783526401, mainnet_equivalent: null}

eips:
  note: no deltas beyond op-stack's

non_eip_specs: []
tx_types:
  envelope:
    status: inherited
    present: "0x00-0x02, 0x04"
    src: derived from the eips map (2930 / 1559 / 4844 / 7702); see those entries
    note: >-
      The EIP-2718 envelope this chain accepts in mainnet shape; no blob transactions
      (EIP-4844). Derived from the eips map (2930/1559/4844/7702); per-type divergences and
      their evidence are on the rows below.
  note: inherits 0x00-0x04 and OP Stack's 0x7e; adds nothing
tx_authorization:
  note: >-
    NO DELTA — nothing to state. This row shares op-stack's client and op-stack's
    clone (client.shared_with), so it shares its signer chain byte for byte:
    secp256k1 only, key_binding derived, one signer, and the unsigned 0x7e deposit
    path. OP Mainnet neither adds a scheme nor removes one. The emptiness here is the
    same demonstration this row exists to make elsewhere in the file, applied to the
    axis where a chain is most likely to have quietly diverged.
precompiles:
  base_map:
    status: inherited
    present: "0x01-0x11"
    p256verify: true
    src: core/vm/contracts.go:PrecompiledContractsJovian
    note: >-
      Identical to OP Stack, including all six same-address divergences (0x05, 0x08,
      0x0c, 0x0e, 0x0f, 0x0100). Zero additions. Shares op-stack's op-geth clone.
  note: >-
    Identical to op-stack, including all six modified precompiles. Zero additions.
    Contrast Base, which shares this upstream and diverges substantially.
system_contracts:
  note: the OP Stack 0x42.. predeploy set, unmodified
opcodes:
  prevrandao:
    source: l1-randao
    value: >-
      the L1 origin block's beacon RANDAO mix, repeated for every L2 block in that
      epoch
    chooser: >-
      Ethereum's beacon proposer, one L1 block earlier; the sequencer only copies it
      into the payload attributes
    known_at: l1-epoch
    note: >-
      THE L1's RANDAO, READ ACROSS THE BRIDGE, AND ALREADY PUBLIC WHEN THE L2 BLOCK IS
      BUILT. op-node's `attributes.go` sets `PrevRandao: eth.Bytes32(l1Info.MixDigest())`
      — the mixHash of the L1 ORIGIN block for the epoch, not of any L2 block. op-geth
      then takes the stock path: `Difficulty.Sign() == 0` holds on every OP block, so
      `random = &header.MixDigest` and `opRandom` pushes it. Two consequences a mainnet
      contract does not expect. First, THE VALUE REPEATS: every L2 block in an L1 epoch
      shares one L1 origin, so at a 2s L2 block time against 12s L1 slots the same word
      is returned by five or six consecutive blocks. Second, it is OLD: the L1 block it
      comes from was finalized and public before the L2 block existed, so anyone can
      read the next several L2 blocks' PREVRANDAO off Ethereum in advance. The entropy
      is genuine beacon-chain entropy; the freshness is not.
    src: optimism/op-node/rollup/derive/attributes.go:214, op-geth/core/evm.go:NewEVMBlockContext
    src_live: "eth_call 0x445f5260205ff3 @ 0x95d6a60 -> 0xdcbb0e8f…, equal to that block's mixHash; blocks 157117049-157117054 all report the same mixHash 0xec50a319931176b1c0931cc38208496555055751ff8263dc728f077e6bb1529a"
  added: []
  removed: []
  modified: []
proofs:
  proving_live:
    verdict: live
    note: >-
      OP Mainnet has a DisputeGameFactoryProxy deployed at
      0xe5965Ab5962eDc7477C8520243A95517CD252fA9 in the superchain registry's own
      mainnet config — the template's machinery, instantiated for this chain.
    src: "superchain-registry/superchain/configs/mainnet/op.toml:DisputeGameFactoryProxy"

fee_model:
  metering: gas
  note: OP Stack's three components
header_fields: {added: [], removed: [], modified: []}

gotchas:
  - >-
    OP Mainnet adds NOTHING to OP Stack. That is the point of recording it: a truly
    empty delta file, which makes Base's non-empty one meaningful by contrast. Two
    chains, same upstream, same client version — one inherits cleanly, the other
    reimplements the EVM in Rust and adds a dynamic precompile space.
  - >-
    Isthmus (Prague-equivalent) activated 2025-05-09, two days after mainnet's
    Prague. Karst activated 2026-07-08.

system_contracts:
  note: >-
    Almost none of Ethereum's — none of the Cancun/Prague system contracts exist
    (see eips 4788/2935/7002/7251, all probed empty). Moonbeam has one family of
    its own, and it is genuinely bytecode, not a precompile.
  dynamic_range:
    name: Foreign-asset ERC-20 contracts
    status: added
    pattern: "byte[0..4] == 0xffffffff AND bytes[4..20] == the u128 asset id, big-endian"
    note: >-
      XCM-registered foreign assets are REAL ERC-20 contracts, deployed by the
      runtime itself with `EvmRunner::create_force_address` — a CREATE at a
      chosen address, bypassing both CREATE and CREATE2 derivation. Address =
      0xffffffff ++ asset_id. These have full bytecode and are ordinary
      `CALL` targets, so they belong here and not in `precompiles`. Contrast the
      neighbouring convention at 0x0802, where the NATIVE token's ERC-20 face is
      a precompile with no code: on the same chain, two token interfaces, one
      with 24KB of bytecode and one with 5 bytes of dummy code.
    src: "pallets/moonbeam-foreign-assets/src/lib.rs:contract_address_from_asset_id, pallets/moonbeam-foreign-assets/src/evm.rs:erc20_create"

system_transactions:
  - name: "XCM deposit mints an ERC-20 by executing EVM code"
    severity: high
    note: >-
      When XCM delivers a foreign asset, the runtime calls
      `mintInto(address,uint256)` on the asset's ERC-20 contract through
      `EvmRunner::call`, from the pallet's own account. This is real EVM
      execution — it runs the contract's bytecode and emits its `Transfer` log —
      but it happens outside any transaction. `pallet_ethereum::store_block` only
      builds receipts from the `Pending` map, which holds the transactions that
      executed via `Ethereum::transact`; a call that never went through that path
      has no receipt, so the logs it emits cannot appear in `eth_getLogs` or in
      any receipt. A token balance therefore changes, with a Transfer event
      genuinely emitted by the contract, and an indexer following logs sees
      nothing at all. The same mechanism runs `erc20_transfer`, `erc20_approve`
      and `erc20_create`.
    src: "pallets/moonbeam-foreign-assets/src/evm.rs:erc20_mint_into, frontier/frame/ethereum/src/lib.rs:store_block"
  - name: "Staking rewards and slashing move EVM-visible balances"
    note: >-
      Collator and delegator rewards are minted by pallet-parachain-staking
      during block initialisation (`mint_collator_reward`, and the orbiter
      variant), changing balances that `eth_getBalance` reads, with no
      transaction, receipt or log.
    src: "runtime/moonbeam/src/lib.rs:PayoutCollatorOrOrbiterReward"
  - name: "Any Substrate extrinsic that touches pallet-balances"
    note: >-
      Because `AddressMapping` is the identity and `Currency` is pallet-balances,
      EVERY Substrate-side balance movement — transfers, deposits, treasury
      spends, XCM fee payment — is an EVM balance change. The EVM does not have a
      separate ledger to fall out of sync with; it has no ledger of its own at all.
    src: "runtime/moonbeam/src/lib.rs:IdentityAddressMapping"
  - name: "Root-originated EVM execution as an arbitrary sender"
    note: >-
      `EthereumXcm::force_transact_as` lets the ForceOrigin (Root, i.e.
      governance) execute an EVM transaction as ANY address, and optionally force
      the address a CREATE deploys to. Governance-gated, but it means `msg.sender`
      is not, in the limit, evidence of a signature.
    src: "pallets/ethereum-xcm/src/lib.rs:force_transact_as"


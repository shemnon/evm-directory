system_contracts:
  "0x1074000000000000000000000000000000000000":
    name: ISC magic contract (ISCSandbox / ISCAccounts / ISCUtil / ISCPrivileged)
    status: added
    note: >-
      THE CLASSIFICATION IS THE FINDING, and it is neither of this schema's two
      categories cleanly. The address holds seven bytes of real state code —
      `0x600180808053f3` — placed in the EVM genesis alloc with the source comment
      "Dummy code, because some contracts check the code size before calling the
      contract. The EVM code itself will never get executed." `EXTCODESIZE` returns 7
      and `eth_getCode` returns those bytes, which is why it is filed here rather than
      under `precompiles`. But the bytes are a decoy: wasp's go-ethereum fork adds a
      `vm.Config.MagicContracts` map that is consulted in CALL, CALLCODE, DELEGATECALL
      and STATICCALL BEFORE the precompile table and before any code lookup, so the
      dispatch is native Go, exactly like a precompile. Two further consequences: the
      handler returns `remainingGas` unchanged, so calling it costs ZERO EVM gas while
      burning real ISC gas (see `fee_model`); and because it is reachable by
      DELEGATECALL, ISC sandbox calls can be made in a caller's own storage context.
    src: "packages/vm/core/evm/evmimpl/impl.go:SetInitialState, packages/vm/core/evm/evmimpl/iscmagic.go:newMagicContract, core/vm/evm.go:MagicContracts"
    src_doc: https://docs.iota.org/developer/iota-evm/references/magic-contract/introduction
    src_live: "eth_getCode 0x1074000000000000000000000000000000000000 @ 12793600 -> 0x600180808053f3 (7 bytes); eth_call EXTCODESIZE @ 12793600 -> 7; eth_call getChainID() @ 12793600 -> 0x0dc44856...409d; getBaseTokenInfo() -> decimals 9, 'IOTA'"
  dynamic_range:
    name: ERC20Coin wrappers for IOTA L1 coin types
    status: added
    pattern: "bytes[0..1] == 0x1074 AND byte[2] == 0x02 AND bytes[3..19] == keccak256(coinType)[0..16]"
    note: >-
      Registering an IOTA L1 coin type deploys a real ERC20 contract at an address
      DERIVED FROM THE COIN TYPE STRING, not from a deployer nonce or a CREATE2 salt:
      `0x1074` prefix, a one-byte kind tag, then the first 17 bytes of
      keccak256(coinType). These carry genuine `ERC20Coin` runtime bytecode (unlike the
      magic contract) and are ordinary EVM contracts once installed. The same prefix
      also reserves tags 0x01, 0x03 and 0x04 for deprecated base-token and NFT wrappers.
      No address-keyed table can enumerate the set.

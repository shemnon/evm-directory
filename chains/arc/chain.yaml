    src: crates/execution-config/src/protocol_config.rs:retrieve_fee_params
  - name: beneficiary blocklist check
    note: >-
      pre-execution, the executor SLOADs the block beneficiary's blocklist slot out
      of the NativeCoinControl precompile and REJECTS THE WHOLE BLOCK if it is set.
      A validator that gets blocklisted stops being able to produce valid blocks.
      Zero5+.
    src: crates/evm/src/executor.rs:validate_beneficiary_not_blocklisted

opcodes:
  prevrandao:
    source: constant
    value: the zero word
    chooser: nobody
    known_at: always
    note: >-
      ZERO AT EVERY POINT THE MALACHITE APP BUILDS A PAYLOAD. `prev_randao: B256::ZERO`
      appears in `finalize.rs`, `payload.rs`, `handlers/decided.rs` and
      `handlers/consensus_ready.rs` — the block-production, finalisation and
      consensus-ready paths all agree on it, so this is the value, not one branch's
      default. Arc's consensus is Malachite BFT, which has a proposer and signatures and
      could supply something; the EVM is handed zero.
    src: >-
      arc-node/crates/malachite-app/src/finalize.rs:168,
      arc-node/crates/malachite-app/src/payload.rs:377,
      arc-node/crates/malachite-app/src/handlers/decided.rs:391
    src_live: "eth_call 0x445f5260205ff3 @ 29537893 -> 0x00..00, header mixHash 0x00..00"
  added: []
  removed: []
  modified:
  - op: "0xff"
    name: SELFDESTRUCT
    note: >-
      Replaced in the instruction table by an Arc implementation with three
      layered behaviours: blocklist checks on both the executing address and the
      beneficiary (failing with "Blocked address"), a transfer log on any non-zero
      balance move (a Circle-specific `NativeCoinTransferred` before Zero5, an
      EIP-7708 `Transfer` from Zero5), and rejection of a self-targeted
      selfdestruct that would increase the account's own balance. THE VARIANT SET
      CHANGED AT v0.8.1: the `zero4` and `zero5` handlers are gone, folded into the
      unconditional base implementation now that Zero5 and Zero6 are active on every
      network, and a `zero8` handler was added with transaction-warm target checks.
      Dispatch is Zero8, else Zero7, else base — still three implementations, but not
      the same three.
    src: crates/evm/src/opcode.rs:arc_network_selfdestruct_impl
  - op: "0xf1"
    name: CALL
    note: >-
      Value transfers work normally — Arc HAS a native coin, unlike tempo. What
      changes is that a value-bearing transaction is rejected pre-execution if
      either party is blocklisted, and that any non-self value transfer emits an EIP-7708
      log. See gotchas.
    src: crates/evm/src/handler.rs:check_blocklist


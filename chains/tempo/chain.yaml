schema_version: 2

chain:
  name: Tempo
  slug: tempo
  chain_id: 4217
  role: fork
  live: true
  evidence: source
  chain_id_src: crates/hardfork/src/constants.rs:MAINNET_CHAIN_ID
  note: >-
    THE FIRST ROW IN THIS DATASET FOR A CHAIN WITH NO NATIVE TOKEN AT ALL. Not
    "gas is paid in an ERC-20 while a native asset still exists" (Celo, Mantle,
    Gnosis) — Tempo has no native asset. Every account's native balance is
    permanently zero, `value` must be zero on every transaction and every inner
    call, and gas is paid in a TIP-20 stablecoin precompile whose token has SIX
    decimals while the header `baseFeePerGas` is denominated in an eighteen-
    decimal unit that is not any token. The consequences are recorded in
    `fee_model`, `gotchas` and `opcodes` below and are the point of this row.
    Mainnet chain name is "Presto"; the public testnet is "Moderato" (42431).

lineage:
  upstream: ethereum
  ancestry: [ethereum]
  fork_of: reth
  note: >-
    NOT A SOURCE FORK — an SDK consumer. `Cargo.toml` pins every `reth-*` crate
    to `https://github.com/paradigmxyz/reth` rev
    `10aa6a512ba7c4f5f01ff489b1f513da0745821f` as a git dependency and builds a
    node on top of it; `crates/revm` wraps revm's handler rather than editing
    it. Descent is therefore by dependency, not by diff, which is why the deltas
    below are stated as *overrides* (a replaced `Handler`, a replaced
    instruction table entry, a replaced precompile lookup) rather than as
    patches. Stripe/Paradigm; the repo is Apache-2.0/MIT.
  sync_point: >-
    The pinned reth rev supplies the Ethereum baseline, and Tempo's own
    `From<TempoHardfork> for SpecId` maps EVERY Tempo hardfork — Genesis through
    T11 — to `SpecId::OSAKA`. There is no Tempo fork that is "at Prague"; the
    Ethereum revision is a constant and only Tempo's own T-forks move.

client:
  name: tempo (reth-based execution + Simplex consensus)
  repo: https://github.com/tempoxyz/tempo
  version: v1.13.1
  commit: 11b2eec62345a9a045d977255a5d93f66114e9e3
  language: rust
  built_on: reth (git rev 10aa6a512ba7c4f5f01ff489b1f513da0745821f) / revm
  note: >-
    The public mainnet RPC reports `tempo/v1.13.1-6d9d0d5/x86_64-unknown-linux-gnu`,
    i.e. the pinned tag is the tag the network is actually running — the usual
    gap between "the tag we read" and "what validators run" is closed here.
    `crates/precompiles`, `crates/revm`, `crates/evm` and `crates/primitives`
    hold essentially all of the divergence; `crates/consensus` holds Simplex.

live_probe:
  endpoint: https://rpc.tempo.xyz
  chain_id: 4217
  observed_at_block: 36217459      # 0x228a273, `finalized` at probe time
  observed_at: 2026-08-25
  chain_id_src_live: "eth_chainId @ 36217459 -> 0x1079 (4217); net_version -> 4217; web3_clientVersion -> tempo/v1.13.1-6d9d0d5/x86_64-unknown-linux-gnu"
  block_scan_range: 36217459-36217516
  caveat: >-
    The public endpoint rate-limits: a 100-block scan was truncated at 58 blocks.
    The tx-type census below therefore covers 36217459-36217516 only.

consensus:
  engine: Simplex BFT (Commonware), Ed25519 validator keys
  finality: single-slot deterministic (BFT), sub-second
  block_time: ~200ms
  note: >-
    Header carries a `consensusContext` object (epoch, view, parentView,
    Ed25519 proposer key) and a millisecond timestamp component, both absent on
    mainnet. There is no beacon chain: `parentBeaconBlockRoot` is present in the
    header but is always zero and no code lives at the EIP-4788 address.
    Withdrawals are rejected outright by the block executor.
  src: crates/primitives/src/header.rs:TempoConsensusContext
  src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> consensusContext {epoch: 1676, view: 15860, parentView: 15859, proposer: 0x89dbf7ef...}; timestampMillis 0x1a031fcc99d; parentBeaconBlockRoot 0x00..00"

baseline_fork: osaka
baseline_note: >-
  Derived from source, not from a blog post: `impl From<TempoHardfork> for
  SpecId` returns `SpecId::OSAKA` unconditionally, and `tempo_precompiles()`
  builds on `EthPrecompiles::new(spec)` with the Osaka set once T1C is active
  (Prague before it). T1C activated 2026-03-12, so mainnet has been at the Osaka
  precompile set since then. Every delta below is stated against Osaka.
  src: crates/hardfork/src/lib.rs:SpecId, crates/precompiles/src/lib.rs:tempo_precompiles

forks:
  src: crates/hardfork/src/lib.rs:TempoHardfork
  activation_src: crates/hardfork/src/constants.rs:MAINNET_T10_TIMESTAMP
  note: >-
    Tempo's fork axis is entirely its own — T0..T11, activation timestamps
    hardcoded per chain id in `crates/hardfork/src/constants.rs` (mainnet 4217,
    moderato 42431) rather than read from a genesis file at runtime. There is no
    Ethereum-fork axis to schedule: the EVM revision is pinned to Osaka for all
    of them. Roughly one fork every two to three weeks — twelve mainnet forks in
    the six months since genesis.
  timeline:
  - {name: T0, activation_time: 0, mainnet_equivalent: osaka,
     note: "genesis; base fee 10^10 attodollars, fixed",
     src: "crates/hardfork/src/constants.rs:MAINNET_T0_TIMESTAMP"}
  - {name: T1, activation_time: 1770908400, mainnet_equivalent: osaka,
     note: "TIP-1000 state-creation gas (SSTORE 0->x becomes 250,000 gas); TIP-1010 30M general gas limit; base fee 2x10^10 attodollars",
     src: "crates/hardfork/src/constants.rs:MAINNET_T1_TIMESTAMP"}
  - {name: T1A, activation_time: 1770908400, mainnet_equivalent: osaka,
     note: "per-tx gas cap raised from EIP-7825's 16,777,216 to 30,000,000",
     src: "crates/hardfork/src/lib.rs:tx_gas_limit_cap"}
  - {name: T1B, activation_time: 1771858800, mainnet_equivalent: osaka,
     src: "crates/hardfork/src/constants.rs:MAINNET_T1B_TIMESTAMP"}
  - {name: T1C, activation_time: 1773327600, mainnet_equivalent: osaka,
     note: "SWITCHES THE BUILT-IN PRECOMPILE SET FROM PRAGUE TO OSAKA and REMOVES opcode 0x4F — see opcodes.removed",
     src: "crates/precompiles/src/lib.rs:is_t1c"}
  - {name: T2, activation_time: 1774965600, mainnet_equivalent: osaka,
     note: "ValidatorConfigV2 precompile; self-sponsored fee payer rejected",
     src: "crates/hardfork/src/constants.rs:MAINNET_T2_TIMESTAMP"}
  - {name: T3, activation_time: 1777298400, mainnet_equivalent: osaka,
     note: "AddressRegistry + SignatureVerifier precompiles; access-key (keychain) transactions",
     src: "crates/contracts/src/precompiles/mod.rs:ADDRESS_REGISTRY_ADDRESS"}
  - {name: T4, activation_time: 1779112800, mainnet_equivalent: osaka,
     note: "TIP-1046 bug-fix bundle; shared (subblock) gas limit drops to 0. NOT the TIP-1016 gas split — that is coded but gated off, see non_eip_specs.",
     src: "crates/hardfork/src/lib.rs:shared_gas_limit"}
  - {name: T5, activation_time: 1781013600, mainnet_equivalent: osaka,
     note: "TIP20ChannelReserve precompile (payment channels); TIP-1045 payment-lane classification becomes a CONSENSUS rule (is_payment_v2)",
     src: "crates/evm/src/block.rs:is_payment"}
  - {name: T6, activation_time: 1782223200, mainnet_equivalent: osaka,
     note: "ReceivePolicyGuard precompile",
     src: "crates/contracts/src/precompiles/mod.rs:RECEIVE_POLICY_GUARD_ADDRESS"}
  - {name: T7, activation_time: 1783605600, mainnet_equivalent: osaka,
     note: "TIP-1060 storage credits: SSTORE gets a Tempo instruction and clearing refunds go to zero",
     src: "crates/revm/src/instructions.rs:is_t7"}
  - {name: T8, activation_time: 1785420000, mainnet_equivalent: osaka,
     note: "CurrentCommittee precompile, written by a per-block system call",
     src: "crates/evm/src/block.rs:apply_current_committee_system_call"}
  - {name: T9, activation_time: 1786024800, mainnet_equivalent: osaka,
     src: "crates/hardfork/src/constants.rs:MAINNET_T9_TIMESTAMP"}
  - {name: T10, activation_time: 1787320800, mainnet_equivalent: osaka,
     note: "CURRENT MAINNET FORK at the probe block. TIP-1091 zones: ZoneFactory/ZonePortal/ZoneVerifier/ZoneMessenger installed at a fork boundary.",
     src: "crates/evm/src/block.rs:deploy_zone_factory_at_boundary"}
  - {name: T11, status: pending, mainnet_equivalent: osaka,
     note: "declared in the enum with NO mainnet activation timestamp (`Self::T11 => None`). Raises the expiring-nonce replay set to 3,000,000 entries and the max expiry window to 300s.",
     src: "crates/hardfork/src/lib.rs:expiring_nonce_set_capacity"}

eips:
  1559:
    status: modified
    note: >-
      Same update formula, different everything else. TIP-1067 (T7+) runs
      EIP-1559's integer formula against a FIXED 10,000,000 gas target with
      `BaseFeeParams::new(8, 1)` — elasticity 1, not 2, so the usual
      target-halving is suppressed — and then CLAMPS the result into
      [600,000,000, 12,000,000,000]. The base fee can never leave that band, and
      the unit is attodollars, not wei. Observed base fee sat exactly on the
      floor.
    src: crates/hardfork/src/constants.rs:tempo_t7_next_block_base_fee
    src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> baseFeePerGas 0x23c34600 = 600,000,000 == TEMPO_T7_BASE_FEE_FLOOR; eth_feeHistory 4 blocks from 0x228a273 -> all five entries 0x23c34600"
  4844:
    status: removed
    note: >-
      No blob transaction type exists. `TempoTxEnvelope` has no 0x03 variant and
      `TryFrom<TxType> for TempoTxType` returns
      `UnsupportedTransactionType::new(TxType::Eip4844)` explicitly. The header
      still carries `blobGasUsed`/`excessBlobGas` (both zero) and
      `eth_feeHistory` still reports a `baseFeePerBlobGas` of 1 — vestigial
      fields on a chain that cannot accept a blob.
    src: crates/primitives/src/transaction/envelope.rs:UnsupportedTransactionType
    src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> blobGasUsed 0x0, excessBlobGas 0x0; eth_feeHistory @ 36217459 -> baseFeePerBlobGas [0x1 x5]"
  4788:
    status: tombstoned
    note: >-
      The header field survives and is always zero, and the beacon-roots address
      holds NO code, so the ring-buffer write is a no-op and any contract reading
      a parent beacon root gets empty output rather than a revert. There is no
      beacon chain to root. Recorded as tombstoned rather than removed because
      the header field is still consensus-encoded.
    src: crates/primitives/src/header.rs:parent_beacon_block_root
    src_live: "eth_getCode(0x000F3df6D732807Ef1319fB7B8bB8522d0Beac02) @ 36217459 -> 0x; header parentBeaconBlockRoot 0x00..00"
  2935:
    status: inherited
    note: "The history-storage contract IS deployed and holds the standard runtime — the one Prague system contract Tempo keeps."
    src_live: "eth_getCode(0x0000F90827F1C53a10cb7A02335B175320002935) @ 36217459 -> 0x3373fffffffffffffffffffffffffffffffffffffffe14604657602036036042575f3560014303... (standard EIP-2935 runtime)"
  4895:
    status: removed
    note: >-
      Withdrawals are not merely empty, they are REJECTED: the block executor
      errors with "withdrawals are not permitted" if the list is non-empty. The
      header still carries the empty-list `withdrawalsRoot`. There is no native
      asset to withdraw.
    src: crates/evm/src/block.rs:apply_pre_execution_changes
    src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> withdrawals [], withdrawalsRoot 0x56e81f171bcc55a6ff8345e692c0f86e5b48e01b996cadc001622fb5e363b421 (empty trie)"
  7002:
    status: removed
    note: "No withdrawal-request predeploy; `requestsHash` is the empty-list hash."
    src_live: "eth_getCode(0x00000961Ef480Eb55e80D19ad83579A64c007002) @ 36217459 -> 0x; header requestsHash 0xe3b0c442...7852b855"
  7251:
    status: removed
    note: "No consolidation-request predeploy."
    src_live: "eth_getCode(0x0000BBdDc7CE488642fb579F8B00f3a590007251) @ 36217459 -> 0x"
  6110:
    status: removed
    note: "No deposit contract; validator set comes from the ValidatorConfig precompiles, not from an L1 deposit log."
    src: crates/contracts/src/precompiles/mod.rs:VALIDATOR_CONFIG_V2_ADDRESS
  7702:
    status: modified
    note: >-
      The stock 0x04 type is accepted unchanged. Tempo ALSO carries a second,
      parallel delegation mechanism inside its own 0x76 type:
      `tempo_authorization_list` (JSON `aaAuthorizationList`), a 7702-shaped
      authorization list whose entries are signed with TEMPO signatures — so a
      P-256 or WebAuthn key can install a delegation, which stock 7702 cannot do.
      The two lists are separate fields with separate validation.
    src: crates/primitives/src/transaction/tempo_transaction.rs:tempo_authorization_list
  7825:
    status: modified
    note: "Per-transaction gas cap raised from Osaka's 16,777,216 to 30,000,000 at T1A."
    src: crates/hardfork/src/lib.rs:MAX_TX_GAS_LIMIT_OSAKA
  2200:
    status: modified
    note: >-
      SSTORE creation pricing is rewritten twice. TIP-1000 (T1+) charges 250,000
      gas for a 0->nonzero SSTORE, 12.5x Osaka's 20,000. TIP-1060 (T7+) splits
      that into a 5,000-gas residual charged by the gas function plus a
      245,000-gas creditable portion settled by a Tempo SSTORE instruction
      against a storage-credit balance. See `opcodes.modified`.
    src: crates/revm/src/gas_params.rs:SSTORE_CREATE_COST
  3529:
    status: modified
    note: >-
      At T7 `sstore_clearing_slot_refund` is set to 0: clearing a slot yields no
      gas refund at all. Its economic replacement is a TIP-1060 storage CREDIT
      minted at the StorageCredits precompile, redeemable only against a future
      slot creation by the same account — not a gas refund, not transferable to
      the fee.
    src: crates/revm/src/gas_params.rs:t7_gas_params
  3860:
    status: inherited
    src: crates/revm/src/handler.rs:tx_initcode_cost
  7951:
    status: inherited
    note: "P256VERIFY is present at 0x0100 as a native precompile (Osaka built-ins from T1C). Separately — and this is the interesting part — P-256 also authorizes transactions directly; see tx_authorization."
    src_live: "eth_call(0x...0100, 160 zero bytes) @ 36217459 -> 0x (empty = invalid signature, EIP-7951 semantics, no revert); eth_getCode(0x...0100) @ 36217459 -> 0x"
  7623:
    status: unrecorded
    note: "Calldata floor cost is computed for AA transactions via `tx_floor_cost_with_tokens`, but whether the T1/T4/T7 gas tables leave the floor rule itself at Osaka values was not established."
  7702_delegation_prefix:
    status: unrecorded
    note: "Whether Tempo restricts what a 0x04 delegation may point at (e.g. banning delegation to a precompile address) was not established."

non_eip_specs:
  adopted:
  - {id: TIP-0001, name: "Tempo Transaction", note: "the 0x76 type. Status field in tips/tip-0001.md reads Mainnet.", src: "crates/primitives/src/transaction/tempo_transaction.rs:TempoTransaction"}
  - {id: TIP-20, name: "enshrined stablecoin token standard", note: "ERC-20-shaped, implemented as a native precompile family rather than bytecode. Fixed 6 decimals.", src: "crates/precompiles/src/tip20/mod.rs:TIP20Token"}
  - {id: TIP-403, name: "transfer policy registry", note: "per-token and per-account transfer policies enforced inside the TIP-20 precompile; policy id 0 rejects all, id 1 allows all", src: "crates/precompiles/src/tip403_registry/mod.rs:TIP403Registry"}
  - {id: TIP-1000, name: "State Creation Cost Increase", src: "crates/revm/src/gas_params.rs:CONTRACT_CREATE_COST"}
  - {id: TIP-1009, name: "Expiring Nonces", note: "nonce_key == 2^256-1 selects hash-based replay protection with a validity window instead of a sequential nonce", src: "crates/primitives/src/transaction/tempo_transaction.rs:TEMPO_EXPIRING_NONCE_KEY"}
  - {id: TIP-1010, name: "Mainnet Gas Parameters", note: "defines the payment lane's gas budget: the general (non-payment) limit", src: "crates/hardfork/src/constants.rs:TEMPO_T1_GENERAL_GAS_LIMIT"}
  - {id: TIP-1022, name: "Virtual Addresses for TIP-20 Deposit Forwarding", note: "addresses whose bytes [4:14] are 0xFD repeated decode to a (masterId, userTag) pair", src: "crates/primitives/src/address.rs:VIRTUAL_MAGIC"}
  - {id: TIP-1031, name: "Embed consensus context in the block Header", src: "crates/primitives/src/header.rs:TempoConsensusContext"}
  - {id: TIP-1045, name: "Payment Transaction Classification", note: "the consensus predicate for the payment lane — see fee_model", src: "crates/primitives/src/transaction/envelope.rs:is_payment_v2"}
  - {id: TIP-1053, name: "Witnesses in Key Authorizations", src: "crates/primitives/src/transaction/key_authorization.rs:SignedKeyAuthorization"}
  approved:
  - {id: TIP-1067, name: "Dynamic Base Fee", note: "LIVE since T7 while its own status field still reads Approved", src: "crates/hardfork/src/constants.rs:TEMPO_T7_BASE_FEE_PARAMS"}
  draft:
  - {id: TIP-1060, name: "Storage Credits", note: "SHIPPED AT T7, 2026-07-09, and its spec still says Draft", src: "crates/revm/src/gas_credits.rs:STORAGE_CREDIT_VALUE"}
  - {id: TIP-1070, name: "Current Committee State", note: "SHIPPED AT T8", src: "crates/evm/src/block.rs:apply_current_committee_system_call"}
  - {id: TIP-1091, name: "Enshrined ZoneFactory", note: "SHIPPED AT T10", src: "crates/evm/src/block.rs:deploy_zone_factory_at_boundary"}
  - {id: TIP-1092, name: "TIP-20 Policy IDs in TIP-403", src: "crates/precompiles/src/tip403_registry/mod.rs:policy_id"}
  - {id: TIP-1093, name: "Extend Expiring Nonce Window to Five Minutes", note: "the T11 change; T11 has no mainnet activation timestamp", src: "crates/hardfork/src/lib.rs:expiring_nonce_max_expiry_secs"}
  - {id: TIP-1016, name: "Exempt Storage Creation from Gas Limits", note: "status Backlog. Implemented as `amsterdam_gas_params` but gated behind `cfg.enable_amsterdam_eip8037`, which no production path sets — coded, not live.", src: "crates/revm/src/gas_params.rs:amsterdam_gas_params"}
  withdrawn:
  - {id: TIP-1059, name: "Discounted Pure Payment Transfers"}
  - {id: TIP-1065, name: "Repurpose TIP-20 Balance slots into User State"}
  note: >-
    The TIP series lives inside the client repo at `tips/` — 47 numbered
    specifications at this tag, in two tiers: low numbers (TIP-0001, TIP-20,
    TIP-403) are transaction and token standards deliberately echoing ERC
    numbering, the 1000-series are protocol changes. Each file carries its own
    `status:` field with the ladder Draft | In Review | Ready for Consideration |
    Approved | Scheduled | Testnet | Mainnet.

    THAT STATUS FIELD LAGS THE CHAIN AND SHOULD NOT BE TRUSTED. TIP-1060
    (Storage Credits) reads Draft and has been live on mainnet since T7 on
    2026-07-09, where it replaced the SSTORE instruction and zeroed the clearing
    refund. TIP-1070 reads Draft and shipped at T8. TIP-1091 reads Draft and
    shipped at T10 three days before the probe. TIP-1067 reads Approved and has
    been setting the base fee since T7. The `adoption:` values above are taken
    from those status fields as written, because that is what the document says;
    the `status:` of the corresponding facts elsewhere in this file is taken from
    the source, because that is what the chain does. Where they disagree the
    source is right. This is the SCHEMA.md warning about `src_doc:` — docs
    describe intent and lag what shipped — showing up inside a chain's own
    specification repository rather than on a website.

tx_types:
  envelope:
    status: inherited
    present: "0x00-0x02, 0x04"
    src: derived from the eips map (2930 / 1559 / 4844 / 7702); see those entries
    note: >-
      The EIP-2718 envelope this chain accepts in mainnet shape; no blob transactions
      (EIP-4844). Derived from the eips map (2930/1559/4844/7702); per-type divergences and
      their evidence are on the rows below.
  "0x00": {name: Legacy, status: modified, note: "accepted, but `value` must be zero and the fee is charged in the default TIP-20 fee token — a legacy transaction on Tempo cannot move any asset by itself", src: "crates/primitives/src/transaction/envelope.rs:TempoTxEnvelope"}
  "0x01": {name: EIP-2930, status: modified, note: "same value/fee-token caveat as 0x00", src: "crates/primitives/src/transaction/envelope.rs:TempoTxEnvelope"}
  "0x02": {name: EIP-1559, status: modified, note: "same value/fee-token caveat. maxFeePerGas is in attodollars. Observed live: 3 of 7 transactions in the scanned range.", src: "crates/primitives/src/transaction/envelope.rs:TempoTxEnvelope", src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> tx 0x265549d2... type 0x2, value 0x0, receipt feeToken 0x20c0...0000"}
  "0x03": {name: EIP-4844 blob, status: removed, note: "no envelope variant; conversion from alloy's TxType::Eip4844 is an explicit error", src: "crates/primitives/src/transaction/envelope.rs:UnsupportedTransactionType"}
  "0x04": {name: EIP-7702 set-code, status: modified, note: "accepted as-is; Tempo's own delegation list is a field of 0x76 instead", src: "crates/primitives/src/transaction/envelope.rs:TempoTxEnvelope"}
  "0x76":
    name: TempoTransaction (TT)
    status: added
    spec: TIP-0001
    note: >-
      One type byte carrying seven distinct mechanisms that are separate EIPs
      elsewhere, and one that has no mainnet counterpart: (1) `calls[]` — an
      atomic batch, at most one CREATE and it must be first; (2) `feeToken` — an
      explicit per-transaction fee-token choice; (3) `feePayerSignature` — a
      SECOND protocol-validated signer over a different digest; (4)
      `nonceKey`/`nonce` — a 2D nonce for parallel lanes, with `nonceKey ==
      2^256-1` selecting hash-based expiring-nonce replay protection instead;
      (5) `validAfter`/`validBefore` — a consensus-enforced validity window;
      (6) `signature` — secp256k1, P-256, WebAuthn or a keychain wrapper around
      any of those; (7) `keyAuthorization` — provision a new access key into the
      AccountKeychain precompile in the same transaction that first uses it; and
      (8) `aaAuthorizationList` — 7702-shaped delegations signed with Tempo
      signature types. 4 of 7 transactions in the scanned range were 0x76, and
      the sampled one was signed with WebAuthn.
    src: crates/primitives/src/transaction/tempo_transaction.rs:TEMPO_TX_TYPE_ID
    src_live: "eth_getBlockByNumber @ 36217459-36217516 -> 7 txs: {0x2: 3, 0x76: 4}; sampled 0x76 has feeToken 0x20c0...b9537d11c60e8b50, calls[2], nonceKey 0x0, signature {type: webAuthn, pubKeyX, pubKeyY, webauthnData}"

tx_authorization:
  key_binding: declared
  signers_per_tx: 2
  note: >-
    THREE FINDINGS ON THIS AXIS, ALL PROTOCOL-LEVEL.

    (1) P-256 AND WEBAUTHN AUTHORIZE TRANSACTIONS. Not through account-abstraction
    code, not through a paymaster — the client itself verifies them. `SignatureType`
    is {Secp256k1, P256, WebAuthn} and `TempoSignature::recover_signer` dispatches
    on a leading type byte (0x01 P-256, 0x02 WebAuthn, 0x03/0x04 keychain). The
    address is `keccak256(pubKeyX || pubKeyY)[12:]` — the same construction
    secp256k1 uses, applied to a P-256 point, so `key_binding` for these is
    `derived` in exactly mainnet's sense. This is the payoff the P256VERIFY rows
    elsewhere in this dataset never deliver: eleven chains can VERIFY P-256 and on
    almost all of them a P-256 key still cannot move anything. Here it can, and a
    live block contains a WebAuthn-signed transaction to prove it. The webauthn
    path validates authenticatorData flags (UP/UV) and the clientDataJSON
    challenge, i.e. a raw browser passkey assertion is the transaction signature.

    (2) THE FEE PAYER IS A SECOND PROTOCOL-VALIDATED SIGNER. `feePayerSignature`
    is an optional secp256k1 signature over `fee_payer_signature_hash`, a
    DIFFERENT digest: prefix byte 0x78, then the transaction body with the
    SENDER'S ADDRESS substituted for the fee-payer field, and with `fee_token`
    included. So a sponsor commits to who they are sponsoring and to which token
    they will be billed in, and the signature cannot be lifted onto another
    transaction or another payer. `validate_env` recovers it before execution and
    rejects a self-sponsored transaction from T2 on. This is Kaia's fee-delegation
    shape reached independently: two parties, two digests, one type byte. The
    receipt exposes the outcome as a `feePayer` field. Unlike Kaia, each party is
    a single key, not a weighted multisig — `signers_per_tx: 2` counts parties.

    (3) `key_binding: declared` COMES FROM THE KEYCHAIN, NOT FROM THE CURVE.
    A `KeychainSignature` carries an explicit `user_address` and signs
    `keccak256(sigHash || user_address)`. The recovered address is the ACCESS KEY,
    which is then looked up in the AccountKeychain precompile to see whether it may
    act for `user_address` and within what spending limit; the transaction's sender
    is `user_address`, not the recovered key. `ecrecover(sig) == from` is therefore
    false for keychain transactions and true for the three direct schemes — the
    field records the weaker of the two, as Kaia and Tron do. TIP-1045 goes one
    step further: `keyAuthorization` lets a transaction PROVISION the access key it
    is itself signed with, root-key-signed, in the same transaction.
  src: crates/primitives/src/transaction/tt_signature.rs:derive_p256_address, crates/primitives/src/transaction/tt_signature.rs:KeychainSignature, crates/primitives/src/transaction/tempo_transaction.rs:fee_payer_signature_hash, crates/revm/src/handler.rs:SelfSponsoredFeePayer
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      note: "the only scheme accepted for a fee-payer signature — a sponsor cannot be a passkey"
      src: crates/primitives/src/transaction/tempo_transaction.rs:SECP256K1_SIGNATURE_LENGTH
    p256:
      status: added
      authorizes: protocol
      precompile: "0x0100"
      note: >-
        129-byte encoding: r || s || pubKeyX || pubKeyY || preHash flag. Low-s is
        enforced at the protocol level (`s <= n/2`, normalized against
        `P256N_HALF`) — malleability is rejected, not silently accepted.
      src: crates/primitives/src/transaction/tt_signature.rs:P256SignatureWithPreHash
    webauthn:
      status: added
      authorizes: protocol
      precompile: none
      note: >-
        `authorizes: protocol` WITH `precompile: none` — the finding SCHEMA.md
        names. The client validates a full WebAuthn assertion (authenticatorData
        flags, clientDataJSON challenge binding, base64url) to authorize a
        transaction, and no precompile on this chain performs that composite
        check. A contract can call P256VERIFY on the inner ECDSA signature but
        cannot reproduce the authenticator-data and challenge validation the
        protocol just performed, so an on-chain recovery or multisig contract
        cannot re-verify a signature its own chain accepted.
      src: crates/primitives/src/transaction/tt_signature.rs:WebAuthnSignature
    keychain:
      status: added
      authorizes: protocol
      precompile: none
      note: >-
        A wrapper, not a curve: any of the three primitive schemes signed by a key
        registered in the AccountKeychain precompile at 0xAAAAAAAA00..00, acting for
        a declared `user_address` under a spending limit. Two versions (0x03 legacy,
        0x04 current) differ in the digest. No precompile validates the wrapper
        itself.
      src: crates/primitives/src/transaction/tt_signature.rs:SIGNATURE_TYPE_KEYCHAIN_V2
    ed25519:
      status: added
      authorizes: never
      precompile: none
      note: "consensus only — validator identity and the block proposer field. Cannot sign a transaction."
      src: crates/primitives/src/ed25519.rs:PublicKey

non_evm_transactions:
  note: >-
    One protocol record with no EIP-2718 type byte: the validator-scoped bundle
    that implements Tempo's payment-priority lane. It never appears in
    `eth_getBlockByNumber`, so the lane is invisible to an envelope-based indexer.
  entries:
  - id: subblock
    name: SubBlock (payment-priority lane)
    note: >-
      A `SubBlock` is a signed, validator-scoped bundle (version, parentHash,
      feeRecipient, transactions) that a validator can commit into the block it
      is not proposing — Tempo's payment-priority lane. It is NOT a transaction
      type: it has no type byte and never appears in `eth_getBlockByNumber`; its
      contents are ordinary 0x76 transactions whose `nonceKey` carries the
      0x5b-prefixed partial validator key that binds them to that lane. The
      header's `sharedGasLimit` is the budget for the subblock section — and it
      is ZERO from T4 onward, so at the probe block the lane is allocated no gas.
    src: crates/primitives/src/subblock.rs:SubBlock
    src_live: "eth_getBlockByNumber(0x228a273) @ 36217459 -> sharedGasLimit 0x0"


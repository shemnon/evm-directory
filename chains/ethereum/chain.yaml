schema_version: 2

chain:
  name: Ethereum Mainnet
  slug: ethereum
  chain_id: 1
  role: baseline
  live: true

lineage:
  upstream: null            # this IS the root
  ancestry: []
  note: >-
    All other rows in this dataset are expressed relative to this file.
    ethereum/execution-specs is the normative spec; go-ethereum is used here as the
    verification surface because the spec repo has no released mainnet-fork branch
    (default branch is forks/amsterdam, i.e. unshipped).

client:
  name: go-ethereum
  repo: https://github.com/ethereum/go-ethereum
  version: v1.17.5
  commit: 9621c6ad10934a01b5514886fb6fbd87640b6c05
  language: go
  note: reference-by-consensus, not by fiat; cross-check against execution-specs

consensus:
  engine: proof-of-stake (gasper)
  finality: ~13 min (2 epochs)
  block_time: 12s

baseline_fork: osaka

forks:
  src: params/config.go:MainnetChainConfig
  timeline:
  - name: shanghai
    activation_time: 1681338455
    mainnet_equivalent: self
  - name: cancun
    activation_time: 1710338135
    mainnet_equivalent: self
  - name: prague
    activation_time: 1746612311
    mainnet_equivalent: self
  - name: osaka
    activation_time: 1764798551
    mainnet_equivalent: self
  - name: bpo1
    activation_time: 1765290071
    mainnet_equivalent: self
    note: blob-parameter-only fork; target 10 / max 15
  - name: bpo2
    activation_time: 1767747671
    mainnet_equivalent: self
    note: blob-parameter-only fork; target 14 / max 21 — current live blob schedule
  - name: bogota
    activation_time: null
    status: pending
    note: >-
      next named fork in geth's ordering (amsterdam -> bogota -> ubt per
      params/config.go:465-467). Not scheduled. BPO3/BPO4 blob configs exist in
      params but are not on the mainnet schedule.

eips:
  # Baseline chain: every mainnet EIP is `inherited` by definition, so this section
  # lists only what forks care about downstream — the specs other chains commonly
  # disable, delay, or alter. Presence here = "mainnet has it, check the other rows".
  155:  {status: inherited, name: replay protection / chain id,
          src: "core/types/transaction_signing.go:NewEIP155Signer"}
  1559: {status: inherited, name: fee market, note: "commonly disabled or altered downstream (ETC removes it entirely)",
          src: "consensus/misc/eip1559/eip1559.go:CalcBaseFee"}
  2537: {status: inherited, name: BLS12-381 precompiles, fork: prague,
          src: "core/vm/contracts.go:PrecompiledContractsPrague"}
  2935: {status: inherited, name: historical block hashes in state, fork: prague,
          src: "core/state_processor.go:ProcessParentBlockHash"}
  3607: {status: inherited, name: reject txs from senders with code,
          src: "core/state_transition.go:preCheck"}
  4788: {status: inherited, name: beacon block root in EVM, fork: cancun,
          src: "core/state_processor.go:ProcessBeaconBlockRoot"}
  4844: {status: inherited, name: shard blob transactions, fork: cancun, note: "frequent absence downstream — no blob market on most non-L1s",
          src: "core/types/tx_blob.go:BlobTx"}
  6110: {status: inherited, name: supply validator deposits on chain, fork: prague,
          src: "core/state_processor.go:ParseDepositLogs"}
  7002: {status: inherited, name: execution-layer triggerable exits, fork: prague,
          src: "core/state_processor.go:ProcessWithdrawalQueue"}
  7251: {status: inherited, name: increase MAX_EFFECTIVE_BALANCE, fork: prague,
          src: "core/state_processor.go:ProcessConsolidationQueue"}
  7702: {status: inherited, name: set EOA account code, fork: prague,
          src: "core/types/tx_setcode.go:SetCodeTx"}
  7823: {status: inherited, name: modexp upper bounds, fork: osaka, src: "core/vm/contracts.go:PrecompiledContractsOsaka"}
  7883: {status: inherited, name: modexp gas cost increase, fork: osaka, src: "core/vm/contracts.go:PrecompiledContractsOsaka"}
  7951: {status: inherited, name: secp256r1 (P256VERIFY) precompile, fork: osaka,
         note: "shipped on L2s as RIP-7212 years before mainnet — expect downstream chains to have it at the SAME address 0x0100 but under an earlier fork name",
         src: "core/vm/contracts.go:p256Verify"}

non_eip_specs: []

tx_types:
  # verified: core/types/transaction.go:48-52
  "0x00": {name: LegacyTx,     status: inherited, spec: frontier/EIP-155, src: "core/types/transaction.go:LegacyTxType"}
  "0x01": {name: AccessListTx, status: inherited, spec: EIP-2930, src: "core/types/transaction.go:AccessListTxType"}
  "0x02": {name: DynamicFeeTx, status: inherited, spec: EIP-1559, src: "core/types/transaction.go:DynamicFeeTxType"}
  "0x03": {name: BlobTx,       status: inherited, spec: EIP-4844, src: "core/types/transaction.go:BlobTxType"}
  "0x04": {name: SetCodeTx,    status: inherited, spec: EIP-7702, src: "core/types/transaction.go:SetCodeTxType"}
  src: core/types/transaction.go
  note: >-
    0x00 is the untyped RLP legacy envelope. Typed envelopes are 0x00-0x7f;
    0x80-0xff are reserved to avoid RLP ambiguity, which is why OP Stack's
    deposit type sits at 0x7e — the top of the legal range, chosen to minimise
    collision risk with future mainnet types.

tx_authorization:
  key_binding: derived
  signers_per_tx: 1
  note: >-
    The baseline. secp256k1 is the ONLY scheme that can authorize a transaction, and
    the address is the hash of the recovered public key, so ecrecover(sig) == from is
    an identity rather than a check. EIP-7702 does not change this: the SetCode
    authorization and the transaction are both still secp256k1: delegated code may
    verify anything it likes, but only after a secp256k1 signature has already
    authorized the call.
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      src: "core/types/transaction_signing.go:Sender"
    secp256r1:
      status: inherited
      authorizes: never
      precompile: "0x0100"
      note: >-
        P256VERIFY (EIP-7951) is a tool for CONTRACTS. A P-256 key cannot sign a
        transaction at any fork level. The distinction this whole axis exists to make.
      src: "core/vm/contracts.go:p256Verify"

precompiles:
  # verified: core/vm/contracts.go:PrecompiledContractsOsaka
  "0x01": {name: ECRECOVER,        status: inherited, spec: frontier, src: "core/vm/contracts.go:ecrecover"}
  "0x02": {name: SHA256,           status: inherited, spec: frontier, src: "core/vm/contracts.go:sha256hash"}
  "0x03": {name: RIPEMD160,        status: inherited, spec: frontier, src: "core/vm/contracts.go:ripemd160hash"}
  "0x04": {name: IDENTITY,         status: inherited, spec: frontier, src: "core/vm/contracts.go:dataCopy"}
  "0x05": {name: MODEXP,           status: inherited, spec: "EIP-198/2565/7823/7883", src: "core/vm/contracts.go:bigModExp"}
  "0x06": {name: BN256_ADD,        status: inherited, spec: "EIP-196/1108", src: "core/vm/contracts.go:bn256AddIstanbul"}
  "0x07": {name: BN256_SCALAR_MUL, status: inherited, spec: "EIP-196/1108", src: "core/vm/contracts.go:bn256ScalarMulIstanbul"}
  "0x08": {name: BN256_PAIRING,    status: inherited, spec: "EIP-197/1108", src: "core/vm/contracts.go:bn256PairingIstanbul"}
  "0x09": {name: BLAKE2F,          status: inherited, spec: EIP-152, src: "core/vm/contracts.go:blake2F"}
  "0x0a": {name: KZG_POINT_EVALUATION, status: inherited, spec: EIP-4844, src: "core/vm/contracts.go:kzgPointEvaluation"}
  "0x0b": {name: BLS12_G1ADD,      status: inherited, spec: EIP-2537, src: "core/vm/contracts.go:bls12381G1Add"}
  "0x0c": {name: BLS12_G1MSM,      status: inherited, spec: EIP-2537, src: "core/vm/contracts.go:bls12381G1MultiExp"}
  "0x0d": {name: BLS12_G2ADD,      status: inherited, spec: EIP-2537, src: "core/vm/contracts.go:bls12381G2Add"}
  "0x0e": {name: BLS12_G2MSM,      status: inherited, spec: EIP-2537, src: "core/vm/contracts.go:bls12381G2MultiExp"}
  "0x0f": {name: BLS12_PAIRING,    status: inherited, spec: EIP-2537, src: "core/vm/contracts.go:bls12381Pairing"}
  "0x10": {name: BLS12_MAP_FP_TO_G1,  status: inherited, spec: EIP-2537, src: "core/vm/contracts.go:bls12381MapG1"}
  "0x11": {name: BLS12_MAP_FP2_TO_G2, status: inherited, spec: EIP-2537, src: "core/vm/contracts.go:bls12381MapG2"}
  "0x0100": {name: P256VERIFY,     status: inherited, spec: "EIP-7951 (= RIP-7212)", fork: osaka, src: "core/vm/contracts.go:p256Verify"}
  src: core/vm/contracts.go:PrecompiledContractsOsaka
  note: >-
    Contiguous 0x01-0x11, then a deliberate jump to 0x0100. That gap is the
    convention forks exploit: nearly every chain in this dataset places its custom
    precompiles far away from the mainnet range to stay collision-free as mainnet
    grows. Chains that did NOT do this are worth flagging.

system_contracts:
  # verified: params/protocol_params.go:246-262. Real bytecode, NOT precompiles.
  "0x000F3df6D732807Ef1319fB7B8bB8522d0Beac02":
    {name: Beacon roots, status: inherited, spec: EIP-4788, fork: cancun,
     src: "params/protocol_params.go:BeaconRootsAddress"}
  "0x0000F90827F1C53a10cb7A02335B175320002935":
    {name: Historical block hashes, status: inherited, spec: EIP-2935, fork: prague,
     src: "params/protocol_params.go:HistoryStorageAddress"}
  "0x00000961Ef480Eb55e80D19ad83579A64c007002":
    {name: Withdrawal request queue, status: inherited, spec: EIP-7002, fork: prague,
     src: "params/protocol_params.go:WithdrawalQueueAddress"}
  "0x0000BBdDc7CE488642fb579F8B00f3a590007251":
    {name: Consolidation request queue, status: inherited, spec: EIP-7251, fork: prague,
     src: "params/protocol_params.go:ConsolidationQueueAddress"}
  "0x00000000219ab540356cBB839Cbe05303d7705fa":
    {name: Beacon deposit contract, status: inherited, spec: EIP-6110,
     src: "params/config.go:MainnetChainConfig.DepositContractAddress"}
  src: params/protocol_params.go

system_transactions:
  sender: "0xfffffffffffffffffffffffffffffffffffffffe"
  note: >-
    EIP-4788 SYSTEM_ADDRESS. Not a tx type — an implicit pre-block call. Chains that
    add protocol-driven state changes (OP deposits, Avalanche atomic ops) belong in
    this category, not in tx_types, unless they define an actual type byte.
  src: params/protocol_params.go:SystemAddress

opcodes:
  added: []

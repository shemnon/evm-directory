tx_lifecycle:
  ordered_then_invalid:
    verdict: unreachable
    src: "core/txpool/legacypool/legacypool.go:validateTx, core/state_transition.go:preCheck"
    note: >-
      MAINNET BASELINE — THE STATE IS UNREACHABLE BY CONSTRUCTION. Nonce, balance and gas
      price are checked before a transaction can be ordered: the pool rejects it at
      `validateTx`, and a block containing one is invalid because `preCheck` fails during
      execution. So "ordered but invalid" is not a state mainnet can reach, the nonce is
      always preserved, and the sender resubmits freely. Every other row on this axis is a
      delta against that, and the divergence appears wherever a chain separates ordering
      from execution.
  nonce_on_failure:
    verdict: preserved
    src: "core/state_transition.go:preCheck"
    note: >-
      Preserved, always: an invalid transaction is never included, so nothing spends the
      nonce.

p2p:
  max_tx_bytes:
    verdict: 131072
    tier: policy
    scope: non_blob
    src: "core/txpool/legacypool/legacypool.go:txMaxSize"
    note: >-
      MAINNET BASELINE, AND IT IS NOT A CONSENSUS RULE. 128 KiB = 4 x the 32 KiB
      `txSlotSize`, a DoS bound chosen so pool admission stays O(maxslots); the comment at
      the constant gives the reason as propagation cost, not validity. Every other EL
      copied the number to keep the mempool from fragmenting, so it reads like a spec and
      is not one. A larger transaction is perfectly valid in a block and simply cannot get
      there through public gossip — see `max_block_bytes` for the ceiling that does bind.
  max_blob_tx_bytes:
    verdict: 1048576
    tier: policy
    scope: blob
    src: "core/txpool/blobpool/blobpool.go:txMaxSize"
    note: >-
      A SECOND, DIFFERENT LIMIT IN THE SAME CLIENT. The blob pool caps a transaction at
      1 MiB *including its blobs* — eight times the legacy pool's cap — because blob
      transactions are pulled rather than pushed and the payload sits on disk. The trap is
      that this byte cap is what actually enforces the per-transaction blob COUNT:
      `maxBlobsPerTx` is `params.BlobTxMaxBlobs` (6), and the constant's own comment warns
      "if you increase this, validation will fail on txMaxSize". Two limits, one binding
      the other, in opposite units.
  max_block_bytes:
    verdict: 8388608
    tier: consensus
    src: "params/protocol_params.go:MaxBlockSize"
    note: >-
      EIP-7934, live at Osaka: the first size limit on this axis that a validating node
      enforces. 8 MiB is already net of the spec's 2 MiB safety margin against a 10 MiB
      total, so the constant is the effective cap on the RLP-encoded block, checked in
      `core/block_validator.go` and gated on `IsOsaka`. Before Fusaka there was no
      consensus size limit at all.
  max_message_bytes:
    verdict: 10485760
    tier: transport
    src: "eth/protocols/eth/protocol.go:maxMessageSize"
    note: >-
      10 MiB per `eth` protocol message, the same in `snap`. The hard wire ceiling above it
      is the RLPx frame's 24-bit length field (`p2p/rlpx/buffer.go:maxUint24`, 16,777,215
      bytes). Note that neither bound is what shapes behaviour in practice: `snap` assembles
      responses against a 2 MiB `softResponseLimit` and stops there.
  fragmentation:
    verdict: none
    tier: transport
    src: "p2p/rlpx/buffer.go:maxUint24"
    note: >-
      RLPx has no application-level chunking — multi-frame messages were cut from the spec
      and geth never carried them — so the frame cap is hard rather than a unit of
      delivery. A message that does not fit is not split; the connection errors.
  transports:
    verdict: "devp2p + libp2p"
    src: "eth/protocols/eth/protocol.go:maxMessageSize"
    note: >-
      TWO STACKS, NOT ONE, and conflating them is the usual error. Execution peers speak
      devp2p/RLPx (`eth/69`, `snap/1`) and carry transactions; consensus peers speak libp2p
      gossipsub and carry beacon blocks and blob sidecars, under its own 10 MiB
      `MAX_PAYLOAD_SIZE`. A transaction never touches libp2p and a blob sidecar never
      touches RLPx.
    stack:
      - {layer: execution, protocol: devp2p, purpose: tx + block gossip}
      - {layer: consensus, protocol: libp2p, purpose: beacon block + blob sidecar gossip}

block_metrics:
  block_gas_limit:
    verdict: ~
    observed: 60000000
    observed_at_block: 26100375
    observed_at: 2026-10-01
    mutability: adjustable
    src: "params/protocol_params.go:GasLimitBoundDivisor"
    src_live: "eth_getBlockByNumber @ 26100375 -> gasLimit 0x3938700"
    note: >-
      THE CODE SETS NO VALUE HERE, only the rate of change, and that is the whole reason
      this axis stores a pair. `MaxGasLimit` is 2^63-1 and `MinGasLimit` is 5000 —
      neither is a budget — so the only real limit is whatever the block producers have
      walked the number to, 1/1024 at a time, under `GasLimitBoundDivisor`. A reader who
      takes `verdict:` as "the" gas limit on a row like this one gets no answer at all;
      `observed:` is the answer, and it is a snapshot that decays.
  tx_gas_limit:
    verdict: 16777216
    mutability: fixed
    src: "params/protocol_params.go:MaxTxGas"
  gas_target:
    verdict: ~
    observed: 30000000
    observed_at_block: 26100375
    observed_at: 2026-10-01
    mutability: fixed
    src: "params/protocol_params.go:DefaultElasticityMultiplier"
    src_live: "eth_getBlockByNumber @ 26100375 -> gasLimit 0x3938700 / elasticity 2"
    note: >-
      Derived, not configured: EIP-1559 sets the target at the limit divided by
      `DefaultElasticityMultiplier` (2), so it moves whenever the limit does. Blocks
      above target raise the base fee, below it lower it — which makes this the number
      that decides what a user pays, while `block_gas_limit` only decides what is
      possible.
  block_time:
    verdict: 12000
    observed: 12049.2
    observed_at_block: 26100375
    observed_at: 2026-10-01
    mutability: fixed
    src_doc: https://github.com/ethereum/consensus-specs/blob/dev/specs/phase0/beacon-chain.md#time-parameters
    src_live: "eth_getBlockByNumber @ 26100375 vs 26090375 -> 120492s / 10000 blocks"
    note: >-
      12s is SECONDS_PER_SLOT from the consensus specification, not a value any
      execution client sets — which is why the citation here is a spec rather than the
      pinned clone. The observed figure runs slightly above it (12,049 ms over 10,000
      blocks) because missed slots add 12s gaps that no average can remove.
  blob_count:
    verdict: 21
    observed: 21
    observed_at_block: 26100375
    observed_at: 2026-10-01
    mutability: fixed
    src: "params/config.go:DefaultBPO2BlobConfig"
    src_live: "eth_config @ 26100375 -> blobSchedule.max 21"
    note: >-
      21 per block at BPO2, and SCHEDULED TO CHANGE AGAIN. The blob schedule is a fork
      ladder of its own in `params/config.go`: Cancun 3/6, Prague 6/9, BPO1 10/15, BPO2
      14/21 (live), BPO3 21/32. A per-block blob count is therefore a fork-dependent
      fact, not a constant, and the pair on this row agrees only because the probe
      happened after BPO2. Note the separate per-TRANSACTION cap of 6
      (`BlobTxMaxBlobs`), which is what actually binds a single sender.
  blob_gas_limit:
    verdict: 2752512
    mutability: fixed
    src: "params/protocol_params.go:BlobTxBlobGasPerBlob"

proofs:
  # The baseline, stated once, exactly as opcodes.baseline_set and tx_lifecycle are.
  # Every other row in this axis is a delta against these six answers.
  state_transition:
    verdict: consensus
    note: >-
      Nothing proves mainnet's state transition to anybody else, because there is no
      anybody else: the validator set attesting to a block IS the settlement layer.
      Every validating node re-executes and compares its computed root against the
      header's. Recorded as `consensus` rather than left blank on purpose — it is the
      baseline the rollup rows are a delta against, not an absence of evidence.
    src: "core/block_validator.go:ValidateState"
  proving_live:
    verdict: n/a
    note: "nothing is being proven, so there is nothing that could be live or staged"
    src: "core/block_validator.go:ValidateState"
  settlement:
    verdict: self
    note: >-
      Mainnet settles itself. No external contract accepts or rejects its state
      transition, and there is no window in which a transition can be revoked by a
      party outside the chain.
    src: "consensus/beacon/consensus.go:Finalize"
  prover_constraints:
    verdict: none
    note: >-
      No circuit bound reaches EVM semantics. Mainnet precompiles carry gas costs and,
      from EIP-7823, explicit input bounds written as consensus rules — but those are
      chosen for pricing and DoS, not to keep a prover inside a trace budget, and no
      mainnet precompile succeeds in eth_call while being unminable in a block.
    src: "core/vm/contracts.go:PrecompiledContractsOsaka"
  state_proof:
    verdict: served
    note: >-
      EIP-1186 as specified: eth_getProof returns {balance, codeHash, nonce,
      storageHash, accountProof, storageProof} and the account leaf is a four-item RLP
      list. This is the shape every light client and bridge in the ecosystem decodes.
    src: "internal/ethapi/api.go:GetProof"
  proof_root:
    verdict: canonical
    note: >-
      The accountProof verifies against `header.Root` of the block it was taken at.
      That property is what the other rows on this axis break, and they break it in
      three different ways — a root from another block, a root under another hash, and
      no root at all.
    src: "core/types/block.go:Header"

fee_model:
  metering: gas
  fee_market: EIP-1559 (base fee burned + priority tip)
  blob_fee_market: EIP-4844 independent 1559-style market, target 14 / max 21 (BPO2)
  extra_components: []

header_fields:
  added: []
  removed: []
  modified: []
  note: baseline — Osaka header is the reference shape

gotchas:
  - >-
    P256VERIFY at 0x0100 landed on mainnet only at Osaka (Dec 2025) but has been on
    OP-Stack chains as RIP-7212 since well before. A contract that feature-detects it
    will behave differently across chains that are otherwise "Prague-equivalent".
  - >-
    "Prague-equivalent" is ambiguous downstream: EIP-7702 and EIP-2537 shipped in the
    same fork, and forks frequently adopt one without the other. Always record the
    EIP set, never just the fork name. This is the reason the eips: map exists.
  - >-
    BPO forks change only blob target/max. A chain claiming "Osaka-equivalent" may
    still have a completely different blob schedule, or no blob market at all.

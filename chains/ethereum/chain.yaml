  note: >-
    baseline — the full Osaka jump table is the reference set. `baseline_set` below
    enumerates it so other rows can be rendered against the complete instruction set
    rather than only against each other's deltas: without it, a grid of opcodes has no
    way to distinguish "this chain has ADD, unremarkably" from "nobody recorded
    anything about ADD here".
  baseline_set:
    src: core/vm/jump_table.go:newOsakaInstructionSet
    note: >-
      The 150 entries for which newOsakaInstructionSet() yields an operation with
      `undefined == false`, read out of the pinned tree at the recorded commit. Opcode
      constants exist in core/vm/opcodes.go for instructions that are NOT in the active
      set, so the constant list is not the same question and would overstate this by
      several entries. CLZ (0x1e, EIP-7939) is present, which is what distinguishes
      this from the Prague set.

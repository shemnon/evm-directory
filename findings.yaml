- id: getcode-proves-nothing
  title: eth_getCode cannot tell a precompile from a contract
  axis: precompiles
  rank: 20
  lede: >-
    SCHEMA.md distinguishes a precompile (native code, no bytecode in state) from a
    system contract (real bytecode at a fixed address), and the obvious test is
    `eth_getCode`: empty means precompile. That test fails on eight rows here, in six
    shapes, in BOTH directions. Classification has to come from the client's precompile
    map; a probe can only corroborate it.
  chains:
    flare: >-
      Fails in both directions on one chain. The Warp precompile answers `0x01`,
      inherited from Avalanche's deliberate `extcodesize` stub — while Flare's
      `0x1000…0001–0007`, cited elsewhere as custom precompiles, are ordinary system
      contracts with real genesis bytecode.
    sonic: >-
      Writes a 1-byte `0x00` stub at EvmWriter, so the probe reports a contract.
    cosmos-evm: >-
      Writes a **full ~24KB ERC-20 runtime** at its dynamic token precompiles that is
      never executed and decompiles into the contract it impersonates.
    moonbeam: >-
      Breaks it the other way. `PrecompileRegistry.updateAccountCode` at `0x0815` writes
      a 5-byte revert stub into any precompile's account and **anyone may call it**, so
      36 of 47 addresses carry code — including all nine of mainnet's, making
      `EXTCODESIZE(0x01) == 5` — while several genuine precompiles return `0x`.
    tempo: >-
      Writes `0xef`, giving `EXTCODESIZE == 1` — indistinguishable by size from a real
      one-byte contract.
    arc: >-
      Writes `0x01`, giving `EXTCODESIZE == 1` — indistinguishable by size from a real
      one-byte contract.
    avalanche-c: >-
      `ApplyPrecompileActivations` deliberately writes `nonce=1, code=0x01` at its
      precompiles so Solidity's `extcodesize` guard passes — the origin of the pattern
      several rows here inherit.
    injective: >-
      The family counter-example: Injective vendors the Cosmos EVM module but writes NO
      code stub, so `eth_getCode` at its precompiles returns `0x` live where the
      framework it derives from returns a 24KB ERC-20 runtime. Same family, opposite
      answer from the same probe — which is why the probe cannot be the classifier.
  body: >-
    SCHEMA.md distinguishes a precompile (native code, no bytecode in state) from a
    system contract (real bytecode at a fixed address), and the obvious test is
    `eth_getCode`: empty means precompile. That test fails on eight rows here, in six
    different shapes, and it fails in BOTH directions. Avalanche's `ApplyPrecompileActivations`
    deliberately writes `nonce=1, code=0x01` at its precompiles so Solidity's
    `extcodesize` guard passes — so Flare's Warp precompile answers `0x01`. Sonic writes
    a 1-byte `0x00` stub at EvmWriter. Tempo writes `0xef`; Arc writes `0x01`; both give
    `EXTCODESIZE == 1`, indistinguishable by size from a real one-byte contract. Cosmos
    EVM writes a **full ~24KB ERC-20 runtime** at its dynamic token precompiles that is
    never executed and decompiles into the contract it impersonates. Moonbeam breaks it
    the other way too: `PrecompileRegistry.updateAccountCode` at `0x0815` writes a
    5-byte revert stub into any precompile's account and **anyone may call it**, so 36
    of 47 addresses carry code — including all nine of mainnet's, making
    `EXTCODESIZE(0x01) == 5` — while several genuine precompiles return `0x`. Conversely
    Flare's `0x1000…0001–0007`, cited elsewhere as custom precompiles, are ordinary
    system contracts with real genesis bytecode. Classification has to come from the
    client's precompile map; a probe can only corroborate it.

- id: second-meter-failures
  title: A second resource meter, and five ways it fails your transaction
  axis: fees-envelope
  rank: 21
  lede: >-
    Gas is no longer the only thing a transaction can run out of, and the failure modes
    share nothing. A transaction can be rejected, truncated away, silently dropped, or
    charged for work it never did, and only one of those is visible as an ordinary
    revert.
  chains:
    taiko: >-
      zk gas (100M per block) **truncates the block**: the offending transaction and
      every one after it are dropped and the block stays valid — with no
      `eth_estimateZkGas` to predict it.
    linea: >-
      **Discards with no receipt** — no revert, and no charge.
    polygon-zkevm: >-
      **Discards with no receipt** — no revert, no charge, and the hash is blacklisted
      from the pool afterwards.
    moonbeam: >-
      Meters four resources — gas, Weight ref_time at a compile-time 25,000 ps/gas, PoV
      proof size at gas/8, and storage growth at gas/366 — and the last two fail as
      **OutOfGas with EVM gas remaining**.
    megaeth: >-
      Halts, **refunds the remaining gas**, and mines a `status: 0` receipt.
    sonic: >-
      Inverts the idea: it charges 10% of the gas you did NOT use, verified live to the
      wei, while `eth_estimateGas` returns the true figure — so padding an estimate
      transfers value.
  body: >-
    Gas is no longer the only thing a transaction can run out of, and the failure modes
    share nothing. Taiko's zk gas (100M per block) **truncates the block**: the offending
    transaction and every one after it are dropped and the block stays valid, with no
    `eth_estimateZkGas` to predict it. Linea and Polygon zkEVM **discard with no
    receipt** — no revert, no charge, and on Polygon the hash is blacklisted from the
    pool. Moonbeam meters four resources (gas, Weight ref_time at a compile-time 25,000
    ps/gas, PoV proof size at gas/8, storage growth at gas/366) and the last two fail as
    **OutOfGas with EVM gas remaining**. MegaETH halts, **refunds the remaining gas**,
    and mines a `status: 0` receipt. Sonic inverts the idea: it charges 10% of the gas
    you did NOT use, verified live to the wei, while `eth_estimateGas` returns the true
    figure — so padding an estimate transfers value. A transaction can be rejected,
    truncated away, silently dropped, or charged for work it never did, and only one of
    those five is visible as an ordinary revert.

- id: no-native-asset
  title: What the EVM does when the gas token is not a native 18-decimal asset
  axis: fees-envelope
  rank: 22
  lede: >-
    `msg.value`, `BALANCE`, `SELFBALANCE`, `CALL`'s value argument and `eth_getBalance`
    all assume one native 18-decimal asset. The rows here break that assumption in
    different places.
  chains:
    tempo: >-
      **Deletes the native asset outright.** `value != 0` is rejected at admission,
      `BALANCE` and `SELFBALANCE` return 0, and the base fee is denominated in
      attodollars rather than any token — while `eth_getBalance` returns a FABRICATED
      CONSTANT for every address at every block, ignoring both arguments, so the RPC and
      the EVM contradict each other about the same account in the same block.
    arc: >-
      Makes USDC native at the cost of a duplicated unit: `USDC.balanceOf(a) ==
      eth_getBalance(a) // 10**12`, integer division — so every account carries
      sub-microdollar dust the token interface can neither see nor move, and one
      transfer emits two `Transfer` logs with two different amounts.
    celo: >-
      Keeps a native token and pays gas in an ERC-20, through a custom transaction type.
    mantle: >-
      Makes an ERC-20 the native token, needing no new transaction type at all.
    gnosis: >-
      The control at the other end: a different gas token, mainnet's 1559 parameters to
      the digit, and the base fee credited to a collector rather than burned.
    plasma: >-
      The null result — the zero-fee stablecoin path is ERC-4337, not consensus, and 0
      of 274 sampled transactions paid a zero gas price.
  body: >-
    `msg.value`, `BALANCE`, `SELFBALANCE`, `CALL`'s value argument and `eth_getBalance`
    all assume one native 18-decimal asset, and four rows here break that assumption
    four ways. Celo keeps a native token and pays gas in an ERC-20 via a custom tx type.
    Mantle makes an ERC-20 the native token, needing no new type at all. **Arc** makes
    USDC native at the cost of a duplicated unit — `USDC.balanceOf(a) ==
    eth_getBalance(a) // 10**12`, integer division, so every account carries
    sub-microdollar dust the token interface can neither see nor move, and one transfer
    emits two `Transfer` logs with two different amounts. **Tempo deletes the native
    asset outright**: `value != 0` is rejected at admission, `BALANCE` and `SELFBALANCE`
    return 0, the base fee is denominated in attodollars rather than any token — and
    `eth_getBalance` returns a FABRICATED CONSTANT for every address at every block,
    ignoring both arguments, so the RPC and the EVM contradict each other about the same
    account in the same block. Gnosis is the control at the other end: a different gas
    token, mainnet's 1559 parameters to the digit, and the base fee credited to a
    collector rather than burned. Plasma is the null result — its zero-fee stablecoin
    path is ERC-4337, not consensus, and 0 of 274 sampled transactions paid a zero gas
    price.

- id: stale-coordinates
  title: Four of fifteen candidate clients were at the wrong address
  axis: method
  rank: 23
  lede: >-
    The repository coordinates a chain publishes are not durable, and the drift is
    invisible until a clone fails. Of fifteen chains scheduled in one pass, four were
    not where the backlog said. Pinning a commit protects a fact once found; it does not
    help you find the client.
  chains:
    gnosis: >-
      `gnosischain/gnosis` **404s**. The live chainspec is inside Nethermind, while
      `gnosischain/configs`' genesis is frozen pre-Merge.
    injective: >-
      `InjectiveLabs/injective-core` **moved orgs**, to `InjectiveFoundation`.
    mantle: >-
      `mantlenetworkio` **redirects** to `mantle-xyz`.
    polygon-zkevm: >-
      `0xPolygonHermez/zkevm-node` is **archived** and replaced by a different client,
      `0xPolygon/cdk-erigon`, whose contracts moved to a third org.
    linea: >-
      Linea had already shown the pattern before this pass: Consensys → LFDT-Lineth,
      hyperledger/besu → besu-eth. Here as on three of the four others, the running
      network was identified by asking it — `web3_clientVersion` — rather than by
      reading a document.
  body: >-
    The repository coordinates a chain publishes are not durable, and the drift is
    invisible until a clone fails. Of fifteen chains scheduled in one pass, four were
    not where the backlog said: `gnosischain/gnosis` **404s** (the live chainspec is
    inside Nethermind, while `gnosischain/configs`' genesis is frozen pre-Merge),
    `InjectiveLabs/injective-core` **moved orgs** to `InjectiveFoundation`,
    `mantlenetworkio` **redirects** to `mantle-xyz`, and `0xPolygonHermez/zkevm-node` is
    **archived** and replaced by a different client (`0xPolygon/cdk-erigon`) whose
    contracts moved to a third org. Linea had already shown the pattern: Consensys →
    LFDT-Lineth, hyperledger/besu → besu-eth. In three of the five cases the running
    network was identified only by asking it — `web3_clientVersion` — rather than by
    reading a document. Pinning a commit protects a fact once found; it does not help
    you find the client.

- id: ordered-then-invalid
  title: A transaction ordered before it is executed has seven different fates
  axis: method
  rank: 24
  lede: >-
    Mainnet checks nonce, balance and gas price *before* a transaction is ordered, so
    "ordered but invalid" is not a state it can reach. Every chain that separates
    ordering from execution has to invent an answer, and the rows here have invented
    seven. There is no portable answer to "was my transaction included".
  chains:
    conflux: >-
      **Erases it.** A third receipt outcome, `TransactionStatus::Skipped`, then deletes
      the transaction from the block, the transaction index and
      `eth_getTransactionReceipt` alike — so it is indistinguishable from a transaction
      never submitted, forever.
    iota-evm: >-
      **Erases it.** Rejection happens at the ISC request layer before the EVM is
      entered, so there is no receipt to write and none ever appears.
    artela: >-
      **Erases it.** The indexing event is emitted from the *last* ante decorator, so an
      ante failure leaves the CometBFT index with no entry while the transaction sits
      provably in the block.
    rollkit: >-
      **Erases it.** The builder logs a `warn!` and does not append;
      `eth_getTransactionReceipt` returns null forever.
    taraxa: >-
      **The counter-pole:** no skip path at all. The transaction is included, charged
      the full gas limit, and gets a `status: 0` receipt.
    autonomys: >-
      **Escalates.** The offending transaction poisons its whole `Bundle`, every valid
      co-passenger is dropped, and the operator is automatically slashed under
      `SlashedReason::InvalidBundle`.
    berachain: >-
      **Rejects the block.** The EVM sits behind the Engine API, whose `newPayload`
      verdict has no per-transaction skip, so `ProcessProposal` returns REJECT and the
      client sees nothing at all.
    rise: >-
      **Makes the state unreachable** — it admits synchronously and publishes only after
      executing, so the ordered-but-invalid state never exists to be observed.
    megaeth: >-
      **Makes the state unreachable** by the opposite route — the state is created
      inside the builder and resolved before publication.
    monad: >-
      **Charges it**, inside execution.
    hedera: >-
      **Bills it without ever executing it, and the bill may land on the node.** Fees
      are charged before the handler is reached, and the split is by *who was negligent*
      rather than by what failed: a due-diligence failure (expiry re-checked against the
      consensus clock, a bad payer signature) debits the submitting **node's** account
      and the payer nothing, while a duplicate or an unaffordable service fee debits the
      **payer** and never calls the handler. It is the only row where the node pays for
      the sender's invalid transaction. A record always exists, because Hedera cannot
      drop something that reached consensus — but for a wrapped Ethereum transaction the
      Ethereum hash is written only inside the handler, so the `eth_*` view is null
      forever anyway.
  body: >-
    Mainnet checks nonce, balance and gas price *before* a transaction is ordered, so
    "ordered but invalid" is not a state it can reach. Every chain that separates
    ordering from execution has to invent an answer, and ten rows here have invented
    seven. **Erasure, by four unrelated mechanisms:** Conflux defines a third receipt
    outcome, `TransactionStatus::Skipped`, then deletes the transaction from the block,
    the transaction index and `eth_getTransactionReceipt` alike; IOTA EVM rejects at the
    ISC request layer before the EVM is entered, so there is no receipt to write; Artela
    emits its indexing event from the *last* ante decorator, so an ante failure leaves
    the CometBFT index with no entry while the transaction sits provably in the block;
    Rollkit's builder logs a `warn!` and does not append. In all four,
    `eth_getTransactionReceipt` returns null forever and the transaction is
    indistinguishable from one never submitted. **Taraxa is the counter-pole:** no skip
    path at all — included, charged the full gas limit, `status: 0`. **Autonomys
    escalates:** the offending transaction poisons its whole `Bundle`, every valid
    co-passenger is dropped, and the operator is automatically slashed under
    `SlashedReason::InvalidBundle`. **Berachain rejects the block:** the EVM sits behind
    the Engine API, whose `newPayload` verdict has no per-transaction skip, so
    `ProcessProposal` returns REJECT and the client sees nothing at all. **RISE and
    MegaETH make the state unreachable**, by opposite routes — RISE admits synchronously
    and publishes only after executing, MegaETH creates the state inside the builder and
    resolves it before publication. **Monad charges it**, inside execution. **Hedera bills
    it without ever executing it, and the bill may land on the node**: fees are charged
    before the handler is reached, and the split is by *who was negligent* rather than by
    what failed — a due-diligence failure (expiry re-checked against the consensus clock, a
    bad payer signature) debits the submitting **node's** account and the payer nothing,
    while a duplicate or an unaffordable service fee debits the **payer** and never calls
    the handler. It is the only row where the node pays for the sender's invalid
    transaction. A record always exists, because Hedera cannot drop something that reached
    consensus — but for a wrapped Ethereum transaction the Ethereum hash is written only
    inside the handler, so the `eth_*` view is null forever anyway. There is no portable
    answer to "was my transaction included", and a null receipt means "still pending" on
    some of these chains, "gone forever" on others, and "gone, and you were charged" on
    one.

- id: cometbft-el-boundary
  title: Same consensus engine, opposite failure mode — the Engine API is the discriminator
  axis: lineage
  rank: 25
  lede: >-
    Two chains run the same consensus engine, CometBFT, and must answer the same
    question — what happens to a transaction that is in a proposal but invalid when it
    executes. They answer oppositely, and the discriminator is not the consensus engine
    but whether the EVM is inside the ABCI application or behind the Engine API.
  chains:
    berachain: >-
      The EVM is a separate process reached over the Engine API, whose
      `engine_newPayload` verdict covers the whole payload with no per-transaction skip
      — so failure is **per-block**. `ProcessProposal` returns
      `PROCESS_PROPOSAL_STATUS_REJECT`, CometBFT re-proposes the height, and an RPC
      client observes nothing at all. Berachain goes further: CometBFT never orders EVM
      transactions in the first place, since `prepareProposal` ignores `req.Txs` and
      returns exactly two entries, the SSZ beacon block and its blob sidecars.
    artela: >-
      The EVM is in-process behind an ante-handler chain, so failure is
      **per-transaction**: the transaction is erased, provably in the CometBFT block yet
      with no index entry and a permanently null receipt.
  body: >-
    Berachain and Artela both run CometBFT and both must answer what happens to a
    transaction that is in a proposal but invalid when it executes. They answer
    oppositely, and the discriminator is not the consensus engine but **where the EVM
    runs**. Artela's EVM is in-process behind an ante-handler chain, so failure is
    per-transaction: the transaction is erased, provably in the CometBFT block yet with
    no index entry and a permanently null receipt. Berachain's EVM is a separate process
    reached over the Engine API, whose `engine_newPayload` verdict covers the whole
    payload with no per-transaction skip, so failure is per-block — `ProcessProposal`
    returns `PROCESS_PROPOSAL_STATUS_REJECT`, CometBFT re-proposes the height, and an
    RPC client observes nothing at all. Berachain goes further: CometBFT never orders
    EVM transactions in the first place, since `prepareProposal` ignores `req.Txs` and
    returns exactly two entries, the SSZ beacon block and its blob sidecars. Any
    generalisation of the form "Cosmos/CometBFT chains behave like X" is wrong in one of
    the two directions; the question to ask is whether the EVM is inside the ABCI
    application or behind the Engine API.

- id: finality-tag-is-not-finality
  title: The `finalized` block tag means something different on every chain that has one
  axis: fees-envelope
  rank: 26
  lede: >-
    Any chain speaking the Engine API inherits Ethereum's `safe` and `finalized` block
    tags whether or not it has anything to put behind them, and the rows here fill them
    with incompatible meanings — with nothing in the RPC response to tell the cases
    apart.
  chains:
    autonomys: >-
      Honest and extreme: `finalized` sits 14,994 blocks — roughly twenty-four hours —
      behind `latest`, the optimistic execution challenge window plus the consensus
      chain's confirmation depth. `safe` returns the identical block, so there is no
      intermediate tier. A bridge waiting for `finalized` waits a day.
    iota-evm: >-
      Maps every negative tag to latest, so `finalized`, `safe` and `pending` return
      byte-identical head blocks — while the RPC serves a state its own source documents
      as "can be ahead of ConfirmedState".
    rollkit: >-
      Fills them by arithmetic — `safe = head-2`, `finalized = head-3` — under a source
      comment calling it "a temporary mock value until proper DA-based finalization is
      wired up". The DA-driven update that would make them meaningful is overwritten by
      the next block, ten times a second, leaving `finalized` 0.7 s behind head on a
      chain whose data layer settles every 6 s: strictly weaker than `latest` plus a
      fixed wall-clock delay.
    rise: >-
      Publishes full receipts for blocks that do not exist yet, so the tags sit above a
      chain whose head is itself provisional.
    megaeth: >-
      Publishes full receipts for blocks that do not exist yet, so the tags sit above a
      chain whose head is itself provisional.
  body: >-
    Any chain speaking the Engine API inherits Ethereum's `safe` and `finalized` block
    tags whether or not it has anything to put behind them, and four rows here fill them
    with four incompatible meanings. **Autonomys** is honest and extreme: `finalized`
    sits 14,994 blocks — roughly twenty-four hours — behind `latest`, the optimistic
    execution challenge window plus the consensus chain's confirmation depth, and `safe`
    returns the identical block, so there is no intermediate tier. **Rollkit** fills them
    by arithmetic — `safe = head-2`, `finalized = head-3` — under a source comment
    calling it "a temporary mock value until proper DA-based finalization is wired up";
    the DA-driven update that would make them meaningful is overwritten by the next
    block, ten times a second, leaving `finalized` 0.7 s behind head on a chain whose
    data layer settles every 6 s. **IOTA EVM** maps every negative tag to latest, so
    `finalized`, `safe` and `pending` return byte-identical head blocks while the RPC
    serves a state its own source documents as "can be ahead of ConfirmedState".
    **RISE and MegaETH** publish full receipts for blocks that do not exist yet. A bridge
    that waits for `finalized` waits a day on one chain and gets a strictly weaker
    guarantee than `latest` plus a fixed wall-clock delay on another, with nothing in the
    RPC response to distinguish the cases.

- id: preconfirmation-sentinels
  title: Three sentinels for "this block does not exist yet", and one reaches unmodified clients
  axis: fees-envelope
  rank: 27
  lede: >-
    A chain that publishes a transaction's result before its enclosing block is sealed
    must name a block hash it does not yet have. Both rows here also contradict
    themselves inside one payload: the streamed receipt and the streamed transaction
    disagree about the same missing hash.
  chains:
    rise: >-
      The preconfirmed receipt comes back over ordinary `eth_getTransactionReceipt` with
      `blockHash: 0x0000…0000`, and `eth_subscribe(["logs"])` is *replaced* rather than
      extended, so that channel silently carries shred logs with `blockHash: null` — two
      sentinels on one chain. An integrator who changed nothing is already consuming
      preconfirmations, storing a valid-looking zero `bytes32` that will never match a
      real block. RISE's shreds are unsigned, so a contradicted preconfirmation cannot
      be proven.
    megaeth: >-
      The sentinel is `blockHash: 0xffff…ff`, and the blast radius is small: it is
      confined to an opt-in WebSocket stream — a mini-block receipt carries it, while
      plain HTTP returns null — so a standard client is safe by default. MegaETH's
      mini-blocks are signed, so a contradicted preconfirmation can be proven.
  body: >-
    MegaETH and RISE both publish a transaction's result before its enclosing block is
    sealed, and both must name a block hash they do not yet have. They chose different
    sentinels and, more importantly, different blast radii. MegaETH confines it to an
    opt-in WebSocket stream — a mini-block receipt carries
    `blockHash: 0xffff…ff`, while plain HTTP returns null — so a standard client is safe
    by default. RISE returns the preconfirmed receipt over ordinary
    `eth_getTransactionReceipt` with `blockHash: 0x0000…0000`, and additionally
    *replaces* rather than extends `eth_subscribe(["logs"])` so that channel silently
    carries shred logs with `blockHash: null`. On RISE an integrator who changed nothing
    is already consuming preconfirmations, storing a valid-looking zero `bytes32` that
    will never match a real block. Both chains also contradict themselves within one
    payload: the streamed receipt and the streamed transaction disagree about the same
    missing hash. RISE's shreds are unsigned, so a contradicted preconfirmation cannot be
    proven; MegaETH's mini-blocks are signed. A defence written for one chain fails on
    the other, and RISE uses two sentinels itself.

- id: dag-ordering-confiscates
  title: Chains that fix inclusion before balances are known confiscate rather than reject
  axis: fees-envelope
  rank: 28
  lede: >-
    On mainnet a transaction that cannot cover `gas_limit * gas_price` is simply not
    includable — the check runs before ordering. Where proposers fix an order without
    knowing the balance it will execute against, the state transition has to do
    *something*, and two chains with no shared ancestry independently chose to take
    whatever the sender has. Two independent arrivals make it a property of the ordering
    model rather than a quirk of either client.
  chains:
    taraxa: >-
      Computes `available_funds_gas = balance / gas_price` and subtracts all but
      sub-gas-price dust. The nonce is bumped, a `status: 0` receipt is emitted, and the
      reported `gasUsed` is a function of the sender's BALANCE rather than of work
      performed — so the field every explorer and cost model reads as "work done" is,
      here, a measure of how poor the sender was.
    conflux: >-
      Takes `min(gas_cost, balance)`. The nonce is bumped, a `status: 0` receipt is
      emitted, and the reported `gasUsed` is a function of the sender's BALANCE rather
      than of work performed — so the field every explorer and cost model reads as "work
      done" is, here, a measure of how poor the sender was.
  body: >-
    On mainnet a transaction that cannot cover `gas_limit * gas_price` is simply not
    includable — the check runs before ordering. Where proposers fix an order without
    knowing the balance it will execute against, the state transition has to do
    *something*, and two chains with no shared ancestry independently chose to take
    whatever the sender has. Taraxa computes `available_funds_gas = balance / gas_price`
    and subtracts all but sub-gas-price dust; Conflux takes `min(gas_cost, balance)`.
    Both bump the nonce, both emit a `status: 0` receipt, and both report a `gasUsed`
    that is a function of the sender's *balance* rather than of work performed — so the
    receipt field that every explorer and cost model reads as "work done" is, in this
    case, a measure of how poor the sender was. Two independent arrivals at the same
    design make it a property of the ordering model rather than a quirk of either client.

- id: duplicate-transactions
  title: What counts as "the same transaction" is not the same question on every chain
  axis: tx-types
  rank: 29
  lede: >-
    Where many proposers build blocks at once, the same transaction landing in more than
    one block is the normal case rather than an edge case. WHERE deduplication happens —
    before ordering, after execution, or not at all — determines what a client can
    observe.
  chains:
    taraxa: >-
      Deduplicates at period assembly, BEFORE the ordered block set becomes a
      transaction list: the duplicate never executes, but the DAG block carrying it
      stays in the period data, so it remains visible in the DAG and is absent only from
      the executed list. Fees are credited strictly to the first includer, and before
      the Aspen fork a DAG block got no reward at all unless it contributed a unique
      transaction — nobody is charged and nobody is slashed, and the only cost of losing
      the race is forgone revenue.
    conflux: >-
      Executes it, gets `OldNonce`, marks it `Skipped`, then erases every trace — from
      the block body, the transaction index and `eth_getTransactionReceipt` alike — so
      the duplicate is indistinguishable from a transaction never submitted.
    hedera: >-
      **Makes the identity model itself the divergence.** A transaction is keyed by
      `TransactionID` = *(payer account, valid-start timestamp)*; nothing about the
      contents enters the key, so two byte-identical submissions with different
      valid-starts are different transactions, two unrelated bodies sharing a payer and
      timestamp are the same one, and uniqueness holds only inside a 180-second window
      after which an ID may be reused. Duplicates are the designed-for case, because the
      SDKs submit to several nodes for reliability — and Hedera does what no other row
      does: it **charges for them**. A duplicate first seen from another node debits the
      payer the node and network fees with the service fee waived and never executes; a
      duplicate from the same node debits that node instead; and the node that LOST the
      race is paid the node fee, so losing is revenue. None of it is visible to Ethereum
      tooling — the Ethereum hash is recorded only inside the handler a duplicate never
      reaches — so an operator sees an HBAR debit with no `eth_*` object to attribute it
      to.
    sonic: >-
      **Dedupes in four layers, and the layer that applies depends on an on-chain
      toggle**: an emitter-side stake lottery, a `seenHashes` pass over the confirmed
      event set during block derivation, and a nonce precheck at execution — but
      `SingleProposerBlockFormation` mode bypasses the hash dedup entirely, leaving only
      trial-execution at the proposer. The duplicate vanishes from `eth_*` entirely, yet
      `dag_getEventPayload` still lists it one level down — erased at one layer and
      visible at another. The whole fee is credited to the first ordered event's creator
      and the losing emitter is unrewarded but not slashed.
    monad: >-
      **The strong negative**: no deduplication anywhere, because a block containing a
      duplicate is REJECTED. Two consensus checks do it — a within-block `nonce_usages`
      set, and a cross-block coherency check that reconstructs expected nonces from the
      triedb at N-3 plus the `NonceUsageMap` of every uncommitted ancestor, which is
      what deferred execution forces.
    autonomys: >-
      **Deduplicates by byte equality** across the concatenation of every valid bundle,
      AFTER per-bundle validity classification — so an ordinary duplicate is explicitly
      NOT one of `InvalidBundleType`'s six variants and its author is never slashed.
      That is the inversion worth noting: on the one chain where a stale nonce inside a
      bundle is a slashable protocol violation, submitting the same transaction twice is
      not.
  body: >-
    Where many proposers build blocks at once, the same transaction landing in more than
    one block is the normal case rather than an edge case, and the dataset holds three
    mechanisms operating at three different layers. **Taraxa** deduplicates at period
    assembly, before the ordered block set becomes a transaction list: the duplicate never
    executes, but the DAG block carrying it stays in the period data, so it remains visible
    in the DAG and is absent only from the executed list. **Conflux** executes it, gets
    `OldNonce`, marks it `Skipped`, and then erases every trace — from the block body, the
    transaction index and `eth_getTransactionReceipt` alike, so the duplicate is
    indistinguishable from a transaction never submitted. Taraxa credits fees strictly to
    the first includer and, before its Aspen fork, gave a DAG block no reward at all unless
    it contributed a unique transaction: nobody is charged and nobody is slashed, and the
    only cost of losing the race is forgone revenue. Where deduplication happens — before
    ordering, or after execution — determines what a client can observe, and the two are
    not interchangeable. **Hedera makes the identity model itself the divergence.** A
    transaction there is keyed by `TransactionID` = *(payer account, valid-start
    timestamp)* — nothing about the contents enters the key, so two byte-identical
    submissions with different valid-starts are different transactions and two unrelated
    bodies sharing a payer and timestamp are the same one — and uniqueness holds only
    inside a 180-second window, after which an ID may be reused. Duplicates are the
    designed-for case, because the SDKs submit to several nodes for reliability. Hedera
    then does what no other row does: it **charges for them**. A duplicate first seen from
    another node debits the payer the node and network fees with the service fee waived
    and never executes; a duplicate from the same node debits that node instead; and the
    node that *lost* the race is paid the node fee, so losing is revenue. None of it is
    visible to Ethereum tooling — the Ethereum hash is recorded only inside the handler a
    duplicate never reaches — so an operator sees an HBAR debit with no `eth_*` object to
    attribute it to. Taraxa charges nobody, Conflux erases everything, Hedera bills
    silently. **Sonic dedupes in four layers and the layer that applies depends on an
    on-chain toggle**: an emitter-side stake lottery, a `seenHashes` pass over the
    confirmed event set during block derivation, and a nonce precheck at execution — but
    its `SingleProposerBlockFormation` mode bypasses the hash dedup entirely, leaving only
    trial-execution at the proposer. The duplicate vanishes from `eth_*` exactly as on
    Conflux, yet `dag_getEventPayload` still lists it one level down, exactly as on
    Taraxa; the whole fee is credited to the first ordered event's creator and the losing
    emitter is unrewarded but not slashed. **Monad is the strong negative**: no
    deduplication anywhere, because a block containing a duplicate is *rejected*. Two
    consensus checks do it — a within-block `nonce_usages` set, and a cross-block
    coherency check that reconstructs expected nonces from the triedb at N-3 plus the
    `NonceUsageMap` of every uncommitted ancestor, which is what deferred execution
    forces. **Autonomys deduplicates by byte equality** across the concatenation of every
    valid bundle, *after* per-bundle validity classification — so an ordinary duplicate is
    explicitly **not** one of `InvalidBundleType`'s six variants and its author is never
    slashed. That is the inversion worth noting: on the one chain where a stale nonce
    inside a bundle is a slashable protocol violation, submitting the same transaction
    twice is not.

- id: nonce-burned-without-execution
  title: A failed transaction may spend your nonce and show you nothing
  axis: fees-envelope
  rank: 30
  lede: >-
    On mainnet the question cannot arise: an invalid transaction is never included, so
    the nonce is always preserved and the sender resubmits freely. Where ordering is
    separated from execution, the nonce may be spent by a transaction that did no work —
    so "no receipt" does not mean "nothing happened", and the sender cannot tell the two
    apart from the Ethereum RPC alone.
  chains:
    artela: >-
      **The dangerous instance.** Same shape as the framework, but Artela's `PREVRANDAO`
      nil-dereference makes the state reachable from ordinary bytecode rather than from
      an internal error, and its `queryCosmosTxIndexer` is stricter still. A sender sees
      no receipt, concludes nothing happened, resubmits at the same nonce, and is
      permanently behind a gap no RPC call will reveal.
    cosmos-evm: >-
      **The ancestor case, and it is deliberate.** `MonoDecorator` commits the fee
      deduction and `IncrementNonce`, and the Cosmos SDK commits ante writes before
      running the message; then `TxSucessOrExpectedFailure` — `res.Code == 0 ||
      TxExceedBlockGasLimit(res)` — drops everything else out of
      `EthMsgsFromCometBlock`. A post-ante error (`failed to commit stateDB`, refund
      gas-overflow, any recovered panic) takes the fee, burns the nonce, and erases the
      transaction from the block, the hash lookup and the receipt store alike. The
      framework's own test `TestEthMsgsFromCometBlockSkipStateDBCommitFailure` pins it
      with a literal `{Code: 4, Log: "failed to commit stateDB"}`, and the one escape
      hatch is a **substring match** on the block-gas-limit error string — applied to
      exactly one of the several ways a fee can be taken.
    injective: >-
      **Inherits only half of it** — verified against Injective's own tree rather than
      assumed. It replaces the framework ante chain with `CheckEthSenderNonce` and
      applies NO result filter in `EthMsgsFromTendermintBlock`, so the nonce is burned
      and the receipt is lost, but the transaction still appears in the block and the
      gap is observable.
    sonic: >-
      Burns the nonce and emits a `status: 0` receipt, off a fee-only balance check
      reached independently of the other rows here. The axis splits without danger: the
      spent nonce is always visible.
    monad: >-
      Burns the nonce and emits a `status: 0` receipt, off a fee-only balance check
      reached independently of the other rows here. The axis splits without danger: the
      spent nonce is always visible.
    taraxa: >-
      SETS the nonce rather than incrementing it, so one transaction can burn an
      unbounded range of nonces.
    conflux: >-
      Preserves the nonce on one path and burns it on another.
    iota-evm: >-
      Preserves the nonce on one path and burns it on another.
    sei: >-
      **The deliberate counter-example.** The nonce bump and the stub receipt are gated
      on the same condition, so a spent nonce always has a receipt and a missing receipt
      always means a preserved nonce.
    megaeth: >-
      **The other deliberate counter-example.** The nonce is BURNED on the
      failed-receipt path and PRESERVED on the erasure path, and the two are told apart
      exactly the way a mainnet client expects — by whether a receipt exists. A
      block-level limit lost to a race re-runs `pre_execution_check` inside
      `commit_transaction_outcome` and returns before the commit, discarding the entire
      state delta including revm's nonce increment, so the transaction is freely
      resubmittable at the same nonce. The erasure happens BECAUSE nothing was
      committed, rather than after the nonce and fee were already taken — so here "no
      receipt" honestly means "nothing happened".
    hedera: >-
      Preserves the nonce in both its failure modes — while taking HBAR anyway.
  body: >-
    On mainnet the question cannot arise: an invalid transaction is never included, so
    the nonce is always preserved and the sender resubmits freely. Where ordering is
    separated from execution, the nonce may be spent by a transaction that did no work —
    and on three rows it is spent by a transaction the RPC will not admit exists.
    **`cosmos-evm` is the ancestor case, and it is deliberate.** `MonoDecorator` commits
    the fee deduction and `IncrementNonce`, and the Cosmos SDK commits ante writes before
    running the message; then `TxSucessOrExpectedFailure` — `res.Code == 0 ||
    TxExceedBlockGasLimit(res)` — drops everything else out of `EthMsgsFromCometBlock`.
    So a post-ante error (`failed to commit stateDB`, refund gas-overflow, any recovered
    panic) takes the fee, burns the nonce, and erases the transaction from the block, the
    hash lookup and the receipt store alike. The framework's own test
    `TestEthMsgsFromCometBlockSkipStateDBCommitFailure` pins it with a literal
    `{Code: 4, Log: "failed to commit stateDB"}`, and the one escape hatch is a
    **substring match** on the block-gas-limit error string, whitelisted back into
    visibility with the in-source reason that a fee-taken transaction must stay visible —
    applied to exactly one of the several ways a fee can be taken. **`artela` is the
    dangerous instance**: same shape, but its `PREVRANDAO` nil-dereference makes the state
    reachable from ordinary bytecode rather than from an internal error, and its
    `queryCosmosTxIndexer` is stricter still. A sender sees no receipt, concludes nothing
    happened, resubmits at the same nonce, and is permanently behind a gap no RPC call
    will reveal. **`injective` inherits only half of it** — verified against its own tree
    rather than assumed: it replaces the framework ante chain with `CheckEthSenderNonce`
    and applies *no* result filter in `EthMsgsFromTendermintBlock`, so the nonce is burned
    and the receipt is lost, but the transaction still appears in the block and the gap is
    observable. **`sei` is the deliberate counter-example**: the nonce bump and the stub
    receipt are gated on the same condition, so a spent nonce always has a receipt and a
    missing receipt always means a preserved nonce. Elsewhere the axis splits without
    danger: `sonic` and `monad` reached the same fee-only balance check from unrelated
    directions and burn the nonce with a `status: 0` receipt; `taraxa` *sets* rather than
    increments, so one transaction can burn an unbounded range of nonces; `conflux` and
    `iota-evm` each preserve on one path and burn on another; and `hedera` preserves the
    nonce in both its failure modes while taking HBAR anyway. The portable lesson is that
    "no receipt" does not mean "nothing happened", and the sender cannot tell the two
    apart from the Ethereum RPC alone.

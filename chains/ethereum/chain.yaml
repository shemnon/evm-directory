fee_model:
  metering: gas
  fee_market: EIP-1559 (base fee burned + priority tip)
  blob_fee_market: EIP-4844 independent 1559-style market, target 14 / max 21 (BPO2)
  extra_components: []
  gas_limit: validator-adjustable, ~1/1024 per block

header_fields:
  added: []
  removed: []
  modified: []
  note: baseline — Osaka header is the reference shape

gotchas:
  - >-
    P256VERIFY at 0x0100 landed on mainnet only at Osaka (Dec 2025) but has been on
    OP-Stack chains as RIP-7212 since well before. A contract that feature-detects it
    will behave differently across chains that are otherwise "Prague-equivalent".
  - >-
    "Prague-equivalent" is ambiguous downstream: EIP-7702 and EIP-2537 shipped in the
    same fork, and forks frequently adopt one without the other. Always record the
    EIP set, never just the fork name. This is the reason the eips: map exists.
  - >-
    BPO forks change only blob target/max. A chain claiming "Osaka-equivalent" may
    still have a completely different blob schedule, or no blob market at all.

fee_model:
  metering: "gas, projected from three Substrate meters"
  fee_market: "Substrate transaction-payment slow-adjusting multiplier, presented as an EIP-1559 baseFeePerGas"
  note: >-
    FOUR meters run at once, and only one of them is gas.

    (1) EVM gas, as usual, capped per transaction at TX_MAX_GAS_LIMIT =
    35,000,000 and per block at 60,000,000.

    (2) Substrate `ref_time`. The conversion is a compile-time constant, not an
    on-chain parameter: WEIGHT_PER_GAS = WEIGHT_REF_TIME_PER_SECOND /
    GAS_PER_SECOND = 1e12 / 40e6 = 25,000 picoseconds of ref_time per gas, and
    `FixedGasWeightMapping::weight_to_gas` is literally `ref_time / 25_000`. The
    block gas limit is derived from it (0.75 * 2e12 / 25_000 = 60,000,000, which
    matches the observed header exactly). Every precompile that dispatches a
    Substrate call charges the pallet's BENCHMARKED weight back to the EVM
    through this ratio, so its gas cost is a wall-clock measurement divided by a
    constant. P256VERIFY at 70,946 gas is the same mechanism applied to a
    non-dispatching precompile.

    (3) PoV proof size, at gas/8 (GasLimitPovSizeRatio). Charged separately by
    `record_external_operation` for account reads, code reads and writes, on top
    of the gas those operations already cost.

    (4) Storage growth, at gas/366 (GasLimitStorageGrowthRatio = block gas limit
    / 160KB, MBIP-5).

    Meters 3 and 4 fail as `ExitError::OutOfGas`. That is the fee-model hazard:
    a transaction can abort "out of gas" with EVM gas remaining, because it ran
    out of proof size or of storage-growth budget instead, and nothing in the
    receipt distinguishes the three cases. Two contracts with identical EVM gas
    profiles can differ by an order of magnitude in what `eth_estimateGas`
    returns, because estimation must satisfy the binding meter, not the gas one.
  extra_components:
  - {name: "base fee", note: "split by `FeesTreasuryProportion` (an on-chain governance parameter) between the Treasury and burning.",
     src: "runtime/common/src/deal_with_fees.rs:DealWithEthereumBaseFees"}
  - {name: "priority fee", note: "paid in full to the block author (the collator), resolved via pallet-author-inherent.",

system_contracts:
  note: >-
    Both entries below are REAL EVM BYTECODE at fixed addresses, confirmed by
    eth_getCode returning nonzero. They are system_contracts, NOT precompiles — the
    distinction SCHEMA.md says gets conflated constantly, and one that third-party
    write-ups about this chain get wrong routinely. Hyperliquid own docs get it right,
    calling CoreWriter "a system contract". What makes both remarkable is that neither
    does anything to EVM state: each is a gas burn plus a LOG, and the actual effect is
    produced off-EVM by HyperCore reading that log.
  "0x3333333333333333333333333333333333333333":
    name: CoreWriter
    status: added
    severity: high
    note: >-
      544 bytes of bytecode. Disassembly of the deployed code shows the WHOLE contract:
      one selector 0x17938e13, an empty 400-iteration loop (PUSH2 0x0190, pure gas
      burn), then LOG2 of one event, then return. The selector is keccak
      "sendRawAction(bytes)" and the log topic 0x8c7f585f..12e3 is keccak
      "RawAction(address,bytes)" — both recomputed locally and matched exactly against
      the constants embedded in the bytecode and against live logs on chain. Measured
      cost agrees with the disassembly: eth_estimateGas gives 47042 against a 21000
      baseline, and 400 loop iterations plus a two-topic log is about that.
      severity: high. THERE IS NO SUCCESS SIGNAL. sendRawAction has no return value and
      cannot revert on a rejected action, because the EVM side only emits a log —
      HyperCore interprets it afterwards, asynchronously, outside the EVM. A contract
      that places an order, cancels one, or moves funds through CoreWriter receives a
      successful call whether HyperCore accepts or rejects the action. Every EVM-level
      guarantee stops at the log boundary, and no amount of checking the return value
      helps because there is none.
    src_live: "eth_getCode 0x3333...3333 @ 43436288 -> 544 bytes, dispatch on 0x17938e13, PUSH2 0x0190 loop, LOG2 topic0 0x8c7f585fb295f7eb1e6aeb8fba61b23a4fe60beda405f0045073b185c74412e3; eth_getLogs -> 27 RawAction logs in 400 blocks to head, payloads beginning 0x0100000d; eth_estimateGas -> 47042 vs 21000 baseline"
    src_doc: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/hyperevm/interacting-with-hypercore
  "0x2222222222222222222222222222222222222222":
    name: native HYPE bridge to HyperCore
    status: added
    severity: high
    note: >-
      122 bytes. The disassembly is even smaller than CoreWriter: it REVERTS if
      calldatasize is nonzero, so it accepts only plain value transfers, and on an empty
      call it emits LOG2 with topic 0x88a5966d..5874 carrying msg.value as data and
      msg.sender as an indexed topic. That topic is keccak "Received(address,uint256)",
      recomputed locally and matched against live logs. Same shape as CoreWriter and the
      same hazard: sending native HYPE here moves it to HyperCore by log interpretation,
      with no EVM-level confirmation that the credit occurred, and it is a one-way door
      for anything sent by mistake. Its account also reports a nonce of 1015323, which
      no ordinary contract would accumulate — see system_transactions.
    src_live: "eth_getCode 0x2222...2222 @ 43436288 -> 122 bytes, CALLDATASIZE guard then LOG2 topic0 0x88a5966d370b9919b20f3e2c13ff65706f196a4e32cc2c12bf57088f88525874; eth_getLogs -> 4 Received logs in 800 blocks to head, e.g. block 43436417 value 0x2be0a6e276cc2c00"
  "0x5555555555555555555555555555555555555555":
    name: unrecorded (2041 bytes of code present)
    status: unrecorded
    note: >-
      Code exists at this vanity address, but it could NOT be established from the RPC
      whether it is a protocol-installed predeploy or an ordinary contract someone
      deployed to a mined vanity address. That distinction is the whole point of the
      system_contracts category, so it is left unrecorded rather than guessed.
    src_live: "eth_getCode 0x5555...5555 @ 43436288 -> 2041 bytes (provenance not determinable via RPC)"
  "0x4200000000000000000000000000000000000015":
    name: OP Stack L1Block (control probe)
    status: removed
    note: "checked as a negative control — no OP Stack predeploys here, as expected for a non-OP chain"
    src_live: "eth_getCode 0x4200...0015 @ 43436288 -> 0x (empty)"

system_transactions:
  note: >-
    Strongly suspected and NOT established. The bridge contract at 0x2222 reports
    eth_getTransactionCount of 1015323, a value no ordinary contract accumulates, since
    a contract nonce only increments on CREATE. The natural reading is that HyperCore
    credits HYPE into the EVM by originating protocol transactions from that address,
    which would make them system_transactions in this schema sense. But no such
    transaction was found in the sampled blocks, no receipt carries a distinguishing
    field, and debug_ tracing is not exposed on the public endpoint. The Core-to-EVM
    direction is therefore unrecorded; only the EVM-to-Core direction (the two log
    emitters above) was observed directly.
  status: unrecorded
  src_live: "eth_getTransactionCount 0x2222...2222 @ 43436288 -> 0xf7c1b (1015323); no matching transaction found in 60 sampled blocks; debug_traceBlockByNumber -> Method not found"

opcodes:
  added: []
  removed: []
  modified:
    - {op: "0x44", name: PREVRANDAO, note: "always pushes 0 — see eips.4399, severity high"}
    - {op: "0x41", name: COINBASE, note: "always pushes the zero address; there is no block proposer to pay"}
  note: >-
    NO CUSTOM OPCODES. Twenty-four unallocated mainnet opcodes were probed by executing
    them as init code — 0x0c, 0x0d, 0x0e, 0x0f, 0x1e, 0x1f, 0x21, 0x4b, 0x4c, 0x4d,
    0x4e, 0x4f, 0xa5, 0xa6, 0xb0, 0xb1, 0xc0, 0xd0, 0xe0, 0xee, 0xf6, 0xf7, 0xf8, 0xfc
    — and every one returned OpcodeNotFound. The jump table is stock. This is a real
    finding, not an empty section: HyperEVM reaches an entire order book from inside
    the EVM and did it without touching the instruction set, which is the opposite of
    Tron, whose sixteen custom opcodes at 0xd0-0xdf make staking and voting single
    instructions. Same problem, two opposite answers.
  src_live: "eth_call init code <opcode> 60005260206000f3 @ 43436288 -> OpcodeNotFound for all 24 unallocated opcodes probed; PUSH0/MCOPY/TLOAD/TSTORE/BLOBHASH/BLOBBASEFEE/CHAINID/NUMBER/TIMESTAMP/GASLIMIT/BASEFEE/SELFBALANCE all execute"

fee_model:
  metering: gas
  fee_market: EIP-1559 with a hard base-fee floor and burned priority fees
  extra_components: none
  note: >-
    Gas, and nothing exotic in the metering — but three divergences in the market.
    (1) Priority fees are BURNED rather than paid to a proposer; the docs attribute
    this to HyperBFT, and it matches the zero-address miner in every header and
    eth_maxPriorityFeePerGas returning 0. (2) The base fee has a hard floor at
    100,000,000 wei that stock EIP-1559 does not have — observed unmoved across 13
    consecutive blocks running far under target. (3) The 1559 controller spans two
    block kinds with a 10x gas-limit difference, so "the" target is not a single
    number. There is NO L1 data-fee component: receipts carry only the standard fields
    (no l1Fee, no operator fee), which distinguishes this cleanly from every OP Stack
    row in the dataset. Observed gas costs above a 21000 baseline: HyperCore read
    precompiles 2392 (0x0809, no args) to 3579 (0x0806, one word), CoreWriter 26042.
  src_live: "eth_getBlockReceipts 43436390 @ 43436288 -> receipt keys are the standard set with no l1Fee or DA field; eth_estimateGas -> 21000 EOA, 21000 absent address 0x0815, 23392 precompile 0x0809, 24579 precompile 0x0806, 47042 CoreWriter"
  src_doc: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/hyperevm

header_fields:
  added: []
  removed:
    - {field: requestsHash, note: "EIP-7685 field entirely absent from the JSON, at every height sampled from block 1 to head — the cleanest evidence the chain is pre-Prague"}
  modified:
    - name: stateRoot
      severity: high
      note: >-
        ALWAYS THE ZERO HASH. Not merely at the pinned height — zero in all 120 blocks
        scanned AND at blocks 1, 100, 1,000,000, 10,000,000, 20,000,000, 30,000,000 and
        40,000,000. HyperEVM headers commit to no state root at all. Corroborating and
        independent: eth_getProof is not a supported method on the endpoint, which is
        exactly what one would expect when there is no state trie to prove against.
        The consequence is that the header cannot be used to verify any state claim —
        no light clients, no Merkle state proofs, no trust-minimised bridge that reads
        HyperEVM state from a header. severity: high because the field is PRESENT and
        well-formed in the JSON; anything that reads it gets a valid-looking 32-byte
        value that means nothing, with no error anywhere.
    - name: timestamp
      severity: high
      note: >-
        NOT STRICTLY INCREASING. A large block carries the SAME timestamp as the small
        block immediately before it: blocks 43436389 and 43436390 both report
        1786980420. Two of 119 transitions in the scanned window were non-increasing,
        matching exactly the two large blocks it contained. Mainnet requires
        timestamp[n] > timestamp[n-1]; here consecutive distinct blocks tie. Anything
        that assumes strict monotonicity — an indexer ordering by timestamp, a contract
        computing an elapsed-time delta and dividing, a TWAP — sees a zero interval.
        The docs describe the block numbers as "a unique increasing sequence" and say
        nothing whatsoever about timestamps.
    - name: gasLimit
      note: "alternates 3,000,000 (small) and 30,000,000 (large) within one chain; was 2,000,000 for small blocks earlier in the chain history"
    - name: mixHash
      note: "always the zero hash — no randomness beacon; see opcodes PREVRANDAO"
    - name: parentBeaconBlockRoot
      note: "field retained, always the zero hash — no beacon chain"
    - name: miner
      note: "always the zero address — priority fees are burned, there is no proposer to credit"
    - name: extraData
      note: "always empty (0x) in every block scanned"
    - name: blobGasUsed / excessBlobGas
      note: "fields retained, both pinned to 0x0 in every block scanned — no blobs"
    - name: withdrawalsRoot
      note: "field retained, always the empty-trie root with an empty withdrawals list"
  src_live: "eth_getBlockByNumber 43436288-43436407 @ 43436288 -> stateRoot 0x00..00 120/120, requestsHash absent 120/120, mixHash 0x00..00 120/120, parentBeaconBlockRoot 0x00..00 120/120, miner 0x00..00 120/120, extraData 0x 120/120, blobGasUsed 0x0 120/120, withdrawalsRoot 0x56e81f17..b421 120/120, non-increasing timestamps 2/119; eth_getProof -> Method not found"

gotchas:
  - >-
    stateRoot is the zero hash in every block, at every height sampled across the whole
    chain history. HyperEVM headers commit to no state. eth_getProof is not served
    either. There is no way to prove a HyperEVM state fact against a block header, so
    light clients and trust-minimised state bridges are structurally impossible — and
    the field is still present and well-formed, so tooling reads a plausible 32-byte
    value and never errors.
  - >-
    0x0100 IS EMPTY. This is the first row in the dataset with no P256VERIFY at 0x0100,
    directly falsifying "0x0100 is the one universal address" as a universal. Worse, it
    fails silently: EIP-7951 signals an invalid signature by returning empty output,
    which is precisely what an absent precompile returns. Every P256 verification on
    this chain reports "invalid signature" forever, with no revert and no error. Any
    passkey or WebAuthn wallet ported here is broken and looks like it is merely
    rejecting bad signatures.
  - >-
    Two consecutive blocks can share a timestamp. Every large block carries the same
    timestamp as the small block before it — two of 119 transitions in the scanned
    window. Any elapsed-time computation across that boundary yields zero, and anything
    dividing by it reverts. The dual-block docs promise increasing block NUMBERS and
    say nothing about timestamps.
  - >-
    CoreWriter cannot tell you it failed. The entire contract is a gas burn plus one
    log; HyperCore interprets that log asynchronously outside the EVM. sendRawAction
    has no return value and does not revert on a rejected action, so a contract that
    places an order or moves funds gets a successful call regardless of the outcome.
    The same is true of the native bridge at 0x2222, which is a receive-and-log
    contract. Every EVM-level guarantee stops at the log boundary.
  - >-
    0x0a is a tombstone made by a build flag. KZG point evaluation is present in the
    precompile dispatch but always returns "c-kzg feature is not enabled", even for a
    well-formed 192-byte input, while mainnet returns a semantic error for the same
    bytes. It fails rather than returning empty, which is what separates a tombstone
    from an absent address — and unlike BSC's and Avalanche's deliberate tombstones,
    this one looks like a compile-time omission.
  - >-
    The public RPC silently ignores the block parameter on every state-reading method.
    eth_call, eth_getCode, eth_getBalance and eth_getTransactionCount all return LATEST
    state at any requested height, with no error: CoreWriter returns its full 544 bytes
    "at block 1", months before it existed. Only eth_getBlockByNumber honours the
    parameter. Any historical simulation, fork-testing setup or archive replay pointed
    at this endpoint is quietly reading the present. This also bounds what THIS row can
    claim — see live_probe.caveat.
  - >-
    No custom opcodes and no custom transaction type. HyperEVM reaches an entire order
    book from inside the EVM using nothing but 21 read precompiles and two log-emitting
    system contracts. Compare Tron, which needed 16 opcodes at 0xd0-0xdf for less, and
    Arbitrum, Base, OP and Polygon, which each burned a type byte. The interesting
    divergence here is not in the instruction set at all — it is in the block schedule,
    the header, and the asynchronous boundary between the EVM and HyperCore.
  - >-
    PREVRANDAO is present and always zero, as is COINBASE. Tron removed PREVRANDAO
    outright, which at least fails loudly; here it executes and returns a constant that
    any attacker knows in advance.

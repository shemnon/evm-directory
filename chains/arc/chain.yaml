schema_version: 2

chain:
  name: Arc
  slug: arc
  chain_id: 5042
  role: fork
  live: true
  evidence: source
  chain_id_src: crates/shared/src/chain_ids.rs:MAINNET_CHAIN_ID
  note: >-
    MAINNET HAS BEEN RUNNING SINCE MAY 2026. Genesis is dated 2026-05-12 and block 1
    2026-05-15, and the chain was at block 29,537,893 on 2026-11-04. Circle described a
    private mainnet in August and announced the public launch for 2026-09-16. Every
    `src_live:` below is mainnet unless it names the testnet (5042002).

    THIS ROW CALLED ITSELF PRELAUNCH UNTIL 2026-11-04, AND THAT WAS WRONG FOR SIX MONTHS.
    It watched `https://rpc.arc.network`, a hostname that never resolved, while Arc's docs
    moved to docs.arc.io and published `rpc.mainnet.arc.io`. A dead hostname was read as
    a chain that did not exist. Replaying the row against mainnet then corrected four
    other claims: Zero7 and Zero8 activated on the running chain rather than at genesis,
    plain value transfers do emit EIP-7708 logs, mainnet's precompile marker is `0xef` and
    not `0x01`, and two code sizes had been string lengths.

    Arc keeps a native coin, which is what makes it the interesting contrast to
    the tempo row: USDC IS the native coin, minted and burned through a
    precompile, with `msg.value`, BALANCE and SELFDESTRUCT all working normally.
    The divergence is not that they stopped working — it is that the SAME
    balance now has two on-chain representations in two different units.

lineage:
  upstream: ethereum
  ancestry: [ethereum]
  fork_of: reth
  note: >-
    An SDK consumer, not a source fork: `Cargo.toml` pins every `reth-*` crate to
    `https://github.com/paradigmxyz/reth` TAG `v1.11.3` and builds an
    `ArcEvmFactory` / `ArcPrecompileProvider` / `ArcEvmHandler` on top. Deltas are
    overrides — a replaced SELFDESTRUCT instruction, an inserted precompile map, a
    pre-execution hook — rather than patches. Consensus is Malachite (Tendermint
    BFT, Ed25519 validator keys), vendored as a git submodule and maintained by
    Circle. Apache-2.0.
  sync_point: >-
    arc-node v0.8.1 moved the SDK pin from reth v1.11.3 to RETH v2.2.0, crossing the
    same major-version boundary the plasma row faces. It is still a released tag, not
    a floating rev — a stronger pin than
    tempo's. The Ethereum fork ladder is declared explicitly in `BASE_FORKS`
    (Frontier..Prague, all at block/timestamp 0) with Osaka inserted per network
    and PAIRED with the Arc Zero5 fork.

client:
  name: arc-node (reth execution + Malachite consensus)
  repo: https://github.com/circlefin/arc-node
  version: v0.8.2
  commit: 0f0be9fad975a2fe16546323b060d7b070617936
  language: rust
  built_on: reth v2.2.0 / revm
  note: >-
    One repo, both halves: `crates/evm`, `crates/precompiles`,
    `crates/execution-*` are the EL; `crates/malachite-app`, `crates/quake`,
    `crates/types` are the CL. A `contracts/` Foundry tree ships the Solidity
    system contracts. Mainnet and testnet RPCs both report only `arc/v1`, so the
    running version CANNOT be matched to this tag — unlike tempo, where it could.
    v0.8.2 is the newest release. Its fork tables and reth v2.2.0 SDK pin are unchanged from v0.8.1.
    The repo README calls this "alpha software currently undergoing audits".

live_probe:
  endpoint: https://rpc.mainnet.arc.io
  chain_id: 5042
  observed_at_block: 29537893      # 0x1c2b665, `finalized` at probe time
  observed_at: 2026-11-04
  chain_id_src_live: "eth_chainId @ 29537893 -> 0x13b2 (5042); web3_clientVersion -> arc/v1 (no version detail)"
  block_scan_range: 29537844-29537893
  src_doc: https://docs.arc.io/arc/references/connect-to-arc
  caveat: >-
    The testnet (5042002, https://rpc.testnet.arc.io) is cited only where a fact needs a
    comparison, and each such `src_live:` says so. The older testnet hostname
    rpc.testnet.arc.network still answered on 2026-11-04. Blocks arrive about twice a
    second, so a block number here is a moment, not a period.

consensus:
  engine: Malachite (Tendermint BFT, Rust), Ed25519 validator keys
  finality: single-slot deterministic (BFT), sub-second
  note: >-
    Permissioned validator set governed by a PermissionedValidatorManager
    contract. No beacon chain — but the header still carries
    `parentBeaconBlockRoot`, and on the observed block it is set to the
    PARENT HASH rather than to zero, so the field is repurposed rather than
    nulled. The EIP-4788 ring-buffer contract holds no code, so nothing consumes
    it.
  src: crates/types/src/signing.rs:Ed25519
  src_live: "eth_getBlockByNumber(0x1c2b665) @ 29537893 -> parentBeaconBlockRoot 0x2853d1b30d893fe9243884ae6fa8750106b92bf0a2d8076369f113388cd37bdb == parentHash; eth_getCode(0x000F3df6…Beac02) -> 0x"

baseline_fork: osaka
baseline_note: >-
  Derived from the schedule, and it contradicts the client's own comments. The
  `ArcHardfork` enum annotates Zero3/Zero4/Zero5 as "align to Ethereum Prague",
  but `ARC_MAINNET_HARDFORKS` inserts `EthereumHardfork::Osaka` at
  `Timestamp(0)`, paired with Zero5. `BASE_FORKS` stops at Prague and each
  network's table adds Osaka on top. So mainnet is Osaka from genesis and the
  testnet reached Osaka at 1779890400. Confirmed on mainnet: P256VERIFY answers at
  0x0100 with EIP-7951 empty-on-invalid semantics, which only exists at Osaka.
  src: crates/execution-config/src/hardforks.rs:ARC_MAINNET_HARDFORKS

forks:
  src: crates/execution-config/src/hardforks.rs:ArcHardfork
  activation_src: crates/execution-config/src/hardforks.rs:ARC_ZERO7_HARDFORK_TIMESTAMP_ACTIVATION_MAINNET
  note: >-
    TWO SCHEDULES THAT REACHED THE SAME PLACE. Mainnet (5042) has Zero3, Zero4, Osaka,
    Zero5 and Zero6 at genesis, then took Zero7 and Zero8 together at 1789052400
    (2026-09-10 15:00 UTC), on a chain already past block 20 million. Testnet (5042002)
    took each fork separately, reaching Zero7 in June and Zero8 on 2026-09-03. Both
    networks now run the same fork set, so testnet is earlier rather than different.

    The activation mechanism is also mixed: Zero3/Zero4 by BLOCK, Zero5/Zero6 by
    block on mainnet but by TIMESTAMP on testnet, Zero7+ by timestamp
    everywhere. The client documents why — a block-based fork declared after a
    timestamp fork breaks `ForkFilter`'s BTreeMap ordering and corrupts the
    EIP-2124 fork id — and `is_arc_fork_active` therefore has to OR the two
    checks, because a bare block check silently returns false for a
    timestamp-activated fork.
  timeline:
  - {name: Zero3, activation_block: 0, mainnet_equivalent: prague,
     note: "mainnet: genesis. testnet: block 11172019.",
     src: "crates/execution-config/src/hardforks.rs:ARC_ZERO3_HARDFORK_BLOCK_ACTIVATION_TESTNET"}
  - {name: Zero4, activation_block: 0, mainnet_equivalent: prague,
     note: "mainnet: genesis. testnet: block 26148086.",
     src: "crates/execution-config/src/hardforks.rs:ARC_ZERO4_HARDFORK_BLOCK_ACTIVATION_TESTNET"}
  - {name: Osaka, activation_time: 0, mainnet_equivalent: osaka,
     note: "mainnet: Timestamp(0). testnet: 1779890400. Paired with Zero5 by convention.",
     src: "crates/execution-config/src/hardforks.rs:ARC_OSAKA_HARDFORK_TIMESTAMP_ACTIVATION_TESTNET"}
  - {name: Zero5, activation_block: 0, mainnet_equivalent: osaka,
     note: "extraData becomes exactly 8 bytes of consensus data; EIP-7708 transfer logs replace the custom NativeCoinTransferred log; beneficiary blocklist check. testnet: timestamp 1779894517.",
     src: "crates/execution-validation/src/consensus.rs:arc_validate_extra_data_format"}
  - {name: Zero6, activation_block: 0, mainnet_equivalent: osaka,
     note: "PQ precompile (SLH-DSA) registered; stricter ABI-decode validation on precompile calldata. testnet: timestamp 1779894517.",
     src: "crates/precompiles/src/precompile_provider.rs:ArcHardforkFlags"}
  - name: Zero7
    activation_time: 1789052400
    mainnet_equivalent: osaka
    note: >-
      ACTIVATED ON A RUNNING MAINNET AT BLOCK 20156410, the first block at or after
      2026-09-10 15:00:00 UTC. This entry previously said it would apply from the first
      mainnet block; it could not, because blocks had been produced since May. Testnet:
      1781791200 (2026-06-18 14:00 UTC), first block 47591460. Adds the CallFrom subcall
      precompile (callable only by the Memo and Multicall3From contracts) and a
      SELFDESTRUCT variant. Memo and Multicall3From were deployed earlier, at blocks
      3087061 and 3087090, so their code does not mark the activation.
    src: "crates/evm/src/evm.rs:build_subcall_registry, crates/execution-config/src/hardforks.rs:ARC_ZERO7_HARDFORK_TIMESTAMP_ACTIVATION_MAINNET"
    src_live: "eth_call(0x1800…0003, empty calldata) @ 20156409 -> revert OpcodeNotFound; @ 20156410 -> revert 'unauthorized caller'. eth_getBlockByNumber -> timestamps 1789052399 and 1789052400"
  - name: Zero8
    activation_time: 1789052400
    mainnet_equivalent: osaka
    note: >-
      ACTIVATED WITH ZERO7 AT BLOCK 20156410, from the same mainnet constant. Testnet:
      1788447600 (2026-09-03 15:00 UTC), first block 60260874. It adds a FOURTH SELFDESTRUCT
      handler (`arc_network_selfdestruct_zero8`, with transaction-warm target checks),
      rejects the legacy gas credit earlier forks allowed, and makes delegatecall
      rejections charge the uniform early-revert gas penalty. The live test uses the
      handler: a target warmed earlier in the transaction no longer pays the cold-access
      cost, so a SELFDESTRUCT given 5,100 gas fails before the fork and succeeds after it.
      Testnet, where Zero8 arrived alone, shows the same flip at its own boundary.
    src: "crates/execution-config/src/hardforks.rs:ARC_ZERO8_HARDFORK_TIMESTAMP_ACTIVATION_MAINNET, crates/evm/src/opcode.rs:arc_network_selfdestruct_zero8"
    src_live: "eth_call with state override, wrapper warms the target with BALANCE then CALLs a child with 5100 gas whose code is PUSH20 target SELFDESTRUCT: child success 0 @ 20156409, 1 @ 20156410, 1 @ 29537893; testnet 0 @ 60260873, 1 @ 60260874. Controls at all those heights: unwarmed target with 5100 gas -> 0; warmed target with 8000 gas -> 1"

eips:
  1559:
    status: modified
    note: >-
      Rewritten in three ways at once. (a) The controller input is an
      EMA-SMOOTHED gas-used figure, `(1-α)·G[t-1] + α·G[t]`, not the parent's raw
      gas used — so the base fee responds to a trend rather than to one block.
      (b) `max_change_denominator` and `elasticity_multiplier` are replaced by
      fixed-point `k_rate` and `inverse_elasticity_multiplier` against a scale of
      10,000, letting the gas target be an arbitrary fraction of the gas limit
      rather than exactly half. (c) The result is bounded by `FeeParams` READ FROM
      A CONTRACT (see system_contracts 0x3600…0001) and by a per-network ceiling
      of 20,000 gwei. The mainnet and testnet BaseFeeConfigs are identical at this
      tag.
    src: crates/execution-config/src/gas_fee.rs:determine_ema_parent_gas_used, crates/execution-config/src/gas_fee.rs:arc_calc_next_block_base_fee, crates/execution-config/src/chainspec.rs:BASE_FEE_CONFIG_MAINNET
    src_live: "eth_feeHistory 4 blocks from 0x1c2b665 @ 29537893 -> baseFeePerGas flat at 0x4a817c800 (20 gwei) across all five entries, gasUsedRatio 0.034, 0.009, 0.008, 0.023"
  7708:
    status: added
    note: >-
      NOT ON MAINNET ETHEREUM, AND NOT PARTIAL AS THIS ROW USED TO SAY. Native-coin
      movements emit an ERC-20 `Transfer` log from the EIP-7708 system address 0xffff…fffe.
      Adopted here because the native coin is a stablecoin and Circle wants native
      movement to be indexable the way a token transfer is. The log comes from the
      SELFDESTRUCT handler, the NativeCoinAuthority paths and `before_frame_init`, which
      covers value-bearing calls, so a plain transfer to an EOA emits it too. Self-transfers
      do not. The client disables revm's own Amsterdam emission to avoid duplicates. An
      earlier version of this row said an ordinary CALL did not emit it, from source
      alone and with no such call in the scanned range.
    src: crates/evm/src/log.rs:create_eip7708_transfer_log, crates/evm/src/opcode.rs:create_eip7708_transfer_log, crates/evm/src/evm.rs:before_frame_init, crates/evm/src/evm.rs:amsterdam_eip7708_disabled
    src_live: "eth_getTransactionReceipt(0x305693964cee8983…) @ 29537853 -> plain value transfer to an EOA, empty calldata, log[0] from 0xfffffffffffffffffffffffffffffffffffffffe, Transfer topic 0xddf252ad…, data 10328883301503 == tx value"
  4844:
    status: removed
    note: >-
      Removed by CONFIGURATION, not by encoding. `ArcPoolBuilder` calls
      `.no_eip4844()` on the validator, so blob transactions are rejected by the
      mempool; the reth envelope still knows the type. That is a weaker removal
      than tempo's, where the envelope has no 0x03 variant at all — a blob
      transaction delivered by other means is a consensus question this row does
      not answer. Header keeps `blobGasUsed`/`excessBlobGas` (zero) and
      `eth_feeHistory` still reports `baseFeePerBlobGas`.
    src: crates/execution-txpool/src/pool.rs:no_eip4844
    src_live: "eth_getBlockByNumber(0x1c2b665) @ 29537893 -> blobGasUsed 0x0, excessBlobGas 0x0; eth_feeHistory -> baseFeePerBlobGas [0x1 x5]"
  4788:
    status: modified
    note: >-
      The field is present and is NOT zero — the observed block sets
      `parentBeaconBlockRoot` to the parent block hash. The ring-buffer contract
      at 0x000F3df6…Beac02 holds no code, so the system call is a no-op and
      nothing can read the value back on chain. A contract expecting a beacon
      root gets empty output; a client validating the field against a beacon
      chain would reject every block.
    src_live: "eth_getBlockByNumber(0x1c2b665) @ 29537893 -> parentBeaconBlockRoot == parentHash == 0x2853d1b3…37bdb; eth_getCode(0x000F3df6D732807Ef1319fB7B8bB8522d0Beac02) -> 0x"
  2935:
    status: inherited
    note: "history-storage contract deployed with the standard runtime"
    src_live: "eth_getCode(0x0000F90827F1C53a10cb7A02335B175320002935) @ 29537893 -> 0x3373fffffffffffffffffffffffffffffffffffffffe14604657602036036042575f… (83 bytes, identical to testnet)"
  4895:
    status: removed
    note: "withdrawals list is empty with the empty-trie root; no beacon chain to withdraw from. Not probed for active rejection, unlike tempo."
    src_live: "eth_getBlockByNumber(0x1c2b665) @ 29537893 -> withdrawals [], withdrawalsRoot 0x56e81f17…363b421"
  7002:
    status: removed
    src_live: "eth_getCode(0x00000961Ef480Eb55e80D19ad83579A64c007002) @ 29537893 -> 0x; requestsHash 0xe3b0c442…7852b855"
  7251:
    status: removed
    src_live: "eth_getCode(0x0000BBdDc7CE488642fb579F8B00f3a590007251) @ 29537893 -> 0x"
  7951:
    status: inherited
    note: "P256VERIFY at 0x0100, registered only when Osaka is active — the client asserts both directions in `test_p256_precompile_not_available_with_prague`."
    src: crates/precompiles/src/precompile_provider.rs:P256_PRECOMPILE_ADDRESS
    src_live: "eth_call(0x…0100, 160 zero bytes) @ 29537893 -> 0x (empty, EIP-7951 invalid-signature semantics); eth_getCode -> 0x"
  6780:
    status: modified
    note: >-
      SELFDESTRUCT is replaced by an Arc instruction with three behaviours
      layered on the Cancun semantics: both the executing address and the
      beneficiary are checked against the native-coin blocklist and the
      instruction fails with "Blocked address" if either is listed; a non-zero
      balance emits a transfer log; and self-targeted selfdestruct with a
      non-zero balance is rejected outright (`ERR_SELFDESTRUCTED_BALANCE_INCREASED`).
      Dispatch is Zero8, else Zero7, else base; see opcodes.modified.
    src: crates/evm/src/opcode.rs:arc_network_selfdestruct_impl
  7702:
    status: inherited
    note: "delegation designators are resolved normally, including through the CallFrom precompile. No Arc-specific delegation mechanism."
    src: crates/evm/src/evm.rs:eip7702_address
  7623:
    status: unrecorded
    note: "not traced."

non_eip_specs:
  adopted:
  - {id: ADR-0004, name: "base fee in extraData", note: "the client's own ADR; header extraData is exactly 8 bytes holding the next block's base fee", src: "crates/execution-validation/src/consensus.rs:arc_validate_extra_data_format"}
  note: >-
    Arc has no numbered public spec series comparable to Tempo's TIPs. Design
    decisions live in `docs/adr/` inside the client repo and are referenced from
    the code by number.

tx_types:
  envelope:
    status: inherited
    present: "0x00, 0x02, 0x04"
    src: derived from the eips map (2930 / 1559 / 4844 / 7702); see those entries
    note: >-
      The EIP-2718 envelope this chain accepts in mainnet shape; no blob transactions
      (EIP-4844), no EIP-2930 access-list transactions. Derived from the eips map
      (2930/1559/4844/7702); per-type divergences and their evidence are on the rows below.
  "0x00": {name: Legacy, status: inherited, note: "29% of transactions in the scanned range", src_live: "blocks 29537844-29537893 @ 29537893 -> 61 of 209"}
  "0x01": {name: EIP-2930, status: unrecorded, note: "not observed in the scanned range; nothing in the client excludes it"}
  "0x02": {name: EIP-1559, status: inherited, src_live: "blocks 29537844-29537893 @ 29537893 -> 148 of 209"}
  "0x03": {name: EIP-4844 blob, status: removed, note: "rejected by the txpool validator, not by the envelope — see eips.4844", src: "crates/execution-txpool/src/pool.rs:no_eip4844"}
  "0x04": {name: EIP-7702 set-code, status: inherited, note: "supported; rare, one in about 1,550 transactions over the 430 blocks before the pin", src: "crates/evm/src/evm.rs:eip7702_address", src_live: "eth_getBlockByNumber @ 29537695 -> tx 0x35d428fa642dd7b6… type 0x4"}
  note: >-
    NO ARC-SPECIFIC TRANSACTION TYPE EXISTS. This is a real finding for a chain
    whose pitch is stablecoin payments: no fee-payer type, no sponsored type, no
    batch type at the envelope. Batching and sender-spoofing are done with
    ordinary transactions to the Multicall3From contract, which then calls the
    CallFrom precompile — application-layer, not protocol-layer.

tx_authorization:
  key_binding: derived
  signers_per_tx: 1
  note: >-
    MAINNET-EQUIVALENT AND THAT IS THE ANSWER. secp256k1, `ecrecover(sig) == from`,
    one signer. There is no fee-payer signature, no alternative curve at the
    protocol level, no account-key registry — the contrast with the tempo row,
    written from the same brief, is total.

    Two things that look like exceptions and are not:

    (1) THE CallFrom PRECOMPILE SPOOFS `msg.sender`, NOT THE TRANSACTION SIGNER.
    `callFrom(address sender, address target, bytes data)` at 0x1800…0003 executes
    a subcall with an arbitrary `sender`. It is not a transaction-authorization
    mechanism: the transaction is still signed by one secp256k1 key, and the
    precompile is callable ONLY by two CREATE2-fixed contract addresses baked into
    the client (`AllowedCallers::Only({MEMO_ADDRESS, MULTICALL3_FROM_ADDRESS})`) —
    an allow-list in consensus code, not on chain. It nevertheless means `msg.sender`
    inside a called contract is not proof of a signature by that address, which is
    an assumption a great deal of Solidity rests on. Live on mainnet since Zero7, block
    20156410.

    (2) THE PQ PRECOMPILE VERIFIES SIGNATURES THAT CAN NEVER AUTHORIZE ANYTHING.
    `verifySlhDsaSha2128s` (FIPS 205 SLH-DSA-SHA2-128s) is the first post-quantum
    verifier in this dataset. It is `authorizes: never` — the ordinary state of a
    verifier precompile, and worth recording precisely because the tempo row shows
    the opposite pairing on the same axis.
  src: crates/precompiles/src/call_from.rs:CALL_FROM_ADDRESS, crates/evm/src/evm.rs:AllowedCallers, crates/pq-precompile/src/lib.rs:PQ_ADDRESS
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      src: crates/execution-txpool/src/pool.rs:TransactionValidationTaskExecutor
    p256:
      status: inherited
      authorizes: never
      precompile: "0x0100"
      note: "the standard pairing — verifiable by contracts, cannot move a coin"
      src: crates/precompiles/src/precompile_provider.rs:P256_PRECOMPILE_ADDRESS
    slh_dsa_sha2_128s:
      status: added
      authorizes: never
      precompile: "0x1800000000000000000000000000000000000004"
      note: >-
        Post-quantum hash-based signatures (FIPS 205), gated on Zero6. The
        precompile's own doc comment calls it experimental. Gas is priced against
        the hash count implied by the scheme rather than as a flat fee.
      src: crates/pq-precompile/src/lib.rs:verifySlhDsaSha2128s
    ed25519:
      status: added
      authorizes: never
      precompile: none
      note: "Malachite validator keys only; no EVM-visible verifier and no transaction path"
      src: crates/types/src/signing.rs:Ed25519

precompiles:
  base_map:
    status: inherited
    present: "0x01-0x11"
    p256verify: true
    src: crates/precompiles/src/precompile_provider.rs:ArcPrecompileProvider
    note: >-
      revm's Osaka precompile set unchanged for 0x01-0x11 plus P256VERIFY at 0x0100
      (RIP-7212 semantics, from before mainnet Osaka). Arc's own precompiles are all
      far above the mainnet range at 0x1800.. / 0x3600.. and are added on top.
  "0x1800000000000000000000000000000000000000":
    name: NativeCoinAuthority
    status: added
    note: >-
      Mints, burns and transfers the native coin, in 18-decimal units. Callable
      ONLY by the NativeFiatToken contract at 0x3600…0000 — the check is
      `caller != ALLOWED_CALLER_ADDRESS` in the precompile itself. So the native
      coin's supply is controlled by one Solidity contract, which is upgradeable
      behind a proxy. Emits EIP-7708 Transfer logs from the system address on
      every path.
    src: crates/precompiles/src/native_coin_authority.rs:NATIVE_COIN_AUTHORITY_ADDRESS
    src_live: "eth_call(totalSupply()) @ 29537893 -> 1183563569272467000000000000; eth_getCode -> 0xef"
  "0x1800000000000000000000000000000000000001":
    name: NativeCoinControl
    status: added
    note: >-
      The blocklist. `blocklist(address)` / `unBlocklist(address)` / `isBlocklisted(address)`,
      with storage in the precompile's own account. Its effects are not confined
      to the precompile — see system_transactions and gotchas: a blocklisted
      sender or (for value-bearing calls) recipient fails PRE-EXECUTION, and a
      block whose beneficiary is blocklisted is INVALID.
    src: crates/precompiles/src/native_coin_control.rs:NATIVE_COIN_CONTROL_ADDRESS
    src_live: "eth_call(isBlocklisted(0x0)) @ 29537893 -> false; eth_getCode -> 0xef"
  "0x1800000000000000000000000000000000000002":
    name: SystemAccounting
    status: added
    note: >-
      Per-block gas accounting written by a system call from 0xffff…fffe and
      readable by contracts via `getGasValues(uint64)`. It is how the EMA gas
      figure and the base fee are carried across blocks in state as well as in
      extraData.
    src: crates/precompiles/src/system_accounting.rs:SYSTEM_ACCOUNTING_ADDRESS
    src_live: "eth_call(getGasValues(29537892)) @ 29537893 -> (0x38a32, 0xbd206, 0x4a817c800) — the last word is the 20 gwei base fee; eth_getCode -> 0xef"
  "0x1800000000000000000000000000000000000003":
    name: CallFrom
    status: added
    activation_condition: "ArcHardfork::Zero7 — active on mainnet since block 20156410"
    note: >-
      A SUBCALL precompile, a category the dataset has not had: it is not
      registered in the precompile map at all but in a separate
      `SubcallRegistry`, because it must run a child EVM call and post-process
      the result. `callFrom(sender, target, data)` executes `target` with
      `msg.sender == sender`. Callers are restricted to two hardcoded CREATE2
      addresses.
    src: crates/precompiles/src/call_from.rs:CALL_FROM_ADDRESS, crates/evm/src/evm.rs:build_subcall_registry
    src_live: "eth_call(empty calldata) @ 29537893 -> revert 'unauthorized caller'; eth_getCode -> 0xef"
  "0x1800000000000000000000000000000000000004":
    name: PQ (SLH-DSA-SHA2-128s verifier)
    status: added
    activation_condition: "ArcHardfork::Zero6"
    note: "FIPS 205 post-quantum signature verification. Reverts with an ABI-encoded string on malformed input rather than returning empty."
    src: crates/pq-precompile/src/lib.rs:PQ_ADDRESS
    src_live: "eth_call(0x1800…0004, empty calldata) @ 29537893 -> revert 'Input too short'; eth_getCode -> 0xef"
  "0x000000000000000000000000000000000000000a":
    name: KZG point evaluation
    status: inherited
    note: "present and functioning although blob transactions are rejected by the pool — the same verifier-without-payload pattern as tempo."
    src_live: "eth_call(0x…0a, 192 zero bytes) @ 29537893 -> revert PrecompileError"
  note: >-
    ARC PRECOMPILES CARRY ONE BYTE OF CODE, AND THE BYTE DEPENDS ON THE NETWORK. On mainnet
    each address in the 0x1800…000{0..4} family returns `0xef` from `eth_getCode`, with
    `EXTCODESIZE == 1`; testnet returns `0x01`. The inherited Ethereum precompiles return
    `0x` on both. Mainnet's genesis file writes `0xef` with nonce 1 across all 256
    addresses from 0x1800…0000 to 0x1800…00ff, reserving far more than the five in use.
    It is the byte tempo writes, the EOF-reserved prefix that cannot be executed. Either
    way `eth_getCode` alone misclassifies these addresses in both directions, and the
    source map is the only reliable enumeration.
  src: crates/precompiles/src/precompile_provider.rs:create_precompiles_map, assets/mainnet/genesis.json
  src_live: "eth_getCode @ 29537893: 0x1800…0000/0001/0002/0003/0004 all -> 0xef; 0x…01 and 0x…0100 -> 0x. EXTCODESIZE(0x1800…0000) via eth_call state override -> 1. Testnet eth_getCode @ latest on 2026-11-04: the same five -> 0x01"


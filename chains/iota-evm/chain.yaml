system_transactions:
  - name: ISC balance mutation with no EVM transaction
    description: >-
      `eth_getBalance` does not read EVM state. `StateDB.GetBalance` forwards to the ISC
      `accounts` core contract via the sandbox, and `AddBalance`/`SubBalance` write
      there too. So any ISC request that credits or debits an Ethereum-address agent —
      an L1 deposit, a withdrawal, a governance payout, another contract's
      `transferToL1` — changes an EVM balance with no transaction, no receipt, no log
      and no trace. This is the same shape as Injective's batch auction, reached by a
      different route: here the ledger is simply not the EVM's.
    src: "packages/vm/core/evm/emulator/statedb.go:GetBalance, packages/vm/core/evm/evmimpl/internal.go:GetBaseTokensBalance"
    src_doc: https://docs.iota.org/developer/iota-evm/explanations/how-accounts-work
  - name: per-ISC-block EVM block minting
    description: >-
      `vmContext.extractBlock` calls `evmimpl.MintBlock` unconditionally at the end of
      every ISC block, so an EVM block is produced for ISC activity that contains no EVM
      transactions at all. EVM block number is identical to the ISC block index.
    src: "packages/vm/vmimpl/vmcontext.go:extractBlock, packages/evm/jsonrpc/evmchain.go:iscBlockIndexByEVMBlockNumber"
  - name: gas-fee payout to the chain admin
    description: >-
      Fees are neither burned nor paid to a block producer. `FeePolicy.FeeFromGasBurned`
      splits the fee between the validator fee target and the chain admin by
      `ValidatorFeeShare`, and the live value of that field is 0 — so 100% of all EVM
      gas fees on IOTA EVM accrue to a single ISC agent, the chain admin.
    src: "packages/vm/gas/feepolicy.go:FeeFromGasBurned"
    src_live: "GET /v1/chain @ 12793600 -> validatorFeeShare 0, chainAdmin 0x8779ca52589fd6f4ca1776b63b200a7b8f9fd71f2c4d386a987dfdb24569fc5e"

opcodes:
  added: []
  removed: []
  modified:
  - op: "0x40"
    name: BLOCKHASH
    severity: high
    note: >-
      BLOCKHASH IS BROKEN FOR EVERY BLOCK IT IS SUPPOSED TO ANSWER FOR, and it fails by
      panicking rather than by returning zero. Two distinct panics cover the whole
      256-block window. For `n == number-1` geth's `GetHashFn` short-circuits to
      `header.ParentHash` and then calls `StateDB.Witness()`, which wasp implements as
      `panic("should not be called")`. For every other in-window `n` the lookup reaches
      `chainContext.GetHeader`, which is `panic("not implemented")`. Only OUT-OF-window
      numbers behave — they return zero without touching either. Compounding it, the
      pending header used for execution never sets `ParentHash` at all, so even the
      short-circuit would have returned the zero hash rather than the real parent. In an
      `eth_call` this is a JSON-RPC error; in a transaction `applyMessage` catches the
      panic and turns it into a `status: 0` receipt whose revert reason is the Go panic
      string. Any contract using BLOCKHASH for randomness, checkpointing or L1
      attestation cannot run on this chain.
    src: "packages/vm/core/evm/emulator/statedb.go:Witness, packages/vm/core/evm/emulator/emulator.go:GetHeader, packages/vm/core/evm/emulator/blockchaindb.go:GetPendingHeader"
    src_live: "eth_call BLOCKHASH(number-1) @ 12793600 -> -32000 'should not be called'; BLOCKHASH(number-2) and BLOCKHASH(number-256) -> -32000 'not implemented'; BLOCKHASH(number-257) -> 0x00..00"
  - op: "0x3a"
    name: GASPRICE
    severity: high
    note: >-
      Always pushes 0. `applyMessage` sets `msg.GasPrice`, `msg.GasFeeCap` and
      `msg.GasTipCap` to zero before every execution because "gas fee is set by ISC",
      and the tx context is built from that zeroed message. Meanwhile the receipt
      reports the real `effectiveGasPrice` (10 gwei at the pinned block), so on-chain
      and off-chain observers of the same transaction disagree. Any contract that
      reimburses callers as `tx.gasprice * gasUsed`, meters relayer cost, or bounds a
      gas price computes zero — silently, with no revert.
    src: "packages/vm/core/evm/emulator/emulator.go:applyMessage"
    src_live: "eth_call GASPRICE @ 12793600 -> 0x00..00, while eth_gasPrice -> 0x2540be400 and the receipt for 0x0b0a51dd... reports effectiveGasPrice 0x2cb417800"
  - op: "0x41"
    name: COINBASE
    severity: high
    note: >-
      Always the zero address. Blocks are not produced by an identifiable proposer, the
      minted header leaves `Coinbase` unset, and `NewEVMBlockContext` is called with a
      nil author. Value paid to `block.coinbase` is credited to the ISC agent for
      address 0x0 and is unrecoverable; the real fee recipient (the chain admin) is an
      ISC agent id with no Ethereum address at all.
    src: "packages/vm/core/evm/emulator/blockchaindb.go:makeHeader"
    src_live: "eth_call COINBASE @ 12793600 -> 0x00..00; every sampled block header reports miner 0x00..00"
  - op: "0x44"
    name: PREVRANDAO / DIFFICULTY
    severity: high
    note: "always 0; see eips.4399. Real randomness exists but only through the magic contract."
    src: "packages/vm/core/evm/emulator/blockchaindb.go:GetPendingHeader"
    src_live: "eth_call PREVRANDAO @ 12793600 -> 0x00..00"
  - op: "0x48"
    name: BASEFEE
    severity: high
    note: "always 0; see eips.1559 and eips.3198."
    src: "packages/vm/core/evm/emulator/emulator.go:applyMessage"
    src_live: "eth_call BASEFEE @ 12793600 -> 0x00..00"
  - op: "0x4a"
    name: BLOBBASEFEE
    severity: high
    note: "enabled by the Cancun rules but backed by a nil pointer; executing it aborts. See eips.7516."
    src: "packages/vm/core/evm/emulator/emulator.go:applyMessage"
    src_live: "eth_call BLOBBASEFEE @ 12793600 -> -32000 'runtime error: invalid memory address or nil pointer dereference'"
  - op: "0x45"
    name: GASLIMIT
    note: >-
      Returns the ISC block gas limit converted into EVM units
      (`MaxGasPerBlock * B/A`), 1,000,000,000 at the pinned block. It is a governance
      parameter, not a miner-adjusted target, and no EIP-1559 elasticity applies to it.
      A single transaction is separately capped at `MaxGasPerRequest` = 50,000,000, and
      a larger `gas` field is SILENTLY TRUNCATED to that cap rather than rejected.
    src: "packages/vm/gas/evm.go:EVMBlockGasLimit, packages/vm/core/evm/emulator/emulator.go:CallGasLimit"
    src_live: "eth_call GASLIMIT @ 12793600 -> 0x3b9aca00; GET /v1/chain -> maxGasPerBlock 1000000000, maxGasPerRequest 50000000"
  - op: "0x31"
    name: BALANCE / SELFBALANCE (0x47) / CALL value transfer
    note: >-
      Semantically ordinary, but the ledger underneath is not the EVM's. Balances are
      read and written through the ISC `accounts` core contract, in 9-decimal base-token
      units plus a per-account 18-decimal `weiRemainder`, not from EVM state. Wei-level
      precision is preserved on L2 (unlike chains that truncate dust), but no balance is
      provable from `stateRoot`, and a balance can change with no EVM transaction.
    src: "packages/vm/core/evm/emulator/statedb.go:GetBalance, packages/vm/core/accounts/basetokens.go:getBaseTokens"

fee_model:
  metering: >-
    TWO METERS, and the receipt reports the larger. The EVM meters normally; then
    `applyTransaction` converts the EVM gas used into ISC gas
    (`EVMGasToISC = ceil(evmGas * A/B)`) and burns it against the ISC request budget.
    Separately, every ISC sandbox operation the transaction triggers — magic-contract
    calls, state writes at 55 ISC gas/byte, event bytes — burns ISC gas that the EVM
    never saw, because the magic contract returns `remainingGas` unchanged. Finally the
    receipt's `gasUsed` is AMENDED UPWARD to `ISCGasBudgetToEVM(total ISC gas burned)`
    whenever that exceeds the EVM's own figure. So `gasUsed` is
    `max(evm_gas, isc_gas_burned * B/A)`, not the EVM's gas, and a transaction can be
    charged for work no EVM trace explains. At the pinned block `EVMGasRatio` is 1:1,
    which makes the two units numerically equal and the divergence invisible — the ratio
    is chain governance state and can be changed by the chain admin without any fork.
  fee_market: >-
    none. A single governance-set price, `GasPerToken` (live value A=1, B=10 -> 10
    base-token units per gas unit, i.e. exactly 10 gwei at 9 base-token decimals). A
    transaction whose `gasPrice` is below it is refused at RPC ingress AND skipped at
    consensus; a transaction whose `gasPrice` is above it pays the higher price it
    offered. There is no base fee, no burn, no priority auction and no
    `eth_feeHistory`. Ordering is randomized, so bidding higher buys mempool
    proposal priority, never position in the block.
  extra_components:
  - name: nonce on failure
    severity: high
    src: "packages/vm/core/evm/evmimpl/internal.go:saveExecutedTx, packages/vm/vmimpl/skipreq.go:earlyCheckReasonToSkip, packages/vm/vmexceptions/exceptions.go:SkipRequestErrors"
    description: >-
      NONCE ON FAILURE: SPLIT BY WHICH OF THE TWO REJECTION LAYERS CAUGHT IT, and
      the split falls on the same line as the receipt.

      LAYER 1 — ISC request level, before the EVM runs. `earlyCheckReasonToSkip`
      (bad signature, wrong nonce, gas price below the governance minimum) and
      the `SkipRequestErrors` set (ISC block gas exhausted, L1 transaction size
      exceeded, sender cannot cover the minimum fee) make `runRequests` log
      "request skipped (ignored) by the VM" and `continue` WITHOUT incrementing
      the request index. The EVM never runs, so the nonce is NEVER TOUCHED and
      nothing is charged — and the transaction is ERASED: no EVM receipt, no
      blocklog receipt, no transaction index, `eth_getTransactionReceipt` null
      forever. NONCE PRESERVED, NO RECEIPT. Two mitigations soften it: the RPC
      re-checks nonce and balance at ingress, and a skipped off-ledger request
      stays in the pool and is retried until its nonce becomes valid or its
      24-hour TTL expires — except a nonce that is too LOW, which is dropped.

      LAYER 2 — EVM level, once the request runs. REVERT, out-of-gas, or the ISC
      gas-budget overrun that rewrites an already-successful receipt to
      `status: 0`. State is rolled back, logs are stripped, gas is charged — and
      `saveExecutedTx` then reaches past the rollback to put the nonce back:
      `if receipt.Status != types.ReceiptStatusSuccessful { emulator.IncNonce(...) }`,
      under the comment "make sure the nonce is incremented if the state was
      rolled back by the VM". NONCE BURNED, RECEIPT PRESENT with `status: 0`.

      So the two are consistent here in the way Sei's are and Artela's are not: a
      receipt means the nonce was spent, no receipt means it was not. What is
      unusual is that the nonce increment is an EXPLICIT, out-of-band write —
      because the VM's rollback would otherwise have undone it, the one place in
      this dataset where the nonce had to be re-applied by hand after a revert.
  - name: minimum fee per request
    description: >-
      Every request is charged at least 10,000 ISC gas (`BurnCodeMinimumGasPerRequest1P`,
      `minGasPerRequest` in governance), floored AFTER the EVM receipt is built. Below
      ~10,000 gas of EVM work the receipt's `gasUsed` under-reports what was charged.
  - name: fee destination
    description: >-
      Split by `ValidatorFeeShare` between the round's randomly-selected validator fee
      destination and the chain admin. Live value 0: everything goes to the chain admin.
      Nothing is ever burned.
  - name: ISC gas budget derived from the EVM gas limit
    description: >-
      The request's ISC gas budget is `EVMGasToISC(tx.gas)`, further clamped into
      [`minGasPerRequest`, `maxGasPerRequest`] and then reduced to what the sender's L2
      balance can actually afford. A transaction is therefore executed under a budget
      that may be SMALLER than the `gas` it declared, with no EVM-visible signal.
  src: "packages/vm/core/evm/evmimpl/impl.go:applyTransaction, packages/vm/gas/evm.go:EVMGasToISC, packages/vm/gas/feepolicy.go:FeePolicy, packages/vm/vmimpl/runreq.go:calculateAffordableGasBudget"
  src_live: "GET /v1/chain @ 12793600 -> evmGasRatio {a:1,b:1}, gasPerToken {a:1,b:10}, validatorFeeShare 0, minGasPerRequest 10000, maxGasPerRequest 50000000; eth_gasPrice -> 0x2540be400 (10 gwei)"

header_fields:
  added: []
  removed:
  - {name: baseFeePerGas, note: "no fee market; the key is absent from eth_getBlockByNumber output entirely"}
  - {name: withdrawalsRoot, note: "no consensus layer, no withdrawals"}
  - {name: blobGasUsed, note: "blob transactions cannot be submitted"}
  - {name: excessBlobGas}
  - {name: parentBeaconBlockRoot, note: "no beacon chain"}
  - {name: requestsHash, note: "Prague not scheduled"}
  modified:
  - name: stateRoot
    severity: high
    note: >-
      PERMANENTLY ZERO, in every block including genesis. The minted header type stores
      only {Hash, GasLimit, GasUsed, Time, TxHash, ReceiptHash, Bloom} — there is no
      `Root` field to store. EVM state is committed by ISC's own trie over the chain
      state, which the Ethereum header does not reference. Consequences: `eth_getProof`
      does not exist, no light client or state proof over IOTA EVM is possible, and any
      tool that treats a zero `stateRoot` as "empty state" or compares state roots
      across blocks is wrong on both counts.
    src: "packages/vm/core/evm/emulator/blockchaindb.go:makeHeader"
    src_live: "eth_getBlockByNumber @ 12793600 and at 0x0, 0x1, 0xc33701-0xc33705 -> stateRoot 0x00..00 in all"
  - name: transactionsRoot / receiptsRoot
    severity: high
    note: >-
      COMMIT TO NOTHING. `makeHeader` computes them with `types.DeriveSha(txs,
      &fakeHasher{})`, and `fakeHasher.Hash()` returns `common.Hash{}` unconditionally.
      So a block with transactions carries the ZERO root, and a block without them
      carries the real `types.EmptyRootHash` — the inverse of the mainnet signal, and
      confirmed live at both ends (block 1 is empty and shows 0x56e81f17..., block
      12793600 has nine transactions and shows 0x00..00). Because the block hash is
      `Header.Hash()` over those fields, THE BLOCK HASH DOES NOT COMMIT TO THE BLOCK'S
      TRANSACTIONS OR RECEIPTS: it is a function of parent hash, number, time, gas used
      and bloom only. Receipt inclusion proofs are impossible, and any bridge or indexer
      that verifies a receipt against `receiptsRoot` is verifying nothing.
    src: "packages/vm/core/evm/emulator/blockchaindb.go:fakeHasher"
    src_live: "eth_getBlockByNumber @ 12793600 -> transactionsRoot and receiptsRoot both 0x00..00 with 9 transactions; @ 0x1 (empty) -> both 0x56e81f171bcc55a6ff8345e692c0f86e5b48e01b996cadc001622fb5e363b421"
  - name: miner
    note: "always 0x00..00; see opcodes COINBASE."
  - name: difficulty / totalDifficulty / nonce / mixHash / extraData
    note: >-
      All constant: difficulty and totalDifficulty 0, nonce 0x00..00, mixHash 0x00..00,
      extraData `0x` (empty). `sha3Uncles` is the standard empty-uncle constant and
      `uncles` is always empty.
    src_live: "eth_getBlockByNumber @ 12793600"
  - name: timestamp
    note: >-
      One-second resolution, taken from the ISC batch's aggregated time — a
      per-round order statistic (the (|proposals|-F)-th lowest node clock, roughly the
      66th percentile) over committee members' wall clocks, not a proposer's choice.
      It is monotonically non-decreasing across blocks but the interval is irregular:
      4 s, 5 s, 24 s, 60 s, 25 s across five consecutive blocks at the pinned height.
      Two adjacent blocks can carry the SAME second.
    src: "packages/chain/cons/bp/batch_proposal_set.go:aggregatedTime"
    src_live: "eth_getBlockByNumber 0xc33700..0xc33705 @ 12793600 -> 1787844123, 1787844127, 1787844132, 1787844156, 1787844216, 1787844241"

gotchas:
  ordering_and_execution: >-
    (a) WHAT ORDERS TRANSACTIONS. Nothing that resembles a block builder. An
    `eth_sendRawTransaction` becomes an ISC OFF-LEDGER REQUEST, held in per-node
    mempools with NO L1 ordering guarantee of any kind — it never touches the IOTA L1
    until the block that contains it is committed. Each committee node proposes a batch
    (off-ledger requests in gas-price order, respecting nonce continuity, capped at 500;
    on-ledger requests, which the IOTA L1 ordered first, capped at 100). An Asynchronous
    Common Subset (ACS) decides the SET: a request is in iff at least F+1 nodes proposed
    it. The ORDER is then derived, not proposed — `AggregatedBatchProposals.
    OrderedRequests` sorts by `blake2b(requestID, requestHash, randomness)` where
    `randomness` is a threshold-BLS common coin the committee produces in the same
    round, then makes a second pass swapping same-sender off-ledger requests so their
    nonces increase. On-ledger and off-ledger requests are interleaved in that one
    pseudorandom order. So ordering does commit before execution, but only just: it is
    computed and executed inside a single consensus round, and gas price buys mempool
    proposal priority, never a position in the block. [src]
    (b) EXECUTION SHAPE. Single-threaded, deterministic, one pass. Every node runs the
    identical `vm.VMTask` over the identical ordered list; there is no parallelism, no
    optimistic execution, no conflict detection and therefore no re-run or abort. The
    VM output — the ISC state commitment — is packed into an IOTA L1 programmable
    transaction which the committee threshold-signs (DSS Schnorr), so execution and
    ordering are agreed in the same round rather than in separate ones. Two
    implementations could only disagree by being non-deterministic. [src]
    (c) ORDERED BUT INVALID — THE CENTRAL QUESTION, AND THERE ARE TWO ANSWERS BECAUSE
    THERE ARE TWO REJECTION LAYERS.
    LAYER 1, ISC request level, before the EVM runs: `earlyCheckReasonToSkip` verifies
    the request signature, then checks the nonce — for an Ethereum sender it reads the
    EVM nonce directly — and then checks the gas price against the governance minimum.
    Any failure returns an error, and `runRequests` logs "request skipped (ignored) by
    the VM" and `continue`s WITHOUT incrementing the request index. Three further
    conditions reach the same fate as panics from inside execution
    (`vmexceptions.SkipRequestErrors`, documented in source as "causes skipping the
    request. Never appear in the receipt of the request"): the ISC block gas limit being
    exhausted, the maximum L1 transaction size being exceeded, and the sender not having
    enough L2 funds for the minimum fee. In every one of these cases the transaction is
    ERASED: no EVM receipt, no blocklog receipt, no transaction index, no log, no trace.
    `eth_getTransactionReceipt` returns null forever, and the transaction is
    indistinguishable from one that was never submitted. This is the same observable
    outcome as Conflux's `Skipped` state, reached for an entirely different reason — not
    a third receipt status but the absence of any receipt at all. Two mitigations
    partially hide it in practice: the RPC re-checks the nonce and the sender's balance
    at ingress and rejects synchronously, so the common cases fail before the mempool;
    and a skipped off-ledger request is NOT marked processed, so it stays in the pool
    and is retried at later heights until its nonce becomes valid or its 24-hour TTL
    expires. A nonce that is too LOW, however, is dropped from the pool outright.
    LAYER 2, EVM level, once the request runs: ordinary. An out-of-gas or REVERT
    produces a receipt with `status: 0`, gas charged, logs stripped
    (`receipt.Logs` is emptied and the bloom recomputed), state rolled back, and the
    nonce incremented explicitly by `saveExecutedTx` even though the state was reverted.
    An ISC-level error raised by a magic-contract call — an invalid allowance,
    insufficient funds for an allowance, an unresolvable core-contract call — is caught
    by `applyMessage` and re-encoded as a standard `Error(string)` revert, so it reaches
    the client as an ordinary Solidity revert reason carrying ISC prose.
    RUNNING OUT OF *ISC* GAS: this is the one case where the EVM would have completed
    and does not. `applyTransaction` burns the ISC equivalent of the EVM gas AFTER
    `emu.SendTransaction` returns; if that burn exceeds the request's ISC budget it
    panics, `burnGasErr` is set, and the already-successful receipt is rewritten to
    `status: 0` with its logs removed. The EVM's own gas meter never saw the limit. The
    same budget can also be smaller than the `gas` the user declared, because
    `calculateAffordableGasBudget` clamps it to what the sender's L2 balance can pay —
    so a transaction can fail for insufficient budget while `eth_estimateGas` and the
    declared `gas` field both looked fine. [src]
    (d) PRECONFIRMATION AND MUTABILITY. Yes, and there is no field that says so. The
    JSON-RPC serves `LatestState(ActiveOrCommittedState)`, and `ActiveState` is defined
    in wasp's own source as "the state the chain build next TX on, can be ahead of
    ConfirmedState" (sic), where `ConfirmedState` is "the state confirmed on L1". So
    `eth_blockNumber`, `eth_getBalance` and `eth_getTransactionReceipt` routinely answer
    from ISC blocks whose committing IOTA L1 transaction has not been confirmed, and by
    default the node will pipeline an unbounded number of such blocks
    (`PipeliningLimit: -1`). Unlike MegaETH there is no sentinel: the receipt looks
    completely ordinary, with a real block hash and number. And the block tags cannot
    help, because `parseBlockNumber` maps EVERY negative tag to latest — `finalized`,
    `safe` and `pending` all return the same head block as `latest`, verified live. A
    bridge polling `finalized` on IOTA EVM is polling the unconfirmed tip. [src, src_live]
  layering: >-
    The whole row rests on one fact: IOTA EVM is a contract, not a chain. It is the
    `evm` core contract of one ISC chain, which is itself a Move object on the
    post-Rebased IOTA L1 — confirmed live, since `getBaseTokenInfo()` returns the coin
    type `0x0000...0002::iota::IOTA`, Move notation, and `getChainID()` returns a
    32-byte object id rather than a number. Everything an Ethereum client asks about is
    synthesised for its benefit: blocks are minted one per ISC block by
    `BlockchainDB.MintBlock`, whose own doc comment calls it "a fake blockchain (more
    like a list of blocks), intended for satisfying EVM tools that depend on the concept
    of a block".
  chain_id_is_a_uint16: >-
    The EVM chain id is stored and returned as a `uint16` throughout wasp
    (`BlockchainDB.GetChainID`, `EthService.ChainId`, `emulator.Init`). No ISC chain can
    carry an EVM chain id above 65535. 8822 fits; a chain id in the modern registered
    range could not be represented at all.
  historical_calls_use_a_current_clock: >-
    `eth_call` against a historical block resolves the ISC state at that block index
    correctly, but the pending header it executes against takes its timestamp from
    `sandbox.Timestamp()` — the CURRENT chain time — and its number from that block + 1.
    Probed at block 0x1, `TIMESTAMP` returned the wall clock of the probe while `NUMBER`
    returned 2. Any historical simulation of a time-dependent contract is wrong.
  blocks_can_be_pruned: >-
    `BlockchainDB.prune` deletes the header, transactions and receipts of block
    `n - blockKeepAmount` on every mint, and the wasp default is 10,000 blocks — about a
    day. IOTA EVM mainnet is configured to keep everything (block 1 is still
    retrievable), but this is chain governance state, not a protocol guarantee, and on
    any other ISC chain `eth_getTransactionReceipt` for an old transaction returns null
    because the data was deleted.
  receipt_logs_are_stripped_on_failure: >-
    A failed transaction's receipt has its `Logs` array emptied and its bloom
    recomputed, in the VM and again defensively in `RPCMarshalReceipt`. On mainnet a
    reverted transaction also emits no logs, so this matches — but it means a partial
    trace showing events before a revert can never be reconciled against the receipt.
  no_pending_state: >-
    There is no pending block and no pending transaction view. `eth_pendingTransactions`,
    `eth_newPendingTransactionFilter`, `eth_getProof`, `eth_feeHistory` and
    `eth_maxPriorityFeePerGas` are all absent, and the `pending` tag silently returns
    `latest`. A submitted transaction is invisible to every RPC method until the block
    containing it is produced.

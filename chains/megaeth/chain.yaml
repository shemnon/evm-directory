      `@ 25048478` or `@ 25149945`; nothing new is attached to 24869120.
  note: >-
    Block 24869120 (0x17b7900) has timestamp 1787666131, which is AFTER the Rex6
    mainnet activation at 1787626800 (2026-08-25 03:00 UTC), so every probe below
    observes the Rex6 spec. Historical state IS served at that height — eth_call and

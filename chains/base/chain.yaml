schema_version: 2

chain:
  name: Base
  slug: base
  chain_id: 8453
  role: fork
  live: true

lineage:
  upstream: op-stack
  ancestry: [ethereum, op-stack]
  fork_of: reth / op-reth
  note: >-
    Inherits all OP Stack deltas, then adds substantially more of its own than any
    other OP-Stack descendant here. NOT a thin row: Base has its own fork line
    (Azul, Beryl, Cobalt, Zombie), its own precompile framework, native account
    abstraction, and a DYNAMIC precompile address space.
  sync_point: >-
    base v1.5.4: the OP Stack sequence through Jovian, then five Base-specific
    upgrades — Azul, Beryl, Cobalt and Denim live, Everest unscheduled — plus the
    Zenith gate.

client:
  name: base (base-reth-node)
  repo: https://github.com/base/base
  version: v1.5.4
  commit: 8bb377afad0d3521381487fc99edd10640418a63
  language: rust
  built_on: reth / op-reth (revm 42.0.1, base/reth tag base-v2.5.2.11)
  note: >-
    base/node is only a Docker packaging repo pinning this client via versions.env.
    Reading node alone would have produced a near-empty and badly wrong row.
  companion_repos:
  - {name: node, repo: "https://github.com/base/node",
     commit: 36cedd9185512d8664721ab3fd89381ddd0fcd97,
     pinned_by: {how: reference},
     provides: "nothing this row states — pinned only so the rejection above names a
       specific tree. This is the repo the obvious search finds, and AT THIS COMMIT ITS
       versions.env STILL PINS base/base v1.2.0 while the client has shipped v1.5.1 and
       the network has passed Cobalt. The packaging repo lags the client by three minor
       releases and one live mainnet fork, which is why this row reads the client repo
       and keeps node only as a pointer."}

consensus:
  engine: OP Stack (sequencer) + fault proofs

baseline_fork: osaka

forks:
  src: crates/common/genesis/src/chain/upgrade.rs, crates/common/chains/src/chain.rs, crates/common/chains/src/config.rs
  note: >-
    Base is ABSENT from the superchain-registry mainnet configs in this snapshot,
    unlike OP Mainnet and World Chain, so activation timestamps could not be read
    from there. Fork ORDER is verified from the BaseUpgrade enum; timestamps are
    runtime configuration.
  timeline:
  - {name: "bedrock..jovian", mainnet_equivalent: see_op_stack, status: active}
  - {name: azul,   mainnet_equivalent: null, note: Base-specific}
  - {name: beryl,  mainnet_equivalent: null, note: "installs the dynamic B-20 precompile lookup"}
  - name: cobalt
    activation_time: 1790791200
    mainnet_equivalent: null
    note: >-
      LIVE ON MAINNET SINCE 2026-09-30 18:00 UTC (Sepolia 2026-09-23 18:00). At the
      previous pin this was `ForkCondition::Never` on both networks. What it shipped
      is not what it was for: Cobalt installs the two EIP-8130 support precompiles,
      NonceManager at 0x8130..aa01 and TxContext at 0x8130..aa02, and enables
      transaction extensions in the builder — but the EIP-8130 TRANSACTION TYPE moved
      off Cobalt before Cobalt activated, and is now on Everest. See the 0x79 entry.
    src: crates/common/chains/src/config.rs:cobalt_timestamp
  - name: denim
    activation_time: 1793901600
    activation_block: 53556127
    mainnet_equivalent: null
    severity: high
    note: >-
      LIVE ON BASE MAINNET SINCE 2026-11-05 18:00 UTC, FROM BLOCK 53556127 (Sepolia since
      2026-10-21 18:00). Block 53556126 is the last 2s block. Blocks go from 2s to a fixed
      200ms. `block.timestamp` stays in whole
      seconds, so five consecutive blocks share one value, and the millisecond part lives
      in the `BaseTime` predeploy, updated by a new deposit at tx[1] of every block. At the
      first Denim block the gas limit is divided by 10 and the EIP-1559 denominator
      multiplied by 10, preserving throughput per unit of time. Also moves the B-20 asset,
      stablecoin and policy logic to V3, with inverted policy IDs. v1.5.2 to v1.5.4 change
      no schedule source; v1.5.4 retunes engine persistence and gossip for 200ms blocks.
    src: "crates/common/chains/src/config.rs:denim_timestamp, crates/common/genesis/src/schedule.rs:DenimTimestampSchedule, crates/common/genesis/src/rollup.rs:NATIVE_SUBSECOND_BLOCK_INTERVAL_MILLIS, crates/consensus/derive/src/attributes/stateful.rs:DENIM_GAS_PARAMETER_SCALING_FACTOR, crates/common/precompiles/src/policy/abi/v3.rs:IPolicyRegistry"
    src_live: "Base mainnet eth_getBlockByNumber @ 53556126 -> timestamp 1793901599, gasLimit 400000000, extraData 0x0100000064…; @ 53556127..53556131 -> timestamp 1793901601 on all five, gasLimit 40000000, extraData 0x01000003e8…, tx[1] a 0x7e deposit to 0x4200…0030 with selector 0x86bdf394. eth_call timestampMs on 0x4200…0030 @ 53556126 -> reverts 'Proxy: implementation not initialized'; @ 53556127 -> 1793901601000; @ 53556128 -> 1793901601200"
    src_doc: "https://github.com/base/base/releases/tag/v1.5.4"
  - name: everest
    status: pending
    mainnet_equivalent: null
    note: >-
      New at this pin, and it now holds the EIP-8130 transaction type. Fifth Base-specific
      upgrade, contract-backed and in the execution ladder, with `everest_timestamp: None`
      on every network. Declared, not scheduled.
    src: "crates/common/genesis/src/chain/upgrade.rs:Everest, crates/common/chains/src/config.rs:everest_timestamp, crates/common/evm/src/eip8130.rs:not_active_error"
  - name: zenith
    status: pending
    mainnet_equivalent: null
    note: >-
      REPLACES `zombie` AS THE NEVER-ACTIVATING GATE, and the rename came with a
      promotion in what it holds. Zenith is not contract-backed and not signalable
      via L1: it is excluded from both CONTRACT_VARIANTS and EXECUTION_VARIANTS, and
      the tests assert that even a runtime registry override cannot activate it
      (`set_activation_timestamp(.., Zenith, u64::MAX)` still leaves
      `ForkCondition::Never`). Only a genesis-configured timestamp could.
    src: crates/common/genesis/src/chain/upgrade.rs:Zenith

eips:
  7702: {status: inherited, note: "present as a distinct tx type alongside EIP-8130",
         src: "crates/common/consensus/src/transaction/tx_type.rs:OpTxType"}
  8130:
    status: added
    note: >-
      "Account Abstraction by Account Configuration", implemented NATIVELY — the
      crate README states "Enshrined, not a precompile". Brings 2D nonces, a
      sender/payer split, an intrinsic gas schedule (Eip8130GasSchedule), stateful
      actor authorization, and config-change authorization. Gated behind Cobalt.
    src: crates/execution/eip8130/README.md, crates/execution/eip8130/src/

non_eip_specs:
  - {id: B-20, name: native token precompile family, adoption: adopted, fork: beryl}
  - {id: Flashblocks, name: sub-block preconfirmations, adoption: adopted,
     src: crates/execution/flashblocks}

tx_types:
  envelope:
    status: inherited
    present: "0x00-0x02, 0x04"
    src: derived from the eips map (2930 / 1559 / 4844 / 7702); see those entries
    note: >-
      The EIP-2718 envelope this chain accepts in mainnet shape; no blob transactions
      (EIP-4844). Derived from the eips map (2930/1559/4844/7702); per-type divergences and
      their evidence are on the rows below.
  "0x79":
    name: Eip8130Tx
    status: pending
    spec: EIP-8130
    fork: everest
    severity: high
    src: "crates/common/consensus/src/transaction/tx_type.rs:EIP8130_REJECTION_MSG, crates/common/evm/src/eip8130.rs:not_active_error, crates/execution/txpool/src/validator.rs:check_without_keystore"
    note: >-
      THE GATE HAS MOVED TWICE: COBALT, THEN ZENITH, NOW EVEREST. The rejection message says
      "EIP-8130 (account abstraction) transactions are gated behind Everest;
      eth_sendRawTransaction does not accept transaction type 0x79 before Everest", and
      execution rejects it too, since a block can arrive by the Engine API or P2P. This
      undoes the row's earlier reading that the type sat behind a gate no runtime override
      could open: Everest is contract-backed and in the execution ladder, though unscheduled.
      Zenith still holds the Keystore, so between Everest and Zenith a 0x79 transaction may
      use only delegation and native secp256k1 keys. Cobalt went live on 2026-09-30 and
      brought the type's two support precompiles with it, so the infrastructure for
      native account abstraction is callable on Base mainnet today while the
      transaction type that would use it is not submittable. `pending` rather than
      `added` because the type is merged and not live. Distinct from EIP-7702, which
      Base does support.
  note: >-
    Inherits 0x00-0x04 and OP Stack's 0x7e deposit, and adds 0x79. Base therefore
    carries TWO non-mainnet type bytes.

tx_authorization:
  key_binding: declared
  signers_per_tx: 2
  note: >-
    EIP-8130 is the opposite design choice to zkSync's, and the contrast is the point.
    zkSync makes the account's own code the authentication rule, so the scheme set is
    open and unbounded. Base ENSHRINES a CLOSED set: `sender_auth` is
    `authenticator(20) || authenticator_data`, and AuthenticatorDispatch routes that
    20-byte selector through a hardcoded if-chain over four canonical values, falling
    through to AuthError::NotCanonical for anything else. There is no path by which a
    user-deployed contract validates a transaction signature. The crate says so in its
    own README heading — "Enshrined, not a precompile" — and the four authenticators
    are native Rust, not EVM calls: the deployed contracts at those addresses exist for
    ERC-1271 use and the native code must stay byte-identical to them, but the
    protocol never calls them.

    So on Base a P-256 key really can move a wei, and `authorizes: protocol` is the
    honest value: it is the CLIENT verifying the signature, not account code. That
    makes Base the sharpest counter-example in the dataset to the usual P256VERIFY
    story — eleven rows carry the precompile and it is a contract tool on almost all
    of them; here the same curve is a first-class transaction signer.

    NOT THE UNPAIRED FINDING. Every scheme here has a verifier a contract can reach:
    secp256k1 at 0x01, P-256 at 0x0100, and the WebAuthn variant is P-256 ECDSA over a
    SHA-256 message construction, reproducible from 0x0100 plus 0x02. Base even prices
    the enshrined authenticators off those precompiles deliberately — Eip8130GasSchedule
    pins 3,000 for k1 and 6,900 for P-256 to the ECRECOVER and EIP-7951 costs. A clean
    negative.

    KEY BINDING SPLITS BY PATH, and `declared` is recorded because 0x79 is what is new.
    On 0x00-0x04 and 0x7e it is mainnet's `derived`. On 0x79 with `sender == None` it is
    still derived — sender_auth is a bare 65-byte r||s||v and recover_eoa_sender's
    result IS the sender. With `sender == Some(addr)` it is `declared`: the address is
    an explicit unsigned field and the resolved actorId is checked against an
    ActorConfig read out of the AccountConfiguration contract's storage, with scope
    bits and an expiry. ecrecover(sig) != from on that path.

    TWO PARTIES, TWO DIFFERENT DIGESTS, as on Kaia — arrived at independently. `payer`
    is an optional second account that authorizes over payer_signature_hash, which
    substitutes the RESOLVED sender into the digest and is domain-separated by its own
    magic byte (0x7A), so a payer signature cannot be replayed under a different
    sender. The payer's auth blob takes the same authenticator(20)||data form, so a
    sponsor may itself be a P-256 or WebAuthn key. Absent a payer, the sender pays and
    payer_auth is empty.

    NOT LIVE ON MAINNET, AND TWO FORK GATES SAY SO, NOT A DEPLOYMENT GAP. The only
    transaction type that reaches AuthenticatorDispatch is 0x79, which is gated behind
    Everest (unscheduled), and non-secp256k1 keys also need Zenith's Keystore. So the P-256
    schemes below are `pending`, not `added` — a P-256 key cannot sign a Base mainnet
    transaction today. Cobalt's activation on 2026-09-30 did not change that. The
    canonical contracts are CREATE2 deployments with per-contract mined salts sharing a
    `0x8130…` vanity prefix. The module docs warn that any bytecode change moves an
    address, and this row's earlier `0x2403…`/`0x2809…` set is gone for that reason. None of
    the current five has code on mainnet. Because the enshrined dispatch keys on those
    addresses, a redeploy before Everest changes WHICH address means P-256; it will not
    change that P-256 authorizes.

    A fifth selector, DELEGATE_AUTHENTICATOR, is deliberately NOT recorded as a scheme:
    it verifies no signature of its own. It wraps one canonical non-delegate
    authenticator at depth 1 exactly (nesting is NestedDelegate, an error) and surfaces
    a delegated-account obligation. It changes WHOSE key counts, not WHAT a key is.
  src: "crates/execution/eip8130/src/dispatch.rs:AuthenticatorDispatch, crates/execution/eip8130/src/dispatch.rs:NotCanonical, crates/common/consensus/src/transaction/eip8130/addresses.rs:CANONICAL_AUTHENTICATORS, crates/common/consensus/src/transaction/eip8130/addresses.rs:P256_AUTHENTICATOR_SALT, crates/execution/eip8130/README.md, crates/execution/eip8130/src/verify.rs:verify_sender, crates/common/consensus/src/transaction/eip8130/signed.rs:recover_eoa_sender, crates/execution/eip8130/src/account_config.rs:ActorConfig, crates/common/consensus/src/transaction/eip8130/tx.rs:sender_signature_hash, crates/common/consensus/src/transaction/eip8130/tx.rs:payer_signature_hash, crates/execution/eip8130/src/verify.rs:ActorTxVerifier"
  src_live: "eth_getCode @ 55270259 for ACCOUNT_CONFIG 0x813012Bd8D971928475235BBac6F0488c4A100AC, P256_AUTHENTICATOR 0x8130C89F65750431b564A4730397552a11CeA256, WEBAUTHN_AUTHENTICATOR 0x813007b6b1b48E75D91dEc5927ab515d12a0F1d0, DELEGATE_AUTHENTICATOR 0x81301AA52202f8C6b79Cde660440E3c6A7c5ade1, DEFAULT_ACCOUNT 0x81309c54D6Bc190FbBc0FA9f296ea4C6A539ADEf -> all 0x (no code)"
  schemes:
    secp256k1:
      status: inherited
      authorizes: protocol
      precompile: "0x01"
      note: >-
        Unchanged on 0x00-0x04 and 0x7e, and the default on 0x79. Unique among the
        four authenticators in having NO deployed contract: K1_AUTHENTICATOR is the
        protocol-reserved sentinel address(1) and the protocol recovers from the blob
        directly. EIP-7702 also remains available alongside 0x79, still secp256k1 for
        both the tuple and the transaction, so Base carries two account-abstraction
        mechanisms at once without either widening the curve set of the other.
      src: "crates/common/consensus/src/transaction/eip8130/constants.rs:K1_AUTHENTICATOR, crates/common/consensus/src/transaction/tx_type.rs:OpTxType"
    secp256r1:
      status: pending
      authorizes: protocol
      precompile: "0x0100"
      activation_condition: "Zenith fork (was Cobalt; Zenith is not runtime-activatable)"
      note: >-
        Raw P-256. auth blob is r||s||x||y||pre_hash (129 bytes, the trailing byte
        required and ignored), actorId is keccak256(x||y) — so the account is
        identified by the KEY, and a P-256 key has no address of its own. Low-s
        enforced to match OpenZeppelin's P256.verify. Paired with 0x0100, which Base
        has at both the Jovian and Azul (Osaka-priced) pricings. STILL `pending` AT
        v1.5.1, FOR A DIFFERENT REASON THAN BEFORE: the earlier blocker was that the
        authenticator contracts were undeployed on mainnet, but the binding constraint
        now is that the only transaction type reaching AuthenticatorDispatch is 0x79,
        which moved from the Cobalt gate to Everest, and non-secp256k1 keys need the Zenith
        Keystore on top of that. Cobalt going live on
        2026-09-30 did not make a P-256 key able to move a wei on Base.
      src: "crates/common/consensus/src/transaction/eip8130/addresses.rs:P256_AUTHENTICATOR, crates/execution/eip8130/src/dispatch.rs:p256_verify, crates/common/precompiles/src/provider.rs:P256VERIFY"
    secp256r1_webauthn:
      status: pending
      authorizes: protocol
      precompile: "0x0100"
      activation_condition: "Zenith fork (was Cobalt; Zenith is not runtime-activatable)"
      note: >-
        The same curve under a WebAuthn envelope, so a passkey signs the transaction
        directly. The client parses clientDataJSON, asserts the type member and the
        base64url-encoded challenge at caller-supplied offsets, requires the
        User-Present flag (requireUV false), checks backup-state consistency, then
        P-256-verifies over sha256(authenticatorData || sha256(clientDataJSON)).
        Recorded as its own scheme because the message construction — not the curve —
        is what differs, and that construction has no precompile: a contract must
        reassemble it from 0x02 and 0x0100 by hand. Not an unpaired scheme, since the
        signature itself is checkable at 0x0100.
      src: "crates/common/consensus/src/transaction/eip8130/addresses.rs:WEBAUTHN_AUTHENTICATOR, crates/execution/eip8130/src/dispatch.rs:webauthn, crates/common/eip8130/src/schedule.rs:Eip8130GasSchedule"

precompiles:
  base_map:
    status: inherited
    present: "0x01-0x11"
    p256verify: true
    src: crates/common/precompiles/src/lib.rs
    note: >-
      Inherits OP Stack's base map — full 0x01-0x11 plus P256VERIFY at 0x0100 —
      including all six of op-geth's same-address semantic divergences (0x05 MODEXP,
      0x08 bn254 pairing cap, 0x0c/0x0e/0x0f BLS caps, 0x0100 gas). Base reimplements
      the Isthmus BLS and Granite pairing-cap variants in Rust to match op-geth.
  "0x8453000000000000000000000000000000000001":
    name: Activation
    status: added
    src: crates/common/precompiles/src/activation/storage.rs:ADDRESS
    note: "address prefix is Base's own chain ID (8453) — a placement convention unique in this dataset"
  "0x8453000000000000000000000000000000000002":
    name: Policy
    status: added
    src: crates/common/precompiles/src/policy/storage.rs:ADDRESS
  "0x813000000000000000000000000000000000aa01":
    name: Nonce
    status: added
    fork: cobalt
    src: crates/common/eip8130/src/nonce.rs:NonceManagerSlots, crates/common/precompiles/src/nonce/storage.rs:ADDRESS
    note: >-
      2D nonce support for EIP-8130, installed by `provider.rs:install_with_observer`
      only once the upgrade is >= Cobalt. LIVE SINCE 2026-09-30: at the previous pin
      Cobalt was `ForkCondition::Never`, so this address was in the client and not on
      the network. It is now callable on mainnet even though the 0x79 transaction type
      it supports is gated behind Everest and is not.
  "0x813000000000000000000000000000000000aa02":
    name: TxContext
    status: added
    fork: cobalt
    src: crates/common/precompiles/src/tx_context/storage.rs:ADDRESS
    note: >-
      Same Cobalt gate and same history as the Nonce precompile above: in the client
      at the previous pin, on the network since 2026-09-30.
  "0xB20F000000000000000000000000000000000000":
    name: B20Factory
    status: added
    fork: beryl
    src: crates/common/precompiles/src/b20_factory/storage.rs:ADDRESS
  dynamic_range:
    name: B-20 token precompiles
    status: added
    fork: beryl
    severity: high
    pattern: "byte[0] == 0xb2 AND bytes[1..10] == 0 AND byte[10] in {0x00 asset, 0x01 stablecoin}"
    src: crates/common/precompiles/src/b20_factory/variant.rs:has_b20_prefix, crates/common/precompiles/src/lookup.rs:BerylLookup
    note: >-
      NOT ENUMERABLE. Beryl installs a PrecompileLookup (BerylLookup) that resolves
      precompiles by PREDICATE over the address rather than from a fixed map. Every
      address matching the pattern is a precompile — roughly 2^72 addresses per
      variant, with the low 9 bytes carrying token identity. No other chain in this
      dataset has a precompile address space that cannot be listed.
  note: >-
    Also inherits all six of OP Stack's modified precompiles. The Isthmus BLS12-381
    variants and Granite bn254 pairing cap are reimplemented here in Rust
    (crates/common/precompiles/src/{bls12_381,bn254_pair}.rs), matching op-geth.

system_contracts:
  note: inherits the OP Stack 0x42.. predeploy set
  "0x4200000000000000000000000000000000000030":
    name: BaseTime
    status: added
    fork: denim
    severity: high
    src: "crates/common/consensus/src/predeploys.rs:BASE_TIME, crates/common/evm/src/base_time.rs:ensure_predeploy, crates/common/consensus/src/base_time.rs:BaseTimeUpdateTx"
    src_live: "eth_call timestampMs on Base mainnet @ 53556126 -> reverts 'Proxy: implementation not initialized'; @ 53556127 -> 1793901601000; @ 55170259 -> 1794224427400; @ 55270259 -> 1794244427400"
    note: >-
      THE ONLY SUB-SECOND CLOCK SINCE DENIM, AND IT IS WRONG DURING tx[0]. `timestampMs()`
      combines the block's seconds with a stored millisecond part that the tx[1] deposit
      updates, so the L1-info deposit at tx[0] sees the previous value: 200ms behind within
      a second and 800ms ahead at rollover, in the client's own words. The proxy predates
      Denim on mainnet; Denim installed its implementation at block 53556127.
system_transactions:
  - name: BaseTime millisecond deposit
    fork: denim
    note: >-
      From Denim every block carries a second system deposit at tx[1], calling
      `setTimestampMillisPart(uint16)` on BaseTime, ahead of user deposits and sequencer
      transactions. Consensus rejects a block whose value disagrees with the schedule. Code
      that assumes user transactions start at index 1 breaks here.
    src: crates/common/consensus/src/base_time.rs:validate_timestamp_schedule

opcodes:
  prevrandao:
    source: l1-randao
    value: >-
      the L1 origin block's beacon RANDAO mix, repeated for every L2 block in that
      epoch
    chooser: >-
      Ethereum's beacon proposer, one L1 block earlier; the sequencer only copies it
      into the payload attributes
    known_at: l1-epoch
    note: >-
      THE L1's RANDAO, READ ACROSS THE BRIDGE, AND ALREADY PUBLIC WHEN THE L2 BLOCK IS
      BUILT. op-node's `attributes.go` sets `PrevRandao: eth.Bytes32(l1Info.MixDigest())`
      — the mixHash of the L1 ORIGIN block for the epoch, not of any L2 block. op-geth
      then takes the stock path: `Difficulty.Sign() == 0` holds on every OP block, so
      `random = &header.MixDigest` and `opRandom` pushes it. Two consequences a mainnet
      contract does not expect. First, THE VALUE REPEATS: every L2 block in an L1 epoch
      shares one L1 origin, so against 12s L1 slots the same word was returned by five or
      six consecutive 2s blocks, and since Denim by 60 consecutive 200ms blocks. Second, it is OLD: the L1 block it
      comes from was finalized and public before the L2 block existed, so anyone can
      read the next several L2 blocks' PREVRANDAO off Ethereum in advance. The entropy
      is genuine beacon-chain entropy; the freshness is not.
    src: >-
      base/crates/proof/host/src/handler.rs:793,
      base/crates/proof/executor/src/builder/env.rs:121,
      base/crates/proof/executor/src/builder/assemble.rs:107
    src_live: "eth_call 0x445f5260205ff3 @ 0x31228d2 -> 0x9d11e1d9…, equal to that block's mixHash; blocks 51521760-51521764 share one value and 51521765-51521769 the next, five and six L2 blocks per L1 epoch. After Denim, eth_getBlockByNumber over 55270060..55270259 -> one complete run of 60 blocks sharing a mixHash"
  added: []
  removed: []
  modified: []

p2p:
  max_tx_bytes:
    verdict: 131072
    tier: policy
    src: "base/crates/execution/node/src/node.rs:with_max_tx_input_bytes"
    note: >-
      A DIFFERENT CLIENT REACHING THE INHERITED NUMBER. Base runs a reth-based node rather
      than op-geth, so its pool limit comes from reth's `DEFAULT_MAX_TX_INPUT_BYTES` wired
      through `with_max_tx_input_bytes(ctx.config().txpool.max_tx_input_bytes)` — a
      configurable pass-through, where the op-geth value inherited from `op-stack` is a
      compile-time constant. Same 128 KiB, different enforcement and different override
      story, and reth's blob-transaction measurement differs from geth's — see `plasma`.

block_metrics:
  block_time:
    verdict: 200
    observed: 200.0
    observed_at_block: 55270259
    observed_at: 2026-11-09
    mutability: fixed
    src: "crates/common/genesis/src/rollup.rs:NATIVE_SUBSECOND_BLOCK_INTERVAL_MILLIS, crates/consensus/service/src/actors/sequencer/actor.rs:NATIVE_SUBSECOND_BLOCK_INTERVAL_MILLIS"
    src_live: "eth_call timestampMs on 0x4200…0030 @ 55170259 vs 55270259 -> 20000000ms / 100000 blocks; eth_getBlockByNumber timestamps over the same window -> 20000s"
    note: >-
      200ms since Denim at block 53556127, a compiled constant
      (`NATIVE_SUBSECOND_BLOCK_INTERVAL_MILLIS`) rather than the OP Stack `l2BlockTime`
      config every other descendant inherits, so changing it now takes a fork. Before
      Denim it was that inherited 2s. `block.timestamp` stays in seconds, so the exact
      figure comes from BaseTime's millisecond clock, not from header timestamps.
  block_gas_limit:
    verdict: ~
